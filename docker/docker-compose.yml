version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qym}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qym}
      POSTGRES_DB: ${POSTGRES_DB:-qym}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qym -d qym"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      QYM_ENVIRONMENT: ${QYM_ENVIRONMENT:-prod}
      QYM_BASE_URL: ${QYM_BASE_URL:-http://localhost:8000}
      QYM_DATABASE_URL: ${QYM_DATABASE_URL:-postgresql+psycopg2://qym:qym@db:5432/qym}
      QYM_ADMIN_BOOTSTRAP_TOKEN: ${QYM_ADMIN_BOOTSTRAP_TOKEN:-}
      QYM_AUTH_MODE: ${QYM_AUTH_MODE:-proxy_headers}
      QYM_LLM_CONFIG_ENCRYPTION_KEY: 64jhtf1giKj9yQFc332dtE9eGmhgi7rYpekfooX4-Ik=
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/healthz\").read()'"]
      interval: 10s
      timeout: 5s
      retries: 10

  db-backup:
    image: postgres:16
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-qym}
      PGPASSWORD: ${POSTGRES_PASSWORD:-qym}
      PGDATABASE: ${POSTGRES_DB:-qym}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
    volumes:
      - ${QYM_BACKUP_PATH:-./backups}:/backups
      - ./backup.sh:/backup.sh:ro
    entrypoint: ["/bin/bash", "/backup.sh"]
    restart: unless-stopped

volumes:
  pgdata:

