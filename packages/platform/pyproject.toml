[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qym-platform"
version = "0.1.0"
description = "Deployed web platform for qym evaluation framework"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Faisal Bin Hussein", email = "faisalx96@yahoo.com"},
]
dependencies = [
    "qym>=0.7.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "Authlib>=1.3.1",
    "itsdangerous>=2.2.0",
    "python-dotenv>=0.19.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pandas>=2.0.0",
    "dataiku-api-client>=13.0.0",
    "openai>=1.0.0",
    "cryptography>=42.0.0",
]

[project.scripts]
qym-platform = "qym_platform.cli:main"

# Package data (static UI builds, docs, alembic migrations) is declared in
# MANIFEST.in (graft qym_platform/_static + graft qym_platform/migrations) and
# pulled into wheels/sdists via include-package-data. This replaced the old
# non-recursive [tool.setuptools.package-data] globs, which silently missed
# nested build output like _static/app/assets/*.
[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
