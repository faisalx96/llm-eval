<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>qym Docs</title>
  <link rel="icon" type="image/png" href="./qym_icon.png?v=3" />
  <link rel="stylesheet" href="./portal.css?v=3" />
</head>
<body>
  <div class="portal-shell">
    <aside class="portal-sidebar">
      <a class="portal-brand" href="./">
        <span class="portal-brand-mark">قيِّم</span>
        <span class="portal-brand-text">Docs</span>
      </a>
      <div class="portal-search">
        <label for="portal-search-input">Search docs</label>
        <input id="portal-search-input" type="search" placeholder="Search commands, config, examples..." />
      </div>
      <nav id="portal-nav" class="portal-nav"></nav>
      <div class="portal-sidebar-footer">
        <a id="portal-app-link" href="../">Back to App</a>
        <a href="./openapi.json">OpenAPI JSON</a>
      </div>
    </aside>
    <main class="portal-main">
      <header class="portal-header">
        <div class="portal-header-copy">
          <div class="portal-kicker">Self-hosted docs</div>
          <h1 id="portal-title">qym Docs</h1>
          <p id="portal-summary"></p>
        </div>
        <div class="portal-meta">
          <div class="portal-meta-label">Generated</div>
          <div id="portal-generated-at"></div>
        </div>
      </header>
      <div id="portal-results" class="portal-results" hidden></div>
      <article id="portal-content" class="portal-content"></article>
    </main>
  </div>
  <script src="./portal.js?v=3" defer></script>
</body>
</html>
