        container.querySelectorAll('.category-chip[data-chip-key]').forEach(chip => {
          chip.addEventListener('click', () => {
            const key = chip.dataset.chipKey;
            if (state.selectedCategories.has(key)) {
              state.selectedCategories.delete(key);
              // Clear any active filter for this category
              setCatFilter(key, null);
            } else {
              state.selectedCategories.add(key);
            }
            renderMetadataBreakdown();
            // Re-render items in case a filter was cleared
            state.page = 1;
            renderItems();
          });
        });
      }

      function normalizeErrorLabel(value, fallback) {
        let text = stringify(value || '').trim();
        if (!text) text = fallback || 'Unknown error';
        text = text.replace(/^ERROR:\s*/i, '').split(/\r?\n/).map(s => s.trim()).filter(Boolean).join(' ') || text;
        text = text.replace(/\s+/g, ' ').trim();
        return text;
      }

      function splitErrorLabel(label) {
        const text = String(label || '').trim();
        const idx = text.indexOf(':');
        if (idx <= 0) return { title: text || 'Unknown error', detail: '' };
        const title = text.slice(0, idx).trim();
        const detail = text.slice(idx + 1).trim();
        if (!title || !detail) return { title: text || 'Unknown error', detail: '' };
        return { title: title, detail: detail };
      }

      function getErrorBucketKey(kind, label) {
        const parts = splitErrorLabel(label);
        const title = parts.title.replace(/\s+/g, ' ').trim();
        const detail = parts.detail.replace(/\s+/g, ' ').trim();
        const visibleDetail = detail.length > 72 ? detail.slice(0, 69).trimEnd() : detail;
        return kind + '||' + title + '||' + visibleDetail;
      }

      function renderErrorDetailHtml(detail) {
        const text = String(detail || '').trim();
        if (!text) return '';
        const needsExpand = text.length > 120;
        if (!needsExpand) return '<div class="error-card-detail">' + escapeHtml(text) + '</div>';
        return '<div class="error-card-detail" data-error-full="' + escapeAttr(text) + '">' +
          '<span class="error-detail-text">' + escapeHtml(text) + '</span><span class="error-detail-more">' +
          '<button type="button" class="error-detail-toggle">Show more</button></span></div>';
      }

      function addErrorBucket(buckets, kind, label, count, itemId) {
        const safeCount = Math.max(1, Number(count) || 1);
        const key = getErrorBucketKey(kind, label);
        if (!buckets[key]) {
          buckets[key] = { kind: kind, label: label, count: 0, itemIds: new Set() };
        }
        buckets[key].count += safeCount;
        if (itemId != null && itemId !== '') buckets[key].itemIds.add(String(itemId));
      }

      function rowMatchesErrorFilter(row, filter) {
        if (!filter) return true;
        const buckets = {};
        collectRowErrors(row, buckets);
        return !!buckets[getErrorBucketKey(filter.kind, filter.label)];
      }

      function rowMatchesActiveErrorFilters(row) {
        return rowMatchesErrorFilter(row, state.taskErrorFilter) &&
          rowMatchesErrorFilter(row, state.traceErrorFilter) &&
          rowMatchesErrorFilter(row, state.analysisErrorFilter);
      }

      function getErrorFilterSlot(kind) {
        if (kind === 'Task error') return 'taskErrorFilter';
        if (kind === 'Trace error') return 'traceErrorFilter';
        if (kind === 'Analysis error') return 'analysisErrorFilter';
        return 'traceErrorFilter';
      }

      function collectRowErrors(row, buckets) {
        if (!row) return;
        const itemId = row.item_id || String(row.index || '');
        if ((row.status || '') === 'error') {
          const executionError = row.error || row.output_full || row.output || '';
          addErrorBucket(buckets, 'Task error', normalizeErrorLabel(executionError, 'Task failed'), 1, itemId);
        }

        const md = row.item_metadata || {};
        if (md.analysis_error) {
          addErrorBucket(buckets, 'Analysis error', normalizeErrorLabel(md.analysis_error, 'Analysis failed'), 1, itemId);
        }

        const ts = (row.trace_stats && typeof row.trace_stats === 'object') ? row.trace_stats : {};
        const toolErrors = Number(ts.tool_errors || ts.malformed_tool_calls || 0);
        const providerErrors = Number(ts.provider_errors || 0);
        if (toolErrors > 0) addErrorBucket(buckets, 'Trace error', 'Tool errors', toolErrors, itemId);
        if (providerErrors > 0) addErrorBucket(buckets, 'Trace error', 'Provider errors', providerErrors, itemId);
      }

      function renderErrorDistributionSection() {
        const section = el('error-distribution-section');
        if (!section) return;

        const buckets = {};
        const filteredItems = getFilteredItems();
        for (const item of filteredItems) collectRowErrors(item.row, buckets);

        const stats = Object.values(buckets).sort((a, b) => b.count - a.count || a.label.localeCompare(b.label));
        const totalErrors = stats.reduce((sum, entry) => sum + entry.count, 0);

        if (totalErrors === 0) {
          section.innerHTML = '<h3 class="section-title">Error Distribution</h3>' +
            '<div class="comparison-stats"><div class="section-empty-state">' +
              '<div class="section-empty-copy"><span>No errors in the current filtered items.</span></div>' +
            '</div></div>';
          return;
        }

        function renderErrorCards(entries) {
          if (!entries.length) return '<div class="category-empty-state">No errors in this category.</div>';
          let cards = '<div class="breakdown-grid">';
          for (const entry of entries) {
            const labelParts = splitErrorLabel(entry.label);
            const itemCount = entry.itemIds.size;
            const itemText = itemCount === 1 ? '1 item' : itemCount + ' items';
            const itemCountHtml = entry.kind === 'Task error' ? '' : '<div class="error-card-item-count">' + itemText + '</div>';
            const countLabel = entry.count === 1 ? 'error' : 'errors';
            const activeFilter = state[getErrorFilterSlot(entry.kind)];
            const isActive = activeFilter && activeFilter.kind === entry.kind && activeFilter.label === entry.label;
            cards += '<div class="breakdown-card error-card' + (isActive ? ' active' : '') + '" data-error-kind="' + escapeAttr(entry.kind) + '" data-error-label="' + escapeAttr(entry.label) + '" title="Click to filter by this error">' +
              '<div class="error-card-top">' +
                '<div class="error-card-text"><div class="error-card-title" title="' + escapeAttr(entry.label) + '">' + escapeHtml(labelParts.title) + '</div></div>' +
                '<div class="error-card-count">' + entry.count + '<span class="error-card-count-label">' + countLabel + '</span></div>' +
              '</div>' +
              renderErrorDetailHtml(labelParts.detail) +
              itemCountHtml +
            '</div>';
          }
          return cards + '</div>';
        }

      function renderErrorGroup(title, icon, entries, alwaysShow) {
        if (!alwaysShow && entries.length === 0) return '';
        const groupTotal = entries.reduce((sum, entry) => sum + entry.count, 0);
          const iconHtml = icon === 'task'
            ? '<svg class="breakdown-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>'
            : '<svg class="breakdown-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h4l2-7 4 14 2-7h4"/></svg>';
          const groupClass = icon === 'task' ? 'task-error-group' : 'trace-error-group';
        return '<div class="breakdown-section breakdown-errors ' + groupClass + '">' +
            '<div class="breakdown-header">' + iconHtml + ' ' + escapeHtml(title) + ' <span class="breakdown-metric">' + groupTotal + '</span></div>' +
            renderErrorCards(entries) +
          '</div>';
      }

        const taskStats = stats.filter(entry => entry.kind === 'Task error');
        const traceStats = stats.filter(entry => entry.kind === 'Trace error');
        const analysisStats = stats.filter(entry => entry.kind === 'Analysis error');

        let html = '<h3 class="section-title">Error Distribution</h3>';
        html += '<div class="comparison-stats">';
        html += renderErrorGroup('Task Errors', 'task', taskStats, true);
        html += renderErrorGroup('Trace Errors', 'trace', traceStats, true);
        html += renderErrorGroup('Analysis Errors', 'trace', analysisStats, false);
        html += '</div>';
        section.innerHTML = html;

        section.querySelectorAll('.error-card[data-error-kind]').forEach(card => {
          card.addEventListener('click', (e) => {
            if (e.target.closest('.error-detail-toggle')) return;
            const nextFilter = { kind: card.dataset.errorKind, label: card.dataset.errorLabel };
            const slot = getErrorFilterSlot(nextFilter.kind);
            const current = state[slot];
            state[slot] = current && current.kind === nextFilter.kind && current.label === nextFilter.label ? null : nextFilter;
            state.page = 1;
            renderItems();
          });
        });
        section.querySelectorAll('.error-detail-toggle').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const detail = btn.closest('.error-card-detail');
            if (!detail) return;
            const textEl = detail.querySelector('.error-detail-text');
            const expanded = detail.dataset.expanded === '1';
            detail.dataset.expanded = expanded ? '0' : '1';
            textEl.textContent = detail.dataset.errorFull;
            btn.textContent = expanded ? 'Show more' : 'Show less';
          });
        });
      }

      function renderRootCauseSection() {
        const section = el('root-cause-section');
        if (!section) return;

        const rows = state.snapshot.rows || [];
        const filteredItems = getFilteredItems();
        const filteredItemIds = new Set(filteredItems.map(item => {
          const r = item.row;
          return r.item_id || String(r.index);
        }));
        const anyAssignedOverall = rows.some(row => {
          const md = row.item_metadata || {};
          return !!String(md.root_cause || '').trim();
        });
        const filteredFailedCount = filteredItems.filter(item => {
          const row = item.row;
          const status = row.status || '';
          if (status === 'error') return true;
          const metric = state.selectedMetric;
          const mIdx = metric ? state.allMetrics.indexOf(metric) : -1;
          if (mIdx < 0) return false;
          const score = window.QymMetrics.parseScoreValue((row.metric_values || [])[mIdx]);
          const threshold = state.metricIsBoolean[metric] ? 0.9999 : (state.metricThresholds[metric] || 0.8);
          return score !== null && score < threshold;
        }).length;

        // Build hierarchical root cause categories
        const rcCategories = {};
        for (const row of rows) {
          const itemId = row.item_id || String(row.index);
          if (!filteredItemIds.has(itemId)) continue;
          const md = row.item_metadata || {};
          const rcRaw = String(md.root_cause || '');
          if (!rcRaw) continue;
          const rcDetail = md.root_cause_detail || '';
          if (!rcCategories[rcRaw]) rcCategories[rcRaw] = { count: 0, subcauses: {} };
          rcCategories[rcRaw].count++;
          if (rcDetail) {
            rcCategories[rcRaw].subcauses[rcDetail] = (rcCategories[rcRaw].subcauses[rcDetail] || 0) + 1;
          }
        }

        const catStats = Object.entries(rcCategories)
          .map(([cat, data]) => ({ category: cat, count: data.count, subcauses: data.subcauses }))
          .sort((a, b) => b.count - a.count);

        // Empty state if no root cause data
        if (catStats.length === 0) {
          const emptyMsg = anyAssignedOverall
            ? (filteredFailedCount === 0
                ? 'The current filtered items are all passing, so there are no root causes to summarize.'
                : 'No root causes appear in the current filtered items. Adjust filters to view failure patterns.')
            : 'No root causes assigned yet. Run Auto-Analyze to identify failure patterns.';
          const autoAnalyzeHtml = anyAssignedOverall
            ? ''
            : '<button class="auto-analyze-btn" id="auto-analyze-btn" title="AI-powered root cause analysis"><span class="ai-icon">\uD83E\uDD16</span> Auto-Analyze</button>';
          section.innerHTML = '<h3 class="section-title">Root Cause Analysis</h3>' +
            '<div class="comparison-stats"><div class="section-empty-state">' +
              '<div class="section-empty-copy"><span>' + escapeHtml(emptyMsg) + '</span></div>' +
              (autoAnalyzeHtml ? '<div class="section-empty-actions">' + autoAnalyzeHtml + '</div>' : '') +
            '</div></div>';
          var aaBtn0 = section.querySelector('#auto-analyze-btn');
          if (aaBtn0) aaBtn0.addEventListener('click', function () { QymPlayground.open(); });
          return;
        }

        let html = '<h3 class="section-title">Root Cause Analysis <button class="auto-analyze-btn" id="auto-analyze-btn" title="AI-powered root cause analysis" style="margin-left:12px;"><span class="ai-icon">\uD83E\uDD16</span> Auto-Analyze</button></h3>';
        html += '<div class="comparison-stats"><div class="breakdown-section breakdown-root-cause">';
        html += '<div class="breakdown-header"><span class="breakdown-icon">\u2666</span> Categories &amp; Subcauses</div>';
        html += '<div class="breakdown-grid">';

        for (const cat of catStats) {
          const rcColor = ROOT_CAUSE_COLORS[cat.category] || '#e07a5f';
          const subcauseList = Object.entries(cat.subcauses).sort((a, b) => b[1] - a[1]);
          let subcauseHtml = '';
          if (subcauseList.length > 0) {
            subcauseHtml = '<div class="rc-subcauses">' + subcauseList.map(function(sc) {
              return '<div class="rc-subcause-item" data-bd-category="root_cause" data-bd-value="' + escapeAttr(cat.category) + '" style="cursor:pointer;" title="' + escapeAttr(sc[0]) + '">' +
                '<span class="rc-subcause-name">' + escapeHtml(sc[0]) + '</span>' +
                '<span class="rc-subcause-count">' + sc[1] + '</span>' +
              '</div>';
            }).join('') + '</div>';
          }
          html += '<div class="breakdown-card rc-category-card" data-bd-category="root_cause" data-bd-value="' + escapeAttr(cat.category) + '" style="cursor:pointer;" title="Click to filter by ' + escapeAttr(cat.category) + '">' +
            '<div class="rc-category-pill" style="background:' + rcColor + '20;border-color:' + rcColor + '40;color:' + rcColor + ';">' +
              '<span class="rc-category-pill-name">' + escapeHtml(cat.category) + '</span>' +
              '<span class="rc-category-pill-count" style="background:' + rcColor + '30;">' + cat.count + '</span>' +
            '</div>' +
            subcauseHtml +
          '</div>';
        }

        html += '</div></div>';
        html += '<div id="sankey-diagram-container"></div>';
        html += '</div>';
        section.innerHTML = html;

        // Render Sankey diagram
        renderSankeyDiagram(rows, filteredItemIds);

        // Sankey highlight helpers scoped to this section
        var sankeyContainer = section.querySelector('#sankey-diagram-container');
        function highlightSankey(rc) {
          if (!sankeyContainer) return;
          var allPaths = sankeyContainer.querySelectorAll('[data-sankey-link-rc]');
          var allNodes = sankeyContainer.querySelectorAll('.sankey-node');
          var connectedSol = new Set();
          allPaths.forEach(function (p) {
            if (p.dataset.sankeyLinkRc === rc) {
              connectedSol.add(p.dataset.sankeyLinkSol);
              p.classList.add('sankey-highlighted');
              p.classList.remove('sankey-dimmed');
              p.setAttribute('stroke-opacity', '0.7');
            } else {
              p.classList.add('sankey-dimmed');
              p.classList.remove('sankey-highlighted');
              p.setAttribute('stroke-opacity', '0.08');
            }
          });
          allNodes.forEach(function (n) {
            var connected = (n.dataset.sankeyRc && n.dataset.sankeyRc === rc) ||
                            (n.dataset.sankeySol && connectedSol.has(n.dataset.sankeySol));
            if (connected) { n.classList.add('sankey-highlighted'); n.classList.remove('sankey-dimmed'); }
            else { n.classList.add('sankey-dimmed'); n.classList.remove('sankey-highlighted'); }
          });
        }
        function clearSankeyHighlight() {
          if (!sankeyContainer) return;
          sankeyContainer.querySelectorAll('[data-sankey-link-rc]').forEach(function (p) {
            p.classList.remove('sankey-highlighted', 'sankey-dimmed');
            p.setAttribute('stroke-opacity', '0.35');
          });
          sankeyContainer.querySelectorAll('.sankey-node').forEach(function (n) {
            n.classList.remove('sankey-highlighted', 'sankey-dimmed');
          });
        }

        // Wire click-to-filter and hover-to-highlight on root cause cards
        section.querySelectorAll('.breakdown-card[data-bd-category]').forEach(card => {
          card.addEventListener('click', () => {
            const val = card.dataset.bdValue;
            const current = getCatFilter('root_cause');
            if (current !== null && current.length === 1 && current[0] === val) {
              setCatFilter('root_cause', null);
            } else {
              setCatFilter('root_cause', [val]);
            }
            syncMultiselectUI('root_cause');
            state.page = 1;
            renderItems();
          });
          card.addEventListener('mouseenter', function () {
            highlightSankey(card.dataset.bdValue);
          });
          card.addEventListener('mouseleave', function () {
            clearSankeyHighlight();
          });
        });

        // Wire auto-analyze button
        var aaBtn = section.querySelector('#auto-analyze-btn');
        if (aaBtn) aaBtn.addEventListener('click', function () { QymPlayground.open(); });
      }

      // ── Filtering & Items ──

      function getFilteredItems() {
        const rows = state.snapshot.rows || [];
        const metric = state.selectedMetric;
        const mIdx = metric ? state.allMetrics.indexOf(metric) : -1;
        const isBoolean = metric ? state.metricIsBoolean[metric] : false;
        const threshold = isBoolean ? 0.9999 : (state.metricThresholds[metric] || 0.8);
        let items = [];

        for (const row of rows) {
          // Search filter
          if (state.searchQuery) {
            const q = state.searchQuery.toLowerCase();
            const itemId = String(row.item_id || row.index || '').toLowerCase();
            const inp = stringify(row.input_full || row.input || '').toLowerCase();
            const exp = stringify(row.expected_full || row.expected || '').toLowerCase();
            const out = stringify(row.output_full || row.output || '').toLowerCase();
            if (!itemId.includes(q) && !inp.includes(q) && !exp.includes(q) && !out.includes(q)) continue;
          }

          // Category filters
          const md = (typeof row.item_metadata === 'object') ? row.item_metadata : {};
          if (state.complexityFilter !== null) {
            if (state.complexityFilter.length === 0) continue;
            const val = String(md.complexity ?? '').toLowerCase();
            if (!state.complexityFilter.some(f => f.toLowerCase() === val)) continue;
          }
          if (state.domainFilter !== null) {
            const domainVals = parseMetaList(md.domain).map(v => v.toLowerCase());
            if (state.domainFilterMode === 'exclude') {
              if (state.domainFilter.some(f => domainVals.includes(f.toLowerCase()))) continue;
            } else {
              if (state.domainFilter.length === 0) continue;
              // AND logic: item must contain ALL selected domains
              if (!state.domainFilter.every(f => domainVals.includes(f.toLowerCase()))) continue;
              // Exclusive domains: item must have ONLY that domain (sole value)
              if (state.domainExclusive.size > 0) {
                for (const ex of state.domainExclusive) {
                  if (domainVals.includes(ex.toLowerCase()) && domainVals.length > 1) { domainVals.length = 0; break; }
                }
                if (domainVals.length === 0) continue;
              }
            }
          }
          if (state.rootCauseFilter !== null) {
            if (state.rootCauseFilter.length === 0) continue;
            const rcVal = String(md.root_cause ?? '');
            const wantNone = state.rootCauseFilter.includes('__none__');
            const namedFilters = state.rootCauseFilter.filter(f => f !== '__none__');
            const matchesNamed = namedFilters.length > 0 && namedFilters.some(f => f.toLowerCase() === rcVal.toLowerCase());
            const matchesNone = wantNone && !rcVal;
            if (!matchesNamed && !matchesNone) continue;
          }
          if (state.approvalFilter !== null) {
            if (!matchesApprovalFilter(row, state.approvalFilter)) continue;
          }
          // Custom category filters
          let customFilterFail = false;
          for (const [cfKey, cfVal] of Object.entries(state.categoryFilters)) {
            if (cfVal === null) continue;
            if (cfVal.length === 0) { customFilterFail = true; break; }
            const itemVals = getMetadataCategoryValues(md, cfKey).map(v => v.toLowerCase());
            const effectiveVals = itemVals.length ? itemVals : ['unknown'];
            if (!cfVal.some(f => effectiveVals.includes(String(f).toLowerCase()))) { customFilterFail = true; break; }
          }
          if (customFilterFail) continue;
          if (!rowMatchesActiveErrorFilters(row)) continue;

          // Score for this metric
          let score = null;
          if (mIdx >= 0) {
            const result = window.QymMetrics.getRowScore(row, mIdx);
            score = result.score;
          }

          // Item filter
          if (state.itemFilter === 'passed') {
            if (score === null || score < threshold) continue;
          } else if (state.itemFilter === 'failed') {
            const isError = window.QymMetrics.isErrorRow(row);
            if (!isError && (score === null || score >= threshold)) continue;
          } else if (state.itemFilter === 'errors') {
            if (!window.QymMetrics.isErrorRow(row)) continue;
          } else if (state.itemFilter === 'edited_metrics') {
            if (!rowHasEditedMetric(row)) continue;
          } else if (state.itemFilter === 'retries') {
            if ((row.retry_count || 0) <= 0) continue;
          } else if (state.itemFilter === 'trace_errors') {
            if (getRowTraceErrorCount(row) <= 0) continue;
          }

          // Score distribution filter
          if (state.scoreDistFilter) {
            if (score === null) continue;
            if (score < state.scoreDistFilter.min || score >= state.scoreDistFilter.max) continue;
          }

          // Latency distribution filter
        if (state.latencyDistFilter) {
            const lat = row.latency_ms || 0;
            if (lat < state.latencyDistFilter.min || lat >= state.latencyDistFilter.max) continue;
          }

          items.push({ row, score });
        }

        // Sorting
        if (state.sortBy === 'score_asc') {
          items.sort((a, b) => (a.score ?? -1) - (b.score ?? -1));
        } else if (state.sortBy === 'score_desc') {
          items.sort((a, b) => (b.score ?? -1) - (a.score ?? -1));
        } else if (state.sortBy === 'latency_asc') {
          items.sort((a, b) => (a.row.latency_ms || 0) - (b.row.latency_ms || 0));
        } else if (state.sortBy === 'latency_desc') {
          items.sort((a, b) => (b.row.latency_ms || 0) - (a.row.latency_ms || 0));
        }
        // default: index order (already sorted)

        return items;
      }

      var _breakdownTimer = null;
      function getScrollHost() {
        return document.querySelector('.run-container');
      }

      function getItemsGridTop() {
        const grid = el('items-grid');
        return grid ? grid.getBoundingClientRect().top : null;
      }

      function restoreItemsGridTop(anchorTop) {
        const host = getScrollHost();
        const grid = el('items-grid');
        if (!host || !grid || anchorTop == null) return;
        const currentTop = grid.getBoundingClientRect().top;
        host.scrollTop += currentTop - anchorTop;
      }

      function scheduleBreakdownRender(preserveAnchor = false) {
        const anchorTop = preserveAnchor ? getItemsGridTop() : null;
        clearTimeout(_breakdownTimer);
        _breakdownTimer = setTimeout(function () {
          renderMetadataBreakdown();
          renderErrorDistributionSection();
          renderRootCauseSection();
          if (anchorTop != null) {
            requestAnimationFrame(() => restoreItemsGridTop(anchorTop));
          }
        }, 80);
      }

      function renderItemsHeatmap(container, items, metric, metricIndex) {
        const rowHeight = 40;
        const metricType = state.metricTypes[metric] || 'score';
        const rowValues = items.map(item => {
          const row = item.row;
          let values = [];
          if (!state.viewPass && Array.isArray(row.pass_scores?.[metric])) {
            values = row.pass_scores[metric].map(value => window.QymMetrics.parseScoreValue(value));
          } else {
            const { score } = window.QymMetrics.getRowScore(row, metricIndex);
            values = [score];
          }
          return { row, values };
        });
        const passCount = Math.max(1, ...rowValues.map(item => item.values.length));
        const minWidth = 364 + passCount * 72;
        const passHeaders = Array.from({ length: passCount }, (_, index) => '<span style="text-align:center">Pass ' + (index + 1) + '</span>').join('');
        container.classList.add('heatmap-mode');
        container.innerHTML = '<div class="item-heatmap-shell"><div class="item-heatmap-scroll"><div class="item-heatmap-grid item-heatmap-head" style="--heat-pass-count:' + passCount + ';--heat-min-width:' + minWidth + 'px"><span>Item</span><span>Complexity</span><span class="numeric">Mean</span><span class="numeric">Std dev</span>' + passHeaders + '</div>' +
          '<div class="item-heatmap-viewport" id="item-heatmap-viewport"><div class="item-heatmap-spacer" style="height:' + (rowValues.length * rowHeight) + 'px"></div><div class="item-heatmap-layer" id="item-heatmap-layer"></div></div></div>' +
          '<div class="item-heatmap-meta"><span id="item-heatmap-count"></span><span>Only visible rows are rendered</span></div></div>';
        const viewport = el('item-heatmap-viewport');
        const layer = el('item-heatmap-layer');
        const count = el('item-heatmap-count');
        const draw = () => {
          const start = Math.max(0, Math.floor(viewport.scrollTop / rowHeight) - 2);
          const end = Math.min(rowValues.length, start + 14);
          layer.style.transform = 'translateY(' + (start * rowHeight) + 'px)';
          layer.innerHTML = rowValues.slice(start, end).map(({ row, values }) => {
            const numericValues = values.filter(value => value !== null && Number.isFinite(value));
            const average = numericValues.length ? riMean(numericValues) : null;
            const deviation = numericValues.length > 1 ? riStdDev(numericValues) : 0;
            const category = row.item_metadata?.complexity || parseMetaList(row.item_metadata?.domain || '')[0] || '\u2014';
            const cells = Array.from({ length: passCount }, (_, index) => {
              const value = values[index];
              if (value === null || !Number.isFinite(value)) return '<span class="item-heatmap-cell empty">\u2014</span>';
              const normalized = metricType === 'numeric' ? 0.5 : Math.max(0, Math.min(1, value));
              return '<span class="item-heatmap-cell" style="background:' + riScoreColor(normalized) + ';opacity:' + (0.55 + normalized * 0.45).toFixed(2) + '" title="' + escapeAttr((row.item_id || String(row.index)) + ' · pass ' + (index + 1) + ' · ' + riMetricValue({ type: metricType }, value)) + '">' + escapeHtml(riMetricValue({ type: metricType }, value)) + '</span>';
            }).join('');
            return '<div class="item-heatmap-grid item-heatmap-row" style="--heat-pass-count:' + passCount + ';--heat-min-width:' + minWidth + 'px"><span class="item-heatmap-id" title="' + escapeAttr(row.item_id || String(row.index)) + '">' + escapeHtml(row.item_id || String(row.index)) + '</span><span class="item-heatmap-category">' + escapeHtml(String(category)) + '</span><span class="item-heatmap-number">' + (average === null ? '\u2014' : escapeHtml(riMetricValue({ type: metricType }, average))) + '</span><span class="item-heatmap-number">' + escapeHtml(formatPercent(deviation)) + '</span>' + cells + '</div>';
          }).join('');
          count.textContent = rowValues.length + ' matching items · ' + (end - start) + ' rows rendered';
        };
        viewport.addEventListener('scroll', draw, { passive: true });
        draw();
      }

      function renderItems(scrollToTop) {
        const preserveAnchor = state.hasRenderedItems && !scrollToTop;
        const anchorTop = preserveAnchor ? getItemsGridTop() : null;
        // Keep Performance by Category in sync with the current filters (debounced)
        scheduleBreakdownRender(preserveAnchor);

        const container = el('items-grid');
        const paginationEl = el('pagination');
        const filterCountEl = el('filter-count');
        const items = getFilteredItems();
        const metric = state.selectedMetric;
        const mIdx = metric ? state.allMetrics.indexOf(metric) : -1;
        const isBoolean = metric ? state.metricIsBoolean[metric] : false;
        const threshold = isBoolean ? 0.9999 : (state.metricThresholds[metric] || 0.8);
        renderOverview(items);

        filterCountEl.innerHTML = 'Showing <span class="count-num">' + items.length + '</span> items';
        updateClearButton();

        const totalPages = Math.max(1, Math.ceil(items.length / state.pageSize));
        if (state.page > totalPages) state.page = totalPages;
        const start = (state.page - 1) * state.pageSize;
        const pageItems = items.slice(start, start + state.pageSize);

        if (items.length === 0) {
          container.classList.remove('heatmap-mode');
          container.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--text-muted);">No items match the current filter</div>';
          paginationEl.innerHTML = '';
          if (anchorTop != null) requestAnimationFrame(() => restoreItemsGridTop(anchorTop));
          return;
        }

        if (state.itemDetailView === 'heatmap') {
          paginationEl.innerHTML = '';
          renderItemsHeatmap(container, items, metric, mIdx);
          if (scrollToTop) container.scrollIntoView({ behavior: 'smooth', block: 'start' });
          else if (anchorTop != null) requestAnimationFrame(() => restoreItemsGridTop(anchorTop));
          state.hasRenderedItems = true;
          return;
        }

        container.classList.remove('heatmap-mode');
        container.innerHTML = pageItems.map(({ row: baseRow }) => {
          // Attempt lens: a card can be switched to one pass's slice \u2014
          // that pass's output/latency/trace/status and scores.
          const passAttempts = Array.isArray(baseRow.pass_attempts) ? baseRow.pass_attempts : null;
          const lensPass = (!state.viewPass && passAttempts)
            ? ((state.itemPassLens || {})[baseRow.item_id || String(baseRow.index)] || null)
            : null;
          let row = baseRow;
          if (lensPass) {
            const att = passAttempts[lensPass - 1];
            const lensValues = state.allMetrics.map(name => {
              const scores = (baseRow.pass_scores || {})[name];
              return (Array.isArray(scores) && scores.length >= lensPass) ? scores[lensPass - 1] : null;
            });
            row = {
              ...baseRow,
              metric_values: lensValues,
              ...(att ? {
                status: att.status,
                error: att.error || '',
                output: att.output,
                output_full: att.output,
                latency_ms: att.latency_ms || 0,
                trace_id: att.trace_id || '',
                trace_url: att.trace_url || '',
              } : {}),
            };
          }
          const input = row.input_full || row.input || '\u2014';
          const expected = row.expected_full || row.expected || '';
          const output = row.output_full || row.output || '\u2014';
          const status = row.status || 'pending';
          const latencyMs = row.latency_ms;
          const taskStartedAtMs = row.task_started_at_ms;
          const traceId = row.trace_id;
          const traceUrl = row.trace_url || buildLangfuseTraceUrl(traceId);
          const metricVals = row.metric_values || [];
          const metricMeta = row.metric_meta || {};
          const itemId = row.item_id || String(row.index);
          const safeId = btoa(itemId).replace(/[+/=]/g, '_');

          // Display item ID
          let displayItemId = itemId;
          const itemMatch = itemId.match(/^item_(\d+)$/);
          if (itemMatch) displayItemId = 'Item ' + (parseInt(itemMatch[1], 10) + 1);

          // Metric scores inline
          const metricScoresHtml = state.allMetrics.map((name, i) => {
            const sv = metricVals[i];
            const v = window.QymMetrics.parseScoreValue(sv);
            if (v === null) return '';
            const mType = state.metricTypes[name] || 'score';
            const cls = window.QymMetrics.getMetricColorClass(v, mType);
            const display = window.QymMetrics.formatMetricValue(v, mType);
            const isSelected = name === metric;
            const meta = metricMeta[name] || {};
            const editBtn = '<button class="metric-edit-open" data-row-index="' + escapeAttr(String(row.index ?? 0)) + '" data-metric="' + escapeAttr(name) + '" title="Edit">\u270E</button>';
            const editedBadge = String(meta.modified || '').toLowerCase() === 'true' ? '<span class="metric-edit-badge">Edited</span>' : '';
            return '<div class="metric-score-row ' + (isSelected ? 'highlighted' : '') + '"><span class="metric-score-name">' + escapeHtml(name) + '</span><span class="metric-score-meta"><span class="metric-score-value ' + cls + '">' + display + '</span>' + editBtn + editedBadge + '</span></div>';
          }).join('');

          // Metric edit blocks
          let metricEditHtml = state.allMetrics.map((name, i) => {
            const rawScore = metricVals[i];
            const rawValue = (rawScore == null || rawScore === '') ? '' : String(rawScore);
            const meta = metricMeta[name] || {};
            const originalRaw = meta.original_score;
            const hasOriginal = !(originalRaw == null || originalRaw === '');
            const modifiedNote = hasOriginal ? '<div class="metric-edit-meta">Original: ' + escapeHtml(String(originalRaw)) + '</div>' : '';
            return '<div class="metric-edit-block hidden" data-row-index="' + escapeAttr(String(row.index ?? 0)) + '" data-metric="' + escapeAttr(name) + '"><div class="metric-edit-title">Edit ' + escapeHtml(name) + '_score</div><div class="metric-edit-controls"><input class="metric-edit-input" type="text" value="' + escapeAttr(rawValue) + '" data-row-index="' + escapeAttr(String(row.index ?? 0)) + '" data-metric="' + escapeAttr(name) + '" /><button class="metric-edit-save" data-row-index="' + escapeAttr(String(row.index ?? 0)) + '" data-metric="' + escapeAttr(name) + '">Save</button><span class="metric-edit-status"></span></div>' + modifiedNote + '</div>';
          }).join('');

          // Status left cluster
          const startInfo = formatTaskStart(taskStartedAtMs);
          const clockIcon = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="6.25"/><path d="M8 4.5V8l2.5 1.5"/></svg>';
          const durationPart = latencyMs ? '<span class="toolbar-sep">\u00B7</span><span class="toolbar-duration">' + clockIcon + '<span>' + formatLatency(latencyMs) + '</span></span>' : '';
          const timePart = startInfo ? '<span class="toolbar-sep">\u00B7</span><span class="toolbar-time" title="' + escapeAttr(startInfo.ts) + '">' + escapeHtml(startInfo.ts) + '</span>' : '';

          // Action chips (right cluster)
          const copyBtn = '<button class="copy-btn" data-copy-text="' + escapeAttr(typeof output === 'object' ? JSON.stringify(output,null,2) : String(output)) + '" title="Copy output">' + COPY_ICON + '</button>';
          const traceEndpoint = apiUrl('api/runs/' + encodeURIComponent(state.run.file_path || '') + '/items/' + encodeURIComponent(itemId) + '/trace');
          const traceChip = !IS_EXPORT
            ? '<button type="button" class="action-chip trace-drawer-btn" data-trace-endpoint="' + escapeAttr(traceEndpoint) + '" data-trace-item-label="' + escapeAttr((state.run.run_name || 'Run') + ' \u00B7 ' + displayItemId) + '" data-trace-id="' + escapeAttr(traceId || '') + '" data-trace-url="' + escapeAttr(traceUrl || '') + '" title="Open trace viewer"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2.5 4h11M2.5 8h7M2.5 12h9"/><circle cx="12.5" cy="8" r="1.2" fill="currentColor" stroke="none" opacity=".5"/><circle cx="13.5" cy="12" r="1.2" fill="currentColor" stroke="none" opacity=".5"/></svg>Trace</button>'
            : '';
          const langfuseChip = traceUrl ? '<a class="action-chip" href="' + escapeAttr(traceUrl) + '" target="_blank" title="View in Langfuse"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5H4A1.5 1.5 0 0 0 2.5 5v7A1.5 1.5 0 0 0 4 13.5h7A1.5 1.5 0 0 0 12.5 12v-2"/><path d="M9.5 2.5h4v4"/><path d="M13.25 2.75 7.5 8.5"/></svg>Langfuse</a>' : '';

          // Pass/fail status indicator (skip for numeric metrics — threshold doesn't apply)
          let statusIndicator = '';
          const pfMType = metric ? (state.metricTypes[metric] || 'score') : 'score';
          let pfClass = '';
          if (status === 'error') {
            pfClass = 'fail';
          } else if (metric && mIdx >= 0 && pfMType !== 'numeric') {
            const pfVal = window.QymMetrics.parseScoreValue(metricVals[mIdx]);
            if (pfVal !== null) {
              pfClass = pfVal >= threshold ? 'pass' : 'fail';
            }
          }
          if (pfClass) {
            statusIndicator = '<div class="status-indicator"><div class="status-dot ' + pfClass + '"></div><span class="status-label ' + pfClass + '">' + (pfClass === 'pass' ? 'Pass' : 'Fail') + '</span></div>';
          }

          // Repeat runs: per-pass dot strip for the selected metric.
          const rowPassScores = (row.pass_scores && metric) ? row.pass_scores[metric] : null;
          if (Array.isArray(rowPassScores) && rowPassScores.length > 1) {
            const dotTitle = 'Per-pass scores: ' + rowPassScores.map(v => (v == null ? '—' : v)).join(', ');
            const dots = rowPassScores.map(v => {
              if (v == null) return '<span class="pass-dot"></span>';
              return '<span class="pass-dot ' + (v >= threshold ? 'pass' : 'fail') + '"></span>';
            }).join('');
            statusIndicator += '<span class="pass-dots" title="' + escapeAttr(dotTitle) + '">' + dots + '</span>';
          }

          // Root cause + Solution (side by side for failed items)
          let rootCauseHtml = '';
          const itemPassed = pfClass === 'pass';
          const rowRc = row.item_metadata?.root_cause || '';
          const rowRcDetail = row.item_metadata?.root_cause_detail || '';
          const rowRcNote = row.item_metadata?.root_cause_note || '';
          const rowSol = row.item_metadata?.solution || '';
          const rowSolNote = row.item_metadata?.solution_note || '';
          const reviewCorrectionId = row.review_correction_id;
          const reviewStatus = row.review_correction_status || '';

          // Build root cause group (detail + category badges + shared feedback)
          let rcGroupHtml = '';
          const rcSource = row.item_metadata?.root_cause_source || '';
          const rcConfidence = row.item_metadata?.root_cause_confidence;
          const isAi = rcSource === 'ai';

          if (rowRc || rowRcDetail || !itemPassed) {
            const feedbackIcon = '<svg class="feedback-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 3h12v8H4l-2 2V3z"/></svg>';

            const rcColor = ROOT_CAUSE_COLORS[rowRc] || '#e07a5f';

            // Detail badge (specific issue) — uses same color as category
            let rcDetailBadge = '';
            if (rowRcDetail) {
              const aiClass = isAi ? ' ai-suggested' : '';
              const aiIcon = isAi ? '<span class="ai-indicator" title="AI suggested">\uD83E\uDD16</span>' : '';
              rcDetailBadge = '<span class="meta-badge badge-rc-detail' + aiClass + '" data-rcdetail-item="' + escapeAttr(itemId) + '" style="border-color:' + rcColor + '40;color:' + rcColor + ';background:' + rcColor + '15;max-width:100%;box-sizing:border-box;display:inline-flex;" title="Root cause: ' + escapeAttr(rowRcDetail) + '. Click to change.">' + aiIcon + escapeHtml(rowRcDetail) + '</span>';
            } else if (!itemPassed) {
              rcDetailBadge = '<button class="root-cause-assign-btn" data-rcdetail-item="' + escapeAttr(itemId) + '" title="Assign root cause"><span class="badge-icon">+</span>Root Cause</button>';
            }

            // Category badge (broad preset)
            let rcCategoryBadge = '';
            if (rowRc) {
              const aiClass = isAi ? ' ai-suggested' : '';
              let confidenceDot = '';
              const aiIcon = isAi ? '<span class="ai-indicator" title="AI suggested">\uD83E\uDD16</span>' : '';
              if (isAi && rcConfidence != null) {
                const dotColor = rcConfidence >= 0.8 ? '#22c55e' : (rcConfidence >= 0.5 ? '#eab308' : '#ef4444');
                confidenceDot = '<span class="confidence-dot" style="background:' + dotColor + ';" title="Confidence: ' + (rcConfidence * 100).toFixed(0) + '%"></span>';
              }
              rcCategoryBadge = '<span class="meta-badge badge-root-cause' + aiClass + '" data-rc-item="' + escapeAttr(itemId) + '" style="border-color:' + rcColor + '40;color:' + rcColor + ';background:' + rcColor + '15;max-width:100%;box-sizing:border-box;display:inline-flex;" title="Category: ' + escapeAttr(rowRc) + '. Click to change.">' + aiIcon + escapeHtml(rowRc) + confidenceDot + '</span>';
            } else if (!itemPassed) {
              rcCategoryBadge = '<button class="root-cause-assign-btn rc-category-assign" data-rc-item="' + escapeAttr(itemId) + '" title="Assign root cause category"><span class="badge-icon">+</span>Category</button>';
            }

            // Feedback (shared across both badges)
            var feedbackHtml = '';
            if (rowRc || rowRcDetail) {
              feedbackHtml = rowRcNote
                ? '<div class="feedback-section"><div class="feedback-display" data-feedback-item="' + escapeAttr(itemId) + '" title="Click to edit feedback">' + feedbackIcon + '<span class="feedback-text">' + escapeHtml(rowRcNote) + '</span></div></div>'
                : '<div class="feedback-section"><div class="feedback-display" data-feedback-item="' + escapeAttr(itemId) + '" title="Click to add feedback">' + feedbackIcon + '<span class="feedback-text feedback-placeholder">Add feedback\u2026</span></div></div>';
            }

            // Solution badge group
            let solBadgeHtml = '';
            if (rowSol) {
              const solColor = SOLUTION_COLORS[rowSol] || '#60a5fa';
              const solSource = row.item_metadata?.solution_source || '';
              const solIsAi = solSource === 'ai';
              const solIcon = solIsAi ? '<span class="ai-indicator">\uD83E\uDD16</span>' : '';
              solBadgeHtml = '<div class="rc-badge-group" style="max-width:100%;">' +
                '<span class="rc-sol-label sol-label">\uD83D\uDEE0 SOLUTION</span>' +
                '<span class="meta-badge badge-solution' + (solIsAi ? ' ai-suggested' : '') + '" data-sol-item="' + escapeAttr(itemId) + '" style="border-color:' + solColor + '40;color:' + solColor + ';background:' + solColor + '15;max-width:100%;box-sizing:border-box;display:inline-flex;" title="Solution: ' + escapeAttr(rowSol) + '. Click to change.">' + solIcon + escapeHtml(rowSol) + '</span>' +
                (rowSolNote ? '<div class="sol-note-text">' + escapeHtml(rowSolNote) + '</div>' : '') +
              '</div>';
            } else if (!itemPassed) {
              solBadgeHtml = '<div class="rc-badge-group" style="max-width:100%;">' +
                '<span class="rc-sol-label sol-label">\uD83D\uDEE0 SOLUTION</span>' +
                '<button class="solution-assign-btn" data-sol-item="' + escapeAttr(itemId) + '" title="Suggest solution"><span class="badge-icon">+</span>Solution</button>' +
              '</div>';
            }

            // Combine all badge groups + feedback
            var reviewStatusHtml = '';
            if (reviewStatus === 'approved') {
              reviewStatusHtml = '<div class="rc-inline-actions"><div class="rc-status-pill approved">Approved</div></div>';
            } else if (reviewStatus === 'pending' && reviewCorrectionId) {
              reviewStatusHtml = '<div class="rc-inline-actions"><div class="rc-status-pill pending">Pending Review</div><button class="rc-approve-btn" data-approve-correction="' + escapeAttr(String(reviewCorrectionId)) + '" data-approve-item="' + escapeAttr(itemId) + '">\u2713 Approve</button></div>';
            }
            var solSep = solBadgeHtml ? '<div class="rc-badges-sep"></div>' : '';
            rootCauseHtml = '<div class="rc-sol-row">' +
              reviewStatusHtml +
              '<div class="rc-badges-row">' +
                '<div class="rc-badge-group" style="max-width:100%;">' +
                  '<span class="rc-sol-label rc-label">\u26A0 ROOT CAUSE</span>' +
                  rcDetailBadge +
                '</div>' +
                '<div class="rc-badge-group" style="max-width:100%;">' +
                  '<span class="rc-sol-label rc-label">\uD83D\uDCC2 CATEGORY</span>' +
                  rcCategoryBadge +
                '</div>' +
                solSep +
                solBadgeHtml +
              '</div>' +
              feedbackHtml +
            '</div>';
          }

          // Metric details
          let metricDetailsHtml = '';
          const hasMetricMeta = Object.keys(metricMeta).length > 0;
          if (hasMetricMeta) {
            const detailRows = state.allMetrics.map(name => {
              const meta = metricMeta[name] || {};
              const metaKeys = Object.keys(meta).filter(k => !['modified','original_score'].includes(k) && state.visibleMetricMetaFields[k] !== false);
              if (!metaKeys.length) return '';
              return metaKeys.map(key => {
                const val = meta[key];
                if (val === undefined || val === null || val === '') return '';
                return '<div class="metric-detail-row"><span class="metric-detail-name">' + escapeHtml(name) + ' \u00B7 ' + formatFieldName(key) + '</span><span class="metric-detail-value">' + formatMetaValue(val) + '</span></div>';
              }).join('');
            }).join('');
            if (detailRows) {
              metricDetailsHtml = '<div class="run-metric-details" data-item="' + safeId + '">' + detailRows + '</div>';
            }
          }
          const toggleHtml = metricDetailsHtml ? '<button class="metric-details-toggle" onclick="window._toggleDetails(\'' + safeId + '\')"><span class="toggle-icon" id="toggle-icon-' + safeId + '">\u25B6</span> Metric Details</button>' : '';

          // Item metadata badges
          let itemMetadataHtml = '';
          const SPECIAL_KEYS = ['complexity', 'domain', 'root_cause', 'root_cause_detail', 'root_cause_note', 'root_cause_source', 'root_cause_confidence', 'solution', 'solution_note', 'solution_source'];
          const itemMd = row.item_metadata || {};
          if (typeof itemMd === 'object') {
            let badgesHtml = '';
            for (const sk of SPECIAL_KEYS) {
              if (sk.startsWith('root_cause') || sk.startsWith('solution')) continue;
              if (itemMd[sk] != null && itemMd[sk] !== '' && state.visibleMetadataFields[sk] !== false) {
                const icon = sk === 'complexity' ? '\u2666' : '\u25C6';
                const vals = (sk === 'domain' || sk === 'patterns') ? parseMetaList(itemMd[sk]) : [String(itemMd[sk])];
                for (const v of vals) {
                  let valClass = '';
                  if (sk === 'complexity') {
                    const lv = v.toLowerCase().trim();
                    if (['easy','simple','basic','low'].includes(lv)) valClass = ' complexity-easy';
                    else if (['medium','moderate','intermediate','mid'].includes(lv)) valClass = ' complexity-medium';
                    else if (['hard','difficult','advanced','high','complex'].includes(lv)) valClass = ' complexity-hard';
                    else if (['very hard','very_hard','expert','extreme'].includes(lv)) valClass = ' complexity-expert';
                  }
                  badgesHtml += '<span class="meta-badge badge-' + sk + valClass + '"><span class="badge-icon">' + icon + '</span>' + escapeHtml(v) + '</span>';
                }
              }
            }
            const genericEntries = Object.entries(itemMd).filter(([k]) => k !== 'task_started_at_ms' && k !== 'trace_stats' && !SPECIAL_KEYS.includes(k) && state.visibleMetadataFields[k] !== false);
            let genericHtml = genericEntries.map(([k,v]) => '<span class="item-metadata-tag"><span class="meta-key">' + escapeHtml(k) + ':</span> <span class="meta-val">' + escapeHtml(String(v)) + '</span></span>').join('');
            if (badgesHtml || genericHtml) {
              const sep = badgesHtml && genericHtml ? '<span class="item-meta-sep"></span>' : '';
              itemMetadataHtml = '<div class="item-metadata-row">' + (badgesHtml ? '<div class="item-meta-badges">' + badgesHtml + '</div>' : '') + sep + (genericHtml ? '<div class="item-metadata-tags">' + genericHtml + '</div>' : '') + '</div>';
            }
          }

          // Attempt switcher: Summary (reduced scores + final output) or any
          // individual pass. Hidden in ?pass=N scope — the page is one pass.
          const attemptChips = (!state.viewPass && passAttempts && passAttempts.some(Boolean))
            ? '<div class="attempt-switch" data-item-id="' + escapeAttr(itemId) + '">' +
                '<span class="attempt-switch-label">Attempt</span>' +
                '<button type="button" class="attempt-chip' + (!lensPass ? ' active' : '') + '" data-pass="" title="Reduced scores; final output">Summary</button>' +
                passAttempts.map((att, i) => {
                  if (!att) return '';
                  const n = i + 1;
                  const isErr = att.status === 'error';
                  return '<button type="button" class="attempt-chip' + (lensPass === n ? ' active' : '') + (isErr ? ' err' : '') + '" data-pass="' + n + '" title="Pass ' + n + (isErr ? ' — errored' : '') + '">' + n + '</button>';
                }).join('') +
              '</div>'
            : '';

          return '<div class="item-card' + (lensPass ? ' pass-lensed' : '') + '">' +
            '<div class="item-header"><span class="item-index" title="ID: ' + escapeHtml(itemId) + '">#' + (row.index + 1) + '</span><span style="font-size:var(--font-xs);color:var(--text-muted);">(' + escapeHtml(displayItemId) + ')</span><button class="copy-btn" data-item-id="' + escapeAttr(itemId) + '" title="Copy all fields">' + COPY_ICON + '</button></div>' +
            '<div class="item-input-row"><div class="input-label">INPUT <button class="copy-btn" data-copy-text="' + escapeAttr(typeof input === 'object' ? JSON.stringify(input,null,2) : String(input)) + '" title="Copy input">' + COPY_ICON + '</button></div><div class="input-text">' + renderMarkdownSafe(input) + '</div></div>' +
            (expected ? '<div class="item-expected-row"><div class="expected-label">EXPECTED OUTPUT <button class="copy-btn" data-copy-text="' + escapeAttr(typeof expected === 'object' ? JSON.stringify(expected,null,2) : String(expected)) + '" title="Copy expected">' + COPY_ICON + '</button></div><div class="expected-text collapsed">' + renderMarkdownSafe(expected) + '</div><button class="expected-toggle" onclick="this.previousElementSibling.classList.toggle(\'collapsed\'); this.textContent = this.previousElementSibling.classList.contains(\'collapsed\') ? \'Show more \u25BC\' : \'Show less \u25B2\';">Show more \u25BC</button></div>' : '') +
            itemMetadataHtml +
            '<div class="item-run-output"><div class="output-header"><span class="output-status-cluster"><span class="run-label">OUTPUT</span>' + statusIndicator + durationPart + timePart + '</span><span class="output-actions">' + copyBtn + traceChip + langfuseChip + '</span></div>' + attemptChips + '<div class="output-text ' + (status === 'error' ? 'score-1' : '') + '">' + renderMarkdownSafe(output) + '</div><div class="metric-scores-inline">' + metricScoresHtml + '</div>' + _renderTraceChips(row.trace_stats, row.retry_count) + metricEditHtml + rootCauseHtml + toggleHtml + metricDetailsHtml + '</div>' +
          '</div>';
        }).join('');

        // Pagination
        const paginationHtml = '<button data-page-action="prev" ' + (state.page <= 1 ? 'disabled' : '') + '>&larr; Prev</button><span class="page-info">Page ' + state.page + ' of ' + totalPages + '</span><button data-page-action="next" ' + (state.page >= totalPages ? 'disabled' : '') + '>Next &rarr;</button>';
        paginationEl.innerHTML = paginationHtml;
        paginationEl.querySelector('[data-page-action="prev"]')?.addEventListener('click', () => { state.page--; renderItems(true); });
        paginationEl.querySelector('[data-page-action="next"]')?.addEventListener('click', () => { state.page++; renderItems(true); });

        if (scrollToTop) {
          container.scrollIntoView({ behavior: 'smooth', block: 'start' });
        } else if (anchorTop != null) {
          requestAnimationFrame(() => restoreItemsGridTop(anchorTop));
        }

        state.hasRenderedItems = true;

        wireMetricEditHandlers();
        wireRootCauseHandlers();
        wireSolutionHandlers();
        wireCopyHandlers();
        initExpectedToggles();

        // Attempt switcher: re-render the grid with the chosen pass lens
        // (renderItems preserves the scroll anchor).
        container.querySelectorAll('.attempt-chip').forEach(chip => {
          chip.addEventListener('click', () => {
            const wrap = chip.closest('.attempt-switch');
            if (!wrap) return;
            const lensItemId = wrap.dataset.itemId;
            state.itemPassLens = state.itemPassLens || {};
            const n = parseInt(chip.dataset.pass || '', 10);
            if (Number.isFinite(n) && n > 0) state.itemPassLens[lensItemId] = n;
            else delete state.itemPassLens[lensItemId];
            renderItems();
          });
        });

      // ── Metric edit handlers ──

      async function updateMetricScore(filePath, rowIndex, metricName, newScore) {
        if (IS_EXPORT) {
          const rows = state.snapshot.rows || [];
          const row = rows.find(r => Number(r.index) === rowIndex);
          if (row) {
            const metricIdx = state.allMetrics.indexOf(metricName);
            if (metricIdx >= 0 && row.metric_values) {
              var parsed = parseFloat(newScore);
              row.metric_values[metricIdx] = isNaN(parsed) ? newScore : parsed;
            }
          }
          autoSaveExport();
          return { row: row };
        }
        const res = await fetch(apiUrl('api/runs/update_metric'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ file_path: filePath, row_index: rowIndex, metric_name: metricName, new_score: newScore }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || data.error) throw new Error(data.error || 'Failed to update metric');
        return data;
      }

      function applyUpdatedRow(updatedRow) {
        try {
          const rows = state.snapshot.rows || [];
          const idx = Number(updatedRow.index) || 0;
          if (idx >= 0 && idx < rows.length) { rows[idx] = updatedRow; }
          else { const pos = rows.findIndex(r => Number(r.index) === idx); if (pos >= 0) rows[pos] = updatedRow; }
        } catch {}
      }

      function wireMetricEditHandlers() {
        document.querySelectorAll('.metric-edit-open').forEach(btn => {
          btn.onclick = () => {
            const rowIndex = btn.dataset.rowIndex;
            const metric = btn.dataset.metric;
            const block = document.querySelector('.metric-edit-block[data-row-index="' + rowIndex + '"][data-metric="' + metric + '"]');
            if (!block) return;
            const isHidden = block.classList.contains('hidden');
            block.classList.toggle('hidden');
            btn.textContent = isHidden ? '\u2715' : '\u270E';
          };
        });
        document.querySelectorAll('.metric-edit-save').forEach(btn => {
          btn.onclick = async () => {
            const rowIndex = Number(btn.dataset.rowIndex);
            const metricName = btn.dataset.metric || '';
            const controls = btn.closest('.metric-edit-controls');
            const input = controls ? controls.querySelector('.metric-edit-input') : null;
            const statusEl = controls ? controls.querySelector('.metric-edit-status') : null;
            const filePath = state.run?.file_path || '';
            if (!filePath || !metricName || !input) { if (statusEl) statusEl.textContent = 'Unavailable'; return; }
            btn.disabled = true;
            if (statusEl) statusEl.textContent = 'Saving...';
            try {
              const result = await updateMetricScore(filePath, rowIndex, metricName, input.value);
              if (result && result.row) {
                applyUpdatedRow(result.row);
                renderOverview();
                renderItems();
              }
            } catch (err) {
              if (statusEl) statusEl.textContent = 'Error';
            } finally {
              btn.disabled = false;
              if (statusEl && statusEl.textContent === 'Saving...') statusEl.textContent = '';
            }
          };
        });
      }

        document.querySelectorAll('[data-feedback-item]').forEach(trigger => {
          trigger.addEventListener('click', function(e) {
            e.stopPropagation();
            var itemId = trigger.dataset.feedbackItem;
            var rows = state.snapshot.rows || [];
            var row = rows.find(function(r) { return (r.item_id || String(r.index)) === itemId; });
            var currentNote = row?.item_metadata?.root_cause_note || '';

            var textarea = section.querySelector('textarea');
            var saveBtn = section.querySelector('.feedback-btn-save');
            var cancelBtn = section.querySelector('.feedback-btn-cancel');
            textarea.focus();
            textarea.setSelectionRange(textarea.value.length, textarea.value.length);
            saveBtn.addEventListener('click', async function() {
              await saveFeedback(itemId, textarea.value.trim());
            });
            cancelBtn.addEventListener('click', function() {
              renderItems();
            });
            textarea.addEventListener('keydown', async function(ev) {
              if (ev.key === 'Enter' && !ev.shiftKey) {
                ev.preventDefault();

            btn.disabled = true;
            try {
              const res = await fetch(apiUrl('api/corrections/' + correctionId + '/approve'), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ comment: '' }),
              });
              const data = await res.json().catch(() => ({}));
              if (!res.ok || data.detail || data.error) {
                console.error('Failed to approve correction:', data.detail || data.error);
                btn.disabled = false;
                return;

              if (row) row.review_correction_status = 'approved';
              renderItems();

            }
          });

      async function saveFeedback(itemId, note) {
        var rows = state.snapshot.rows || [];
        var row = rows.find(function(r) { return (r.item_id || String(r.index)) === itemId; });

        if (IS_EXPORT) {
          if (row) {
            if (!row.item_metadata) row.item_metadata = {};
            if (note) row.item_metadata.root_cause_note = note;
            else delete row.item_metadata.root_cause_note;
          }
          autoSaveExport();
          renderItems();
          return;
        }

        var runId = state.run?.file_path;
        if (!runId) return;
        try {
          var res = await fetch(apiUrl('api/runs/update_root_cause'), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ item_id: itemId, root_cause_note: note, run_id: runId }),
          });
          var data = await res.json().catch(function() { return {}; });
          if (!res.ok || data.error) { console.error('Failed to save feedback:', data.error); return; }
          if (data && data.row) {
            applyUpdatedRow(data.row);
          } else if (row) {
            if (!row.item_metadata) row.item_metadata = {};
            if (note) row.item_metadata.root_cause_note = note;
            else delete row.item_metadata.root_cause_note;
          }
          renderItems();
          // Flash success indicator on the feedback section
          setTimeout(function() {
            var saved = document.querySelector('[data-feedback-item="' + itemId + '"]');
            if (saved) {
              var sec = saved.closest('.feedback-section');
              if (sec) { sec.classList.add('feedback-saved'); setTimeout(function() { sec.classList.remove('feedback-saved'); }, 800); }
            }
          }, 50);
        } catch (err) { console.error('Error saving feedback:', err); }
      }

          if (!dropdown.contains(e.target)) cleanup();

          document.addEventListener('click', closeHandler);
          window.addEventListener('scroll', scrollHandler, true);

      async function saveRootCause(itemId, rootCause) {
        const rows = state.snapshot.rows || [];
        const row = rows.find(r => (r.item_id || String(r.index)) === itemId);
        const existingDetail = row?.item_metadata?.root_cause_detail || '';

        function applyLocally() {
          if (row) {
            if (!row.item_metadata) row.item_metadata = {};
            if (rootCause) {
              row.item_metadata.root_cause = rootCause;
              row.item_metadata.root_cause_source = 'human';
              delete row.item_metadata.root_cause_confidence;
            } else {
              delete row.item_metadata.root_cause;
              delete row.item_metadata.root_cause_source;
              delete row.item_metadata.root_cause_confidence;
            }
          }
          if (rootCause && !state.rootCauseValues.includes(rootCause)) { state.rootCauseValues.push(rootCause); state.rootCauseValues.sort(); }
          if (rootCause && !state.allMetadataKeys.includes('root_cause')) { state.allMetadataKeys.push('root_cause'); state.allMetadataKeys.sort(); }
          buildCategoryDropdowns();
          renderItems();
        }

        if (IS_EXPORT) {
          applyLocally();
          autoSaveExport();
          return;
        }

        const runId = state.run?.file_path;
        if (!runId) return;
        try {
          const res = await fetch(apiUrl('api/runs/update_root_cause'), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ item_id: itemId, root_cause: rootCause, root_cause_detail: existingDetail, run_id: runId }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok || data.error) { console.error('Failed to save root cause:', data.error); return; }
          if (data && data.row) {
            applyUpdatedRow(data.row);
            if (rootCause && !state.rootCauseValues.includes(rootCause)) { state.rootCauseValues.push(rootCause); state.rootCauseValues.sort(); }
            if (rootCause && !state.allMetadataKeys.includes('root_cause')) { state.allMetadataKeys.push('root_cause'); state.allMetadataKeys.sort(); }
            buildCategoryDropdowns();
            renderItems();
          } else {
            applyLocally();
          }
        } catch (err) { console.error('Error saving root cause:', err); }
      }

      async function saveRootCauseDetail(itemId, detail) {
        const rows = state.snapshot.rows || [];
        const row = rows.find(r => (r.item_id || String(r.index)) === itemId);
        const existingCategory = row?.item_metadata?.root_cause || '';

        function applyLocally() {
          if (row) {
            if (!row.item_metadata) row.item_metadata = {};
            if (detail) { row.item_metadata.root_cause_detail = detail; } else { delete row.item_metadata.root_cause_detail; }
          }
          renderItems();
        }

        if (IS_EXPORT) {
          applyLocally();
          autoSaveExport();
          return;
        }

        const runId = state.run?.file_path;
        if (!runId) return;
        try {
          const res = await fetch(apiUrl('api/runs/update_root_cause'), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ item_id: itemId, root_cause: existingCategory, root_cause_detail: detail, run_id: runId }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok || data.error) { console.error('Failed to save root cause detail:', data.error); return; }
          if (data && data.row) {
            applyUpdatedRow(data.row);
            renderItems();
          } else {
            applyLocally();
          }
        } catch (err) { console.error('Error saving root cause detail:', err); }
      }

      function showSolutionDropdown(itemId, anchorEl) {
        document.querySelectorAll('.solution-dropdown').forEach(d => d.remove());
        const rows = state.snapshot.rows || [];
        const row = rows.find(r => (r.item_id || String(r.index)) === itemId);
        const currentSol = row?.item_metadata?.solution || '';
        const allOptions = [...SOLUTION_PRESETS];
        // Add any dynamic solution values from the dataset
        for (const r of rows) {
          const s = r.item_metadata?.solution;
          if (s && !allOptions.includes(s)) allOptions.push(s);
        }

        const dropdown = document.createElement('div');
        dropdown.className = 'root-cause-dropdown solution-dropdown';
        let html = '<div class="rc-option ' + (!currentSol ? 'active' : '') + '" data-sol-value=""><span class="rc-dot" style="background:var(--text-muted);"></span> None (clear)</div>';
        html += '<div class="rc-divider"></div>';
        for (const opt of allOptions) {
          const color = SOLUTION_COLORS[opt] || '#60a5fa';
          html += '<div class="rc-option ' + (opt === currentSol ? 'active' : '') + '" data-sol-value="' + escapeAttr(opt) + '"><span class="rc-dot" style="background:' + color + ';"></span> ' + escapeHtml(opt) + '</div>';
        }
        html += '<div class="rc-divider"></div>';
        html += '<div class="rc-custom-input"><input type="text" placeholder="Custom solution..." /><button>Add</button></div>';
        dropdown.innerHTML = html;

        document.body.appendChild(dropdown);
        const rect = anchorEl.getBoundingClientRect();
        const dropH = dropdown.offsetHeight;
        const spaceBelow = window.innerHeight - rect.bottom - 8;
        const spaceAbove = rect.top - 8;
        if (spaceBelow >= dropH || spaceBelow >= spaceAbove) {
          dropdown.style.top = (rect.bottom + 4) + 'px';
        } else {
          dropdown.style.top = Math.max(4, rect.top - dropH - 4) + 'px';
        }
        dropdown.style.left = Math.min(rect.left, window.innerWidth - dropdown.offsetWidth - 8) + 'px';
        dropdown.style.maxHeight = Math.max(spaceBelow, spaceAbove) + 'px';

        dropdown.querySelectorAll('.rc-option').forEach(opt => {
          opt.addEventListener('click', async () => {
            await saveSolution(itemId, opt.dataset.solValue);
            dropdown.remove();
          });
        });

        const customInput = dropdown.querySelector('.rc-custom-input input');
        const customBtn = dropdown.querySelector('.rc-custom-input button');
        customBtn.addEventListener('click', async () => {
          const val = customInput.value.trim();
          if (val) { await saveSolution(itemId, val); dropdown.remove(); }
        });
        customInput.addEventListener('keydown', async (e) => {
          if (e.key === 'Enter') {
            const val = customInput.value.trim();
            if (val) { await saveSolution(itemId, val); dropdown.remove(); }
          }
        });

        const cleanup = () => {
          dropdown.remove();
          document.removeEventListener('click', closeHandler);
          window.removeEventListener('scroll', scrollHandler, true);
        };
        const closeHandler = (e) => {
          if (!dropdown.contains(e.target)) cleanup();
        };
        const scrollHandler = (e) => {
          if (!dropdown.contains(e.target)) cleanup();
        };
        setTimeout(() => {
          document.addEventListener('click', closeHandler);
          window.addEventListener('scroll', scrollHandler, true);
        }, 0);
      }

      async function saveSolution(itemId, solution) {
        const rows = state.snapshot.rows || [];
        const row = rows.find(r => (r.item_id || String(r.index)) === itemId);

        function applyLocally() {
          if (row) {
            if (!row.item_metadata) row.item_metadata = {};
            if (solution) { row.item_metadata.solution = solution; row.item_metadata.solution_source = 'human'; } else { delete row.item_metadata.solution; delete row.item_metadata.solution_source; delete row.item_metadata.solution_note; }
          }
          renderItems();
        }

        if (IS_EXPORT) {
          applyLocally();
          autoSaveExport();
          return;
        }

        const runId = state.run?.file_path;
        if (!runId) return;
        try {
          const res = await fetch(apiUrl('api/runs/update_root_cause'), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ item_id: itemId, root_cause: row?.item_metadata?.root_cause || '', root_cause_detail: row?.item_metadata?.root_cause_detail || '', solution: solution, run_id: runId }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok || data.error) { console.error('Failed to save solution:', data.error); return; }
          if (data && data.row) {
            applyUpdatedRow(data.row);
            renderItems();
          } else {
            applyLocally();
          }
        } catch (err) { console.error('Error saving solution:', err); }
      }

      window.sortMetaTable = function(button) {
        const table = button?.closest('table.meta-table');
        const tbody = table?.querySelector('tbody');
        if (!table || !tbody) return;

        const colIndex = Number(button.dataset.colIndex || 0);
        const current = button.getAttribute('aria-sort');
        const nextDir = current === 'ascending' ? 'descending' : 'ascending';
        const direction = nextDir === 'ascending' ? 1 : -1;
        const rows = Array.from(tbody.querySelectorAll('tr'));

        table.querySelectorAll('.meta-table-sort').forEach((sortButton) => {
          sortButton.setAttribute('aria-sort', sortButton === button ? nextDir : 'none');
        });

        rows.sort((rowA, rowB) => {
          const cellA = rowA.children[colIndex];
          const cellB = rowB.children[colIndex];
          const rawA = cellA?.dataset.sortValue ?? cellA?.textContent ?? '';
          const rawB = cellB?.dataset.sortValue ?? cellB?.textContent ?? '';
          const emptyA = rawA === '';
          const emptyB = rawB === '';
          if (emptyA && emptyB) return 0;
          if (emptyA) return 1;
          if (emptyB) return -1;

          const numA = Number(rawA);
          const numB = Number(rawB);
          const bothNumeric = rawA.trim() !== '' && rawB.trim() !== '' && Number.isFinite(numA) && Number.isFinite(numB);
          if (bothNumeric && numA !== numB) return (numA - numB) * direction;

          return rawA.localeCompare(rawB, undefined, { numeric: true, sensitivity: 'base' }) * direction;
        });

        rows.forEach(row => tbody.appendChild(row));
      };

      function buildCategoryDropdowns() {
        const hasComplexity = state.complexityValues.length > 0;

        const hasMeta = hasComplexity || hasDomain || hasRootCause;

        if (hasComplexity) buildMultiselectOptions('complexity', state.complexityValues);
