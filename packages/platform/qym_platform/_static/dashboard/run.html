              svg += '<circle cx="' + x(point.mean).toFixed(1) + '" cy="' + y(point.stddev).toFixed(1) + '" r="5" fill="' + color + '" stroke="var(--bg-surface)" stroke-width="2"><title>' + escapeHtml((point.row.item_id || ('Item ' + (point.rowIndex + 1))) + ' · ' + point.metric.name + ' · mean ' + formatPercent(point.mean) + ' · volatility ' + formatPercent(point.stddev)) + '</title></circle>';
            });
            const legend = repeatSeries.map((metric, metricIndex) => '<span class="ri-legend-item" style="--ri-color:' + chartColors[metricIndex % chartColors.length] + '"><span class="ri-legend-swatch"></span>' + escapeHtml(metric.name) + '</span>').join('');
            svg += '<text x="' + ((L + W - R) / 2) + '" y="' + (H - 10) + '" text-anchor="middle" class="ri-label">Mean score</text>' +
              '<text x="16" y="' + ((T + H - B) / 2) + '" text-anchor="middle" transform="rotate(-90 16 ' + ((T + H - B) / 2) + ')" class="ri-label">Pass volatility</text>';
            panels.push('<div class="ri-panel half"><div class="ri-panel-head"><div><div class="ri-panel-title">Quality–Stability Map</div>' +
              '<div class="ri-panel-copy">Upper-right items score well but fluctuate; lower-right items are consistently strong.</div></div></div>' +
              '<div class="ri-legend">' + legend + '</div><svg class="ri-chart ri-chart-plot" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Mean score versus pass volatility by item and metric">' + svg + '</svg></div>');
          }
          if (passTrendPanel) panels.push(passTrendPanel);
        }

        if (!panels.length) return '';
        return '<div class="ri-insights">' +
          '<div class="ri-header"><div><h3 class="section-title">Deep Analysis</h3>' +
          '<div class="ri-header-copy">Relationships, item-level structure, operational tradeoffs, and repeat stability—each chart answers a different diagnostic question.</div></div></div>' +
          '<div class="ri-grid">' + panels.join('') + '</div>' +
        '</div>';
      }

      function riQuantile(values, quantile) {
        if (!values.length) return 0;
        const sorted = [...values].sort((a, b) => a - b);
        const position = (sorted.length - 1) * quantile;
        const lower = Math.floor(position);
        const upper = Math.min(sorted.length - 1, lower + 1);
        return sorted[lower] + (sorted[upper] - sorted[lower]) * (position - lower);
      }

      function riMetricValue(metric, value) {
        return window.QymMetrics.formatMetricValue(value, metric.type, metric.type === 'numeric' ? 1 : 0);
      }

      function buildDeepAnalysisCharts(rows) {
        const series = riMetricSeries(rows);
        if (!series.length || !rows.length) return '';
        const chartColors = ['var(--chart-1)', 'var(--chart-2)', 'var(--chart-3)', 'var(--chart-4)', 'var(--chart-5)'];
        const metricByName = new Map(series.map(metric => [metric.name, metric]));
        if (!metricByName.has(state.relationshipX)) state.relationshipX = series[0].name;
        if (!metricByName.has(state.relationshipY) || state.relationshipY === state.relationshipX) {
          state.relationshipY = (series.find(metric => metric.name !== state.relationshipX) || series[0]).name;
        }

        const relationshipPanels = [];
        if (series.length > 1) {
          const W = 620, H = 250, left = 112, top = 58, right = 18, bottom = 18;
          const cellW = (W - left - right) / series.length;
          const cellH = (H - top - bottom) / series.length;
          let matrix = '';
          series.forEach((metric, index) => {
            const x = left + index * cellW + cellW / 2;
            matrix += '<text x="' + x.toFixed(1) + '" y="' + (top - 12) + '" text-anchor="end" transform="rotate(-38 ' + x.toFixed(1) + ' ' + (top - 12) + ')" class="ri-label">' + escapeHtml(metric.name) + '</text>' +
              '<text x="' + (left - 10) + '" y="' + (top + index * cellH + cellH / 2 + 4).toFixed(1) + '" text-anchor="end" class="ri-label">' + escapeHtml(metric.name) + '</text>';
          });
          series.forEach((rowMetric, rowIndex) => {
            const rowMap = new Map(rowMetric.points.map(point => [point.rowIndex, point.value]));
            series.forEach((columnMetric, columnIndex) => {
              const pairs = columnMetric.points.filter(point => rowMap.has(point.rowIndex)).map(point => [rowMap.get(point.rowIndex), point.value]);
              const correlation = rowIndex === columnIndex ? 1 : riPearson(pairs);
              const opacity = correlation === null ? 0.12 : 0.18 + Math.abs(correlation) * 0.72;
              const fill = correlation !== null && correlation < 0 ? 'var(--chart-3)' : 'var(--chart-1)';
              const label = correlation === null ? '\u2014' : correlation.toFixed(2);
              const x = left + columnIndex * cellW, y = top + rowIndex * cellH;
              matrix += '<rect x="' + (x + 1).toFixed(1) + '" y="' + (y + 1).toFixed(1) + '" width="' + Math.max(1, cellW - 2).toFixed(1) + '" height="' + Math.max(1, cellH - 2).toFixed(1) + '" rx="3" fill="' + fill + '" fill-opacity="' + opacity.toFixed(2) + '"><title>' + escapeHtml(rowMetric.name + ' vs ' + columnMetric.name + ': r=' + label) + '</title></rect>' +
                '<text x="' + (x + cellW / 2).toFixed(1) + '" y="' + (y + cellH / 2 + 4).toFixed(1) + '" text-anchor="middle" class="ri-cell-value">' + label + '</text>';
            });
          });
          relationshipPanels.push('<div class="ri-panel half"><div class="ri-panel-head"><div><div class="ri-panel-title">Metric Correlation</div><div class="ri-panel-copy">Pearson correlation across matched item means.</div></div></div>' +
            '<svg class="ri-chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Metric correlation matrix">' + matrix + '</svg></div>');

          const xMetric = metricByName.get(state.relationshipX);
          const yMetric = metricByName.get(state.relationshipY);
          const xMap = new Map(xMetric.points.map(point => [point.rowIndex, point]));
          const matched = yMetric.points.filter(point => xMap.has(point.rowIndex)).map(point => ({ x: xMap.get(point.rowIndex).value, y: point.value, row: point.row, rowIndex: point.rowIndex }));
          const pairs = matched.map(point => [point.x, point.y]);
          const correlation = riPearson(pairs);
          const SW = 620, SH = 250, SL = 54, SR = 18, ST = 16, SB = 42;
          const xValues = matched.map(point => point.x), yValues = matched.map(point => point.y);
          const xMin = xMetric.type === 'numeric' ? Math.min(...xValues) : 0;
          const xMax = xMetric.type === 'numeric' ? Math.max(...xValues) : 1;
          const yMin = yMetric.type === 'numeric' ? Math.min(...yValues) : 0;
          const yMax = yMetric.type === 'numeric' ? Math.max(...yValues) : 1;
          const sx = value => riScale(value, xMin, xMax, SL, SW - SR);
          const sy = value => riScale(value, yMin, yMax, SH - SB, ST);
          let scatter = '<line x1="' + SL + '" y1="' + (SH - SB) + '" x2="' + (SW - SR) + '" y2="' + (SH - SB) + '" class="ri-axis"/><line x1="' + SL + '" y1="' + ST + '" x2="' + SL + '" y2="' + (SH - SB) + '" class="ri-axis"/>';
          for (let tick = 0; tick < 3; tick++) {
            const xValue = xMin + (xMax - xMin) * tick / 2;
            const yValue = yMin + (yMax - yMin) * tick / 2;
            scatter += '<text x="' + sx(xValue).toFixed(1) + '" y="' + (SH - SB + 18) + '" text-anchor="middle" class="ri-data-label">' + escapeHtml(riMetricValue(xMetric, xValue)) + '</text>' +
              '<text x="' + (SL - 9) + '" y="' + (sy(yValue) + 4).toFixed(1) + '" text-anchor="end" class="ri-data-label">' + escapeHtml(riMetricValue(yMetric, yValue)) + '</text>';
          }
          matched.forEach(point => {
            scatter += '<circle cx="' + sx(point.x).toFixed(1) + '" cy="' + sy(point.y).toFixed(1) + '" r="4.5" fill="var(--chart-1)" stroke="var(--bg-surface)" stroke-width="2"><title>' + escapeHtml((point.row.item_id || ('Item ' + (point.rowIndex + 1))) + ' · ' + xMetric.name + ' ' + riMetricValue(xMetric, point.x) + ' · ' + yMetric.name + ' ' + riMetricValue(yMetric, point.y)) + '</title></circle>';
          });
          scatter += '<text x="' + ((SL + SW - SR) / 2) + '" y="' + (SH - 8) + '" text-anchor="middle" class="ri-label">' + escapeHtml(xMetric.name) + '</text>' +
            '<text x="16" y="' + ((ST + SH - SB) / 2) + '" text-anchor="middle" transform="rotate(-90 16 ' + ((ST + SH - SB) / 2) + ')" class="ri-label">' + escapeHtml(yMetric.name) + '</text>';
          const options = selected => series.map(metric => '<option value="' + escapeAttr(metric.name) + '"' + (metric.name === selected ? ' selected' : '') + '>' + escapeHtml(metric.name) + '</option>').join('');
          relationshipPanels.push('<div class="ri-panel half"><div class="ri-panel-head"><div><div class="ri-panel-title">Metric Relationship</div><div class="ri-panel-copy">' + escapeHtml(xMetric.name) + ' versus ' + escapeHtml(yMetric.name) + ', item by item.</div></div>' +
            '<div class="ri-relationship-controls"><span class="ri-axis-control"><label for="ri-x-axis">X</label><select class="filter-select ri-axis-select" id="ri-x-axis" data-ri-axis="x">' + options(xMetric.name) + '</select></span>' +
            '<span class="ri-axis-control"><label for="ri-y-axis">Y</label><select class="filter-select ri-axis-select" id="ri-y-axis" data-ri-axis="y">' + options(yMetric.name) + '</select></span>' +
            '<span class="ri-panel-stat">r ' + (correlation === null ? '\u2014' : correlation.toFixed(2)) + '</span></div></div>' +
            '<svg class="ri-chart" viewBox="0 0 ' + SW + ' ' + SH + '" role="img" aria-label="Relationship between selected metrics">' + scatter + '</svg></div>');
        }

        const qualityMetric = series.find(metric => metric.name === state.selectedMetric && metric.type !== 'numeric') || series.find(metric => metric.type !== 'numeric') || series[0];
        const qualityItems = qualityMetric.points.map(point => ({ row: point.row, rowIndex: point.rowIndex, quality: point.value, latency: Number(point.row.latency_ms) })).filter(item => Number.isFinite(item.latency) && item.latency > 0);
        let frontierPanel = '';
        if (qualityItems.length > 1) {
          const W = 1000, H = 285, L = 54, R = 18, T = 16, B = 42;
          const latencies = qualityItems.map(item => item.latency);
          const qualities = qualityItems.map(item => item.quality);
          let latMin = Math.min(...latencies), latMax = Math.max(...latencies);
          if (latMin === latMax) { latMin *= 0.95; latMax *= 1.05; }
          const medianLatency = riQuantile(latencies, 0.5);
          const p95Latency = riQuantile(latencies, 0.95);
          const medianQuality = riQuantile(qualities, 0.5);
          const x = value => riScale(value, latMin, latMax, L, W - R);
          const y = value => riScale(value, 0, 1, H - B, T);
          const zoneX = x(p95Latency), zoneY = y(medianQuality);
          let frontier = '<rect x="' + zoneX.toFixed(1) + '" y="' + zoneY.toFixed(1) + '" width="' + (W - R - zoneX).toFixed(1) + '" height="' + (H - B - zoneY).toFixed(1) + '" fill="var(--error)" opacity="0.10"/>' +
            '<text x="' + (W - R - 8) + '" y="' + (H - B - 10) + '" text-anchor="end" class="ri-zone-label">slow + weak</text>' +
            '<line x1="' + L + '" y1="' + (H - B) + '" x2="' + (W - R) + '" y2="' + (H - B) + '" class="ri-axis"/><line x1="' + L + '" y1="' + T + '" x2="' + L + '" y2="' + (H - B) + '" class="ri-axis"/>' +
            '<line x1="' + x(medianLatency).toFixed(1) + '" y1="' + T + '" x2="' + x(medianLatency).toFixed(1) + '" y2="' + (H - B) + '" stroke="var(--border-strong)" stroke-dasharray="5 4"/>' +
            '<line x1="' + L + '" y1="' + y(medianQuality).toFixed(1) + '" x2="' + (W - R) + '" y2="' + y(medianQuality).toFixed(1) + '" stroke="var(--border-strong)" stroke-dasharray="5 4"/>' +
            '<line x1="' + x(p95Latency).toFixed(1) + '" y1="' + T + '" x2="' + x(p95Latency).toFixed(1) + '" y2="' + (H - B) + '" stroke="var(--border-strong)" stroke-dasharray="2 3"/>';
          [0, 0.5, 1].forEach(value => {
            frontier += '<text x="' + (L - 10) + '" y="' + (y(value) + 4).toFixed(1) + '" text-anchor="end" class="ri-data-label">' + Math.round(value * 100) + '%</text>';
          });
          [latMin, (latMin + latMax) / 2, latMax].forEach(value => {
            frontier += '<text x="' + x(value).toFixed(1) + '" y="' + (H - B + 18) + '" text-anchor="middle" class="ri-data-label">' + escapeHtml(formatLatency(value)) + '</text>';
          });
          qualityItems.forEach(item => {
            const radius = 4 + Math.min(2, Number(item.row.retry_count || 0));
            frontier += '<circle cx="' + x(item.latency).toFixed(1) + '" cy="' + y(item.quality).toFixed(1) + '" r="' + radius + '" fill="' + riScoreColor(item.quality) + '" stroke="var(--bg-surface)" stroke-width="2"><title>' + escapeHtml((item.row.item_id || ('Item ' + (item.rowIndex + 1))) + ' · ' + qualityMetric.name + ' ' + riMetricValue(qualityMetric, item.quality) + ' · latency ' + formatLatency(item.latency)) + '</title></circle>';
          });
          frontier += '<text x="' + ((L + W - R) / 2) + '" y="' + (H - 8) + '" text-anchor="middle" class="ri-label">Average latency</text>' +
            '<text x="16" y="' + ((T + H - B) / 2) + '" text-anchor="middle" transform="rotate(-90 16 ' + ((T + H - B) / 2) + ')" class="ri-label">Mean ' + escapeHtml(qualityMetric.name) + '</text>';
          frontierPanel = '<div class="ri-panel wide"><div class="ri-panel-head"><div><div class="ri-panel-title">Quality–Latency Frontier</div><div class="ri-panel-copy">One point per item. Point size increases with retries; reference lines show run medians.</div></div></div>' +
            '<svg class="ri-chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Quality versus latency by item">' + frontier + '</svg>' +
            '<div class="ri-note-row"><span>Dot size = retries</span><span>Dashed = medians · dotted = p95 latency</span></div></div>';
        }

        const repeatSeries = series.filter(metric => metric.type !== 'numeric' && metric.points.some(point => Array.isArray(point.row.pass_scores?.[metric.name]) && point.row.pass_scores[metric.name].length > 1));
        const repeatPanels = [];
        if (repeatSeries.length) {
          const volatility = [];
          repeatSeries.forEach((metric, metricIndex) => {
            metric.points.forEach(point => {
              const values = (point.row.pass_scores?.[metric.name] || []).map(Number).filter(Number.isFinite);
              if (values.length > 1) volatility.push({ metric, metricIndex, row: point.row, rowIndex: point.rowIndex, mean: riMean(values), stddev: riStdDev(values) });
            });
          });
          if (volatility.length) {
            const W = 1000, H = 285, L = 54, R = 18, T = 16, B = 42;
            const maxStd = Math.max(0.1, ...volatility.map(point => point.stddev)) * 1.08;
            const x = value => riScale(value, 0, 1, L, W - R);
            const y = value => riScale(value, 0, maxStd, H - B, T);
            let stability = '<line x1="' + L + '" y1="' + (H - B) + '" x2="' + (W - R) + '" y2="' + (H - B) + '" class="ri-axis"/><line x1="' + L + '" y1="' + T + '" x2="' + L + '" y2="' + (H - B) + '" class="ri-axis"/>';
            [0, 0.5, 1].forEach(value => stability += '<text x="' + x(value).toFixed(1) + '" y="' + (H - B + 18) + '" text-anchor="middle" class="ri-data-label">' + Math.round(value * 100) + '%</text>');
            [0, maxStd / 2, maxStd].forEach(value => stability += '<text x="' + (L - 10) + '" y="' + (y(value) + 4).toFixed(1) + '" text-anchor="end" class="ri-data-label">' + Math.round(value * 100) + '%</text>');
            volatility.forEach(point => {
              stability += '<circle cx="' + x(point.mean).toFixed(1) + '" cy="' + y(point.stddev).toFixed(1) + '" r="4.5" fill="' + chartColors[point.metricIndex % chartColors.length] + '" stroke="var(--bg-surface)" stroke-width="2"><title>' + escapeHtml((point.row.item_id || ('Item ' + (point.rowIndex + 1))) + ' · ' + point.metric.name + ' · mean ' + formatPercent(point.mean) + ' · standard deviation ' + formatPercent(point.stddev)) + '</title></circle>';
            });
            stability += '<text x="' + ((L + W - R) / 2) + '" y="' + (H - 8) + '" text-anchor="middle" class="ri-label">Mean score</text><text x="16" y="' + ((T + H - B) / 2) + '" text-anchor="middle" transform="rotate(-90 16 ' + ((T + H - B) / 2) + ')" class="ri-label">Pass-to-pass standard deviation</text>';
            const legend = repeatSeries.map((metric, index) => '<span class="ri-legend-item" style="--ri-color:' + chartColors[index % chartColors.length] + '"><span class="ri-legend-swatch"></span>' + escapeHtml(metric.name) + '</span>').join('');
            repeatPanels.push('<div class="ri-panel wide"><div class="ri-panel-head"><div><div class="ri-panel-title">Quality–Stability Map</div><div class="ri-panel-copy">Mean score versus pass-to-pass standard deviation, one point per item and metric.</div></div></div><div class="ri-legend">' + legend + '</div><svg class="ri-chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Mean score versus repeat stability">' + stability + '</svg></div>');
          }

          const thresholdMetric = qualityMetric;
          const valuesByItem = thresholdMetric.points.map(point => (point.row.pass_scores?.[thresholdMetric.name] || [point.value]).map(Number).filter(Number.isFinite)).filter(values => values.length);
          const thresholds = [0.5, 0.6, 0.7, 0.8, 0.9, 0.95];
          const passRates = thresholds.map(threshold => {
            const values = valuesByItem.flat();
            return values.length ? values.filter(value => value >= threshold).length / values.length : 0;
          });
          const partialRates = thresholds.map(threshold => valuesByItem.length ? valuesByItem.filter(values => {
            const passes = values.filter(value => value >= threshold).length;
            return passes > 0 && passes < values.length;
          }).length / valuesByItem.length : 0);
          const lineChart = (lines, labels, ariaLabel) => {
            const W = 620, H = 245, L = 46, R = 16, T = 14, B = 38;
            const x = index => riScale(index, 0, labels.length - 1, L, W - R);
            const y = value => riScale(value, 0, 1, H - B, T);
            let svg = '';
            [0, 0.25, 0.5, 0.75, 1].forEach(value => svg += '<line x1="' + L + '" y1="' + y(value).toFixed(1) + '" x2="' + (W - R) + '" y2="' + y(value).toFixed(1) + '" class="ri-gridline"/><text x="' + (L - 9) + '" y="' + (y(value) + 4).toFixed(1) + '" text-anchor="end" class="ri-data-label">' + Math.round(value * 100) + '%</text>');
            lines.forEach(line => {
              svg += '<path d="' + line.values.map((value, index) => (index ? 'L' : 'M') + x(index).toFixed(1) + ' ' + y(value).toFixed(1)).join(' ') + '" fill="none" stroke="' + line.color + '" stroke-width="2.5"' + (line.dash ? ' stroke-dasharray="5 4"' : '') + '/>';
              line.values.forEach((value, index) => svg += '<circle cx="' + x(index).toFixed(1) + '" cy="' + y(value).toFixed(1) + '" r="4" fill="var(--bg-surface)" stroke="' + line.color + '" stroke-width="2"><title>' + escapeHtml(labels[index] + ': ' + formatPercent(value)) + '</title></circle>');
            });
            labels.forEach((label, index) => svg += '<text x="' + x(index).toFixed(1) + '" y="' + (H - 12) + '" text-anchor="middle" class="ri-data-label">' + escapeHtml(label) + '</text>');
            return '<svg class="ri-chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + escapeAttr(ariaLabel) + '">' + svg + '</svg>';
          };
          repeatPanels.push('<div class="ri-panel half"><div class="ri-panel-head"><div><div class="ri-panel-title">Threshold Explorer</div><div class="ri-panel-copy">Pass rate and partial-pass items at several thresholds.</div></div></div><div class="ri-legend"><span class="ri-legend-item" style="--ri-color:var(--chart-1)"><span class="ri-legend-swatch"></span>pass rate</span><span class="ri-legend-item" style="--ri-color:var(--chart-5)"><span class="ri-legend-swatch"></span>partial-pass items</span></div>' +
            lineChart([{ values: passRates, color: 'var(--chart-1)' }, { values: partialRates, color: 'var(--chart-5)', dash: true }], thresholds.map(value => '\u2265' + Math.round(value * 100) + '%'), 'Pass rate and partial-pass items by threshold') + '</div>');

          const maxPass = Math.max(...valuesByItem.map(values => values.length));
          const estimates = [], lowerBounds = [], upperBounds = [];
          for (let passCount = 1; passCount <= maxPass; passCount++) {
            const itemMeans = valuesByItem.filter(values => values.length >= passCount).map(values => riMean(values.slice(0, passCount)));
            estimates.push(riMean(itemMeans));
            let seed = 1777 + passCount * 97;
            const random = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
            const bootstrap = [];
            for (let sample = 0; sample < 200; sample++) {
              let sum = 0;
              for (let index = 0; index < itemMeans.length; index++) sum += itemMeans[Math.floor(random() * itemMeans.length)];
              bootstrap.push(sum / itemMeans.length);
            }
            lowerBounds.push(riQuantile(bootstrap, 0.025));
            upperBounds.push(riQuantile(bootstrap, 0.975));
          }
          {
            const W = 620, H = 245, L = 46, R = 16, T = 14, B = 38;
            const x = index => riScale(index, 0, Math.max(1, estimates.length - 1), L, W - R);
            const y = value => riScale(value, 0, 1, H - B, T);
            let estimateSvg = '';
            [0, 0.25, 0.5, 0.75, 1].forEach(value => estimateSvg += '<line x1="' + L + '" y1="' + y(value).toFixed(1) + '" x2="' + (W - R) + '" y2="' + y(value).toFixed(1) + '" class="ri-gridline"/><text x="' + (L - 9) + '" y="' + (y(value) + 4).toFixed(1) + '" text-anchor="end" class="ri-data-label">' + Math.round(value * 100) + '%</text>');
            const upper = upperBounds.map((value, index) => x(index).toFixed(1) + ' ' + y(value).toFixed(1));
            const lower = lowerBounds.map((value, index) => x(index).toFixed(1) + ' ' + y(value).toFixed(1)).reverse();
            estimateSvg += '<path d="M' + upper.join(' L') + ' L' + lower.join(' L') + ' Z" fill="var(--chart-2)" opacity="0.12"/><path d="' + estimates.map((value, index) => (index ? 'L' : 'M') + x(index).toFixed(1) + ' ' + y(value).toFixed(1)).join(' ') + '" fill="none" stroke="var(--chart-2)" stroke-width="2.5"/>';
            estimates.forEach((value, index) => {
              estimateSvg += '<line x1="' + x(index).toFixed(1) + '" y1="' + y(lowerBounds[index]).toFixed(1) + '" x2="' + x(index).toFixed(1) + '" y2="' + y(upperBounds[index]).toFixed(1) + '" stroke="var(--border-strong)"/><circle cx="' + x(index).toFixed(1) + '" cy="' + y(value).toFixed(1) + '" r="4" fill="var(--bg-surface)" stroke="var(--chart-2)" stroke-width="2"><title>' + (index + 1) + ' passes: ' + escapeHtml(formatPercent(value)) + '</title></circle><text x="' + x(index).toFixed(1) + '" y="' + (H - 12) + '" text-anchor="middle" class="ri-data-label">' + (index + 1) + '</text>';
            });
            repeatPanels.push('<div class="ri-panel half"><div class="ri-panel-head"><div><div class="ri-panel-title">Score Estimate by Pass Count</div><div class="ri-panel-copy">Cumulative mean and item-level bootstrap interval as passes are added.</div></div></div><div class="ri-legend"><span class="ri-legend-item" style="--ri-color:var(--chart-2)"><span class="ri-legend-swatch"></span>cumulative mean</span><span class="ri-legend-item" style="--ri-color:var(--border-strong)"><span class="ri-legend-swatch"></span>95% interval</span></div><svg class="ri-chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Score estimate by pass count">' + estimateSvg + '</svg></div>');
          }
        }

        let html = '<div class="ri-insights"><div class="ri-header"><div><h3 class="section-title">Deep Analysis</h3><div class="ri-header-copy">Explore metric relationships, quality and latency, and repeat stability.</div></div></div>';
        if (relationshipPanels.length) html += '<div class="ri-analysis-section" style="--ri-section-color:var(--accent-primary)"><div class="ri-subhead"><h4>Metric Relationships</h4><span>Compare how evaluation metrics move together across the same items.</span></div><div class="ri-grid">' + relationshipPanels.join('') + '</div></div>';
        if (frontierPanel) html += '<div class="ri-analysis-section" style="--ri-section-color:var(--warning)"><div class="ri-subhead"><h4>Quality and Latency</h4><span>View item-level quality alongside response time.</span></div><div class="ri-grid">' + frontierPanel + '</div></div>';
        if (repeatPanels.length) html += '<div class="ri-analysis-section" style="--ri-section-color:var(--accent-tertiary)"><div class="ri-subhead"><h4>Repeat Stability</h4><span>Compare score levels, variation, thresholds, and pass-count estimates.</span></div><div class="ri-grid">' + repeatPanels.join('') + '</div></div>';
        return html + '</div>';
      }

      function renderOverview(filteredItemsOverride = null) {
        const section = el('overview-section');
        if (!section || !state.snapshot) { if (section) section.innerHTML = ''; return; }
        const rows = Array.isArray(filteredItemsOverride)
          ? filteredItemsOverride.map(item => item.row).filter(Boolean)
          : (state.snapshot.rows || []);
        const total = rows.length;
        const completed = rows.filter(r => r.status === 'completed' || r.output != null || r.output_full != null || r.error).length;
        const failed = rows.filter(r => window.QymMetrics.isErrorRow(r)).length;
        const latencies = rows.filter(r => r.latency_ms && r.latency_ms > 0 && r.status === 'completed').map(r => r.latency_ms);
        const summaryItem = (kind, label, valueHtml, iconHtml) =>
          '<div class="overview-summary-pill ' + kind + '">' +
            '<span class="overview-summary-icon">' + iconHtml + '</span>' +
            '<span class="overview-summary-text">' +
              '<span class="overview-summary-value">' + valueHtml + '</span>' +
              '<span class="overview-summary-label">' + label + '</span>' +
            '</span>' +
          '</div>';
        const runSummaryHtml =
          '<div class="overview-summary-strip">' +
            summaryItem('total', 'Items', String(total), '<svg viewBox="0 0 24 24"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h10"/></svg>') +
            summaryItem('completed', 'Completed', String(completed), '<svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg>') +
            summaryItem('errors', 'Errors', String(failed), '<svg viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>') +
          '</div>';

        const intelligenceCharts = buildDeepAnalysisCharts(rows);

        // ── Gauge color (hex for conic-gradient) ──
        function gaugeColorHex(score) {
          if (score >= 0.9) return '#10b981';
          if (score >= 0.75) return '#84cc16';
          if (score >= 0.6) return '#eab308';
          if (score >= 0.4) return '#f97316';
          return '#ef4444';
        }

        function buildGaugeRing(score) {
          const color = gaugeColorHex(score);
          const r = 18, circ = 2 * Math.PI * r;
          const fillLen = score >= 1 ? circ : circ * Math.max(0, score - 0.03);
          return '<div class="gauge-ring"><svg class="gauge-svg" viewBox="0 0 48 48">' +
            '<circle class="gauge-track" cx="24" cy="24" r="' + r + '"/>' +
            '<circle class="gauge-fill" cx="24" cy="24" r="' + r + '" stroke="' + color + '" ' +
            'style="stroke-dasharray:' + fillLen.toFixed(2) + ' ' + circ.toFixed(2) + ';"/>' +
            '</svg></div>';
        }

        // ── Metric cards (gauge + histogram) ──
        let cards = '';
        let cardIdx = 0;
        const MAX_BAR_PX = 100;

        for (const metric of state.allMetrics) {
          const mIdx = state.allMetrics.indexOf(metric);
          const mType = state.metricTypes[metric] || 'score';
          let sum = 0, cnt = 0, min = Infinity, max = -Infinity;
          for (const row of rows) {
            const { score } = window.QymMetrics.getRowScore(row, mIdx);
            if (score !== null) { sum += score; cnt++; if (score < min) min = score; if (score > max) max = score; }
          }
          if (cnt === 0) continue;
          const avg = sum / cnt;

          if (mType === 'numeric') {
            // ── Numeric: show min / avg / max / total ──
            const fmtN = window.QymMetrics.formatNumericValue;
            cards += '<div class="metric-card" style="animation-delay:' + (cardIdx * 50) + 'ms;">' +
              '<div class="metric-card-header">' +
                '<div class="metric-card-gauge">' +
                  '<div class="metric-card-info">' +
                    '<div class="metric-card-value">' + fmtN(avg) + '</div>' +
                    '<div class="metric-card-name">' + escapeHtml(metric) + '</div>' +
                  '</div>' +
                '</div>' +
                '<span class="metric-card-badge">' + cnt + ' items</span>' +
              '</div>' +
              '<div class="metric-numeric-stats">' +
                '<div class="metric-num-stat"><span class="metric-num-stat-label">Min</span><span class="metric-num-stat-value">' + fmtN(min) + '</span></div>' +
                '<div class="metric-num-stat"><span class="metric-num-stat-label">Avg</span><span class="metric-num-stat-value">' + fmtN(avg) + '</span></div>' +
                '<div class="metric-num-stat"><span class="metric-num-stat-label">Max</span><span class="metric-num-stat-value">' + fmtN(max) + '</span></div>' +
                '<div class="metric-num-stat"><span class="metric-num-stat-label">Total</span><span class="metric-num-stat-value total-val">' + fmtN(sum) + '</span></div>' +
              '</div>' +
            '</div>';
            cardIdx++;

          } else if (mType === 'boolean') {
            // ── Boolean: pass/fail split bar ──
            const passCount = Math.round(avg * cnt);
            const failCount = cnt - passCount;
            const passPct = (avg * 100).toFixed(0);
            const failPct = (100 - avg * 100).toFixed(0);
            cards += '<div class="metric-card" style="animation-delay:' + (cardIdx * 50) + 'ms;">' +
              '<div class="metric-card-header">' +
                '<div class="metric-card-gauge">' +
                  buildGaugeRing(avg) +
                  '<div class="metric-card-info">' +
                    '<div class="metric-card-value ' + scoreColorClass(avg) + '">' + formatPercent(avg) + '</div>' +
                    '<div class="metric-card-name">' + escapeHtml(metric) + '</div>' +
                  '</div>' +
                '</div>' +
                '<span class="metric-card-badge">' + cnt + ' items</span>' +
              '</div>' +
              '<div class="metric-bool-bar">' +
                '<div class="metric-bool-track">' +
                  (passCount > 0 ? '<div class="metric-bool-seg pass-seg" data-metric="' + escapeAttr(metric) + '" data-bool-filter="passed" style="flex:' + passCount + '" title="Click to filter passing items">' + (passCount > 1 ? passCount : '') + '</div>' : '') +
                  (failCount > 0 ? '<div class="metric-bool-seg fail-seg" data-metric="' + escapeAttr(metric) + '" data-bool-filter="failed" style="flex:' + failCount + '" title="Click to filter failing items">' + (failCount > 1 ? failCount : '') + '</div>' : '') +
                '</div>' +
                '<div class="metric-bool-legend">' +
                  '<span class="metric-bool-legend-item"><span class="metric-bool-dot pass"></span> Pass ' + passPct + '%</span>' +
                  '<span class="metric-bool-legend-item"><span class="metric-bool-dot fail"></span> Fail ' + failPct + '%</span>' +
                '</div>' +
              '</div>' +
            '</div>';
            cardIdx++;

          } else {
            // ── Score (0-1 continuous): histogram ──
            const buckets = computeScoreDistribution(metric, rows);
            const totalWithScores = buckets.reduce((a,b) => a+b, 0);
            if (totalWithScores === 0) continue;

            const maxCount = Math.max(...buckets);
            let barsHtml = '<div class="dist-chart">';
            for (let b = 0; b <= 10; b++) {
              const count = buckets[b];
              const barH = maxCount > 0 ? Math.max(count > 0 ? 3 : 0, Math.round((count / maxCount) * MAX_BAR_PX)) : 0;
              const color = getDistSegmentColor(b);
              const label = (b * 10) + '%';
              const rangeMin = b / 10;
              const rangeMax = b === 10 ? 1.01 : (b + 1) / 10;
              const pct = totalWithScores > 0 ? ((count / totalWithScores) * 100).toFixed(0) : '0';
              barsHtml += '<div class="dist-chart-col" data-metric="' + escapeAttr(metric) + '" data-bucket-min="' + rangeMin + '" data-bucket-max="' + rangeMax + '" title="' + label + ': ' + count + ' items (' + pct + '%) — Click to filter">' +
                '<span class="bar-count">' + (count > 0 ? count : '') + '</span>' +
                '<div class="bar-fill" style="height:' + barH + 'px;background:' + color + ';"></div>' +
                '<span class="bar-label">' + label + '</span>' +
              '</div>';
            }
            barsHtml += '</div>';

            cards += '<div class="metric-card" style="animation-delay:' + (cardIdx * 50) + 'ms;">' +
              '<div class="metric-card-header">' +
                '<div class="metric-card-gauge">' +
                  buildGaugeRing(avg) +
                  '<div class="metric-card-info">' +
                    '<div class="metric-card-value ' + scoreColorClass(avg) + '">' + formatPercent(avg) + '</div>' +
                    '<div class="metric-card-name">' + escapeHtml(metric) + '</div>' +
                  '</div>' +
                '</div>' +
                '<span class="metric-card-badge">' + totalWithScores + ' scored</span>' +
              '</div>' +
              barsHtml +
            '</div>';
            cardIdx++;
          }
        }

        // ── Latency card ──
        let latencyCard = '';
        if (latencies.length > 0) {
          const sorted = [...latencies].sort((a, b) => a - b);
          const minLat = sorted[0];
          const maxLat = sorted[sorted.length - 1];
          const latTotal = latencies.length;
          const [p50, p90, p95, p99] = computePercentiles(latencies, [50, 90, 95, 99]);
          const meanLat = latencies.reduce((a, b) => a + b, 0) / latTotal;

          const latBuckets = buildLatencyBuckets(latencies);
          const counts = latBuckets.map(() => 0);
          for (const lat of latencies) {
            for (let i = 0; i < latBuckets.length; i++) {
              if (lat >= latBuckets[i].min && lat < latBuckets[i].max) { counts[i]++; break; }
              if (i === latBuckets.length - 1) counts[i]++;
            }
          }
          const maxCount = Math.max(...counts);

          let barsHtml = '<div class="dist-chart">';
          for (let i = 0; i < latBuckets.length; i++) {
            const count = counts[i];
            const barH = maxCount > 0 ? Math.max(count > 0 ? 14 : 0, Math.round((count / maxCount) * MAX_BAR_PX)) : 0;
            const pct = latTotal > 0 ? ((count / latTotal) * 100).toFixed(0) : '0';
            if (count === 0) continue;
            barsHtml += '<div class="dist-chart-col" data-lat-min="' + latBuckets[i].min + '" data-lat-max="' + latBuckets[i].max + '" title="' + latBuckets[i].label + ': ' + count + ' items (' + pct + '%) — Click to filter">' +
              '<span class="bar-count">' + (count > 0 ? count : '') + '</span>' +
              '<div class="bar-fill" style="height:' + barH + 'px;background:' + latBuckets[i].color + ';"></div>' +
              '<span class="bar-label">' + latBuckets[i].label + '</span>' +
            '</div>';
          }
          barsHtml += '</div>';

          // Round latency for ruler labels (no decimals)
          const fmtRuler = (ms) => {
            if (!ms || ms <= 0) return '—';
            if (ms >= 60000) {
              const m = Math.floor(ms / 60000);
              const s = Math.round((ms % 60000) / 1000);
              return s > 0 ? m + 'm ' + s + 's' : m + 'm';
            } else if (ms >= 1000) {
              return Math.round(ms / 1000) + 's';
            }
            return Math.round(ms) + 'ms';
          };

          // Ruler marker positions: spread evenly for readability
          const rulerPct = (v) => maxLat > minLat ? ((v - minLat) / (maxLat - minLat) * 100).toFixed(1) : 50;
          const rulerMarkers = [
            { val: minLat, label: 'Min', pos: rulerPct(minLat), color: 'var(--score-5)' },
            { val: p50,    label: 'P50', pos: rulerPct(p50),    color: 'var(--score-4)' },
            { val: p90,    label: 'P90', pos: rulerPct(p90),    color: 'var(--score-3)' },
            { val: p95,    label: 'P95', pos: rulerPct(p95),    color: 'var(--score-3)' },
            { val: p99,    label: 'P99', pos: rulerPct(p99),    color: 'var(--score-2)' },
            { val: maxLat, label: 'Max', pos: rulerPct(maxLat), color: 'var(--score-1)' }
          ];
          // Filter out markers too close to neighbors (< 8% apart),
          // but always keep P50 visible even when it sits near Min/Max.
          const MIN_GAP = 8;
          const filtered = [rulerMarkers[0], rulerMarkers[1]]; // always keep Min + P50
          for (let i = 2; i < rulerMarkers.length - 1; i++) {
            const prev = filtered[filtered.length - 1];
            const next = rulerMarkers[rulerMarkers.length - 1]; // Max
            if (Math.abs(rulerMarkers[i].pos - prev.pos) >= MIN_GAP &&
                Math.abs(rulerMarkers[i].pos - next.pos) >= MIN_GAP) {
              filtered.push(rulerMarkers[i]);
            }
          }
          filtered.push(rulerMarkers[rulerMarkers.length - 1]); // always keep Max

          let rulerHtml = '<div class="latency-ruler-fill" style="width:100%;"></div>';
          for (const m of filtered) {
            rulerHtml += '<div class="latency-ruler-marker" style="left:' + m.pos + '%;">' +
              '<div class="latency-ruler-dot" style="background:' + m.color + ';"></div>' +
              '<div class="latency-ruler-label-below"><b>' + fmtRuler(m.val) + '</b>' + m.label + '</div>' +
            '</div>';
          }

          // Format mean as rounded integer seconds if >= 1s
          const meanFmt = meanLat >= 1000 ? Math.round(meanLat / 1000) + 's' : formatLatency(meanLat);

          latencyCard = '<div class="metric-card" style="animation-delay:' + (cardIdx * 50) + 'ms;">' +
            '<div class="latency-hero">' +
              '<div class="latency-p50-block">' +
                '<div class="latency-p50-val">' + meanFmt + '</div>' +
                '<div class="latency-p50-label">Avg Latency</div>' +
              '</div>' +
              '<div class="latency-ruler">' +
                '<div class="latency-ruler-track">' + rulerHtml + '</div>' +
              '</div>' +
            '</div>' +
            barsHtml +
          '</div>';
          cardIdx++;
        }

        // ── ⚡ Trace Stats card ──
        let traceCard = '';
        const ts = state.run && state.run.trace_stats;
        if (ts && ts.has_spans) {
          const fmtV = (v) => v != null ? _fmtTraceNum(v) : '\u2014';
          const fmtD = (v) => v != null ? v.toFixed(1) : '\u2014';
          const fmtLatency = (v) => v != null ? formatLatency(v) : '\u2014';
          const outerScopeParentPills = Array.isArray(ts.outer_scope_parent_spans)
            ? ts.outer_scope_parent_spans
                .filter(s => s && s.name && s.avg_ms != null)
                .map(s => '<div class="trace-pill" title="' + escapeAttr('Avg ' + s.name + ' latency') + '"><div class="trace-pill-icon agent"><svg viewBox="0 0 16 16"><circle cx="8" cy="4" r="3" fill="currentColor"/><path d="M2.5 14.5c0-3 2.5-5.5 5.5-5.5s5.5 2.5 5.5 5.5z" fill="currentColor" opacity=".75"/></svg></div><div class="trace-pill-text"><span class="trace-pill-label">Avg ' + escapeHtml(s.name) + ' latency</span><span class="trace-pill-val" style="color:#34d399;">' + fmtLatency(s.avg_ms) + '</span></div></div>')
                .join('')
            : '';
          traceCard = '<div class="metric-card" style="animation-delay:' + (cardIdx * 50) + 'ms;">' +
            '<div class="metric-card-header">' +
              '<div class="metric-card-gauge">' +
                '<div class="metric-card-info" style="display:flex;flex-direction:row;align-items:center;gap:8px;">' +
                  '<span style="font-size:16px;line-height:1;">\u26A1</span>' +
                  '<span class="metric-card-name" style="margin-top:0;font-size:var(--font-md);font-weight:600;color:var(--text-primary);">Trace Stats</span>' +
                '</div>' +
              '</div>' +
            '</div>' +
            '<div class="trace-pills-row">' +
              '<div class="trace-pill"><div class="trace-pill-icon tokens">\uD83D\uDCDD</div><div class="trace-pill-text"><span class="trace-pill-label">Avg Tokens</span><span class="trace-pill-val" style="color:var(--accent-primary);">' + fmtV(ts.avg_tokens) + '</span></div></div>' +
              '<div class="trace-pill"><div class="trace-pill-icon llm">\uD83E\uDDE0</div><div class="trace-pill-text"><span class="trace-pill-label">Avg LLM Calls</span><span class="trace-pill-val" style="color:var(--accent-secondary);">' + fmtD(ts.avg_llm_calls) + '</span></div></div>' +
              '<div class="trace-pill"><div class="trace-pill-icon tool">\uD83D\uDD27</div><div class="trace-pill-text"><span class="trace-pill-label">Avg Tool Calls</span><span class="trace-pill-val" style="color:var(--warning);">' + fmtD(ts.avg_tool_calls) + '</span></div></div>' +
              '<div class="trace-pill"><div class="trace-pill-icon success">\u2713</div><div class="trace-pill-text"><span class="trace-pill-label">Tool Success</span><span class="trace-pill-val" style="color:var(--success);">' + (ts.tool_success_rate != null ? (ts.tool_success_rate * 100).toFixed(1) + '%' : '\u2014') + '</span></div></div>' +
              '<div class="trace-pill"><div class="trace-pill-icon llm">\u23F1</div><div class="trace-pill-text"><span class="trace-pill-label">Avg LLM Latency</span><span class="trace-pill-val" style="color:var(--accent-secondary);">' + fmtLatency(ts.avg_llm_ms) + '</span></div></div>' +
              '<div class="trace-pill"><div class="trace-pill-icon tool">\u23F1</div><div class="trace-pill-text"><span class="trace-pill-label">Avg Tool Latency</span><span class="trace-pill-val" style="color:var(--warning);">' + fmtLatency(ts.avg_tool_ms) + '</span></div></div>' +
              '<div class="trace-pill"><div class="trace-pill-icon retriever">\uD83D\uDD0E</div><div class="trace-pill-text"><span class="trace-pill-label">Avg Retriever Latency</span><span class="trace-pill-val" style="color:#38bdf8;">' + fmtLatency(ts.avg_retriever_ms) + '</span></div></div>' +
              '<div class="trace-pill"><div class="trace-pill-icon chain">\u26D3</div><div class="trace-pill-text"><span class="trace-pill-label">Avg Trace Latency</span><span class="trace-pill-val" style="color:var(--text-primary);">' + fmtLatency(ts.avg_top_level_chain_ms) + '</span></div></div>' +
              outerScopeParentPills +
              '<div class="trace-pill"><div class="trace-pill-icon evaluator">\u2605</div><div class="trace-pill-text"><span class="trace-pill-label">Avg Evaluator Latency</span><span class="trace-pill-val" style="color:#a78bfa;">' + fmtLatency(ts.avg_evaluator_ms) + '</span></div></div>' +
            '</div>' +
          '</div>';
          cardIdx++;
        }

        // ── System metrics (latency + trace) ──
        const systemCards = (latencyCard || traceCard
            ? '<div class="system-metrics-section">' +
                '<div class="system-metrics-label">Qym Metrics</div>' +
                '<div class="system-metrics-grid">' + (latencyCard || '') + (traceCard || '') + '</div>' +
              '</div>'
            : '');

        // ── Assemble ──
        section.innerHTML =
          '<div class="overview-header">' +
            '<div><h3 class="section-title">Overview</h3>' +
            '<div class="overview-header-hint">Score distributions per metric and response latency. Click any bar to filter the item table.</div></div>' +
            runSummaryHtml +
          '</div>' +
          (cards ? '<div class="metric-cards-grid">' + cards + '</div>' : '') +
          intelligenceCharts +
          systemCards;

        // ── Wire click handlers ──
        const grid = section;
        if (!grid) return;

        grid.querySelectorAll('.dist-chart-col[data-bucket-min]').forEach(col => {
          col.addEventListener('click', () => {
            const metric = col.dataset.metric;
            const min = parseFloat(col.dataset.bucketMin);
            const max = parseFloat(col.dataset.bucketMax);
            if (metric && metric !== state.selectedMetric) {
              state.selectedMetric = metric;
              const sel = el('items-metric-select');
              if (sel) sel.value = metric;
              updateThresholdControl();
            }
            state.scoreDistFilter = { min, max };
            state.page = 1;
            renderItems();
          });
        });

        grid.querySelectorAll('.dist-chart-col[data-lat-min]').forEach(col => {
          col.addEventListener('click', () => {
            const min = parseFloat(col.dataset.latMin);
            const max = col.dataset.latMax === 'Infinity' ? Infinity : parseFloat(col.dataset.latMax);
            state.latencyDistFilter = { min, max };
            state.page = 1;
            renderItems();
          });
        });

        grid.querySelectorAll('.metric-bool-seg[data-bool-filter]').forEach(seg => {
          seg.addEventListener('click', () => {
            const metric = seg.dataset.metric;
            const boolFilter = seg.dataset.boolFilter;
            if (metric && metric !== state.selectedMetric) {
              state.selectedMetric = metric;
              const sel = el('items-metric-select');
              if (sel) sel.value = metric;
              updateThresholdControl();
            }
            state.scoreDistFilter = null;
            state.itemFilter = boolFilter || 'all';
            const itemFilter = el('item-filter');
            if (itemFilter) itemFilter.value = state.itemFilter;
            state.page = 1;
            renderItems();
          });
        });

        grid.querySelectorAll('.ri-axis-select[data-ri-axis]').forEach(select => {
          select.addEventListener('change', () => {
            const axis = select.dataset.riAxis;
            const next = select.value;
            if (axis === 'x') {
              const previous = state.relationshipX;
              if (next === state.relationshipY) state.relationshipY = previous;
              state.relationshipX = next;
            } else {
              const previous = state.relationshipY;
              if (next === state.relationshipX) state.relationshipX = previous;
              state.relationshipY = next;
            }
            renderOverview(getFilteredItems());
          });
        });
      }

      function getApprovalState(row) {
        if (!row) return '';
        const reviewStatus = String(row.review_correction_status || '').toLowerCase();
        if (reviewStatus === 'approved') return 'approved';
        return 'not_approved';
      }

      function matchesApprovalFilter(row, approvalSelection) {
        if (!approvalSelection) return true;
        const approvalState = getApprovalState(row);
        if (!approvalState) return false;
        // Support string (simple select) or array (legacy)
        if (typeof approvalSelection === 'string') {
          return approvalState === approvalSelection;
        }
        return approvalSelection.some(option => {
          if (option === 'approved') return approvalState === 'approved';
          if (option === 'not_approved') return approvalState === 'not_approved';
          return false;
        });
      }

      function isMetricMetaEdited(meta) {
        if (!meta || typeof meta !== 'object') return false;
        const raw = meta.modified;
        if (raw === true || raw === 1) return true;
        const normalized = String(raw ?? '').trim().toLowerCase();
        return normalized === 'true' || normalized === '1' || normalized === 'yes';
      }

      function rowHasEditedMetric(row) {
        const metricMeta = row?.metric_meta;
        if (!metricMeta || typeof metricMeta !== 'object') return false;
        return Object.values(metricMeta).some(isMetricMetaEdited);
      }

      function renderSankeyDiagram(rows, filteredItemIds) {
        const container = document.getElementById('sankey-diagram-container');
        if (!container) return;

        // Compute root cause -> solution mapping
        const links = {};
        const rcCounts = {};
        const solCounts = {};
        for (const row of rows) {
          const itemId = row.item_id || String(row.index);
          if (!filteredItemIds.has(itemId)) continue;
          const md = row.item_metadata || {};
          const rc = md.root_cause || '';
          const sol = md.solution || '';
          if (!rc || !sol) continue;
          const key = rc + '|||' + sol;
          links[key] = (links[key] || 0) + 1;
          rcCounts[rc] = (rcCounts[rc] || 0) + 1;
          solCounts[sol] = (solCounts[sol] || 0) + 1;
        }

        const linkEntries = Object.entries(links);
        if (linkEntries.length === 0) { container.innerHTML = ''; return; }

        // Sort by count descending
        const rcList = Object.entries(rcCounts).sort((a, b) => b[1] - a[1]);
        const solList = Object.entries(solCounts).sort((a, b) => b[1] - a[1]);

        // Layout constants
        const nodeH = 32;
        const nodeGap = 8;
        const colWidth = 190;
        const svgPad = 20;
        const totalLeftH = rcList.length * nodeH + (rcList.length - 1) * nodeGap;
        const totalRightH = solList.length * nodeH + (solList.length - 1) * nodeGap;
        const diagramH = Math.max(totalLeftH, totalRightH) + svgPad * 2;

        // Compute node y positions (centered vertically)
        const leftOffsetY = svgPad + (diagramH - svgPad * 2 - totalLeftH) / 2;
        const rightOffsetY = svgPad + (diagramH - svgPad * 2 - totalRightH) / 2;
        const rcPositions = {};
        rcList.forEach(([rc], i) => {
          rcPositions[rc] = leftOffsetY + i * (nodeH + nodeGap) + nodeH / 2;
        });
        const solPositions = {};
        solList.forEach(([sol], i) => {
          solPositions[sol] = rightOffsetY + i * (nodeH + nodeGap) + nodeH / 2;
        });

        // Build HTML
        let html = '<div class="breakdown-header" style="color:var(--text-primary);margin-top:var(--space-md);"><span class="breakdown-icon">\u2666</span> Failure to Fix Flow</div>';
        html += '<div class="sankey-body" style="height:' + diagramH + 'px;">';

        // SVG paths placeholder
        html += '<svg class="sankey-svg" viewBox="0 0 100 ' + diagramH + '" preserveAspectRatio="none" id="sankey-svg"></svg>';

        // Left column (root causes)
        html += '<div class="sankey-col sankey-col-rc" style="width:' + colWidth + 'px;">';
        rcList.forEach(([rc, count], i) => {
          const color = ROOT_CAUSE_COLORS[rc] || '#e07a5f';
          const y = leftOffsetY + i * (nodeH + nodeGap);
          html += '<div class="sankey-node" data-sankey-rc="' + escapeAttr(rc) + '" style="background:' + color + '15;border-color:' + color + '40;color:' + color + ';" title="' + escapeAttr(rc) + ' (' + count + ')"><span class="sankey-node-label">' + escapeHtml(rc) + '</span><span class="sankey-node-count" style="background:' + color + '30;">' + count + '</span></div>';
        });
        html += '</div>';

        // Right column (solutions)
        html += '<div class="sankey-col sankey-col-sol" style="width:' + colWidth + 'px;">';
        solList.forEach(([sol, count], i) => {
          const color = SOLUTION_COLORS[sol] || '#60a5fa';
          const y = rightOffsetY + i * (nodeH + nodeGap);
          html += '<div class="sankey-node" data-sankey-sol="' + escapeAttr(sol) + '" style="background:' + color + '15;border-color:' + color + '40;color:' + color + ';" title="' + escapeAttr(sol) + ' (' + count + ')"><span class="sankey-node-label">' + escapeHtml(sol) + '</span><span class="sankey-node-count" style="background:' + color + '30;">' + count + '</span></div>';
        });
        html += '</div>';

        html += '</div>'; // .sankey-body
        container.innerHTML = html;

        // Now draw SVG paths after DOM insertion
        requestAnimationFrame(function () {
          drawSankeyPaths(container, linkEntries, rcPositions, solPositions, colWidth);
          wireSankeyHover(container);
        });
      }

      function drawSankeyPaths(container, linkEntries, rcPositions, solPositions, colWidth) {
        const svg = container.querySelector('#sankey-svg');
        if (!svg) return;
        const body = container.querySelector('.sankey-body');
        if (!body) return;
        const bodyRect = body.getBoundingClientRect();
        const bodyW = bodyRect.width;

        // Update SVG viewBox to match actual width
        svg.setAttribute('viewBox', '0 0 ' + bodyW + ' ' + svg.parentElement.clientHeight);
        svg.style.width = bodyW + 'px';

        // Compute actual node Y positions from DOM
        const rcNodes = container.querySelectorAll('[data-sankey-rc]');
        const solNodes = container.querySelectorAll('[data-sankey-sol]');
        const rcActual = {};
        rcNodes.forEach(n => {
          const r = n.getBoundingClientRect();
          rcActual[n.dataset.sankeyRc] = r.top - bodyRect.top + r.height / 2;
        });
        const solActual = {};
        solNodes.forEach(n => {
          const r = n.getBoundingClientRect();
          solActual[n.dataset.sankeySol] = r.top - bodyRect.top + r.height / 2;
        });

        // Max count for stroke width scaling
        const maxCount = Math.max(...linkEntries.map(([, c]) => c));
        const minStroke = 2;
        const maxStroke = 16;

        let paths = '';
        for (const [key, count] of linkEntries) {
          const [rc, sol] = key.split('|||');
          const y1 = rcActual[rc];
          const y2 = solActual[sol];
          if (y1 == null || y2 == null) continue;

          const x1 = colWidth + 8;
          const x2 = bodyW - colWidth - 8;
          const cx = (x1 + x2) / 2;
          const sw = minStroke + (count / maxCount) * (maxStroke - minStroke);
          const color = ROOT_CAUSE_COLORS[rc] || '#e07a5f';

          paths += '<path d="M ' + x1 + ' ' + y1 + ' C ' + cx + ' ' + y1 + ', ' + cx + ' ' + y2 + ', ' + x2 + ' ' + y2 + '" ' +
            'fill="none" stroke="' + color + '" stroke-opacity="0.35" stroke-width="' + sw.toFixed(1) + '" ' +
            'data-sankey-link-rc="' + escapeAttr(rc) + '" data-sankey-link-sol="' + escapeAttr(sol) + '" ' +
            'data-sankey-count="' + count + '"/>';
        }
        svg.innerHTML = paths;
      }

      // Module-level Sankey state for cleanup
      var _sankeyResizeObserver = null;
      var _sankeyResizeTimeout = null;

      function wireSankeyHover(container) {
        // Bind hover handlers using event delegation on the container
        // Remove old delegation handler if any, then add fresh one
        if (container._sankeyMouseHandler) {
          container.removeEventListener('mouseenter', container._sankeyMouseHandler, true);
          container.removeEventListener('mouseleave', container._sankeyMouseHandler, true);
        }

        function getHoverTarget(el) {
          while (el && el !== container) {
            if (el.classList && el.classList.contains('sankey-node')) return { rc: el.dataset.sankeyRc || '', sol: el.dataset.sankeySol || '' };
            if (el.dataset && el.dataset.sankeyLinkRc) return { rc: el.dataset.sankeyLinkRc, sol: el.dataset.sankeyLinkSol };
            el = el.parentElement;
          }
          return null;
        }

        function highlight(rc, sol) {
          const allPaths = container.querySelectorAll('[data-sankey-link-rc]');
          const allNodes = container.querySelectorAll('.sankey-node');
          // Build connected set for fast lookup
          const connectedRc = new Set();
          const connectedSol = new Set();
          allPaths.forEach(p => {
            const pRc = p.dataset.sankeyLinkRc;
            const pSol = p.dataset.sankeyLinkSol;
            if ((rc && pRc === rc) || (sol && pSol === sol)) {
              connectedRc.add(pRc);
              connectedSol.add(pSol);
              p.classList.add('sankey-highlighted');
              p.classList.remove('sankey-dimmed');
              p.setAttribute('stroke-opacity', '0.7');
            } else {
              p.classList.add('sankey-dimmed');
              p.classList.remove('sankey-highlighted');
              p.setAttribute('stroke-opacity', '0.08');
            }
          });
          allNodes.forEach(n => {
            const connected = (n.dataset.sankeyRc && connectedRc.has(n.dataset.sankeyRc)) ||
                              (n.dataset.sankeySol && connectedSol.has(n.dataset.sankeySol));
            if (connected) { n.classList.add('sankey-highlighted'); n.classList.remove('sankey-dimmed'); }
            else { n.classList.add('sankey-dimmed'); n.classList.remove('sankey-highlighted'); }
          });
        }

        function clearHighlight() {
          container.querySelectorAll('[data-sankey-link-rc]').forEach(p => {
            p.classList.remove('sankey-highlighted', 'sankey-dimmed');
            p.setAttribute('stroke-opacity', '0.35');
          });
          container.querySelectorAll('.sankey-node').forEach(n => n.classList.remove('sankey-highlighted', 'sankey-dimmed'));
        }

        function handler(e) {
          if (e.type === 'mouseenter') {
            const target = getHoverTarget(e.target);
            if (target) highlight(target.rc, target.sol);
          } else {
            const target = getHoverTarget(e.target);
            if (target) clearHighlight();
          }
        }
        container._sankeyMouseHandler = handler;
        container.addEventListener('mouseenter', handler, true);
        container.addEventListener('mouseleave', handler, true);

        // Resize observer — disconnect old one first, no recursion
        if (_sankeyResizeObserver) {
          _sankeyResizeObserver.disconnect();
          _sankeyResizeObserver = null;
        }
        clearTimeout(_sankeyResizeTimeout);

        if (typeof ResizeObserver !== 'undefined') {
          const body = container.querySelector('.sankey-body');
          if (body) {
            _sankeyResizeObserver = new ResizeObserver(() => {
              clearTimeout(_sankeyResizeTimeout);
              _sankeyResizeTimeout = setTimeout(() => {
                // Guard: if container was detached from DOM, stop
                if (!container.isConnected) { if (_sankeyResizeObserver) _sankeyResizeObserver.disconnect(); return; }
                const existingPaths = container.querySelectorAll('[data-sankey-link-rc]');
                const entries = [];
                existingPaths.forEach(p => {
                  entries.push([p.dataset.sankeyLinkRc + '|||' + p.dataset.sankeyLinkSol, parseInt(p.dataset.sankeyCount) || 1]);
                });
                if (entries.length > 0) {
                  drawSankeyPaths(container, entries, {}, {}, 190);
                }
              }, 150);
            });
            _sankeyResizeObserver.observe(body);
          }
        }
      }

      function getCategoryChipKeys() {
        // Return metadata keys eligible for breakdown chips
        const EXCLUDED = new Set(['root_cause', 'root_cause_detail', 'root_cause_note', 'root_cause_source', 'root_cause_confidence', 'solution', 'solution_note', 'solution_source', 'task_started_at_ms', 'retry_count', 'analysis_error']);
        const MAX_CARD = 30;
        const rows = state.snapshot.rows || [];
        const keys = [];
        for (const k of state.allMetadataKeys) {
          if (EXCLUDED.has(k)) continue;
          const uniqueVals = new Set();
          for (const row of rows) {
            const v = (row.item_metadata || {})[k];
            if (v != null && v !== '') {
              for (const value of getMetadataCategoryValues(row.item_metadata || {}, k)) uniqueVals.add(value);
            }
          }
          if (uniqueVals.size === 0 || uniqueVals.size > MAX_CARD) continue;
          keys.push({ key: k, count: uniqueVals.size });
        }
        return keys;
      }

      function getCategoryMetricScores(row, metric, metricIndex) {
        if (!state.viewPass && row.pass_scores && Array.isArray(row.pass_scores[metric])) {
          const passValues = row.pass_scores[metric]
            .map(value => window.QymMetrics.parseScoreValue(value))
            .filter(value => value !== null);
          if (passValues.length > 0) return passValues;
        }
        const { score } = window.QymMetrics.getRowScore(row, metricIndex);
        return score === null ? [] : [score];
      }

      function getCategoryGroupStats(categoryKey, rows, filteredItemIds, metric, metricIndex, threshold, supportsPassRate) {
        const groups = {};
        for (const row of rows) {
          const itemId = row.item_id || String(row.index);
          if (!filteredItemIds.has(itemId)) continue;
          const metadata = row.item_metadata || {};
          const rawValue = metadata[categoryKey] ?? '';
          const isListKey = isListCategoryKey(categoryKey);
          const parsedValues = getMetadataCategoryValues(metadata, categoryKey);
          const groupValues = parsedValues.length ? parsedValues : [String(rawValue)];
          if (groupValues.length === 0) groupValues.push('');
          const domainIsSole = isListKey && groupValues.length === 1;
          const metricScores = getCategoryMetricScores(row, metric, metricIndex);

          for (const groupValue of groupValues) {
            if (isListKey && state.domainFilter !== null
                && state.domainFilter.some(filter => filter.toLowerCase() === groupValue.toLowerCase()) && !domainIsSole) continue;
            const effective = groupValue || 'unknown';
            if (!groups[effective]) groups[effective] = { scores: [], latencies: [], count: 0 };
            groups[effective].count++;
            groups[effective].scores.push(...metricScores);
            if (row.latency_ms && row.status === 'completed') groups[effective].latencies.push(row.latency_ms);
          }
        }

        const stats = Object.entries(groups).map(([groupValue, group]) => {
          const passCount = supportsPassRate ? group.scores.filter(score => score >= threshold).length : 0;
          return {
            groupVal: groupValue,
            itemCount: group.count,
            avgScore: group.scores.length ? group.scores.reduce((sum, score) => sum + score, 0) / group.scores.length : 0,
            passRate: supportsPassRate && group.scores.length ? passCount / group.scores.length : null,
            avgLatency: group.latencies.length ? group.latencies.reduce((sum, latency) => sum + latency, 0) / group.latencies.length : null,
          };
        });

        if (state.categoryBreakdownSort === 'name') {
          stats.sort((a, b) => a.groupVal.localeCompare(b.groupVal));
        } else if (state.categoryBreakdownSort === 'rate' || state.categoryBreakdownSort === 'delta') {
          stats.sort((a, b) => (b.passRate ?? -1) - (a.passRate ?? -1) || a.groupVal.localeCompare(b.groupVal));
        } else if (categoryKey === 'complexity') {
          const order = ['easy', 'medium', 'hard', 'expert'];
          stats.sort((a, b) => {
            const aIndex = order.indexOf(a.groupVal.toLowerCase().trim());
            const bIndex = order.indexOf(b.groupVal.toLowerCase().trim());
            return (aIndex === -1 ? 999 : aIndex) - (bIndex === -1 ? 999 : bIndex);
          });
        } else {
          stats.sort((a, b) => b.avgScore - a.avgScore);
        }
        return stats;
      }

      function categoryDeltaText(passRate, baseline) {
        if (passRate === null || baseline === null) return '\u2014';
        const points = Math.round((passRate - baseline) * 100);
        return (points > 0 ? '+' : '') + points + 'pp';
      }

      function categoryDeltaClass(passRate, baseline) {
        if (passRate === null || baseline === null || passRate === baseline) return '';
        return passRate > baseline ? 'positive' : 'negative';
      }

      function categoryPassTrack(passRate, baseline) {
        if (passRate === null) return '';
        const baselineStyle = baseline === null ? '' : '--category-baseline:' + Math.round(baseline * 100) + '%;';
        return '<div class="category-pass-track' + (baseline === null ? '' : ' has-baseline') + '" style="--category-pass:' + Math.round(passRate * 100) + '%;' + baselineStyle + '--category-pass-color:' + riScoreColor(passRate) + '">' +
          '<span class="category-pass-fill"></span></div>';
      }

      function renderMetadataBreakdown() {
        const section = el('metadata-breakdown');
        if (!section) return;

        const chipKeys = getCategoryChipKeys();

        // If no metadata keys at all, hide the section
        if (chipKeys.length === 0) { section.innerHTML = ''; return; }

        const metric = state.selectedMetric || state.allMetrics[0];
        if (!metric) return;
        const mIdx = state.allMetrics.indexOf(metric);
        const metricType = state.metricTypes[metric] || 'score';
        const isBoolean = state.metricIsBoolean[metric];
        const supportsPassRate = metricType !== 'numeric';
        if (!supportsPassRate && ['rate', 'delta'].includes(state.categoryBreakdownSort)) {
          state.categoryBreakdownSort = 'default';
        }
        const rows = state.snapshot.rows || [];
        const threshold = isBoolean ? 0.9999 : (state.metricThresholds[metric] || 0.8);

        // Get filtered item IDs so breakdown only shows items matching current filters
        const filteredItems = getFilteredItems();
        const filteredItemIds = new Set(filteredItems.map(item => {
          const r = item.row;
          return r.item_id || String(r.index);
        }));

        const overallScores = [];
        for (const row of rows) {
          const itemId = row.item_id || String(row.index);
          if (filteredItemIds.has(itemId)) overallScores.push(...getCategoryMetricScores(row, metric, mIdx));
        }
        const overallPassRate = supportsPassRate && overallScores.length
          ? overallScores.filter(score => score >= threshold).length / overallScores.length
          : null;

        let html = '<h3 class="section-title">Performance by Category</h3>';

        html += '<div class="category-breakdown-toolbar"><div class="category-chip-bar">';
        html += '<span class="category-chip-bar-label">Categories</span>';
        for (const { key, count } of chipKeys) {
          const selected = state.selectedCategories.has(key);
          const displayName = key;
          html += '<button class="category-chip' + (selected ? ' selected' : '') + '" data-chip-key="' + escapeAttr(key) + '">' +
            escapeHtml(displayName) + ' <span class="chip-count">' + count + '</span></button>';
        }
        html += '</div>';
        html += '<div class="category-breakdown-controls">' +
          '<span class="category-breakdown-context">Metric <strong>' + escapeHtml(metric) + '</strong>' +
            (supportsPassRate ? ' &middot; Pass <strong>&ge;' + escapeHtml(formatPercent(threshold)) + '</strong>' : ' &middot; Numeric metric') + '</span>' +
          '<span class="category-breakdown-sort"><label for="category-breakdown-sort">Sort</label>' +
            '<select class="filter-select" id="category-breakdown-sort">' +
              '<option value="default"' + (state.categoryBreakdownSort === 'default' ? ' selected' : '') + '>Default</option>' +
              '<option value="name"' + (state.categoryBreakdownSort === 'name' ? ' selected' : '') + '>Name</option>' +
              '<option value="rate"' + (state.categoryBreakdownSort === 'rate' ? ' selected' : '') + (supportsPassRate ? '' : ' disabled') + '>Pass rate</option>' +
              '<option value="delta"' + (state.categoryBreakdownSort === 'delta' ? ' selected' : '') + (supportsPassRate ? '' : ' disabled') + '>Delta</option>' +
            '</select></span>' +
          '<span class="samples-view-toggle category-breakdown-view-toggle" role="group" aria-label="Category view">' +
            '<button type="button" class="samples-view-btn category-breakdown-view-btn' + (state.categoryBreakdownView === 'cards' ? ' active' : '') + '" data-category-view="cards" aria-pressed="' + (state.categoryBreakdownView === 'cards') + '">Cards</button>' +
            '<button type="button" class="samples-view-btn category-breakdown-view-btn' + (state.categoryBreakdownView === 'compare' ? ' active' : '') + '" data-category-view="compare" aria-pressed="' + (state.categoryBreakdownView === 'compare') + '">Compare</button>' +
          '</span></div></div>';

        const breakdownKeys = chipKeys.filter(c => state.selectedCategories.has(c.key)).map(c => c.key);

        if (breakdownKeys.length === 0) {
          html += '<div class="comparison-stats"><div class="section-empty-state">' +
            '<div class="section-empty-copy"><strong>Select categories above to see performance breakdowns</strong><span>Choose from your item metadata fields to analyze scores by group</span></div>' +
          '</div></div>';
          section.innerHTML = html;
          wireChipClicks(section);
          return;
        }

        const statsByKey = new Map(breakdownKeys.map(key => [key, getCategoryGroupStats(key, rows, filteredItemIds, metric, mIdx, threshold, supportsPassRate)]));
        html += '<div class="comparison-stats metadata-breakdown-content">';

        if (state.categoryBreakdownView === 'compare') {
          if (!breakdownKeys.includes(state.categoryCompareKey)) state.categoryCompareKey = breakdownKeys[0];
          html += '<div class="category-compare-tabs" role="tablist" aria-label="Category dimension">';
          for (const key of breakdownKeys) {
            html += '<button type="button" class="category-compare-tab' + (state.categoryCompareKey === key ? ' active' : '') + '" data-category-compare-key="' + escapeAttr(key) + '" role="tab" aria-selected="' + (state.categoryCompareKey === key) + '">' + escapeHtml(key) + '</button>';
          }
          html += '</div>';
          const compareStats = statsByKey.get(state.categoryCompareKey) || [];
          html += '<div class="category-compare-scroll"><div class="category-compare-head"><span>Category</span><span>Pass rate</span><span>Rate</span><span>Average</span><span>Delta</span><span>Items</span><span>Latency</span></div>';
          for (const group of compareStats) {
            const averageDisplay = window.QymMetrics.formatMetricValue(group.avgScore, metricType, 0);
            const latencyDisplay = group.avgLatency !== null ? formatLatency(group.avgLatency) : '&mdash;';
            const deltaClass = categoryDeltaClass(group.passRate, overallPassRate);
            html += '<button type="button" class="category-compare-row" data-bd-category="' + escapeAttr(state.categoryCompareKey) + '" data-bd-value="' + escapeAttr(group.groupVal) + '" title="Click to filter by ' + escapeAttr(group.groupVal) + '">' +
              '<span class="category-compare-name" title="' + escapeAttr(group.groupVal) + '">' + escapeHtml(group.groupVal) + '</span>' +
              '<span>' + categoryPassTrack(group.passRate, overallPassRate) + '</span>' +
              '<span class="category-compare-number">' + (group.passRate === null ? '&mdash;' : formatPercent(group.passRate)) + '</span>' +
              '<span class="category-compare-number muted">' + averageDisplay + '</span>' +
              '<span class="category-compare-delta ' + deltaClass + '">' + categoryDeltaText(group.passRate, overallPassRate) + '</span>' +
              '<span class="category-compare-number muted">' + group.itemCount + '</span>' +
              '<span class="category-compare-number muted">' + latencyDisplay + '</span></button>';
          }
          html += '</div>';
          if (overallPassRate !== null) html += '<div class="category-baseline-note"><span class="category-baseline-marker"></span><span>Run pass rate &middot; ' + formatPercent(overallPassRate) + '</span></div>';
        } else {
          for (const bdKey of breakdownKeys) {
            const groupStats = statsByKey.get(bdKey) || [];
            if (groupStats.length === 0) continue;

            const icon = bdKey === 'complexity' ? '\u2666' : (bdKey === 'domain' ? '\u25C6' : '\u25CB');
            const colorClass = bdKey === 'complexity' ? 'breakdown-complexity' : (bdKey === 'domain' ? 'breakdown-domain' : 'breakdown-custom');
            const expanded = state.expandedCategoryGroups.has(bdKey);
            const visibleStats = expanded ? groupStats : groupStats.slice(0, 6);

            html += '<div class="breakdown-section ' + colorClass + '">';
            html += '<div class="breakdown-header"><span class="breakdown-icon">' + icon + '</span> ' + escapeHtml(bdKey) + ' <span class="breakdown-metric">' + escapeHtml(metric) + '</span></div>';
            html += '<div class="breakdown-grid">';

            for (const group of visibleStats) {
              const latencyDisplay = group.avgLatency !== null ? formatLatency(group.avgLatency) : '&mdash;';
              let cardValueClass = '';
              if (bdKey === 'complexity') {
                const value = group.groupVal.toLowerCase().trim();
                if (['easy','simple','basic','low'].includes(value)) cardValueClass = ' complexity-easy';
                else if (['medium','moderate','intermediate','mid'].includes(value)) cardValueClass = ' complexity-medium';
                else if (['hard','difficult','advanced','high','complex'].includes(value)) cardValueClass = ' complexity-hard';
                else if (['very hard','very_hard','expert','extreme'].includes(value)) cardValueClass = ' complexity-expert';
              }
              const colorClassName = window.QymMetrics.getMetricColorClass(group.avgScore, metricType);
              const averageDisplay = window.QymMetrics.formatMetricValue(group.avgScore, metricType, 0);
              const deltaClass = categoryDeltaClass(group.passRate, overallPassRate);
              html += '<div class="breakdown-card' + cardValueClass + '" data-bd-category="' + escapeAttr(bdKey) + '" data-bd-value="' + escapeAttr(group.groupVal) + '" style="cursor:pointer;" title="Click to filter by ' + escapeAttr(group.groupVal) + '">' +
                '<div class="breakdown-card-label">' + escapeHtml(group.groupVal) + '</div>' +
                '<div class="breakdown-card-scores"><div class="score-col"><span class="score-col-label">Average</span><span class="score-col-value ' + colorClassName + '">' + averageDisplay + '</span></div><div class="score-col"><span class="score-col-label">Items</span><span class="score-col-value" style="color:var(--text-muted);">' + group.itemCount + '</span></div><div class="score-col"><span class="score-col-label">Latency</span><span class="score-col-value" style="color:var(--text-secondary); font-weight:500;">' + latencyDisplay + '</span></div></div>' +
                (supportsPassRate ? '<div class="breakdown-pass-summary"><span>Pass rate</span><strong>' + formatPercent(group.passRate) + ' &middot; <span class="' + deltaClass + '">' + categoryDeltaText(group.passRate, overallPassRate) + '</span></strong></div>' + categoryPassTrack(group.passRate, overallPassRate) : '') +
              '</div>';
            }
            html += '</div>';
            if (groupStats.length > 6) {
              html += '<button type="button" class="category-expand-btn" data-category-expand="' + escapeAttr(bdKey) + '">' +
                (expanded ? 'Show less' : 'Show ' + (groupStats.length - visibleStats.length) + ' more') + '</button>';
            }
            html += '</div>';
          }
        }

        html += '</div>';
        section.innerHTML = html;
        wireChipClicks(section);

        const sortSelect = section.querySelector('#category-breakdown-sort');
        if (sortSelect) {
          sortSelect.addEventListener('change', () => {
            state.categoryBreakdownSort = sortSelect.value;
            renderMetadataBreakdown();
          });
        }
        section.querySelectorAll('.category-breakdown-view-btn[data-category-view]').forEach(button => {
          button.addEventListener('click', () => {
            state.categoryBreakdownView = button.dataset.categoryView;
            renderMetadataBreakdown();
          });
        });
        section.querySelectorAll('.category-compare-tab[data-category-compare-key]').forEach(button => {
          button.addEventListener('click', () => {
            state.categoryCompareKey = button.dataset.categoryCompareKey;
            renderMetadataBreakdown();
          });
        });
        section.querySelectorAll('.category-expand-btn[data-category-expand]').forEach(button => {
          button.addEventListener('click', () => {
            const key = button.dataset.categoryExpand;
            if (state.expandedCategoryGroups.has(key)) state.expandedCategoryGroups.delete(key);
            else state.expandedCategoryGroups.add(key);
            renderMetadataBreakdown();
          });
        });

        // Wire breakdown card click-to-filter
        section.querySelectorAll('.breakdown-card[data-bd-category], .category-compare-row[data-bd-category]').forEach(card => {
          card.addEventListener('click', () => {
            const cat = card.dataset.bdCategory;
            const val = card.dataset.bdValue;
            const current = getCatFilter(cat);
            if (cat === 'domain') {
              if (state.domainFilterMode === 'exclude') {
                state.domainExclusive.delete(val);
                setCatFilter(cat, [val], 'include');
              } else if (current === null) {
                state.domainExclusive.delete(val);
                setCatFilter(cat, [val], 'include');
              } else if (current.includes(val) && !state.domainExclusive.has(val)) {
                state.domainExclusive.add(val);
              } else if (!current.includes(val)) {
                state.domainExclusive.delete(val);
                setCatFilter(cat, current.concat(val), 'include');
              }
            } else if (current !== null && current.length === 1 && current[0] === val) {
              setCatFilter(cat, null);
            } else {
              setCatFilter(cat, [val]);
            }
            syncMultiselectUI(cat);
            state.page = 1;
            renderItems();
          });
        });
      }

      function wireChipClicks(container) {
