        if (ts.tokens != null) chips.push('<span class="trace-chip"><span class="trace-chip-icon">\u26A1</span><span class="trace-chip-value">' + _fmtTraceNum(ts.tokens) + '</span><span class="trace-chip-label">Tokens</span></span>');
        if (ts.cost > 0) chips.push('<span class="trace-chip"><span class="trace-chip-icon">\u26A1</span><span class="trace-chip-value">$' + ts.cost.toFixed(3) + '</span><span class="trace-chip-label">Cost</span></span>');
        if (ts.llm_calls) chips.push('<span class="trace-chip"><span class="trace-chip-icon">\u26A1</span><span class="trace-chip-value">' + ts.llm_calls + '</span><span class="trace-chip-label">LLM Calls</span></span>');
        if (ts.tool_calls) chips.push('<span class="trace-chip"><span class="trace-chip-icon">\u26A1</span><span class="trace-chip-value">' + ts.tool_calls + '</span><span class="trace-chip-label">Tool Calls</span></span>');
        if (toolErrorCount > 0 || ts.tool_calls) chips.push('<span class="trace-chip' + (toolErrorCount > 0 ? ' trace-chip-err' : '') + '"><span class="trace-chip-icon">\u26A1</span><span class="trace-chip-value">' + toolErrorCount + '</span><span class="trace-chip-label">Tool Errors</span></span>');
        if (ts.noisy_reasoning > 0) chips.push('<span class="trace-chip"><span class="trace-chip-icon">\u2728</span><span class="trace-chip-value">' + ts.noisy_reasoning + '</span><span class="trace-chip-label">Noisy Reasoning</span></span>');
        if (ts.provider_errors > 0) chips.push('<span class="trace-chip trace-chip-err"><span class="trace-chip-icon">\u26A0</span><span class="trace-chip-value">' + ts.provider_errors + '</span><span class="trace-chip-label">Provider Errors</span></span>');
        if ((retryCount || 0) > 0) chips.push('<span class="trace-chip"><span class="trace-chip-icon">\u21BB</span><span class="trace-chip-value">' + retryCount + '</span><span class="trace-chip-label">Retries</span></span>');
        if (chips.length === 0) return '';
        return '<div class="trace-chips-row">' + chips.join('') + '</div>';
      }

      function getRowTraceErrorCount(row) {
        const ts = (row && row.trace_stats && typeof row.trace_stats === 'object') ? row.trace_stats : {};
        return Number(ts.tool_errors || ts.malformed_tool_calls || 0) + Number(ts.provider_errors || 0);
      }

      function renderMarkdownSafe(value) {
        if (value === null || value === undefined) return '&mdash;';
        if (typeof value === 'object') return formatObjectAsHtml(value);
        const str = String(value).replace(/\\u([0-9a-fA-F]{4})/g, (_, hex) => String.fromCharCode(parseInt(hex, 16)));
        const trimmed = str.trim();
        if ((trimmed.startsWith('{') && trimmed.endsWith('}')) || (trimmed.startsWith('[') && trimmed.endsWith(']'))) {
          try { const p = JSON.parse(trimmed); if (typeof p === 'object' && p !== null) return formatObjectAsHtml(p); } catch {}
          const p = parsePythonDict(trimmed);
          if (p !== null) return formatObjectAsHtml(p);
        }
        let html = escapeHtml(str);
        html = html.replace(/```([\s\S]*?)```/g, '<pre style="background:var(--bg-elevated);padding:4px 8px;border-radius:4px;overflow-x:auto;margin:4px 0;">$1</pre>');
        html = html.replace(/`([^`]+)`/g, '<code style="background:var(--bg-elevated);padding:1px 4px;border-radius:3px;">$1</code>');
        html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
        html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
        html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" style="color:var(--accent-primary);">$1</a>');
        if (isRTL(str)) html = '<div dir="rtl" style="text-align:right;">' + html + '</div>';
        return html;
      }

      function parsePythonDict(str) {
        try {
          let i = 0; const len = str.length;
          function skip() { while (i < len && /\s/.test(str[i])) i++; }
          function parseVal() {
            skip(); if (i >= len) return undefined;
            const ch = str[i];
            if (ch === "'" || ch === '"') return parseStr(ch);
            if (ch === '{') return parseObj();
            if (ch === '[') return parseArr();
            return parseLit();
          }
          function parseStr(q) {
            i++; let r = '';
            while (i < len) {
              if (str[i] === '\\' && i+1 < len) { const n = str[i+1]; if (n==='n'){r+='\n';i+=2;} else if(n==='t'){r+='\t';i+=2;} else if(n==='\\'){r+='\\';i+=2;} else if(n===q){r+=q;i+=2;} else {r+=str[i];i++;} }
              else if (str[i] === q) { i++; return r; }
              else { r += str[i]; i++; }
            }
            return r;
          }
          function parseObj() {
            i++; const o = {}; skip(); if (str[i]==='}'){i++;return o;}
            while (i<len) { skip(); const k=parseVal(); if (typeof k!=='string') return null; skip(); if(str[i]!==':') return null; i++; o[k]=parseVal(); skip(); if(str[i]==='}'){i++;return o;} if(str[i]===','){i++;continue;} return null; }
            return o;
          }
          function parseArr() {
            i++; const a=[]; skip(); if(str[i]===']'){i++;return a;}
            while (i<len) { a.push(parseVal()); skip(); if(str[i]===']'){i++;return a;} if(str[i]===','){i++;continue;} return null; }
            return a;
          }
          function parseLit() {
            if (str.slice(i,i+4)==='True'){i+=4;return true;}
            if (str.slice(i,i+5)==='False'){i+=5;return false;}
            if (str.slice(i,i+4)==='None'){i+=4;return null;}
            let n=''; while(i<len && /[0-9.\-+eE]/.test(str[i])){n+=str[i];i++;}
            if(n){const v=parseFloat(n);if(!isNaN(v))return v;}
            return undefined;
          }
          return parseVal();
        } catch { return null; }
      }

      function fmtStr(s) {
        var escaped = escapeHtml(s);
        return isRTL(s) ? '<span class="formatted-string" dir="rtl" style="text-align:right;display:block;">' + escaped + '</span>' : '<span class="formatted-string">' + escaped + '</span>';
      }

      function isPrimitiveArrayValue(value) {
        if (Array.isArray(value)) return value.every(isPrimitiveArrayValue);
        return value === null || value === undefined || ['string', 'number', 'boolean'].includes(typeof value);
      }

      function inlineArrayText(value) {
        if (Array.isArray(value)) return '[' + value.map(inlineArrayText).join(', ') + ']';
        if (value === null || value === undefined) return 'null';
        if (typeof value === 'string') return JSON.stringify(value);
        return String(value);
      }

      function compactArrayHtml(value) {
        if (!isPrimitiveArrayValue(value)) return '';
        const text = inlineArrayText(value);
        return text.length <= 200 ? '<span class="formatted-array-inline">' + escapeHtml(text) + '</span>' : '';
      }

      function formatObjectAsHtml(obj) {
        if (Array.isArray(obj)) {
          const compact = compactArrayHtml(obj);
          if (compact) return compact;
          if (!obj.length) return '<span class="formatted-array">[]</span>';
          return '<div class="formatted-array">' + obj.map((item, idx) => {
            let f; if (item===null||item===undefined) f='<span class="formatted-null">null</span>'; else if (typeof item==='object') f=formatObjectAsHtml(item); else if (typeof item==='string') f=fmtStr(item); else f=escapeHtml(String(item));
            return '<div class="formatted-array-item"><span class="formatted-index">['+idx+']</span> '+f+'</div>';
          }).join('') + '</div>';
        }
        const entries = Object.entries(obj);
        if (!entries.length) return '<span class="formatted-object">{}</span>';

        // Group consecutive table-like children so they render side-by-side.
        const groups = [];
        let tableBuffer = [];
        function flushTables() {
          if (!tableBuffer.length) return;
          const cells = tableBuffer.map(({ key, table }) =>
            '<div class="formatted-table-cell"><span class="formatted-key">' + escapeHtml(formatFieldName(key)) + '</span>' + formatMetaTable(table) + '</div>'
          ).join('');
          groups.push('<div class="formatted-table-grid">' + cells + '</div>');
          tableBuffer = [];
        }
        for (const [k, v] of entries) {
          const table = (v && typeof v === 'object') ? normalizeMetaTableValue(v) : null;
          if (table) { tableBuffer.push({ key: k, table: table }); continue; }
          flushTables();
          let f; if(v===null||v===undefined) f='<span class="formatted-null">null</span>'; else if(typeof v==='object') f=formatObjectAsHtml(v); else if(typeof v==='string') f=fmtStr(v); else if(typeof v==='number') f='<span class="formatted-number">'+v+'</span>'; else if(typeof v==='boolean') f='<span class="formatted-boolean">'+v+'</span>'; else f=escapeHtml(String(v));
          groups.push('<div class="formatted-row"><span class="formatted-key">'+escapeHtml(k)+'</span>'+f+'<button class="copy-btn" data-copy-text="'+escapeAttr(String(v??''))+'" title="Copy '+escapeHtml(k)+'">'+COPY_ICON+'</button></div>');
        }
        flushTables();
        return '<div class="formatted-object">' + groups.join('') + '</div>';
      }

      function formatFieldName(name) {
        return name.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
      }

      function metaCellText(value) {
        if (value === undefined || value === null) return '';
        if (typeof value === 'object') {
          try { return JSON.stringify(value); }
          catch { return String(value); }
        }
        return String(value);
      }

      function normalizeMetaTableValue(val) {
        if (Array.isArray(val)) {
          if (val.length === 0 || !val.every(function(r) { return Array.isArray(r); })) return null;
          var colCount = Math.max.apply(null, val.map(function(r) { return r.length; }).concat([0]));
          if (colCount === 0) return null;
          return {
            columns: Array.from({length: colCount}, function(_, i) { return 'Col ' + (i + 1); }),
            rows: val.map(function(r) {
              return Array.from({length: colCount}, function(_, i) { return i < r.length ? r[i] : ''; });
            })
          };
        }

        if (!val || typeof val !== 'object' || !Array.isArray(val.columns) || !Array.isArray(val.rows)) {
          return null;
        }

        var declaredColumns = val.columns.map(function(c) { return String(c == null ? '' : c); });
        var discoveredColumns = declaredColumns.slice();
        var sourceRows = val.rows;
        var colCountObj = declaredColumns.length;
        for (var ri = 0; ri < sourceRows.length; ri++) {
          var row = sourceRows[ri];
          if (Array.isArray(row)) colCountObj = Math.max(colCountObj, row.length);
          else if (row && typeof row === 'object' && declaredColumns.length === 0) {
            Object.keys(row).forEach(function(key) {
              if (!discoveredColumns.includes(key)) discoveredColumns.push(key);
            });
            colCountObj = Math.max(colCountObj, discoveredColumns.length);
          }
          else if (colCountObj === 0) colCountObj = 1;
        }
        if (colCountObj === 0) return null;

        var columns = Array.from({length: colCountObj}, function(_, i) { return discoveredColumns[i] || ('Col ' + (i + 1)); });
        var rows = sourceRows.map(function(row) {
          if (Array.isArray(row)) {
            return Array.from({length: colCountObj}, function(_, i) { return i < row.length ? row[i] : ''; });
          }
          if (row && typeof row === 'object') {
            return columns.map(function(column) {
              return Object.prototype.hasOwnProperty.call(row, column) ? row[column] : '';
            });
          }
          return Array.from({length: colCountObj}, function(_, i) { return i === 0 ? row : ''; });
        });

        return { columns: columns, rows: rows };
      }

      function formatMetaTable(table) {
        var maxRows = 200;
        var visibleRows = table.rows.slice(0, maxRows);
        var hiddenRows = Math.max(table.rows.length - visibleRows.length, 0);
        var headerRow = '<tr>' + table.columns.map(function(column, i) {
          return '<th><button type="button" class="meta-table-sort" data-col-index="' + i + '" aria-sort="none" onclick="sortMetaTable(this)">' + escapeHtml(column) + '</button></th>';
        }).join('') + '</tr>';
        var bodyRows = visibleRows.map(function(r) {
          var cells = table.columns.map(function(_, i) {
            var text = metaCellText(i < r.length ? r[i] : '');
            return '<td data-sort-value="' + escapeAttr(text) + '">' + escapeHtml(text) + '</td>';
          }).join('');
          return '<tr>' + cells + '</tr>';
        }).join('');
        var tableHtml = '<table class="meta-table"><thead>' + headerRow + '</thead><tbody>' + bodyRows + '</tbody></table>';
        var truncatedHtml = hiddenRows > 0
          ? '<div class="meta-table-truncated">Showing first ' + maxRows + ' of ' + table.rows.length + ' rows. ' + hiddenRows + ' rows are not loaded in this page.</div>'
          : '';
        return '<div class="meta-table-wrapper">' + tableHtml + '</div>' + truncatedHtml;
      }

      function formatMetaValue(val) {
        if (val === undefined || val === null || val === '') return '';
        if (typeof val === 'boolean') return escapeHtml(String(val));
        if (typeof val === 'number') return escapeHtml(String(val));
        if (typeof val === 'string') return escapeHtml(val);
        var table = normalizeMetaTableValue(val);
        if (table) return formatMetaTable(table);
        if (Array.isArray(val)) {
          var isFlatPrimitive = val.every(function(v) { return v === null || typeof v !== 'object'; });
          if (isFlatPrimitive) return escapeHtml(val.map(function(v) { return String(v == null ? '' : v); }).join(', '));
          return formatObjectAsHtml(val);
        }
        if (typeof val === 'object') return formatObjectAsHtml(val);
        return escapeHtml(String(val));
      }

      function showToast(type, title, message) {
          const container = el('toast-container');
          if (!container) return;
          const toast = document.createElement('div');
          toast.className = `toast toast-${type}`;
          toast.innerHTML = `
              <div class="toast-icon">${type === 'success' ? '✓' : '✗'}</div>
              <div class="toast-content">
                  <div class="toast-title">${escapeHtml(title)}</div>
                  <div class="toast-message">${escapeHtml(message)}</div>
              </div>
              <button class="toast-close" onclick="this.parentElement.remove()">×</button>
          `;
          container.appendChild(toast);
          setTimeout(() => {
              toast.classList.add('toast-exit');
              setTimeout(() => toast.remove(), 300);
          }, 4000);
      }

      // ── Data loading ──

      async function loadRunData() {
        function syncProjectLinks(project) {
          if (!project || !project.slug) return;
          setHrefIfPresent('back-link-header', projectUrl(project.slug));
          setHrefIfPresent('back-link-error', projectUrl(project.slug));
          setHrefIfPresent('back-link-empty', projectUrl(project.slug));
          setHrefIfPresent('logo-link', projectUrl(project.slug));
          const reviewsLink = el('header-reviews-link');
          if (reviewsLink) reviewsLink.href = projectUrl(project.slug, 'reviews');
        }

        if (window.__QYM_EXPORT_DATA__) {
          var data = window.__QYM_EXPORT_DATA__;
          // Check localStorage for saved edits
          var storageKey = 'qym_export_' + (data.run.file_path || 'unknown');
          try {
            var saved = localStorage.getItem(storageKey);
            if (saved) data = JSON.parse(saved);
          } catch (e) {}
          state.run = data.run;
          state.snapshot = data.snapshot;
          state.langfuseHost = data.run.langfuse_host || '';
          state.langfuseProjectId = data.run.langfuse_project_id || '';
          state._exportStorageKey = storageKey;
          syncProjectLinks(data.run.project);
          processRun();
          render();
          if (IS_EXPORT) applyExportMode();
          return;
        }
        if (!RUN_ID) { showEmpty(); return; }
        try {
          const res = await fetch(apiUrl('api/runs/' + RUN_ID));
          if (!res.ok) { showError('HTTP ' + res.status, 'Could not load run data.'); return; }
          const data = await res.json();
          if (data.error) { showError('Error', data.error); return; }
          if (!data.run || !data.snapshot) { showEmpty(); return; }
          state.run = data.run;
          state.snapshot = data.snapshot;
          state.langfuseHost = data.run.langfuse_host || '';
          state.langfuseProjectId = data.run.langfuse_project_id || '';
          syncProjectLinks(data.run.project);
          processRun();
          render();
        } catch (err) {
          console.error('Failed to load run:', err);
          showError('Network Error', 'Could not connect to the server.');
        }
      }

      function processRun() {
        const run = state.run;
        const snap = state.snapshot;
        state.allMetrics = snap.metric_names || run.metric_names || [];

        // Pass scope: swap every row's reduced metric values AND its
        // output/latency/status/trace for the viewed pass's slice, once, so
        // all downstream consumers follow.
        const samplesTotal = parseInt(run.samples, 10) || 1;
        state.viewPass = (VIEW_PASS && samplesTotal > 1 && VIEW_PASS <= samplesTotal) ? VIEW_PASS : null;
        if (state.viewPass) {
          const metricNames = state.allMetrics;
          snap.rows = (snap.rows || []).map(row => {
            if (!row.pass_scores && !row.pass_attempts) return row;
            const passValues = metricNames.map(name => {
              const scores = (row.pass_scores || {})[name];
              return (Array.isArray(scores) && scores.length >= state.viewPass)
                ? scores[state.viewPass - 1]
                : null;
            });
            const att = Array.isArray(row.pass_attempts) ? row.pass_attempts[state.viewPass - 1] : null;
            return {
              ...row,
              metric_values: passValues,
              ...(att ? {
                status: att.status,
                error: att.error || '',
                output: att.output,
                output_full: att.output,
                latency_ms: att.latency_ms || 0,
                trace_id: att.trace_id || '',
                trace_url: att.trace_url || '',
              } : {}),
            };
          });
          document.body.classList.add('pass-scoped');
        }
        if (state.allMetrics.length > 0 && !state.selectedMetric) {
          state.selectedMetric = state.allMetrics[0];
        }

        // Detect metric types (boolean/score/numeric)
        state.metricTypes = {};
        for (const metricName of state.allMetrics) {
          const mIdx = state.allMetrics.indexOf(metricName);
          const mType = window.QymMetrics.detectMetricType(snap.rows || [], mIdx);
          state.metricTypes[metricName] = mType;
          state.metricIsBoolean[metricName] = (mType === 'boolean');
          if (!state.metricThresholds[metricName]) {
            state.metricThresholds[metricName] = 0.8;
          }
        }

        // Collect metadata
        const metaKeySet = new Set();
        const complexitySet = new Set();
        const domainSet = new Set();
        const rootCauseSet = new Set();
        for (const row of (snap.rows || [])) {
          const md = row.item_metadata || {};
          if (typeof md === 'object') {
            for (const k of Object.keys(md)) { if (k !== 'task_started_at_ms' && k !== 'trace_stats') metaKeySet.add(k); }
            if (md.complexity != null && md.complexity !== '') complexitySet.add(String(md.complexity));
            if (md.domain != null && md.domain !== '') {
              for (const d of parseMetaList(md.domain)) domainSet.add(d);
            }
            if (md.root_cause != null && md.root_cause !== '') rootCauseSet.add(String(md.root_cause));
          }
        }
        state.allMetadataKeys = Array.from(metaKeySet).sort();
        const cOrder = ['easy', 'medium', 'hard'];
        state.complexityValues = Array.from(complexitySet).sort((a, b) => {
          const ai = cOrder.indexOf(a.toLowerCase()); const bi = cOrder.indexOf(b.toLowerCase());
          return (ai===-1?999:ai) - (bi===-1?999:bi);
        });
        state.domainValues = Array.from(domainSet).sort();
        state.rootCauseValues = Array.from(rootCauseSet).sort();

        for (const k of state.allMetadataKeys) {
          if (state.visibleMetadataFields[k] === undefined) state.visibleMetadataFields[k] = true;
        }

        // Auto-select categories for breakdown chips
        // Exclude keys that have their own sections or are not useful for grouping
        const EXCLUDED_CATEGORY_KEYS = new Set(['root_cause', 'root_cause_detail', 'root_cause_note', 'root_cause_source', 'root_cause_confidence', 'solution', 'solution_note', 'solution_source', 'task_started_at_ms', 'retry_count', 'analysis_error', 'trace_stats']);
        const MAX_CARDINALITY = 30; // skip keys with too many unique values
        if (state.selectedCategories.size === 0) {
          for (const k of state.allMetadataKeys) {
            if (EXCLUDED_CATEGORY_KEYS.has(k)) continue;
            // Check cardinality
            const uniqueVals = new Set();
            for (const row of (snap.rows || [])) {
              const v = (row.item_metadata || {})[k];
              if (v != null && v !== '') {
                for (const value of getMetadataCategoryValues(row.item_metadata || {}, k)) uniqueVals.add(value);
              }
            }
            if (uniqueVals.size === 0 || uniqueVals.size > MAX_CARDINALITY) continue;
            // Auto-select first 3 valid categories
            if (state.selectedCategories.size < 3) state.selectedCategories.add(k);
          }
        }

        // Collect metric metadata keys
        const mmKeySet = new Set();
        for (const row of (snap.rows || [])) {
          const mm = row.metric_meta || {};
          for (const metricName of Object.keys(mm)) {
            const meta = mm[metricName] || {};
            for (const k of Object.keys(meta)) {
              if (!['modified', 'original_score'].includes(k)) mmKeySet.add(k);
            }
          }
        }
        state.allMetricMetaKeys = Array.from(mmKeySet).sort();
        for (const k of state.allMetricMetaKeys) {
          if (state.visibleMetricMetaFields[k] === undefined) state.visibleMetricMetaFields[k] = true;
        }

        document.title = '\u0642\u064A\u0651\u0650\u0645 \u2022 ' + (run.run_name || 'Run Detail')
          + (state.viewPass ? ' \u2022 Pass ' + state.viewPass : '');
      }

      function showEmpty() {
        el('loading').style.display = 'none';
        el('empty').style.display = 'flex';
        el('run-content').style.display = 'none';
      }

      function showError(title, msg) {
        el('loading').style.display = 'none';
        el('error-state').style.display = 'flex';
        el('error-title').textContent = title;
        el('error-message').textContent = msg;
        el('run-content').style.display = 'none';
      }

      // ── Rendering ──

      function render() {
        el('loading').style.display = 'none';
        el('empty').style.display = 'none';
        el('error-state').style.display = 'none';
        el('run-content').style.display = 'block';
        renderSummary();
        wireTopActions();
        populateMetricSelectors();
        renderOverview();
        renderSamplesAnalysis();
        buildCategoryDropdowns();
        populateMetadataFieldsDropdown();
        populateMetricMetaFieldsDropdown();
        renderItems();
        // Auto-open trace if ?trace=itemId is in the URL
        if (window.QymTraceViewer) window.QymTraceViewer.restoreFromUrl();
      }

      function renderSummary() {
        const run = state.run;
        const config = run.config || {};
        const metadata = run.metadata || {};
        const statusClass = (run.status || '').toLowerCase();
        const statusText = escapeHtml((run.status || 'unknown').toUpperCase());
        const modelName = run.model_name || config.model || config.model_name || '';
        const runId = run.run_id || RUN_ID || '';
        const taskName = run.task_name || metadata.task_name || config.task || '—';
        const owner = run.owner || {};
        const ownerLabel = owner.display_name || owner.email || owner.id || '—';
        const projectName = (run.project && run.project.name) || run.team_name || '—';
        const startedAt = run.started_at || run.created_at || '';
        const endedAt = run.ended_at || '';
        let runtimeMs = run.duration_ms;
        if ((runtimeMs == null || runtimeMs === '') && startedAt && !endedAt) {
          const startedTime = new Date(startedAt).getTime();
          if (!Number.isNaN(startedTime)) runtimeMs = Date.now() - startedTime;
        }
        const runtimeText = runtimeMs != null ? formatDurationMs(runtimeMs) : '—';
        const versionText = [run.git_branch, run.git_commit].filter(Boolean).join(' • ');

        let langfuseUrl = metadata?.langfuse_url || '';
        if (!langfuseUrl && state.langfuseHost && state.langfuseProjectId) {
          langfuseUrl = state.langfuseHost.replace(/\/$/, '') + '/project/' + state.langfuseProjectId;
        }

        function metaItem(label, value, options) {
          const opts = options || {};
          if (value == null || value === '') return '';
          const text = String(value);
          const classes = ['hero-meta-value'];
          if (opts.mono) classes.push('mono');
          if (opts.nowrap) classes.push('nowrap');
          const contentHtml = opts.html || escapeHtml(text);
          return '<div class="hero-meta-item">' +
            '<div class="hero-meta-label">' + escapeHtml(label) + '</div>' +
            '<div class="' + classes.join(' ') + '" title="' + escapeAttr(text) + '">' + contentHtml + '</div>' +
          '</div>';
        }

        let actionsHtml =
          '<button class="export-html-btn export-html-download" id="export-download-btn" style="display:none;" title="Download a new file with your edits baked in">' +
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>' +
            'Download with Changes' +
          '</button>' +
          '<button class="export-html-btn" id="export-share-btn" title="Download as a shareable HTML file">' +
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>' +
            'Share' +
          '</button>';
        if (langfuseUrl) {
          actionsHtml += '<a href="' + escapeAttr(langfuseUrl) + '" target="_blank" rel="noopener" class="hero-link-btn langfuse">Langfuse &#8599;</a>';
        }

        let ingestWarningHtml = '';
        const ingestIncomplete = metadata.ingest_incomplete;
        if (ingestIncomplete && ingestIncomplete.expected_items != null) {
          const expected = parseInt(ingestIncomplete.expected_items, 10) || 0;
          const received = parseInt(ingestIncomplete.received_items, 10) || 0;
          const missing = Math.max(expected - received, 0);
          ingestWarningHtml =
            '<div class="ingest-warning-banner">' +
              '<svg class="ingest-warning-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>' +
              '<div>' +
                '<div class="ingest-warning-title">Incomplete data</div>' +
                '<div class="ingest-warning-body">' +
                  'The evaluation reported <span class="ingest-count">' + expected + '</span> items, but only ' +
                  '<span class="ingest-count">' + received + '</span> reached the platform ' +
                  '(<span class="ingest-count">' + missing + '</span> missing). ' +
                  'The rows and metrics below cover the received items only — check the eval client’s upload warnings for the rest.' +
                '</div>' +
              '</div>' +
            '</div>';
        }

        const samplesCount = parseInt(run.samples, 10) || 1;
        const metaHtml = [
          metaItem('Samples', samplesCount > 1 ? '×' + samplesCount + ' per item' : '', { mono: true, nowrap: true }),
          metaItem('Task', taskName),
          metaItem('Dataset', run.dataset_name || '—', { html: (window.QymShell && run.dataset_name ? QymShell.identiconHTML(run.dataset_name, { cell: 2, gap: 1, showEmpty: false, chip: true }) : '') + escapeHtml(run.dataset_name || '—') + (window.QymShell ? QymShell.datasetVersionInline(run.dataset_version) + QymShell.datasetAliasTags(run.dataset_aliases) : '') }),
          metaItem('Model', modelName || '—', { html: renderModelLabel(modelName || '—', hasReasoningTraceStats(run.trace_stats)), nowrap: true }),
          metaItem('Owner', ownerLabel === '—' ? '' : ownerLabel),
          metaItem('Project', projectName === '—' ? '' : projectName),
          metaItem('Started', formatIsoDateTime(startedAt), { nowrap: true }),
          metaItem('Runtime', runtimeText, { nowrap: true }),
          metaItem('Version', versionText, { mono: true, nowrap: true }),
        ].filter(Boolean).join('');
        const executionContextHtml = buildExecutionContextSectionHtml();

        const hasPassAttempts = (state.snapshot.rows || [])
          .some(r => Array.isArray(r.pass_attempts) && r.pass_attempts.some(Boolean));
        const passNoticeHtml = state.viewPass
          ? '<div class="pass-scope-banner">' +
              '<strong>Pass ' + state.viewPass + ' of ' + samplesCount + '</strong>' +
              '<span>' + (hasPassAttempts
                ? 'Everything on this page — scores, outputs, latency, traces — is from this pass.'
                : 'Scores on this page are from this pass only. Outputs, latency, and traces show each item’s final attempt.') + '</span>' +
              '<a href="' + escapeAttr(window.location.pathname) + '">View all passes →</a>' +
            '</div>'
          : '';

        el('run-summary').innerHTML = '<div class="run-summary-card">' +
          '<div class="hero-top">' +
            '<div class="hero-identity">' +
              '<div class="hero-eyebrow">Run Detail' + (state.viewPass ? ' · Pass ' + state.viewPass + '/' + samplesCount : '') + '</div>' +
              '<div class="hero-headline">' +
                '<div class="hero-run-name">' + escapeHtml(run.run_name || runId || '—') + '</div>' +
              '</div>' +
            '</div>' +
            '<div class="hero-right">' +
              '<div class="hero-status ' + statusClass + '"><span class="hero-status-dot"></span>' + statusText +
                ((samplesCount > 1 && (statusClass === 'running' || statusClass === 'pending'))
                  ? ' • pass ' + Math.min((parseInt(run.last_completed_pass, 10) || 0) + 1, samplesCount) + '/' + samplesCount
                  : '') +
              '</div>' +
              '<div class="hero-actions">' + actionsHtml + '</div>' +
            '</div>' +
          '</div>' +
          ingestWarningHtml +
          passNoticeHtml +
          '<div class="hero-meta-grid">' + metaHtml + '</div>' +
          executionContextHtml +
        '</div>';
      }

      // ── Repeat runs: pass-centric analysis section (only when samples > 1).
      // Header/boxes follow the standard section anatomy; group-metric tiles
      // reuse the Models/Compare view component (model-stat-item + shared
      // tooltips from QymMetrics.getMetricTooltips) so the three views match.
      async function renderSamplesAnalysis() {
        const container = el('samples-analysis-section');
        if (!container) return;
        const run = state.run || {};
        const samplesCount = parseInt(run.samples, 10) || 1;
        if (samplesCount <= 1 || IS_EXPORT) { container.innerHTML = ''; return; }

        const metricName = state.samplesMetric || state.selectedMetric || state.allMetrics[0] || '';

        let group, passes;
        try {
          const [groupRes, passesRes] = await Promise.all([
            fetch(apiUrl('api/runs/' + RUN_ID + '/group-metrics' + (metricName ? '?metric=' + encodeURIComponent(metricName) : ''))),
            fetch(apiUrl('api/runs/' + RUN_ID + '/passes')),
          ]);
          group = await groupRes.json();
          passes = await passesRes.json();
        } catch (err) {
          container.innerHTML = '';
          return;
        }
        if (!group || group.error || !group.group) { container.innerHTML = ''; return; }

        const g = group.group;
        const groupMetric = group.metric || metricName;
        const thresholdPct = Math.round((group.threshold != null ? group.threshold : 0.8) * 100);
        const isBool = !!state.metricIsBoolean[groupMetric];
        const tooltips = window.QymMetrics.getMetricTooltips(samplesCount, isBool, thresholdPct);
        const fp = v => (typeof v === 'number' ? window.QymMetrics.formatPercent(v) : 'NA');
        const mTypeOf = m => state.metricTypes[m] || 'score';
        const fmtMetric = (v, m) => window.QymMetrics.formatMetricValue(v, mTypeOf(m));
        const groupMetricType = mTypeOf(groupMetric);
        const groupMetricLabel = String(groupMetric || 'Metric')
          .replace(/[_-]+/g, ' ')
          .replace(/\b\w/g, c => c.toUpperCase());

        const passRows = (passes && Array.isArray(passes.passes))
          ? passes.passes.filter(p => p.status !== 'pending')
          : [];
        const latencyRows = passRows.filter(p => typeof p.avg_latency_ms === 'number' && (p.items_scored || 0) > 0);
        const latencyItemCount = latencyRows.reduce((sum, p) => sum + (p.items_scored || 0), 0);
        const aggregateAvgLatency = latencyItemCount > 0
          ? latencyRows.reduce((sum, p) => sum + (p.avg_latency_ms * (p.items_scored || 0)), 0) / latencyItemCount
          : run.avg_latency_ms;
        const aggregateErrors = passRows.reduce((sum, p) => sum + (p.error_count || 0), 0);

        // Same finished tile component used by the Models summary cards.
        function statTile(title, value, tooltip, options = {}) {
          const scoreEncoded = options.scoreEncoded !== false;
          const cls = options.valueClass || ((scoreEncoded && typeof value === 'number') ? getSuccessClass(value) : '');
          const display = options.format ? options.format(value) : fp(value);
          return '<div class="model-stat-box">' +
            '<div class="stat-title">' + title + (tooltip ? ' ' + infoIcon(tooltip) : '') + '</div>' +
            '<div class="stat-main ' + cls + '">' + display + '</div>' +
          '</div>';
        }
        const tilesHtml = [
          statTile('Pass@' + samplesCount, g.pass_at_k, tooltips.passAtK),
          statTile('Pass^' + samplesCount, g.pass_hat_k, tooltips.passHatK),
          statTile('Consistency', g.consistency, tooltips.consistency),
          statTile('Reliability', g.reliability, tooltips.reliability),
          statTile('Avg Score', g.avg_at_k, tooltips.avgScore, {
            scoreEncoded: groupMetricType !== 'numeric',
            format: v => fmtMetric(v, groupMetric),
          }),
          statTile('Errors', aggregateErrors, 'Number of item evaluations that returned an error across all passes.', {
            scoreEncoded: false,
            valueClass: aggregateErrors > 0 ? 'failed-count' : '',
            format: v => String(v || 0),
          }),
          statTile('Avg Latency', aggregateAvgLatency, tooltips.avgLatency, {
            scoreEncoded: false,
            format: v => formatLatency(v),
          }),
        ].join('');

        const metricTabsHtml = state.allMetrics.map(m =>
          '<button type="button" role="tab" class="samples-metric-tab' + (m === groupMetric ? ' active' : '') + '" ' +
            'data-samples-metric="' + escapeAttr(m) + '" aria-selected="' + (m === groupMetric) + '">' + escapeHtml(m) + '</button>'
        ).join('');

        const ratioColorCls = v => (typeof v === 'number' ? window.QymMetrics.getMetricColorClass(v, 'score') : '');
        const metricColorCls = (v, m) => (typeof v === 'number' ? window.QymMetrics.getMetricColorClass(v, mTypeOf(m)) : '');

        // Pass sweep table: every metric + latency stats per pass.
        let sweepHtml = '';
        if (passes && Array.isArray(passes.passes)) {
          const metricCols = passes.metrics || [];
          const visible = passRows;
          const queued = passes.passes.length - visible.length;
          const latCell = v => (typeof v === 'number' ? (v / 1000).toFixed(2) + 's' : '—');
          const bodyRows = visible.map(p => {
            const metricCells = metricCols.map(m => {
              const v = (p.metric_means || {})[m];
              if (typeof v !== 'number') return '<td class="sw-num"><span class="sw-val empty">—</span></td>';
              const mType = mTypeOf(m);
              const cls = metricColorCls(v, m);
              const pct = Math.round(Math.max(0, Math.min(1, v)) * 100);
              return '<td class="sw-num"><span class="sw-val ' + cls + '">' + fmtMetric(v, m) + '</span>' +
                (mType === 'numeric' ? '' : '<span class="sw-meter ' + cls + '"><i style="width:' + pct + '%"></i></span>') + '</td>';
            }).join('');
            const errs = p.error_count || 0;
            return '<tr' + (state.viewPass === p.pass_number ? ' class="sw-current"' : '') + '>' +
              '<td class="sw-pass"><span class="sp-dot ' + escapeHtml(p.status || '') + '"></span><span>Pass ' + p.pass_number + ' of ' + passes.samples + '</span></td>' +
              metricCells +
              '<td class="sw-num sw-dim">' + latCell(p.avg_latency_ms) + '</td>' +
              '<td class="sw-num sw-dim">' + latCell(p.median_latency_ms) + '</td>' +
              '<td class="sw-num sw-dim">' + latCell(p.p95_latency_ms) + '</td>' +
              '<td class="sw-num ' + (errs > 0 ? 'sw-err' : 'sw-dim') + '">' + errs + '</td>' +
              '<td class="sw-num sw-dim">' + (p.items_scored || 0) + '</td>' +
            '</tr>';
          }).join('');
          const queuedRow = queued > 0
            ? '<tr><td colspan="' + (6 + metricCols.length) + '" class="sw-queued">' + (queued === 1
                ? 'Pass ' + passes.passes.length + ' of ' + passes.samples + ' queued'
                : 'Passes ' + (passes.passes.length - queued + 1) + '–' + passes.passes.length + ' of ' + passes.samples + ' queued') + '</td></tr>'
            : '';
          sweepHtml =
            '<div class="samples-sweep-wrap">' +
              '<table class="samples-sweep">' +
                '<thead><tr>' +
                  '<th>Pass</th>' +
                  metricCols.map(m => '<th class="sw-num-h">' + escapeHtml(m) + '</th>').join('') +
                  '<th class="sw-num-h">⚡ Avg Latency</th><th class="sw-num-h">⚡ Median Latency</th><th class="sw-num-h">P95 Latency</th><th class="sw-num-h">Errors</th><th class="sw-num-h">Items</th>' +
                '</tr></thead>' +
                '<tbody>' + bodyRows + queuedRow + '</tbody>' +
              '</table>' +
            '</div>';
        }

        // Accuracy-vs-k: chart with a table toggle. All k <= samples computed
        // on demand from the stored passes.
        const band = group.band || {};
        const ks = Object.keys(band).map(Number).sort((a, b) => a - b);
        function curveChartHtml() {
          if (ks.length < 2) return '';
          const W = 620, H = 180, PADL = 44, PADR = 14, PADT = 10, PADB = 26;
          const x = k => PADL + ((k - ks[0]) / (ks[ks.length - 1] - ks[0])) * (W - PADL - PADR);
          const y = v => (H - PADB) - Math.max(0, Math.min(1, v)) * (H - PADT - PADB);
          const pts = key => ks.map(k => x(k).toFixed(1) + ' ' + y(band[k][key]).toFixed(1));
          const line = key => pts(key).map((p, i) => (i === 0 ? 'M' : 'L') + p).join(' ');
          const area = 'M' + pts('pass_at_k').join(' L') +
            ' L' + x(ks[ks.length - 1]).toFixed(1) + ' ' + (H - PADB) +
            ' L' + x(ks[0]).toFixed(1) + ' ' + (H - PADB) + ' Z';
          const dots = (key, color) => ks.map(k =>
            '<circle cx="' + x(k).toFixed(1) + '" cy="' + y(band[k][key]).toFixed(1) + '" r="4.5" fill="var(--bg-surface)" stroke="' + color + '" stroke-width="2"></circle>'
          ).join('');
          const gridline = (v, label) =>
            '<line x1="' + PADL + '" y1="' + y(v) + '" x2="' + (W - PADR) + '" y2="' + y(v) + '" stroke="var(--border-subtle)"' + (v !== 0 ? ' stroke-dasharray="3 5"' : '') + '/>' +
            '<text x="' + (PADL - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end" class="samples-curve-axis">' + label + '</text>';
          return '<svg viewBox="0 0 ' + W + ' ' + H + '" class="samples-curve" role="img" aria-label="' + escapeAttr(groupMetricLabel) + ' versus k">' +
              [[1.0, '100%'], [0.75, '75%'], [0.5, '50%'], [0.25, '25%'], [0.0, '0%']].map(p => gridline(p[0], p[1])).join('') +
              '<path d="' + area + '" fill="var(--success-dim)"/>' +
              '<g stroke="var(--warning)" fill="none" stroke-width="1.8" stroke-dasharray="5 4" stroke-linecap="round"><path d="' + line('pass_hat_k') + '"/></g>' +
              '<g stroke="var(--accent-primary)" fill="none" stroke-width="2.2" stroke-linecap="round"><path d="' + line('pass_at_k') + '"/></g>' +
              dots('pass_hat_k', 'var(--warning)') +
              dots('pass_at_k', 'var(--accent-primary)') +
              ks.map(k => '<text x="' + x(k).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle" class="samples-curve-axis">k=' + k + '</text>').join('') +
            '</svg>';
        }
        function curveTableHtml() {
          if (!ks.length) return '';
          const rows = ks.map(k =>
            '<tr>' +
              '<td class="sw-pass">k=' + k + '</td>' +
              '<td class="sw-num"><span class="sw-val ' + ratioColorCls(band[k].pass_at_k) + '">' + fp(band[k].pass_at_k) + '</span></td>' +
              '<td class="sw-num"><span class="sw-val ' + ratioColorCls(band[k].pass_hat_k) + '">' + fp(band[k].pass_hat_k) + '</span></td>' +
            '</tr>'
          ).join('');
          return '<table class="samples-sweep samples-band-table">' +
            '<thead><tr><th>k</th>' +
            '<th class="sw-num-h">Pass@k ' + infoIcon('If the task got k tries, how often would at least one pass? Computed from all ' + samplesCount + ' stored passes (unbiased estimator).') + '</th>' +
            '<th class="sw-num-h">Pass^k ' + infoIcon('If the task got k tries, how often would ALL k pass? The reliability counterpart of Pass@k.') + '</th>' +
            '</tr></thead><tbody>' + rows + '</tbody></table>';
        }
        const curveBlock = () => {
          const mode = state.samplesCurveView || 'chart';
          const legend = mode === 'chart'
            ? '<div class="samples-legend">' +
                '<span class="samples-legend-chip"><span class="samples-legend-swatch at"></span>Pass@k</span>' +
                '<span class="samples-legend-chip"><span class="samples-legend-swatch hat"></span>Pass^k</span>' +
              '</div>'
            : '';
          return '<div class="samples-curve-head">' +
              '<div class="samples-zone-title">' + escapeHtml(groupMetricLabel) + ' vs k</div>' +
              '<div class="samples-curve-controls">' + legend +
                '<div class="samples-view-toggle">' +
                  '<button type="button" class="samples-view-btn' + (mode === 'chart' ? ' active' : '') + '" data-view="chart" aria-pressed="' + (mode === 'chart') + '">Chart</button>' +
                  '<button type="button" class="samples-view-btn' + (mode === 'table' ? ' active' : '') + '" data-view="table" aria-pressed="' + (mode === 'table') + '">Table</button>' +
                '</div>' +
              '</div>' +
            '</div>' +
            (mode === 'chart'
              ? '<div class="samples-chart-body">' + curveChartHtml() + '</div>'
              : curveTableHtml());
        };

        // Correct distribution — the same horizontal segmented bar used by
        // Models/Compare, with an explicit breakdown for small/empty buckets.
        const dist = Array.isArray(group.distribution) ? group.distribution : null;
        function distChartHtml() {
          const total = dist.reduce((a, b) => a + b, 0) || 1;
          const segments = dist.map((count, n) => {
            if (count === 0) return '';
            const cls = n === 0 ? 'dist-zero' : (n === dist.length - 1 ? 'dist-all' : 'dist-partial');
            const pct = Math.round((count / total) * 100);
            return '<div class="dist-segment ' + cls + '" style="flex:' + count + '" title="' + n + ' of ' + samplesCount + ' passes correct: ' + count + ' items (' + pct + '%)">' +
              '<span class="dist-label">' + n + '/' + samplesCount + '</span>' +
              '<span class="dist-count">' + count + '</span>' +
            '</div>';
          }).join('');
          const breakdown = dist.map((count, n) => {
            const cls = n === 0 ? 'dist-zero' : (n === dist.length - 1 ? 'dist-all' : 'dist-partial');
            const pct = Math.round((count / total) * 100);
            return '<div class="samples-dist-item' + (count === 0 ? ' empty' : '') + '">' +
              '<span class="samples-dist-dot ' + cls + '"></span>' +
              '<span class="samples-dist-label">' + n + ' of ' + samplesCount + ' correct</span>' +
              '<span class="samples-dist-value">' + count + ' ' + (count === 1 ? 'item' : 'items') + ' · ' + pct + '%</span>' +
            '</div>';
          }).join('');
          return '<div class="distribution-bar samples-dist-bar" aria-label="Distribution of items by correct passes">' + segments + '</div>' +
            '<div class="samples-dist-breakdown">' + breakdown + '</div>';
        }
        const distBlockHtml = (dist && dist.length > 1)
          ? '<div class="samples-chart-block samples-sweep-wrap">' +
              '<div class="samples-curve-head">' +
                '<div class="samples-zone-title">Correct Distribution ' + infoIcon('How many of the ' + samplesCount + ' passes got each item correct (score ' + (isBool ? '= 100%' : '&ge;' + thresholdPct + '%') + '). Items at 0 never passed, items at ' + samplesCount + ' always passed — columns in between are flaky items. Same distribution as the Compare and Models views.') + '</div>' +
              '</div>' +
              '<div class="samples-chart-body">' + distChartHtml() + '</div>' +
            '</div>'
          : '';

        container.innerHTML =
          '<div class="overview-header">' +
            '<div><h3 class="section-title">Repeat Run Analysis</h3>' +
            '<div class="overview-header-hint">Every item was evaluated ' + samplesCount + 'x in this run. Select the metric summarized across all ' + samplesCount + ' passes.</div></div>' +
          '</div>' +
          '<div class="samples-metric-row">' +
            '<div class="samples-metric-tabs" role="tablist" aria-label="Repeat run aggregate metric">' + metricTabsHtml + '</div>' +
            '<div class="samples-metric-threshold"><span>Pass threshold</span><strong>&ge;' + thresholdPct + '%</strong></div>' +
          '</div>' +
          '<div class="samples-group-tiles">' + tilesHtml + '</div>' +
          sweepHtml +
          '<div class="samples-charts-row">' +
            '<div class="samples-chart-block samples-sweep-wrap" id="samples-curve-block">' + curveBlock() + '</div>' +
            distBlockHtml +
          '</div>';

        const blockEl = el('samples-curve-block');
        container.querySelectorAll('.samples-metric-tab').forEach(btn => {
          btn.addEventListener('click', () => {
            const nextMetric = btn.dataset.samplesMetric;
            if (!nextMetric || nextMetric === groupMetric) return;
            state.samplesMetric = nextMetric;
            renderSamplesAnalysis();
          });
        });
        function wireCurveToggle() {
          blockEl.querySelectorAll('.samples-view-btn').forEach(btn => {
            btn.addEventListener('click', () => {
              state.samplesCurveView = btn.dataset.view;
              blockEl.innerHTML = curveBlock();
              wireCurveToggle();
            });
          });
        }
        if (blockEl) wireCurveToggle();
      }

      function wireTopActions() {
        const shareBtn = el('export-share-btn');
        if (shareBtn && !shareBtn.dataset.boundShare && !IS_EXPORT) {
          shareBtn.dataset.boundShare = '1';
          shareBtn.addEventListener('click', function() {
            const runId = state.run?.file_path || RUN_ID;
            if (!runId) return;
            window.open(apiUrl('api/runs/' + runId + '/export-html'), '_blank');
          });
        }

        const dlBtn = el('export-download-btn');
        if (dlBtn && !dlBtn.dataset.boundDownload) {
          dlBtn.dataset.boundDownload = '1';
          dlBtn.addEventListener('click', downloadExportHtml);
        }
      }

      function buildExecutionContextSectionHtml() {
        const run = state.run || {};
        const config = run.config || {};
        const metadata = run.metadata || {};
        const hiddenConfigKeys = new Set([
          'run_name', 'task_name', 'task', 'git_branch', 'git_commit',
          'model', 'model_name', 'dataset', 'dataset_name',
          'max_metric_concurrency', 'MAX_METRIC_CONCURRENCY'
        ]);
        const hiddenMetadataKeys = new Set([
          'langfuse_url', 'langfuse_host', 'langfuse_project_id', 'trace_stats',
          'snapshot', 'rows', 'metric_names', 'task_name', 'model',
          'model_name', 'dataset', 'dataset_name', 'total_items',
          'git_branch', 'git_commit', 'ingest_incomplete'
        ]);
        const colors = ['var(--accent-primary)', 'var(--accent-secondary)', 'var(--accent-tertiary)', 'var(--chart-4)', 'var(--chart-5)'];
        const entries = [];
        const seenKeys = new Set();

        Object.entries(config).forEach(([key, value]) => {
          if (hiddenConfigKeys.has(key) || value == null || value === '') return;
          seenKeys.add(String(key).toLowerCase());
          entries.push({ key: key, value: stringify(value), group: 'Config' });
        });

        Object.entries(metadata).forEach(([key, value]) => {
          if (hiddenMetadataKeys.has(key) || value == null || value === '') return;
          if (seenKeys.has(String(key).toLowerCase())) return;
          entries.push({ key: key, value: stringify(value), group: 'Metadata' });
        });

        if (!entries.length) {
          return '';
        }

        const cellsHtml = entries.map((entry, index) => {
          const color = colors[index % colors.length];
          const keyLabel = formatFieldLabel(entry.key);
          const sourceLabel = entry.group === 'Metadata' ? 'Metadata' : 'Config';
          return '<div class="context-cell">' +
            '<span class="context-cell-dot" style="background:' + color + '"></span>' +
            '<div class="context-cell-text">' +
              '<div class="context-cell-key">' + escapeHtml(keyLabel + ' • ' + sourceLabel) + '</div>' +
              '<div class="context-cell-val" title="' + escapeAttr(entry.value) + '">' + escapeHtml(entry.value) + '</div>' +
            '</div>' +
          '</div>';
        }).join('');

        return '<div class="context-section">' +
          '<div class="context-grid">' + cellsHtml + '</div>' +
        '</div>';
      }

      function populateMetricSelectors() {
        const singleMetric = state.allMetrics.length <= 1;

        // Threshold slider (in filter panel)
        const thresholdSlider = el('threshold-slider');
        if (thresholdSlider) {
          thresholdSlider.addEventListener('input', (e) => {
            const v = parseFloat(e.target.value);
            el('threshold-value').textContent = v + '%';
          });
          thresholdSlider.addEventListener('change', (e) => {
            const v = parseFloat(e.target.value);
            if (!isNaN(v) && v >= 0 && v <= 100) {
              state.metricThresholds[state.selectedMetric] = v / 100;
              renderOverview();
              state.page = 1;
              renderItems();
            }
          });
        }
        updateThresholdControl();

        // Items metric select
        const sel = el('items-metric-select');
        const grp = el('fp-metric-group');
        if (sel) {
          if (singleMetric) {
            if (grp) grp.style.display = 'none';
          } else {
            if (grp) grp.style.display = '';
            sel.innerHTML = state.allMetrics.map(m =>
              '<option value="' + escapeAttr(m) + '" ' + (m === state.selectedMetric ? 'selected' : '') + '>' + escapeHtml(m) + '</option>'
            ).join('');
            sel.addEventListener('change', (e) => {
              state.selectedMetric = e.target.value;
              state.scoreDistFilter = null;
              state.page = 1;
              updateThresholdControl();
              renderItems();
            });
          }
        }
      }

      function updateThresholdControl() {
        const tg = el('fp-threshold-group');
        const ts = el('threshold-slider');
        const tv = el('threshold-value');
        if (!tg || !ts) return;
        const metric = state.selectedMetric;
        const mType = state.metricTypes?.[metric];
        if (!metric || state.metricIsBoolean[metric] || mType === 'numeric') {
          tg.style.display = 'none';
        } else {
          tg.style.display = '';
          const pct = Math.round((state.metricThresholds[metric] ?? 0.8) * 100);
          ts.value = pct;
          if (tv) tv.textContent = pct + '%';
        }
      }


      function computeScoreDistribution(metric, rowsOverride = null) {
        const rows = Array.isArray(rowsOverride) ? rowsOverride : (state.snapshot.rows || []);
        const mIdx = state.allMetrics.indexOf(metric);
        if (mIdx < 0) return [];
        const buckets = new Array(11).fill(0); // 0%, 10%, 20%, ..., 100%
        for (const row of rows) {
          const { score } = window.QymMetrics.getRowScore(row, mIdx);
          if (score === null) continue;
          const pct = Math.round(score * 100);
          const bucket = Math.min(10, Math.floor(pct / 10));
          buckets[bucket]++;
        }
        return buckets;
      }

      function getDistSegmentColor(bucketIdx) {
        // Per-bucket gradient using qym score palette (0%=red -> 100%=green)
        const colors = [
          'var(--score-1)',    // 0%
          'var(--score-1)',    // 10%
          '#f97316',           // 20%
          'var(--score-2)',    // 30%
          '#d4a017',           // 40%
          'var(--score-3)',    // 50%
          '#a3b818',           // 60%
          'var(--score-4)',    // 70%
          'var(--score-4)',    // 80%
          'var(--score-5)',    // 90%
          'var(--accent-primary)', // 100%
        ];
        return colors[Math.min(bucketIdx, colors.length - 1)];
      }

      function buildLatencyBuckets(latencies) {
        if (!latencies || latencies.length === 0) return [];
        const sorted = [...latencies].sort((a, b) => a - b);
        const minMs = sorted[0];
        const maxMs = sorted[sorted.length - 1];
        if (maxMs - minMs < 1) {
          return [{ label: formatLatBucketLabel(0, null), min: 0, max: Infinity, color: 'var(--accent-primary)' }];
        }

        // Fixed-interval buckets: 10 equal-width buckets up to P95,
        // plus an 11th open-ended tail bucket for everything beyond
        const p95Idx = Math.floor(0.95 * (sorted.length - 1));
        const capMs = sorted[p95Idx];

        // Pick a nice interval that gives exactly 10 buckets
        const rawInterval = capMs / 10;
        let interval;
        if (rawInterval <= 100) interval = Math.max(10, Math.ceil(rawInterval / 10) * 10);
        else if (rawInterval <= 500) interval = Math.ceil(rawInterval / 50) * 50;
        else if (rawInterval <= 2000) interval = Math.ceil(rawInterval / 250) * 250;
        else if (rawInterval <= 5000) interval = Math.ceil(rawInterval / 1000) * 1000;
        else if (rawInterval <= 20000) interval = Math.ceil(rawInterval / 2000) * 2000;
        else if (rawInterval <= 60000) interval = Math.ceil(rawInterval / 5000) * 5000;
        else interval = Math.ceil(rawInterval / 10000) * 10000;

        // Build exactly 10 edges, then add tail
        const buckets = [];
        for (let i = 0; i < 10; i++) {
          const bMin = i * interval;
          const bMax = (i + 1) * interval;
          buckets.push({ min: bMin, max: bMax, label: formatLatBucketLabel(bMin, bMax) });
        }
        // 11th bucket: everything beyond
        const tailMin = 10 * interval;
        buckets.push({ min: tailMin, max: Infinity, label: formatLatBucketLabel(tailMin, null) });

        if (buckets.length === 0) {
          buckets.push({ min: 0, max: Infinity, label: 'all' });
        }

        // Assign colors: gradient green → red
        const colorStops = ['var(--score-5)', 'var(--score-4)', 'var(--score-3)', 'var(--score-2)', 'var(--score-1)'];
        for (let i = 0; i < buckets.length; i++) {
          const t = buckets.length > 1 ? i / (buckets.length - 1) : 0;
          const ci = Math.min(colorStops.length - 1, Math.round(t * (colorStops.length - 1)));
          buckets[i].color = colorStops[ci];
        }
        return buckets;
      }

      function formatLatBucketLabel(minMs, maxMs) {
        const fmt = (ms) => {
          if (ms >= 60000) return (ms / 60000).toFixed(ms % 60000 === 0 ? 0 : 1) + 'm';
          if (ms >= 1000) return (ms / 1000).toFixed(ms % 1000 === 0 ? 0 : 1) + 's';
          return ms + 'ms';
        };
        if (maxMs === null) return fmt(minMs) + '+';
        return fmt(minMs) + '-' + fmt(maxMs);
      }

      function riScoreColor(value) {
        if (value >= 0.9) return 'var(--score-5)';
        if (value >= 0.75) return 'var(--score-4)';
        if (value >= 0.6) return 'var(--score-3)';
        if (value >= 0.4) return 'var(--score-2)';
        return 'var(--score-1)';
      }

      function riMean(values) {
        return values.length ? values.reduce((sum, value) => sum + value, 0) / values.length : 0;
      }

      function riStdDev(values) {
        if (values.length < 2) return 0;
        const mean = riMean(values);
        return Math.sqrt(values.reduce((sum, value) => sum + Math.pow(value - mean, 2), 0) / values.length);
      }

      function riPearson(pairs) {
        if (pairs.length < 2) return null;
        const xs = pairs.map(pair => pair[0]);
        const ys = pairs.map(pair => pair[1]);
        const mx = riMean(xs), my = riMean(ys);
        let numerator = 0, dx = 0, dy = 0;
        for (let i = 0; i < pairs.length; i++) {
          const x = xs[i] - mx, y = ys[i] - my;
          numerator += x * y;
          dx += x * x;
          dy += y * y;
        }
        return dx > 0 && dy > 0 ? numerator / Math.sqrt(dx * dy) : null;
      }

      function riScale(value, domainMin, domainMax, rangeMin, rangeMax) {
        if (domainMax === domainMin) return (rangeMin + rangeMax) / 2;
        return rangeMin + ((value - domainMin) / (domainMax - domainMin)) * (rangeMax - rangeMin);
      }

      function riMetricSeries(rows) {
        return state.allMetrics.map((name, metricIndex) => {
          const points = [];
          rows.forEach((row, rowIndex) => {
            const parsed = window.QymMetrics.getRowScore(row, metricIndex);
            if (parsed.score !== null) points.push({ row, rowIndex, value: parsed.score });
          });
          const values = points.map(point => point.value);
          return {
            name,
            metricIndex,
            type: state.metricTypes[name] || 'score',
            points,
            min: values.length ? Math.min(...values) : 0,
            max: values.length ? Math.max(...values) : 1,
          };
        }).filter(series => series.points.length > 0);
      }

      function buildRunIntelligenceCharts(rows) {
        const series = riMetricSeries(rows);
        if (!series.length || !rows.length) return '';
        const chartColors = ['var(--chart-1)', 'var(--chart-2)', 'var(--chart-3)', 'var(--chart-4)', 'var(--chart-5)'];
        const panels = [];

        // Item x metric matrix: every available score, no aggregation hidden.
        {
          const left = 96, top = 10, bottom = 32, cellH = 22;
          const width = Math.max(720, left + rows.length * 18 + 18);
          const height = top + series.length * cellH + bottom;
          const cellW = (width - left - 18) / rows.length;
          const labelEvery = Math.max(1, Math.ceil(rows.length / 18));
          let svg = '';
          series.forEach((metric, metricRow) => {
            const y = top + metricRow * cellH;
            svg += '<text x="' + (left - 10) + '" y="' + (y + cellH / 2 + 4) + '" text-anchor="end" class="ri-label">' + escapeHtml(metric.name) + '</text>';
            rows.forEach((row, rowIndex) => {
              const parsed = window.QymMetrics.getRowScore(row, metric.metricIndex);
              const x = left + rowIndex * cellW;
              const rawValue = parsed.score;
              const normalized = rawValue === null ? null : (metric.type === 'numeric'
                ? (metric.max === metric.min ? 0.5 : (rawValue - metric.min) / (metric.max - metric.min))
                : Math.max(0, Math.min(1, rawValue)));
              const fill = normalized === null ? 'var(--bg-active)' : riScoreColor(normalized);
              const display = rawValue === null ? 'No score' : window.QymMetrics.formatMetricValue(rawValue, metric.type);
              svg += '<rect x="' + (x + 0.5).toFixed(1) + '" y="' + (y + 0.5) + '" width="' + Math.max(1, cellW - 1).toFixed(1) + '" height="' + (cellH - 1) + '" rx="1.5" fill="' + fill + '"' + (normalized === null ? ' opacity="0.35"' : '') + '>' +
                '<title>' + escapeHtml((row.item_id || ('Item ' + (rowIndex + 1))) + ' · ' + metric.name + ': ' + display) + '</title></rect>';
            });
          });
          rows.forEach((row, rowIndex) => {
            if (rowIndex % labelEvery !== 0 && rowIndex !== rows.length - 1) return;
            const x = left + rowIndex * cellW + cellW / 2;
            svg += '<text x="' + x.toFixed(1) + '" y="' + (height - 20) + '" text-anchor="end" transform="rotate(-40 ' + x.toFixed(1) + ' ' + (height - 20) + ')" class="ri-data-label">#' + (row.index != null ? row.index + 1 : rowIndex + 1) + '</text>';
          });
          panels.push('<div class="ri-panel matrix">' +
            '<div class="ri-panel-head"><div><div class="ri-panel-title">Item Performance Matrix</div>' +
            '<div class="ri-panel-copy">Every item across every metric. Vertical patterns reveal consistently hard items; horizontal patterns reveal metric disagreement.</div></div>' +
            '<div class="ri-panel-stat">' + rows.length + ' × ' + series.length + '</div></div>' +
            '<div class="ri-chart-scroll"><svg class="ri-chart" style="min-width:' + width + 'px" viewBox="0 0 ' + width + ' ' + height + '" role="img" aria-label="Item by metric performance matrix">' + svg + '</svg></div>' +
          '</div>');
        }

        // Correlation matrix plus a direct scatter for the strongest relationship.
        if (series.length > 1) {
          const correlations = [];
          for (let i = 0; i < series.length; i++) {
            correlations[i] = [];
            for (let j = 0; j < series.length; j++) {
              const byRow = new Map(series[i].points.map(point => [point.rowIndex, point.value]));
              const pairs = series[j].points.filter(point => byRow.has(point.rowIndex)).map(point => [byRow.get(point.rowIndex), point.value]);
              correlations[i][j] = { value: i === j ? 1 : riPearson(pairs), pairs };
            }
          }
          const cellW = 96, cellH = 28;
          const left = 100, top = 50;
          const width = left + series.length * cellW + 18;
          const height = top + series.length * cellH + 18;
          let svg = '';
          series.forEach((metric, index) => {
            const pos = left + index * cellW + cellW / 2;
            svg += '<text x="' + pos + '" y="' + (top - 12) + '" text-anchor="end" transform="rotate(-38 ' + pos + ' ' + (top - 12) + ')" class="ri-label">' + escapeHtml(metric.name) + '</text>';
            svg += '<text x="' + (left - 10) + '" y="' + (top + index * cellH + cellH / 2 + 4) + '" text-anchor="end" class="ri-label">' + escapeHtml(metric.name) + '</text>';
          });
          let strongest = null;
          for (let i = 0; i < series.length; i++) {
            for (let j = 0; j < series.length; j++) {
              const corr = correlations[i][j].value;
              const x = left + j * cellW, y = top + i * cellH;
              const opacity = corr === null ? 0.12 : 0.18 + Math.abs(corr) * 0.72;
              const fill = corr !== null && corr < 0 ? 'var(--chart-3)' : 'var(--chart-1)';
              const label = corr === null ? '—' : corr.toFixed(2);
              svg += '<rect x="' + (x + 1) + '" y="' + (y + 1) + '" width="' + (cellW - 2) + '" height="' + (cellH - 2) + '" rx="3" fill="' + fill + '" fill-opacity="' + opacity.toFixed(2) + '"><title>' + escapeHtml(series[i].name + ' vs ' + series[j].name + ': r=' + label) + '</title></rect>' +
                '<text x="' + (x + cellW / 2) + '" y="' + (y + cellH / 2 + 4) + '" text-anchor="middle" class="ri-cell-value">' + label + '</text>';
              if (i < j && corr !== null && (!strongest || Math.abs(corr) > Math.abs(strongest.corr))) {
                strongest = { i, j, corr, pairs: correlations[i][j].pairs };
              }
            }
          }
          panels.push('<div class="ri-panel"><div class="ri-panel-head"><div><div class="ri-panel-title">Metric Correlation</div>' +
            '<div class="ri-panel-copy">Pearson correlation across matched items. Strong negatives expose metric tradeoffs; strong positives expose overlap.</div></div></div>' +
            '<div class="ri-chart-scroll"><svg class="ri-chart ri-chart-square" viewBox="0 0 ' + width + ' ' + height + '" role="img" aria-label="Metric correlation matrix">' + svg + '</svg></div></div>');

          if (strongest && strongest.pairs.length > 1) {
            const xSeries = series[strongest.i], ySeries = series[strongest.j];
            const W = 620, H = 220, L = 52, R = 16, T = 14, B = 40;
            const xVals = strongest.pairs.map(pair => pair[0]), yVals = strongest.pairs.map(pair => pair[1]);
            const xMin = Math.min(...xVals), xMax = Math.max(...xVals), yMin = Math.min(...yVals), yMax = Math.max(...yVals);
            let marks = '<line x1="' + L + '" y1="' + (H - B) + '" x2="' + (W - R) + '" y2="' + (H - B) + '" class="ri-axis"/>' +
              '<line x1="' + L + '" y1="' + T + '" x2="' + L + '" y2="' + (H - B) + '" class="ri-axis"/>';
            strongest.pairs.forEach((pair, index) => {
              const x = riScale(pair[0], xMin, xMax, L, W - R);
              const y = riScale(pair[1], yMin, yMax, H - B, T);
              marks += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="5" fill="var(--chart-1)" stroke="var(--bg-surface)" stroke-width="2"><title>Matched item ' + (index + 1) + ' · ' + escapeHtml(xSeries.name) + ': ' + escapeHtml(window.QymMetrics.formatMetricValue(pair[0], xSeries.type)) + ' · ' + escapeHtml(ySeries.name) + ': ' + escapeHtml(window.QymMetrics.formatMetricValue(pair[1], ySeries.type)) + '</title></circle>';
            });
            marks += '<text x="' + ((L + W - R) / 2) + '" y="' + (H - 10) + '" text-anchor="middle" class="ri-label">' + escapeHtml(xSeries.name) + '</text>' +
              '<text x="16" y="' + ((T + H - B) / 2) + '" text-anchor="middle" transform="rotate(-90 16 ' + ((T + H - B) / 2) + ')" class="ri-label">' + escapeHtml(ySeries.name) + '</text>' +
              '<text x="' + L + '" y="' + (H - B + 18) + '" class="ri-data-label">' + escapeHtml(window.QymMetrics.formatMetricValue(xMin, xSeries.type)) + '</text>' +
              '<text x="' + (W - R) + '" y="' + (H - B + 18) + '" text-anchor="end" class="ri-data-label">' + escapeHtml(window.QymMetrics.formatMetricValue(xMax, xSeries.type)) + '</text>';
            panels.push('<div class="ri-panel half"><div class="ri-panel-head"><div><div class="ri-panel-title">Strongest Metric Relationship</div>' +
              '<div class="ri-panel-copy">' + escapeHtml(xSeries.name) + ' versus ' + escapeHtml(ySeries.name) + ', item by item.</div></div><div class="ri-panel-stat">r ' + strongest.corr.toFixed(2) + '</div></div>' +
              '<svg class="ri-chart ri-chart-plot" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Scatter plot of the strongest metric relationship">' + marks + '</svg></div>');
          }
        }

        const repeatSeries = series.filter(metric => metric.type !== 'numeric' && metric.points.some(point => point.row.pass_scores && Array.isArray(point.row.pass_scores[metric.name]) && point.row.pass_scores[metric.name].length > 1));

        // Quality-latency frontier: one item per point using normalized composite quality.
        {
          const normalizedByMetric = series.map(metric => {
            const map = new Map();
            metric.points.forEach(point => {
              const normalized = metric.type === 'numeric'
                ? (metric.max === metric.min ? 0.5 : (point.value - metric.min) / (metric.max - metric.min))
                : Math.max(0, Math.min(1, point.value));
              map.set(point.rowIndex, normalized);
            });
            return map;
          });
          const items = rows.map((row, rowIndex) => {
            const values = normalizedByMetric.map(map => map.get(rowIndex)).filter(value => value !== undefined);
            return { row, rowIndex, quality: values.length ? riMean(values) : null, latency: Number(row.latency_ms) };
          }).filter(item => item.quality !== null && Number.isFinite(item.latency) && item.latency > 0);
          if (items.length > 1) {
            const W = 620, H = 220, L = 50, R = 18, T = 16, B = 40;
            const lats = items.map(item => item.latency).sort((a, b) => a - b);
            const qualities = items.map(item => item.quality).sort((a, b) => a - b);
            const latMin = lats[0], latMax = lats[lats.length - 1];
            const medianLat = lats[Math.floor((lats.length - 1) / 2)];
            const medianQuality = qualities[Math.floor((qualities.length - 1) / 2)];
            const xMedian = riScale(medianLat, latMin, latMax, L, W - R);
            const yMedian = riScale(medianQuality, 0, 1, H - B, T);
            let svg = '<line x1="' + L + '" y1="' + (H - B) + '" x2="' + (W - R) + '" y2="' + (H - B) + '" class="ri-axis"/>' +
              '<line x1="' + L + '" y1="' + T + '" x2="' + L + '" y2="' + (H - B) + '" class="ri-axis"/>' +
              '<line x1="' + xMedian.toFixed(1) + '" y1="' + T + '" x2="' + xMedian.toFixed(1) + '" y2="' + (H - B) + '" class="ri-gridline"/>' +
              '<line x1="' + L + '" y1="' + yMedian.toFixed(1) + '" x2="' + (W - R) + '" y2="' + yMedian.toFixed(1) + '" class="ri-gridline"/>';
            [0, 0.5, 1].forEach(value => {
              const y = riScale(value, 0, 1, H - B, T);
              svg += '<text x="' + (L - 10) + '" y="' + (y + 4) + '" text-anchor="end" class="ri-data-label">' + Math.round(value * 100) + '%</text>';
            });
            items.forEach(item => {
              const x = riScale(item.latency, latMin, latMax, L, W - R);
              const y = riScale(item.quality, 0, 1, H - B, T);
              const radius = 4 + Math.min(2, Number(item.row.retry_count || 0));
              svg += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + radius + '" fill="' + riScoreColor(item.quality) + '" stroke="var(--bg-surface)" stroke-width="2"><title>' + escapeHtml((item.row.item_id || ('Item ' + (item.rowIndex + 1))) + ' · quality ' + formatPercent(item.quality) + ' · latency ' + formatLatency(item.latency) + (item.row.retry_count ? ' · retries ' + item.row.retry_count : '')) + '</title></circle>';
            });
            svg += '<text x="' + ((L + W - R) / 2) + '" y="' + (H - 10) + '" text-anchor="middle" class="ri-label">Response latency</text>' +
              '<text x="16" y="' + ((T + H - B) / 2) + '" text-anchor="middle" transform="rotate(-90 16 ' + ((T + H - B) / 2) + ')" class="ri-label">Composite quality</text>' +
              '<text x="' + L + '" y="' + (H - B + 18) + '" class="ri-data-label">' + escapeHtml(formatLatency(latMin)) + '</text>' +
              '<text x="' + (W - R) + '" y="' + (H - B + 18) + '" text-anchor="end" class="ri-data-label">' + escapeHtml(formatLatency(latMax)) + '</text>';
            panels.push('<div class="ri-panel half"><div class="ri-panel-head"><div><div class="ri-panel-title">Quality–Latency Frontier</div>' +
              '<div class="ri-panel-copy">Find expensive failures and fast, high-quality items. Point size increases when retries are present.</div></div></div>' +
              '<svg class="ri-chart ri-chart-plot" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Composite quality versus response latency by item">' + svg + '</svg>' +
              '<div class="ri-note-row"><span>Dashed lines: run medians</span><span>' + items.length + ' items</span></div></div>');
          }
        }

        // Repeat-run stability: observed pass trend and item volatility are distinct from pass@k.
        if (repeatSeries.length) {
          let passTrendPanel = '';
          const maxPass = Math.max(...repeatSeries.flatMap(metric => metric.points.map(point => (point.row.pass_scores[metric.name] || []).length)));
          if (maxPass > 1) {
            const W = 1000, H = 350, L = 46, R = 16, T = 16, B = 36;
            const x = pass => riScale(pass, 1, maxPass, L, W - R);
            const y = value => riScale(value, 0, 1, H - B, T);
            let svg = '';
            [0, 0.25, 0.5, 0.75, 1].forEach(value => {
              const py = y(value);
              svg += '<line x1="' + L + '" y1="' + py + '" x2="' + (W - R) + '" y2="' + py + '" class="ri-gridline"/>' +
                '<text x="' + (L - 9) + '" y="' + (py + 4) + '" text-anchor="end" class="ri-data-label">' + Math.round(value * 100) + '%</text>';
            });
            let legend = '';
            repeatSeries.forEach((metric, metricIndex) => {
              const color = chartColors[metricIndex % chartColors.length];
              const means = [];
              for (let pass = 1; pass <= maxPass; pass++) {
                const values = metric.points.map(point => point.row.pass_scores[metric.name] || []).filter(values => values.length >= pass).map(values => Number(values[pass - 1])).filter(Number.isFinite);
                means.push({ pass, value: values.length ? riMean(values) : null, count: values.length });
              }
              const valid = means.filter(point => point.value !== null);
              if (!valid.length) return;
              const path = valid.map((point, index) => (index === 0 ? 'M' : 'L') + x(point.pass).toFixed(1) + ' ' + y(point.value).toFixed(1)).join(' ');
              svg += '<path d="' + path + '" fill="none" stroke="' + color + '" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
              valid.forEach(point => {
                svg += '<circle cx="' + x(point.pass).toFixed(1) + '" cy="' + y(point.value).toFixed(1) + '" r="4.5" fill="var(--bg-surface)" stroke="' + color + '" stroke-width="2"><title>' + escapeHtml(metric.name + ' · pass ' + point.pass + ': ' + formatPercent(point.value) + ' · ' + point.count + ' items') + '</title></circle>';
              });
              legend += '<span class="ri-legend-item" style="--ri-color:' + color + '"><span class="ri-legend-swatch"></span>' + escapeHtml(metric.name) + '</span>';
            });
            for (let pass = 1; pass <= maxPass; pass++) {
              svg += '<text x="' + x(pass).toFixed(1) + '" y="' + (H - 14) + '" text-anchor="middle" class="ri-data-label">Pass ' + pass + '</text>';
            }
            passTrendPanel = '<div class="ri-panel half trend"><div class="ri-panel-head"><div><div class="ri-panel-title">Observed Performance by Pass</div>' +
              '<div class="ri-panel-copy">Actual mean score on each stored pass for every score metric. This separates pass-order drift from the probability-based pass@k curve.</div></div></div>' +
              '<div class="ri-legend">' + legend + '</div><svg class="ri-chart ri-chart-trend" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Observed metric performance by pass">' + svg + '</svg></div>';
          }

          const volatility = [];
          repeatSeries.forEach((metric, metricIndex) => {
            metric.points.forEach(point => {
              const values = (point.row.pass_scores[metric.name] || []).map(Number).filter(Number.isFinite);
              if (values.length > 1) volatility.push({ metric, metricIndex, row: point.row, rowIndex: point.rowIndex, mean: riMean(values), stddev: riStdDev(values), values });
            });
          });
          if (volatility.length) {
            const W = 620, H = 220, L = 50, R = 18, T = 16, B = 40;
            const maxStd = Math.max(0.5, ...volatility.map(point => point.stddev));
            const x = value => riScale(value, 0, 1, L, W - R);
            const y = value => riScale(value, 0, maxStd, H - B, T);
            let svg = '<line x1="' + L + '" y1="' + (H - B) + '" x2="' + (W - R) + '" y2="' + (H - B) + '" class="ri-axis"/>' +
              '<line x1="' + L + '" y1="' + T + '" x2="' + L + '" y2="' + (H - B) + '" class="ri-axis"/>';
            [0, 0.5, 1].forEach(value => {
              svg += '<text x="' + x(value).toFixed(1) + '" y="' + (H - B + 18) + '" text-anchor="middle" class="ri-data-label">' + Math.round(value * 100) + '%</text>';
            });
            [0, maxStd / 2, maxStd].forEach(value => {
              svg += '<text x="' + (L - 10) + '" y="' + (y(value) + 4).toFixed(1) + '" text-anchor="end" class="ri-data-label">' + Math.round(value * 100) + '%</text>';
            });
            volatility.forEach(point => {
              const color = chartColors[point.metricIndex % chartColors.length];
