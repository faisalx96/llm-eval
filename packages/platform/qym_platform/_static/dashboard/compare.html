      // #4: Safe markdown rendering (basic inline markdown: bold, italic, code, links)
      function isRTL(text) {
        var rtlChars = (text.match(/[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]/g) || []).length;
        var latinChars = (text.match(/[A-Za-z]/g) || []).length;
        return rtlChars > latinChars;
      }

      function _fmtTraceNum(v) {
        if (v >= 1000000) return (v / 1000000).toFixed(1) + 'M';
        if (v >= 1000) return (v / 1000).toFixed(1) + 'K';
        return String(v);
      }
      function _renderTraceChips(ts, retryCount) {
        if (!ts && !(retryCount > 0)) return '';
        ts = ts || {};
        var chips = [];
        var toolErrorCount = ts.tool_errors || ts.malformed_tool_calls || 0;
        if (ts.tokens != null) chips.push('<span class="trace-chip"><span class="trace-chip-icon">\u26A1</span><span class="trace-chip-value">' + _fmtTraceNum(ts.tokens) + '</span><span class="trace-chip-label">Tokens</span></span>');
        if (ts.cost > 0) chips.push('<span class="trace-chip"><span class="trace-chip-icon">\u26A1</span><span class="trace-chip-value">$' + ts.cost.toFixed(3) + '</span><span class="trace-chip-label">Cost</span></span>');
        if (ts.llm_calls) chips.push('<span class="trace-chip"><span class="trace-chip-icon">\u26A1</span><span class="trace-chip-value">' + ts.llm_calls + '</span><span class="trace-chip-label">LLM Calls</span></span>');
        if (ts.tool_calls) chips.push('<span class="trace-chip"><span class="trace-chip-icon">\u26A1</span><span class="trace-chip-value">' + ts.tool_calls + '</span><span class="trace-chip-label">Tool Calls</span></span>');
        if (toolErrorCount > 0 || ts.tool_calls) chips.push('<span class="trace-chip' + (toolErrorCount > 0 ? ' trace-chip-err' : '') + '"><span class="trace-chip-icon">\u26A1</span><span class="trace-chip-value">' + toolErrorCount + '</span><span class="trace-chip-label">Tool Errors</span></span>');
        if (ts.noisy_reasoning > 0) chips.push('<span class="trace-chip"><span class="trace-chip-icon">\u2728</span><span class="trace-chip-value">' + ts.noisy_reasoning + '</span><span class="trace-chip-label">Noisy Reasoning</span></span>');
        if (ts.provider_errors > 0) chips.push('<span class="trace-chip trace-chip-err"><span class="trace-chip-icon">\u26A0</span><span class="trace-chip-value">' + ts.provider_errors + '</span><span class="trace-chip-label">Provider Errors</span></span>');
        if ((retryCount || 0) > 0) chips.push('<span class="trace-chip"><span class="trace-chip-icon">\u21BB</span><span class="trace-chip-value">' + retryCount + '</span><span class="trace-chip-label">Retries</span></span>');
        if (chips.length === 0) return '';
        return '<div class="trace-chips-row">' + chips.join('') + '</div>';
      }

      function renderMarkdownSafe(value) {
        if (value === null || value === undefined) return '—';
        if (typeof value === 'object') return formatObjectAsHtml(value);
        const str = String(value).replace(/\\u([0-9a-fA-F]{4})/g, (_, hex) => String.fromCharCode(parseInt(hex, 16)));
        // Check if it looks like a structured object first
        const trimmed = str.trim();
        if ((trimmed.startsWith('{') && trimmed.endsWith('}')) ||
            (trimmed.startsWith('[') && trimmed.endsWith(']'))) {
          try {
            const parsed = JSON.parse(trimmed);
            if (typeof parsed === 'object' && parsed !== null) return formatObjectAsHtml(parsed);
          } catch {}
          const parsed = parsePythonDict(trimmed);
          if (parsed !== null) return formatObjectAsHtml(parsed);
        }
        // Apply basic markdown transforms (safe subset - no raw HTML)
        let html = escapeHtml(str);
        // Code blocks (triple backtick)
        html = html.replace(/```([\s\S]*?)```/g, '<pre style="background:var(--bg-elevated);padding:4px 8px;border-radius:4px;overflow-x:auto;margin:4px 0;">$1</pre>');
        // Inline code
        html = html.replace(/`([^`]+)`/g, '<code style="background:var(--bg-elevated);padding:1px 4px;border-radius:3px;">$1</code>');
        // Bold
        html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
        // Italic
        html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
        // Links
        html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" style="color:var(--accent-primary);">$1</a>');
        if (isRTL(str)) html = '<div dir="rtl" style="text-align:right;">' + html + '</div>';
        return html;
      }

      function parseMetaList(val) {
        if (val == null || val === '') return [];
        if (Array.isArray(val)) return val.filter(v => v != null && v !== 'null' && v !== '').map(String);
        const s = String(val).trim();
        if (s.startsWith('[') && s.endsWith(']')) {
          try {
            const parsed = JSON.parse(s);
            if (Array.isArray(parsed)) return parsed.filter(v => v != null).map(String);
          } catch {}
          try {
            const fixed = s.replace(/'/g, '"').replace(/"null"/g, 'null');
            const parsed = JSON.parse(fixed);
            if (Array.isArray(parsed)) return parsed.filter(v => v != null).map(String);
          } catch {}
        }
        return [s];
      }

      function isListCategoryKey(key) {
        return key === 'domain' || key === 'patterns';

      function getMetadataCategoryValues(md, key) {
        const raw = (md && typeof md === 'object') ? md[key] : null;
        if (raw == null || raw === '') return [];
        if (isListCategoryKey(key) || Array.isArray(raw)) return parseMetaList(raw);
        return [String(raw)];
      }

      async function updateMetricScore(filePath, rowIndex, metricName, newScore) {
        const res = await fetch(apiUrl('api/runs/update_metric'), {
          method: 'POST',

            file_path: filePath,

      function applyUpdatedRowToRun(runIdx, updatedRow) {
        try {
          const run = state.runs[runIdx];
          if (!run || !run.snapshot) return;
          const rows = run.snapshot.rows || [];
          const idx = Number(updatedRow.index) || 0;
          if (idx >= 0 && idx < rows.length) {
            rows[idx] = updatedRow;
          } else {
            const pos = rows.findIndex(r => Number(r.index) === idx);
            if (pos >= 0) rows[pos] = updatedRow;
          }
        } catch {}
      }

      function wireMetricEditHandlers(scope = document) {
        const root = scope || document;
        root.querySelectorAll('.metric-edit-open').forEach(btn => {
          btn.onclick = () => {
            const runIdx = btn.dataset.runIdx;
            const rowIndex = btn.dataset.rowIndex;
            const metric = btn.dataset.metric;
            const block = root.querySelector(`.metric-edit-block[data-run-idx="${runIdx}"][data-row-index="${rowIndex}"][data-metric="${metric}"]`);
            if (!block) return;
            const isHidden = block.classList.contains('hidden');

            btn.textContent = isHidden ? '✕' : '✎';

            btn.setAttribute('aria-label', isHidden ? 'Close edit' : 'Edit');
          };
        });
        root.querySelectorAll('.metric-edit-save').forEach(btn => {
          btn.onclick = async () => {
            const runIdx = Number(btn.dataset.runIdx);
            const rowIndex = Number(btn.dataset.rowIndex);
            const metricName = btn.dataset.metric || '';
            const controls = btn.closest('.metric-edit-controls');
            const input = controls ? controls.querySelector('.metric-edit-input') : null;
            const status = controls ? controls.querySelector('.metric-edit-status') : null;
            const run = state.runs[runIdx];
            const filePath = run?.run?.file_path || '';
            if (!filePath || !metricName || !input) {
              if (status) status.textContent = 'Unavailable';
              return;
            }
            btn.disabled = true;
            if (status) status.textContent = 'Saving...';
            try {
              const result = await updateMetricScore(filePath, rowIndex, metricName, input.value);
              if (result && result.row) {
                applyUpdatedRowToRun(runIdx, result.row);
                refreshComparisonStatsAfterEdit();
                renderItems();
              }
            } catch (err) {
              if (status) status.textContent = 'Error';
            } finally {
              btn.disabled = false;
              if (status && status.textContent === 'Saving...') status.textContent = '';
            }
          };
        });

      async function saveFeedback(itemId, runIdx, note) {
        const runId = state.runs[runIdx]?.run?.file_path;
        if (!runId) return;
        const run = state.runs[runIdx];
        const rows = run?.snapshot?.rows || [];
        const row = findRowByCompareId(rows, itemId);
        const rawItemId = row?.item_id;
        if (!rawItemId) return;
        try {
          const res = await fetch(apiUrl('api/runs/update_root_cause'), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ item_id: rawItemId, root_cause_note: note, run_id: runId }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok || data.error) { console.error('Failed to save feedback:', data.error); return; }
          if (row) {
            if (!row.item_metadata) row.item_metadata = {};
            if (note) row.item_metadata.root_cause_note = note;
            else delete row.item_metadata.root_cause_note;
          }
          renderItems();
          // Flash success indicator
          setTimeout(() => {
            const saved = document.querySelector('[data-feedback-item="' + itemId + '"][data-feedback-run-idx="' + runIdx + '"]');

              if (sec) { sec.classList.add('feedback-saved'); setTimeout(() => sec.classList.remove('feedback-saved'), 800); }

      }

      function showRootCauseDropdown(itemId, runIdx, anchorEl) {
        // Remove any existing dropdown
        document.querySelectorAll('.root-cause-dropdown').forEach(d => d.remove());

        // Get current root cause for this specific run's item
        const run = state.runs[runIdx];
        const rows = run?.snapshot?.rows || [];
        const row = findRowByCompareId(rows, itemId);
        const currentRC = row?.item_metadata?.root_cause || '';

        // Build options: predefined + any custom values already in data
        const allOptions = [...ROOT_CAUSE_PRESETS];
        for (const v of state.rootCauseValues) {
          if (!allOptions.includes(v)) allOptions.push(v);
        }

        const dropdown = document.createElement('div');
        dropdown.className = 'root-cause-dropdown';

        let html = '';
        html += `<div class="rc-option ${!currentRC ? 'active' : ''}" data-rc-value=""><span class="rc-dot" style="background: var(--text-muted);"></span> None (clear)</div>`;
        html += '<div class="rc-divider"></div>';

        for (const opt of allOptions) {
          const color = ROOT_CAUSE_COLORS[opt] || '#e07a5f';
          const isActive = opt === currentRC;
          html += `<div class="rc-option ${isActive ? 'active' : ''}" data-rc-value="${escapeAttr(opt)}"><span class="rc-dot" style="background: ${color};"></span> ${escapeHtml(opt)}</div>`;
        }

        html += '<div class="rc-divider"></div>';
        html += `<div class="rc-custom-input"><input type="text" placeholder="Custom cause..." /><button>Add</button></div>`;

        dropdown.innerHTML = html;

        // Position near the anchor element, flipping above if it would clip the bottom
        document.body.appendChild(dropdown);
        const rect = anchorEl.getBoundingClientRect();
        const dropH = dropdown.offsetHeight;
        const spaceBelow = window.innerHeight - rect.bottom - 8;
        const spaceAbove = rect.top - 8;
        if (spaceBelow >= dropH || spaceBelow >= spaceAbove) {
          dropdown.style.top = (rect.bottom + 4) + 'px';
        } else {
          dropdown.style.top = Math.max(4, rect.top - dropH - 4) + 'px';
        }
        dropdown.style.left = Math.min(rect.left, window.innerWidth - dropdown.offsetWidth - 8) + 'px';
        dropdown.style.maxHeight = Math.max(spaceBelow, spaceAbove) + 'px';

        // Wire option clicks
        dropdown.querySelectorAll('.rc-option').forEach(opt => {
          opt.addEventListener('click', async () => {
            await saveRootCause(itemId, runIdx, opt.dataset.rcValue);
            dropdown.remove();
          });
        });

        // Wire custom input
        const customInput = dropdown.querySelector('.rc-custom-input input');
        const customBtn = dropdown.querySelector('.rc-custom-input button');
        customBtn.addEventListener('click', async () => {
          const val = customInput.value.trim();
          if (val) {
            await saveRootCause(itemId, runIdx, val);
            dropdown.remove();
          }
        });
        customInput.addEventListener('keydown', async (e) => {
          if (e.key === 'Enter') {
            const val = customInput.value.trim();
            if (val) {
              await saveRootCause(itemId, runIdx, val);
              dropdown.remove();
            }
          }
        });

        // Close on outside click or scroll (but not scroll within the dropdown itself)
        const cleanup = () => {
          dropdown.remove();
          document.removeEventListener('click', closeHandler);
          window.removeEventListener('scroll', scrollHandler, true);
        };
        const closeHandler = (e) => {
          if (!dropdown.contains(e.target)) cleanup();
        };
        const scrollHandler = (e) => {
          if (!dropdown.contains(e.target)) cleanup();
        };
        setTimeout(() => {
          document.addEventListener('click', closeHandler);
          window.addEventListener('scroll', scrollHandler, true);
        }, 0);
      }

      async function saveRootCause(itemId, runIdx, rootCause) {
        const runId = state.runs[runIdx]?.run?.file_path;
        if (!runId) return;
        const run = state.runs[runIdx];
        const rows = run?.snapshot?.rows || [];
        const row = findRowByCompareId(rows, itemId);
        const rawItemId = row?.item_id;
        if (!rawItemId) return;
        try {
          const res = await fetch(apiUrl('api/runs/update_root_cause'), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ item_id: rawItemId, root_cause: rootCause, run_id: runId }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok || data.error) {
            console.error('Failed to save root cause:', data.error);
            return;
          }

          // Update local state: set root_cause only on this run's item
          if (row) {
            if (!row.item_metadata) row.item_metadata = {};
            if (rootCause) {
              row.item_metadata.root_cause = rootCause;
              row.item_metadata.root_cause_source = 'human';
              delete row.item_metadata.root_cause_confidence;
            } else {
              delete row.item_metadata.root_cause;
              delete row.item_metadata.root_cause_source;
              delete row.item_metadata.root_cause_confidence;
            }
          }

          // Update root cause values set
          if (rootCause && !state.rootCauseValues.includes(rootCause)) {
            state.rootCauseValues.push(rootCause);
            state.rootCauseValues.sort();

      window.sortMetaTable = function(button) {
        const table = button?.closest('table.meta-table');
        const tbody = table?.querySelector('tbody');
        if (!table || !tbody) return;

        const colIndex = Number(button.dataset.colIndex || 0);
        const current = button.getAttribute('aria-sort');
        const nextDir = current === 'ascending' ? 'descending' : 'ascending';
        const direction = nextDir === 'ascending' ? 1 : -1;
        const rows = Array.from(tbody.querySelectorAll('tr'));

        table.querySelectorAll('.meta-table-sort').forEach((sortButton) => {
          sortButton.setAttribute('aria-sort', sortButton === button ? nextDir : 'none');
        });

        rows.sort((rowA, rowB) => {
          const cellA = rowA.children[colIndex];
          const cellB = rowB.children[colIndex];
          const rawA = cellA?.dataset.sortValue ?? cellA?.textContent ?? '';
          const rawB = cellB?.dataset.sortValue ?? cellB?.textContent ?? '';
          const emptyA = rawA === '';
          const emptyB = rawB === '';
          if (emptyA && emptyB) return 0;
          if (emptyA) return 1;
          if (emptyB) return -1;

          const numA = Number(rawA);
          const numB = Number(rawB);
          const bothNumeric = rawA.trim() !== '' && rawB.trim() !== '' && Number.isFinite(numA) && Number.isFinite(numB);
          if (bothNumeric && numA !== numB) return (numA - numB) * direction;

          return rawA.localeCompare(rawB, undefined, { numeric: true, sensitivity: 'base' }) * direction;
        });

        rows.forEach(row => tbody.appendChild(row));
      };

      // Format field names to be more readable
      function formatFieldName(name) {
        // Remove common prefixes and convert to title case
        return name
          .replace(/_/g, ' ')
          .replace(/\b\w/g, c => c.toUpperCase());
      }

      function formatValue(value) {
        // Handle null/undefined
        if (value === null || value === undefined) {
          return '—';
        }

        // If it's already a string, check if it's a JSON string or Python dict repr
        if (typeof value === 'string') {
          const trimmed = value.trim();

          // Try to parse as JSON first
          try {
            const parsed = JSON.parse(trimmed);
            if (typeof parsed === 'object' && parsed !== null) {
              return formatObjectAsHtml(parsed);
            }
          } catch {
            // Not valid JSON, continue to try Python dict repr
          }

          // Try to handle Python dict repr (single quotes, True/False/None)
          if ((trimmed.startsWith('{') && trimmed.endsWith('}')) ||
              (trimmed.startsWith('[') && trimmed.endsWith(']'))) {
            const parsed = parsePythonDict(trimmed);
            if (parsed !== null) {
              return formatObjectAsHtml(parsed);
            }
          }

          return escapeHtml(value);
        }

        // If it's an object or array, format it nicely
        if (typeof value === 'object') {
          return formatObjectAsHtml(value);
        }

        // For other primitives, just convert to string
        return escapeHtml(String(value));
      }

      function parsePythonDict(str) {
        // Parse Python dict repr like {'key': 'value', 'num': 123, 'bool': True}
        // This is a simple parser that handles common cases
        try {
          let i = 0;
          const len = str.length;

          function skipWhitespace() {
            while (i < len && /\s/.test(str[i])) i++;
          }

          function parseValue() {
            skipWhitespace();
            if (i >= len) return undefined;

            const ch = str[i];

            // String (single or double quoted)
            if (ch === "'" || ch === '"') {
              return parseString(ch);
            }
            // Object
            if (ch === '{') {
              return parseObject();
            }
            // Array
            if (ch === '[') {
              return parseArray();
            }
            // Number, boolean, None
            return parseLiteral();
          }

          function parseString(quote) {
            i++; // skip opening quote
            let result = '';
            while (i < len) {
              const ch = str[i];
              if (ch === '\\' && i + 1 < len) {
                // Handle escape sequences
                const next = str[i + 1];
                if (next === 'n') { result += '\n'; i += 2; }
                else if (next === 't') { result += '\t'; i += 2; }
                else if (next === 'r') { result += '\r'; i += 2; }
                else if (next === '\\') { result += '\\'; i += 2; }
                else if (next === quote) { result += quote; i += 2; }
                else { result += ch; i++; }
              } else if (ch === quote) {
                i++; // skip closing quote
                return result;
              } else {
                result += ch;
                i++;
              }
            }
            return result; // unclosed string
          }

          function parseObject() {
            i++; // skip '{'
            const obj = {};
            skipWhitespace();
            if (str[i] === '}') { i++; return obj; }

            while (i < len) {
              skipWhitespace();
              // Parse key (must be string)
              const key = parseValue();
              if (typeof key !== 'string') return null;

              skipWhitespace();
              if (str[i] !== ':') return null;
              i++; // skip ':'

              // Parse value
              const val = parseValue();
              obj[key] = val;

              skipWhitespace();
              if (str[i] === '}') { i++; return obj; }
              if (str[i] === ',') { i++; continue; }
              return null; // unexpected character
            }
            return obj;
          }

          function parseArray() {
            i++; // skip '['
            const arr = [];
            skipWhitespace();
            if (str[i] === ']') { i++; return arr; }

            while (i < len) {
              const val = parseValue();
              arr.push(val);

              skipWhitespace();
              if (str[i] === ']') { i++; return arr; }
              if (str[i] === ',') { i++; continue; }
              return null;
            }
            return arr;
          }

          function parseLiteral() {
            // Check for True, False, None, or numbers
            if (str.slice(i, i + 4) === 'True') { i += 4; return true; }
            if (str.slice(i, i + 5) === 'False') { i += 5; return false; }
            if (str.slice(i, i + 4) === 'None') { i += 4; return null; }

            // Parse number
            let numStr = '';
            while (i < len && /[0-9.\-+eE]/.test(str[i])) {
              numStr += str[i];
              i++;
            }
            if (numStr) {
              const num = parseFloat(numStr);
              if (!isNaN(num)) return num;
            }
            return undefined;
          }

          const result = parseValue();
          return result;
        } catch {
          return null;
        }
      }

      function fmtStr(s) {
        var escaped = escapeHtml(s);
        return isRTL(s) ? '<span class="formatted-string" dir="rtl" style="text-align:right;display:block;">' + escaped + '</span>' : '<span class="formatted-string">' + escaped + '</span>';
      }

      function isPrimitiveArrayValue(value) {
        if (Array.isArray(value)) return value.every(isPrimitiveArrayValue);
        return value === null || value === undefined || ['string', 'number', 'boolean'].includes(typeof value);
      }

      function inlineArrayText(value) {
        if (Array.isArray(value)) return '[' + value.map(inlineArrayText).join(', ') + ']';
        if (value === null || value === undefined) return 'null';
        if (typeof value === 'string') return JSON.stringify(value);
        return String(value);
      }

      function compactArrayHtml(value) {
        if (!isPrimitiveArrayValue(value)) return '';
        const text = inlineArrayText(value);
        return text.length <= 200 ? '<span class="formatted-array-inline">' + escapeHtml(text) + '</span>' : '';
      }

      function formatObjectAsHtml(obj) {
        if (Array.isArray(obj)) {
          const compact = compactArrayHtml(obj);
          if (compact) return compact;
          // Format arrays
          if (obj.length === 0) return '<span class="formatted-array">[]</span>';
          const items = obj.map((item, idx) => {
            let formattedItem;
            if (item === null || item === undefined) {
              formattedItem = '<span class="formatted-null">null</span>';
            } else if (typeof item === 'object') {
              formattedItem = formatObjectAsHtml(item);
            } else if (typeof item === 'string') {
              formattedItem = fmtStr(item);
            } else {
              formattedItem = escapeHtml(String(item));
            }
            return `<div class="formatted-array-item"><span class="formatted-index">[${idx}]</span> ${formattedItem}</div>`;
          }).join('');
          return `<div class="formatted-array">${items}</div>`;
        }

        // Format objects as key-value pairs
        const entries = Object.entries(obj);
        if (entries.length === 0) return '<span class="formatted-object">{}</span>';

        // Group consecutive table-like children so they render side-by-side.
        const groups = [];
        let tableBuffer = [];
        const flushTables = () => {
          if (!tableBuffer.length) return;
          const cells = tableBuffer.map(({ key, table }) => (
            `<div class="formatted-table-cell"><span class="formatted-key">${escapeHtml(formatFieldName(key))}</span>${formatMetaTable(table)}</div>`
          )).join('');
          groups.push(`<div class="formatted-table-grid">${cells}</div>`);
          tableBuffer = [];
        };
        for (const [key, val] of entries) {
          const table = (val && typeof val === 'object') ? normalizeMetaTableValue(val) : null;
          if (table) { tableBuffer.push({ key, table }); continue; }
          flushTables();
          let formattedVal;
          if (val === null || val === undefined) {
            formattedVal = '<span class="formatted-null">null</span>';
          } else if (typeof val === 'object') {
            formattedVal = formatObjectAsHtml(val);
          } else if (typeof val === 'string') {
            formattedVal = fmtStr(val);
          } else if (typeof val === 'number') {
            formattedVal = `<span class="formatted-number">${val}</span>`;
          } else if (typeof val === 'boolean') {
            formattedVal = `<span class="formatted-boolean">${val}</span>`;
          } else {
            formattedVal = escapeHtml(String(val));
          }
          const copyVal = String(val ?? '');
          groups.push(`<div class="formatted-row"><span class="formatted-key">${escapeHtml(key)}</span>${formattedVal}<button class="copy-btn" data-copy-text="${escapeAttr(copyVal)}" title="Copy ${escapeHtml(key)}">${COPY_ICON}</button></div>`);
        }
        flushTables();

        return `<div class="formatted-object">${groups.join('')}</div>`;
      }

      function metaCellText(value) {
        if (value === undefined || value === null) return '';
        if (typeof value === 'object') {
          try { return JSON.stringify(value); }
          catch { return String(value); }
        }
        return String(value);
      }

      function normalizeMetaTableValue(val) {
        if (Array.isArray(val)) {
          if (val.length === 0 || !val.every(r => Array.isArray(r))) return null;
          const colCount = Math.max(...val.map(r => r.length), 0);
          if (colCount === 0) return null;
          return {
            columns: Array.from({length: colCount}, (_, i) => `Col ${i + 1}`),
            rows: val.map(r => Array.from({length: colCount}, (_, i) => i < r.length ? r[i] : '')),
          };
        }

        if (!val || typeof val !== 'object' || Array.isArray(val.columns) === false || Array.isArray(val.rows) === false) {
          return null;
        }

        const declaredColumns = val.columns.map(c => String(c ?? ''));
        const discoveredColumns = declaredColumns.slice();
        const sourceRows = val.rows;
        let colCount = declaredColumns.length;
        for (const row of sourceRows) {
          if (Array.isArray(row)) colCount = Math.max(colCount, row.length);
          else if (row && typeof row === 'object' && declaredColumns.length === 0) {
            for (const key of Object.keys(row)) {
              if (!discoveredColumns.includes(key)) discoveredColumns.push(key);
            }
            colCount = Math.max(colCount, discoveredColumns.length);
          }
          else if (colCount === 0) colCount = 1;
        }
        if (colCount === 0) return null;

        const columns = Array.from({length: colCount}, (_, i) => discoveredColumns[i] || `Col ${i + 1}`);
        const rows = sourceRows.map(row => {
          if (Array.isArray(row)) {
            return Array.from({length: colCount}, (_, i) => i < row.length ? row[i] : '');
          }
          if (row && typeof row === 'object') {
            return columns.map(column => Object.prototype.hasOwnProperty.call(row, column) ? row[column] : '');
          }
          return Array.from({length: colCount}, (_, i) => i === 0 ? row : '');
        });

        return { columns, rows };
      }

      function formatMetaTable(table) {
        const maxRows = 200;
        const visibleRows = table.rows.slice(0, maxRows);
        const hiddenRows = Math.max(table.rows.length - visibleRows.length, 0);
        const headerRow = '<tr>' + table.columns.map((column, i) => (
          `<th><button type="button" class="meta-table-sort" data-col-index="${i}" aria-sort="none" onclick="sortMetaTable(this)">${escapeHtml(column)}</button></th>`
        )).join('') + '</tr>';
        const bodyRows = visibleRows.map(r => {
          const cells = table.columns.map((_, i) => {
            const text = metaCellText(i < r.length ? r[i] : '');
            return `<td data-sort-value="${escapeAttr(text)}">${escapeHtml(text)}</td>`;
          }).join('');
          return `<tr>${cells}</tr>`;
        }).join('');
        const tableHtml = `<table class="meta-table"><thead>${headerRow}</thead><tbody>${bodyRows}</tbody></table>`;
        const truncatedHtml = hiddenRows > 0
          ? `<div class="meta-table-truncated">Showing first ${maxRows} of ${table.rows.length} rows. ${hiddenRows} rows are not loaded in this page.</div>`
          : '';
        return `<div class="meta-table-wrapper">${tableHtml}</div>${truncatedHtml}`;
      }

      function formatMetaValue(val) {
        if (val === undefined || val === null || val === '') return '';
        if (typeof val === 'boolean') return escapeHtml(String(val));
        if (typeof val === 'number') return escapeHtml(String(val));
        if (typeof val === 'string') return escapeHtml(val);

        const table = normalizeMetaTableValue(val);
        if (table) return formatMetaTable(table);

        if (Array.isArray(val)) {
          const isFlatPrimitive = val.every(v => v === null || typeof v !== 'object');
          if (isFlatPrimitive) {
            return escapeHtml(val.map(v => String(v ?? '')).join(', '));
          }
          return formatObjectAsHtml(val);
        }

        if (typeof val === 'object') return formatObjectAsHtml(val);
        return escapeHtml(String(val));
      }

      // ── Clear button counter ──
      function countActiveFilters() {
        let n = 0;
        if (state.itemFilter !== 'all') n++;
        if (state.winnerFilter !== 'any') n++;
        if (state.approvalFilter !== null) n++;
        if (state.searchQuery) n++;
        if (state.complexityFilter !== null) n++;
        if (state.domainFilter !== null) n++;
        if (state.rootCauseFilter !== null) n++;
        if (state.taskErrorFilter !== null) n++;
        if (state.traceErrorFilter !== null) n++;
        if (state.analysisErrorFilter !== null) n++;
        if (state.passRateOp) n++;
        if (state.sortBy !== 'index') n++;
        n += Object.values(state.categoryFilters).filter(v => v !== null).length;
        return n;
      }

      function updateClearButton() {
        const clearBtn = el('clear-all-btn');
        const countBadge = el('active-filter-count');
        const n = countActiveFilters();
        if (clearBtn) clearBtn.classList.toggle('visible', n > 0);
        if (countBadge) countBadge.textContent = n;
      }

      function clearAllFilters() {
        state.itemFilter = 'all';
        state.winnerFilter = 'any';
        state.approvalFilter = null;
        state.searchQuery = '';
        state.complexityFilter = null;
        state.domainFilter = null;
        state.domainFilterMode = 'include';
        state.domainExclusive.clear();
        state.rootCauseFilter = null;
        state.taskErrorFilter = null;
        state.traceErrorFilter = null;
        state.analysisErrorFilter = null;
        state.passRateOp = '';
        state.passRateValue = 0;
        state.sortBy = 'index';
        state.categoryFilters = {};
        state.page = 1;

        el('item-filter').value = 'all';
        el('run-winner-filter').value = 'any';
        el('items-search').value = '';
        el('pass-rate-op').value = '';
        el('pass-rate-value').style.display = 'none';
        el('pass-rate-suffix').style.display = 'none';
        el('sort-select').value = 'index';
        const approvalSelect = el('filter-approval');
        if (approvalSelect) approvalSelect.value = '';
        syncMultiselectUI('complexity');
        syncMultiselectUI('domain');
        syncMultiselectUI('root_cause');

        renderItems();
      }

      el('clear-all-btn').addEventListener('click', clearAllFilters);

      // Event listeners
      el('sort-select').addEventListener('change', (e) => {
        state.sortBy = e.target.value;
        state.page = 1;
        renderItems();
      });

      el('item-filter').addEventListener('change', (e) => {
        state.itemFilter = e.target.value;
        state.page = 1;
        renderItems();
      });

      el('filter-approval')?.addEventListener('change', (e) => {
        state.approvalFilter = e.target.value || null;
        state.page = 1;
        renderItems();
      });

      el('run-winner-filter').addEventListener('change', (e) => {
        state.winnerFilter = e.target.value;
        state.page = 1;
        renderItems();
      });

      // #19: Search input with debounce
      {
        let searchTimer = null;
        el('items-search').addEventListener('input', (e) => {
          clearTimeout(searchTimer);
          searchTimer = setTimeout(() => {
            state.searchQuery = e.target.value.trim();
            state.page = 1;
            renderItems();
          }, 250);
        });
      }

      // #2: Category multi-select dropdowns for complexity, domain & root cause
      function buildCategoryDropdowns() {
        const hasComplexity = state.complexityValues.length > 0;
        const hasDomain = state.domainValues.length > 0;
        const hasRootCause = state.rootCauseValues.length > 0;
        const hasMeta = hasComplexity || hasDomain || hasRootCause;

        el('fp-cat-complexity').style.display = hasComplexity ? '' : 'none';
        el('fp-cat-domain').style.display = hasDomain ? '' : 'none';
        el('fp-cat-root_cause').style.display = hasRootCause ? '' : 'none';
        el('fp-meta-fields').style.display = hasMeta ? '' : 'none';
        el('fp-metric-meta-fields').style.display = state.allMetricMetaKeys.length > 0 ? '' : 'none';

        // Approval is a simple <select>, no multi-select build needed
        if (hasComplexity) buildMultiselectOptions('complexity', state.complexityValues);
        if (hasDomain) buildMultiselectOptions('domain', state.domainValues);
        if (hasRootCause) buildMultiselectOptions('root_cause', state.rootCauseValues);
      }

      function buildMultiselectOptions(category, values) {
        const dropdown = el(category + '-ms-dropdown');
        if (!dropdown) return;

        // Count unique items per value (from first run to avoid double-counting)
        const itemCounts = {};
        for (const v of values) itemCounts[v] = 0;
        if (category === 'approval') {
          for (const itemId of (state.compareItemIds || [])) {
            const rowData = state.runs.map(run => findRowByCompareId(run.snapshot?.rows || [], itemId));
            const hasApproved = rowData.some(r => r && getApprovalState(r) === 'approved');
            const hasNotApproved = rowData.some(r => r && getApprovalState(r) === 'not_approved');
            if (hasApproved) itemCounts.approved++;
            if (hasNotApproved) itemCounts.not_approved++;
          }
        } else if (state.runs.length > 0) {
          const rows = state.runs[0].snapshot?.rows || [];
          for (const row of rows) {
            const md = row.item_metadata || {};
            const vals = category === 'domain'
              ? parseMetaList(md.domain)
              : [String(md[category] ?? '')];
            vals.forEach(val => {
              if (itemCounts[val] !== undefined) itemCounts[val]++;
            });
          }
        }

        // For root_cause, add a "(No Root Cause)" option to find unassigned items
        let extraOptions = '';
        if (category === 'root_cause') {
          let noRcCount = 0;
          if (state.runs.length > 0) {
            const rows = state.runs[0].snapshot?.rows || [];
            for (const row of rows) {
              // Count items where ANY run has no root cause (partial)
              const anyMissingRc = state.runs.some(run => {
                const rRows = run.snapshot?.rows || [];
                const rRow = findRowByCompareId(rRows, getRowCompareId(row));
                return !rRow || !rRow.item_metadata?.root_cause;
              });
              if (anyMissingRc) noRcCount++;
            }
          }
          extraOptions = `<label class="multi-select-option" data-value="__none__">
            <input type="checkbox" data-cat="${escapeAttr(category)}" data-val="__none__" />
            <span style="font-style:italic;">(No Root Cause)</span>
            <span class="option-count">${noRcCount}</span>
          </label>
          <div style="height:1px;background:var(--border-subtle);margin:2px 0;"></div>`;
        }

        let html = `<div class="ms-actions">
          <button class="ms-action-btn" data-action="all" data-cat="${escapeAttr(category)}">Select All</button>
          <button class="ms-action-btn" data-action="none" data-cat="${escapeAttr(category)}">None</button>
        </div>`;
        html += extraOptions + values.map(v =>
          `<label class="multi-select-option" data-value="${escapeAttr(v)}">
            <input type="checkbox" data-cat="${escapeAttr(category)}" data-val="${escapeAttr(v)}" />
            <span>${escapeHtml(getCatOptionLabel(category, v))}</span>
            <span class="option-count">${itemCounts[v] || 0}</span>
          </label>`
        ).join('');

        dropdown.innerHTML = html;

        // Wire up option clicks
        dropdown.querySelectorAll('.multi-select-option input[type="checkbox"]').forEach(cb => {
          cb.addEventListener('change', () => {
            const val = cb.dataset.val;
            let filterArr = getCatFilter(category);
            if (category === 'domain') {
              let mode = state.domainFilterMode;
              if (filterArr === null) {
                filterArr = [];
                mode = 'exclude';
                setCatFilter(category, filterArr, mode);
              }
              if (mode === 'exclude') {
                if (cb.checked) {
                  const idx = filterArr.indexOf(val);
                  if (idx >= 0) filterArr.splice(idx, 1);
                } else if (!filterArr.includes(val)) {
                  filterArr.push(val);
                }
                if (filterArr.length === 0) setCatFilter(category, null, 'include');
              } else {
                if (cb.checked) {
                  if (!filterArr.includes(val)) filterArr.push(val);
                } else {
                  const idx = filterArr.indexOf(val);
                  if (idx >= 0) filterArr.splice(idx, 1);
                }
              }
            } else {
              // If null (= all), expand to explicit list before toggling
              if (filterArr === null) {
                filterArr = [...values];
                if (category === 'root_cause') filterArr.push('__none__');
                setCatFilter(category, filterArr);
              }
              if (cb.checked) {
                if (!filterArr.includes(val)) filterArr.push(val);
              } else {
                const idx = filterArr.indexOf(val);
                if (idx >= 0) filterArr.splice(idx, 1);
              }
              if (filterArr.length === 0) setCatFilter(category, null);
            }
            syncMultiselectUI(category);
            state.page = 1;
            renderItems();
          });
        });

        // Wire up actions
        dropdown.querySelectorAll('.ms-action-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (btn.dataset.action === 'all') {
              setCatFilter(category, null, 'include');
            } else {
              setCatFilter(category, [], category === 'domain' ? 'include' : undefined);
            }
            syncMultiselectUI(category);
            state.page = 1;
            renderItems();
          });
        });

        syncMultiselectUI(category);
      }

      // Category filter helpers (complexity, domain, root_cause)
      function getCatFilter(cat) {
        if (cat === 'approval') return state.approvalFilter;
        if (cat === 'complexity') return state.complexityFilter;
        if (cat === 'domain') return state.domainFilter;
        if (cat === 'root_cause') return state.rootCauseFilter;
        if (state.categoryFilters[cat] !== undefined) return state.categoryFilters[cat];
        return null;
      }
      function setCatFilter(cat, val, mode) {
        if (cat === 'approval') state.approvalFilter = val;
        else if (cat === 'complexity') state.complexityFilter = val;
        else if (cat === 'domain') {
          state.domainFilter = val;
          state.domainFilterMode = mode || 'include';
          if (val === null || state.domainFilterMode === 'exclude') state.domainExclusive.clear();
        }
        else if (cat === 'root_cause') state.rootCauseFilter = val;
        else state.categoryFilters[cat] = val;
      }
      function getCatValues(cat) {
        if (cat === 'approval') return state.approvalValues;
        if (cat === 'complexity') return state.complexityValues;
        if (cat === 'domain') return state.domainValues;
        if (cat === 'root_cause') return state.rootCauseValues;
        const values = new Set();
        for (const run of state.runs) {
          for (const row of (run.snapshot?.rows || [])) {
            for (const value of getMetadataCategoryValues(row.item_metadata || {}, cat)) {
              if (value != null && value !== '') values.add(String(value));
            }
          }
        }
        return Array.from(values).sort((a, b) => a.localeCompare(b));
      }
      function getCatDefaultLabel(cat) {
        if (cat === 'approval') return 'All Approval';
        if (cat === 'complexity') return 'All Complexity';
        if (cat === 'domain') return 'All Domains';
        if (cat === 'root_cause') return 'All Root Causes';
        return 'All';
      }
      function getCatOptionLabel(cat, val) {
        if (cat === 'approval') {
          if (val === 'approved') return 'Approved';
          if (val === 'not_approved') return 'Not Approved';
        }
        if (cat === 'root_cause' && val === '__none__') return '(No Root Cause)';
        return val;
      }

      function syncMultiselectUI(category) {
        const filterArr = getCatFilter(category);
        const values = getCatValues(category);
        const defaultLabel = getCatDefaultLabel(category);
        const btn = el(category + '-ms-btn');
        const dropdown = el(category + '-ms-dropdown');

        // Normalize: explicitly selecting every value = reset to null (no filter)
        // For root_cause, "all" means all named values + __none__
        const allCount = category === 'root_cause' ? values.length + 1 : values.length;
        if (allCount > 0 && filterArr !== null && (category !== 'domain' || state.domainFilterMode === 'include') && filterArr.length >= allCount) {
          setCatFilter(category, null);
        }

        const effective = getCatFilter(category);

        // Update button text
        if (btn) {
          if (effective === null) {
            btn.textContent = defaultLabel;
            btn.classList.remove('has-selection');
          } else if (category === 'domain' && state.domainFilterMode === 'exclude') {
            btn.textContent = effective.length === 1
              ? `All Except ${getCatOptionLabel(category, effective[0])}`
              : `${effective.length} excluded`;
            btn.classList.add('has-selection');
          } else if (effective.length === 0) {
            btn.textContent = 'None';
            btn.classList.add('has-selection');
          } else if (effective.length === 1) {
            btn.textContent = getCatOptionLabel(category, effective[0]);
            btn.classList.add('has-selection');
          } else {
            btn.textContent = effective.length + ' selected';
            btn.classList.add('has-selection');
          }
        }

        // Domain supports both include and exclude modes.
        if (dropdown) {
          dropdown.querySelectorAll('.multi-select-option input[type="checkbox"]').forEach(cb => {
            cb.checked = category === 'domain'
              ? (effective === null || (state.domainFilterMode === 'exclude'
                  ? !effective.includes(cb.dataset.val)
                  : effective.includes(cb.dataset.val)))
              : (effective === null || effective.includes(cb.dataset.val));
          });
        }
      }

      // Toggle dropdown open/close — reuse same pattern as index.html model filter
      function setupCatDropdownToggle(category) {
        const btn = el(category + '-ms-btn');
        const dropdown = el(category + '-ms-dropdown');
        if (!btn || !dropdown) return;

        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          // Close other open dropdowns
          document.querySelectorAll('.multi-select-dropdown.open').forEach(d => {
            if (d !== dropdown) d.classList.remove('open');
          });
          el('metadata-fields-dropdown').classList.remove('open');
          el('metric-meta-fields-dropdown').classList.remove('open');
          dropdown.classList.toggle('open');
        });

        dropdown.addEventListener('click', (e) => e.stopPropagation());
      }

      setupCatDropdownToggle('approval');
      setupCatDropdownToggle('complexity');
      setupCatDropdownToggle('domain');
      setupCatDropdownToggle('root_cause');

      // Close dropdowns on outside click
      document.addEventListener('click', () => {
        document.querySelectorAll('.fp-cat-group .multi-select-dropdown.open').forEach(d => d.classList.remove('open'));
      });

      // #20: Pass rate filter — sentence-style controls
      el('pass-rate-op').addEventListener('change', (e) => {
        state.passRateOp = e.target.value;
        const show = !!e.target.value;
        el('pass-rate-value').style.display = show ? '' : 'none';
        el('pass-rate-suffix').style.display = show ? '' : 'none';
        if (show && !state.passRateValue) {
          state.passRateValue = Math.ceil(state.runs.length / 2);
          el('pass-rate-value').value = state.passRateValue;
        }
        state.page = 1;
        renderItems();
      });
      el('pass-rate-value').addEventListener('input', (e) => {
        const K = state.runs.length;
        let v = parseInt(e.target.value, 10);
        if (isNaN(v)) v = 0;
        if (v < 0) v = 0;
        if (v > K) v = K;
        state.passRateValue = v;
        state.page = 1;
        renderItems();
      });

      // #6: Metadata fields selector toggle
      el('metadata-fields-btn').addEventListener('click', () => {
        el('metric-meta-fields-dropdown').classList.remove('open');
        document.querySelectorAll('.multi-select-dropdown.open').forEach(d => d.classList.remove('open'));
        el('metadata-fields-dropdown').classList.toggle('open');
      });
      el('metric-meta-fields-btn').addEventListener('click', () => {
        el('metadata-fields-dropdown').classList.remove('open');
        document.querySelectorAll('.multi-select-dropdown.open').forEach(d => d.classList.remove('open'));
        el('metric-meta-fields-dropdown').classList.toggle('open');
      });
      document.addEventListener('click', (e) => {
        const metaDd = el('metadata-fields-dropdown'), metaBtn = el('metadata-fields-btn');
        const mmDd = el('metric-meta-fields-dropdown'), mmBtn = el('metric-meta-fields-btn');
        if (metaDd && !metaDd.contains(e.target) && e.target !== metaBtn) metaDd.classList.remove('open');
        if (mmDd && !mmDd.contains(e.target) && e.target !== mmBtn) mmDd.classList.remove('open');
      });

      function populateMetadataFieldsDropdown() {
        const dropdown = el('metadata-fields-dropdown');
        if (!dropdown || state.allMetadataKeys.length === 0) {
          if (dropdown) dropdown.innerHTML = '<div style="padding:4px;color:var(--text-muted);font-size:var(--font-xs);">No metadata fields found</div>';
          return;
        }
        dropdown.innerHTML = state.allMetadataKeys.map(k => {
          const checked = state.visibleMetadataFields[k] ? 'checked' : '';
          return `<label><input type="checkbox" ${checked} data-meta-key="${escapeAttr(k)}" /> ${escapeHtml(k)}</label>`;
        }).join('');
        dropdown.querySelectorAll('input[type="checkbox"]').forEach(cb => {
          cb.addEventListener('change', () => {
            state.visibleMetadataFields[cb.dataset.metaKey] = cb.checked;
            renderItems();
          });
        });
      }

      function populateMetricMetaFieldsDropdown() {
        const dropdown = el('metric-meta-fields-dropdown');
        if (!dropdown || state.allMetricMetaKeys.length === 0) {
          if (dropdown) dropdown.innerHTML = '<div style="padding:4px;color:var(--text-muted);font-size:var(--font-xs);">No metric metadata fields found</div>';
          return;
        }
        dropdown.innerHTML = state.allMetricMetaKeys.map(k => {
          const checked = state.visibleMetricMetaFields[k] !== false ? 'checked' : '';
          return `<label><input type="checkbox" ${checked} data-mm-key="${escapeAttr(k)}" /> ${escapeHtml(formatFieldName(k))}</label>`;
        }).join('');
        dropdown.querySelectorAll('input[type="checkbox"]').forEach(cb => {
          cb.addEventListener('change', () => {
            state.visibleMetricMetaFields[cb.dataset.mmKey] = cb.checked;
            renderItems();
          });
        });
      }

      // #8: Export filtered items as CSV with column selector

      var _exportItems = null;

      function tryParseObj(val) {
        if (val && typeof val === 'object' && !Array.isArray(val)) return val;
        if (typeof val === 'string') {
          const s = val.trim();
          if (s.startsWith('{') && s.endsWith('}')) {
            try { const p = JSON.parse(s); if (p && typeof p === 'object' && !Array.isArray(p)) return p; } catch {}
            try { const f = s.replace(/'/g, '"').replace(/True/g, 'true').replace(/False/g, 'false').replace(/None/g, 'null'); const p2 = JSON.parse(f); if (p2 && typeof p2 === 'object' && !Array.isArray(p2)) return p2; } catch {}
          }
        }
        return null;
      }

      function discoverExportColumns(items) {
        const groups = [];
        const metricNames = state.allMetrics;
        const runNames = state.runs.map((r, i) => r.run?.run_name || `Run ${i + 1}`);

        const inputKeys = new Set(), expectedKeys = new Set(), outputKeys = new Set();
        for (const { rowData } of items) {
          for (const rd of rowData) {
            if (!rd) continue;
            const inpObj = tryParseObj(rd.input_full || rd.input);
            if (inpObj) { for (const k of Object.keys(inpObj)) inputKeys.add(k); }
            const expObj = tryParseObj(rd.expected_full || rd.expected);
            if (expObj) { for (const k of Object.keys(expObj)) expectedKeys.add(k); }
            const outObj = tryParseObj(rd.output_full || rd.output);
            if (outObj) { for (const k of Object.keys(outObj)) outputKeys.add(k); }
          }
        }

        const coreCols = [
          { key: 'item_id', label: 'Aligned Item ID', checked: true },
          { key: 'input', label: inputKeys.size > 0 ? 'Input (raw)' : 'Input', checked: inputKeys.size === 0 },
          { key: 'expected', label: expectedKeys.size > 0 ? 'Expected Output (raw)' : 'Expected Output', checked: expectedKeys.size === 0 },
        ];
        groups.push({ group: 'Shared Fields', columns: coreCols });

        if (inputKeys.size > 0) {
          groups.push({ group: 'Input Fields', columns: Array.from(inputKeys).sort().map(k =>
            ({ key: 'input.' + k, label: k, checked: true })
          ) });
        }
        if (expectedKeys.size > 0) {
          groups.push({ group: 'Expected Output Fields', columns: Array.from(expectedKeys).sort().map(k =>
            ({ key: 'expected.' + k, label: k, checked: true })
          ) });
        }

        // Item metadata (shared)
        const metaKeySet = new Set();
        for (const { rowData } of items) {
          const inputRow = rowData.find(r => r);
          const md = inputRow?.item_metadata || {};
          if (typeof md === 'object') {
            for (const k of Object.keys(md)) { if (k !== 'task_started_at_ms') metaKeySet.add(k); }
          }
        }
        if (metaKeySet.size > 0) {
          groups.push({ group: 'Item Metadata', columns: Array.from(metaKeySet).sort().map(k =>
            ({ key: 'meta:' + k, label: k, checked: true })
          ) });
        }

        // Collect metric_meta keys per metric
        const metricMetaKeys = {};
        for (const m of metricNames) metricMetaKeys[m] = new Set();
        for (const { rowData } of items) {
          for (const rd of rowData) {
            if (!rd) continue;
            const mm = rd.metric_meta || {};
            for (const m of metricNames) {
              const meta = mm[m] || {};
              for (const k of Object.keys(meta)) {
                if (!['modified', 'original_score'].includes(k)) metricMetaKeys[m].add(k);
              }
            }
          }
        }

        // Per-run groups
        for (let ri = 0; ri < state.runs.length; ri++) {
          const rn = runNames[ri];
          const runCols = [
            { key: 'run:' + ri + ':output', label: outputKeys.size > 0 ? 'Output (raw)' : 'Output', checked: outputKeys.size === 0 },
          ];
          for (const k of Array.from(outputKeys).sort()) {
            runCols.push({ key: 'run:' + ri + ':output.' + k, label: 'Output > ' + k, checked: true });
          }
          runCols.push({ key: 'run:' + ri + ':status', label: 'Status', checked: true });
          runCols.push({ key: 'run:' + ri + ':root_cause', label: 'Root Cause', checked: true });
          for (const m of metricNames) {
            runCols.push({ key: 'run:' + ri + ':' + m + '_score', label: m + ' Score', checked: true });
            for (const k of Array.from(metricMetaKeys[m]).sort()) {
              runCols.push({ key: 'run:' + ri + ':' + m + ':' + k, label: m + ' > ' + k, checked: true });
            }
          }
          runCols.push({ key: 'run:' + ri + ':latency_ms', label: 'Latency (ms)', checked: true });
          runCols.push({ key: 'run:' + ri + ':trace_url', label: 'Trace URL', checked: true });
          groups.push({ group: rn, columns: runCols });
        }

        return groups;
      }

      function renderExportModal(groups) {
        let overlay = document.getElementById('export-modal-overlay');
        if (!overlay) {
          overlay = document.createElement('div');
          overlay.id = 'export-modal-overlay';
          overlay.className = 'export-modal-overlay';
          document.body.appendChild(overlay);
        }
        let html = '<div class="export-modal"><div class="export-modal-header"><h3>Select Export Columns</h3><div class="export-modal-actions-top"><button id="export-select-all">Select All</button><button id="export-deselect-all">Deselect All</button></div></div><div class="export-modal-body">';
        for (let gi = 0; gi < groups.length; gi++) {
          const g = groups[gi];
          html += `<div class="export-group"><div class="export-group-header" data-group="${gi}"><span class="group-toggle">\u25BC</span><span class="group-name">${escapeHtml(g.group)}</span><input type="checkbox" class="group-check" data-group="${gi}" checked /></div><div class="export-group-items" data-group="${gi}">`;
          for (let ci = 0; ci < g.columns.length; ci++) {
            const col = g.columns[ci];
            const chk = col.checked ? ' checked' : '';
            const cls = col.indent ? ' indent' : '';
            html += `<label class="export-col-item${cls}"><input type="checkbox" data-group="${gi}" data-col="${ci}"${chk} /> ${escapeHtml(col.label)}</label>`;
          }
          html += '</div></div>';
        }
        html += `</div><div class="export-modal-footer"><span style="flex:1;font-size:var(--font-xs);color:var(--text-muted);font-family:var(--font-mono);">${_exportItems.length} item${_exportItems.length !== 1 ? 's' : ''}</span><button class="export-cancel" id="export-modal-cancel">Cancel</button><button class="export-confirm" id="export-modal-confirm">Export</button></div></div>`;
        overlay.innerHTML = html;

        overlay.querySelectorAll('.export-group-header').forEach(hdr => {
          hdr.addEventListener('click', e => {
            if (e.target.type === 'checkbox') return;
            const gi = hdr.dataset.group;
            const items = overlay.querySelector('.export-group-items[data-group="' + gi + '"]');
            const toggle = hdr.querySelector('.group-toggle');
            items.classList.toggle('collapsed');
            toggle.classList.toggle('collapsed');
          });
        });

        overlay.querySelectorAll('.group-check').forEach(gc => {
          gc.addEventListener('change', () => {
            overlay.querySelectorAll('input[data-group="' + gc.dataset.group + '"][data-col]').forEach(cb => { cb.checked = gc.checked; });
          });
        });

        document.getElementById('export-select-all').addEventListener('click', () => {
          overlay.querySelectorAll('input[type="checkbox"]').forEach(cb => { cb.checked = true; });
        });
        document.getElementById('export-deselect-all').addEventListener('click', () => {
          overlay.querySelectorAll('input[type="checkbox"]').forEach(cb => { cb.checked = false; });
        });

        document.getElementById('export-modal-cancel').addEventListener('click', () => { overlay.classList.remove('open'); });
        overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('open'); });

        document.getElementById('export-modal-confirm').addEventListener('click', () => {
          const selectedCols = [];
          for (let gi = 0; gi < groups.length; gi++) {
            for (let ci = 0; ci < groups[gi].columns.length; ci++) {
              const cb = overlay.querySelector(`input[data-group="${gi}"][data-col="${ci}"]`);
              if (cb && cb.checked) selectedCols.push(groups[gi].columns[ci]);
            }
          }
          overlay.classList.remove('open');
          if (selectedCols.length > 0) performExport(_exportItems, selectedCols);
        });

        overlay.classList.add('open');
      }

      function getCompareExportCellValue(itemId, rowData, colKey) {
        const inputRow = rowData.find(r => r);

        if (colKey === 'item_id') return itemId;
        if (colKey === 'input') return stringify(inputRow?.input_full || inputRow?.input || '');
        if (colKey === 'expected') return stringify(inputRow?.expected_full || inputRow?.expected || '');

        if (colKey.startsWith('input.')) {
          const obj = tryParseObj(inputRow?.input_full || inputRow?.input);
          return obj ? stringify(obj[colKey.slice(6)]) : '';
        }
        if (colKey.startsWith('expected.')) {
          const obj = tryParseObj(inputRow?.expected_full || inputRow?.expected);
          return obj ? stringify(obj[colKey.slice(9)]) : '';
        }

        if (colKey.startsWith('meta:')) {
          const md = inputRow?.item_metadata || {};
          const val = md[colKey.slice(5)];
          return val == null ? '' : (typeof val === 'object' ? JSON.stringify(val) : String(val));
        }

        // Per-run columns: run:INDEX:field
        const runMatch = colKey.match(/^run:(\d+):(.+)$/);
        if (runMatch) {
          const ri = parseInt(runMatch[1]);
          const field = runMatch[2];
          const rd = rowData[ri];
          if (!rd) return '';

          if (field === 'output') return stringify(rd.output_full || rd.output || '');
          if (field.startsWith('output.')) {
            const obj = tryParseObj(rd.output_full || rd.output);
            return obj ? stringify(obj[field.slice(7)]) : '';
          }
          if (field === 'status') return rd.status || '';
          if (field === 'root_cause') return String((rd.item_metadata || {}).root_cause || '');
          if (field === 'latency_ms') return String(rd.latency_ms || '');
          if (field === 'trace_url') return rd.trace_url || '';

          if (field.endsWith('_score')) {
            const m = field.slice(0, -6);
            const run = state.runs[ri];
            const mNames = run?.snapshot?.metric_names || run?.run?.metric_names || [];
            const mIdx = mNames.indexOf(m);
            return mIdx >= 0 ? String((rd.metric_values || [])[mIdx] ?? '') : '';
          }

          // metric:metakey
          const cIdx = field.indexOf(':');
          if (cIdx > 0) {
            const m = field.slice(0, cIdx);
            const k = field.slice(cIdx + 1);
            const mm = rd.metric_meta || {};
            const val = (mm[m] || {})[k];
            return val == null ? '' : (typeof val === 'object' ? JSON.stringify(val) : String(val));
          }
        }

        return '';
      }

      function performExport(items, selectedCols) {
        const runNames = state.runs.map((r, i) => r.run?.run_name || `Run ${i + 1}`);
        const header = selectedCols.map(c => {
          const runMatch = c.key.match(/^run:(\d+):(.+)$/);
          if (runMatch) return runNames[parseInt(runMatch[1])] + ' / ' + c.label;
          return c.key;
        });
        const csvRows = [header.map(h => csvEscape(h)).join(',')];
        for (const { itemId, rowData } of items) {
          const r = selectedCols.map(c => csvEscape(getCompareExportCellValue(itemId, rowData, c.key)));
          csvRows.push(r.join(','));
        }
        const blob = new Blob(['\ufeff' + csvRows.join('\n')], { type: 'text/csv;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'compare_export.csv';
        a.click();
        URL.revokeObjectURL(url);
      }

      el('export-filtered-btn').addEventListener('click', () => {
        _exportItems = getFilteredItems();
        if (_exportItems.length === 0) return;
        const groups = discoverExportColumns(_exportItems);
        renderExportModal(groups);
      });

      function stringify(val) {
        if (val === null || val === undefined) return '';
        if (typeof val === 'object') return JSON.stringify(val);
        return String(val);
      }

      function csvEscape(val) {
        if (val.includes(',') || val.includes('"') || val.includes('\n')) {
          return '"' + val.replace(/"/g, '""') + '"';
        }
        return val;
      }

      // ── AI Evaluator Playground (compare view) ──────────────
      if (!IS_COMPARE_EXPORT && typeof QymPlayground !== 'undefined') {
      QymPlayground.init({
          apiUrl: apiUrl,
          getRunId: function () {
              // Use first run by default in compare mode
              if (!state.runs || state.runs.length === 0) return null;
              return state.runs[0]?.run?.file_path || state.runs[0]?.id;
          },
          getRows: function () {
              if (!state.runs || state.runs.length === 0) return [];
              var rows = state.runs[0]?.snapshot?.rows || [];
              var metric = state.selectedItemsMetric || state.selectedOverviewMetric;
              return rows.map(function (r) {
                  return {
                      item_id: r.item_id,
                      index: r.index,
                      input: r.input,
                      output: r.output,
                      expected: r.expected,
                      error: r.error,
                      item_metadata: r.item_metadata,
                      metric_metadata: metric ? ((r.metric_meta || {})[metric] || {}) : {},
                      metric_metadata_by_metric: r.metric_meta || {},
                      scores: r.scores || {},
                      metric_score: metric && r[metric] != null ? parseFloat(r[metric]) : null,
                  };
              });
          },
          getMetric: function () { return state.selectedItemsMetric || state.selectedOverviewMetric; },
          getThreshold: function () {
              var m = state.selectedItemsMetric || state.selectedOverviewMetric;
              return state.metricThresholds[m] || 0.8;
          },
          onAnalysisComplete: function (data) {
              if (!state.runs || state.runs.length === 0) return;
              var snapshot = state.runs[0]?.snapshot || {};
              var rows = snapshot.rows || [];
              for (var i = 0; i < (data.results || []).length; i++) {
                  var result = data.results[i];
                  var row = rows.find(function (r) { return r.item_id === result.item_id; });
                  if (row) {
                      if (!row.item_metadata) row.item_metadata = {};
                      row.item_metadata.root_cause = result.root_cause;
                      row.item_metadata.root_cause_note = result.root_cause_note;
                      row.item_metadata.root_cause_source = 'ai';
                      row.item_metadata.root_cause_confidence = result.confidence;
                  }
              }
              // Update root cause values
              for (var j = 0; j < (data.results || []).length; j++) {
                  var res = data.results[j];
                  if (res.root_cause && !state.rootCauseValues.includes(res.root_cause)) {
                      state.rootCauseValues.push(res.root_cause);
                  }
              }
              state.rootCauseValues.sort();
              if (typeof buildCategoryDropdowns === 'function') buildCategoryDropdowns();
              renderItems();
          },
          showToast: showToast,
          escapeHtml: escapeHtml,
      });
      }

      function escapeInlineScriptContent(content) {
        return String(content || '').replace(/<\/script/gi, '<\\/script');
      }

      async function fetchStaticTextForExport(assetPath) {
        const assetUrl = new URL(assetPath, window.location.href);
        const resp = await fetch(assetUrl.href, { credentials: 'same-origin' });
        if (!resp.ok) throw new Error('Failed to load export asset: ' + assetPath);
        return await resp.text();
      }

      async function inlineCompareExportAssets(html) {
        const stylesheetTags = Array.from(html.matchAll(/<link\s+rel="stylesheet"\s+href="((?:\.\/|\/)static\/(?:dashboard|shell)\.css(?:\?[^"]*)?)"\s*>/g));
        for (const match of stylesheetTags) {
          const css = await fetchStaticTextForExport(match[1]);
          html = html.replace(match[0], () => '<style>\n' + css + '\n</style>');
        }

        const scriptTags = Array.from(html.matchAll(/<script\s+src="((?:\.\/|\/)static\/(?:metrics|trace_viewer)\.js(?:\?[^"]*)?)"><\/script>/g));
        for (const match of scriptTags) {
          const js = await fetchStaticTextForExport(match[1]);
          html = html.replace(match[0], () => '<script>\n' + escapeInlineScriptContent(js) + '\n</' + 'script>');
        }

        html = html.replace(/\s*<script\s+src="(?:\.\/|\/)static\/(?:auth|shell|playground)\.js(?:\?[^"]*)?"><\/script>\s*/g, '\n');
        html = html.replace(/\s*<link\s+rel="icon"\s+type="image\/png"\s+href="(?:\.\/|\/)static\/qym_icon\.png(?:\?[^"]*)?">\s*/g, '\n');
        return html;
      }

      // ── Share button (export comparison as self-contained HTML) ──
      var shareBtn = el('export-share-btn');
      if (shareBtn) {
        shareBtn.addEventListener('click', async function() {
          try {
            shareBtn.disabled = true;
            shareBtn.textContent = 'Exporting...';

            // Serialize current state data
            const exportData = {
              runs: state.runs.map(r => ({
                run: r.run,
                snapshot: r.snapshot
              }))
            };
            const dataJson = JSON.stringify(exportData);

            // Fetch the current page HTML
            const resp = await fetch(window.location.href);
            let html = await resp.text();
            html = await inlineCompareExportAssets(html);

            // Inject export data and mode flag before closing </head>
            const exportScript = '<script>window.__QYM_COMPARE_EXPORT__ = true; window.__QYM_COMPARE_DATA__ = ' +
              dataJson.replace(/<\//g, '<\\/') + ';</' + 'script>';
            html = html.replace('</head>', exportScript + '</head>');

            // Create downloadable blob
            const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'compare_export.html';
            a.click();
            URL.revokeObjectURL(url);

            showToast('success', 'Export Ready', 'HTML comparison downloaded.');
          } catch (err) {
            console.error('Export failed:', err);
            showToast('error', 'Export Failed', err.message);
          } finally {
            shareBtn.disabled = false;
            shareBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg> Share';
          }
        });
      }

      // Initialize
      loadHeaderUser();
      loadComparisonData();
    })();
  </script>
</body>
