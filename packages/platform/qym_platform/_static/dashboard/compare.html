        '#fbbf24', '#60a5fa', '#34d399', '#fb923c'
      ];
      const GROUPED_OUTCOME_ITEM_FILTER_PREFIX = 'grouped:';
      const GROUPED_OUTCOME_BUCKETS = [
        { key: 'a_sweeps_b', title: 'A Sweeps B' },
        { key: 'b_sweeps_a', title: 'B Sweeps A' },
        { key: 'both_pass', title: 'Both Pass' },
        { key: 'both_fail', title: 'Both Fail' },
      ];

      const ROOT_CAUSE_PRESETS = [
        'Hallucination',
        'Incomplete Answer',
        'Wrong Format',
        'Context Missing',
        'Reasoning Error',
        'Tool Use Error',
        'Instruction Following',
        'Knowledge Gap',
      ];

      const ROOT_CAUSE_COLORS = {
        'Hallucination': '#ef4444',
        'Incomplete Answer': '#f97316',
        'Wrong Format': '#eab308',
        'Context Missing': '#3b82f6',
        'Reasoning Error': '#a855f7',
        'Tool Use Error': '#ec4899',
        'Instruction Following': '#14b8a6',
        'Knowledge Gap': '#6366f1',
      };

      const SOLUTION_PRESETS = [
        'Improve Retrieval Context', 'Add Guardrails', 'Refine Prompt Instructions',
        'Expand Training Data', 'Fix Tool Configuration', 'Add Output Validation',
        'Restructure Chain-of-Thought', 'Update Knowledge Base',
      ];
      const SOLUTION_COLORS = {
        'Improve Retrieval Context': '#3b82f6', 'Add Guardrails': '#10b981',
        'Refine Prompt Instructions': '#f97316', 'Expand Training Data': '#0ea5e9',
        'Fix Tool Configuration': '#ec4899', 'Add Output Validation': '#00d4aa',
        'Restructure Chain-of-Thought': '#a855f7', 'Update Knowledge Base': '#6366f1',
      };

      const state = {
        runs: [],
        allMetrics: [],
        selectedOverviewMetric: null,  // For Comparison Overview tabs
        selectedItemsMetric: null,     // For Item-by-Item filters
        itemFilter: 'all',
        winnerFilter: 'any',
        approvalFilter: null,
        approvalValues: ['approved', 'not_approved'],
        page: 1,
        pageSize: 20,
        comparisonStats: {},  // Now keyed by metric name
        metricThresholds: {},  // Per-metric threshold for "correct" (0-1 scale)
        metricIsBoolean: {},   // Per-metric flag: true if all scores are 0 or 1
        langfuseHost: '',      // Langfuse host URL
        langfuseProjectId: '', // Langfuse project ID
        // Group A additions
        searchQuery: '',              // #19: search items by input text
        complexityFilter: null,       // #2: null = all (default), [] = none, [...] = specific values
        domainFilter: null,           // #2: null = all (default), [] = none, [...] = specific values
        domainFilterMode: 'include',  // include = explicit matches, exclude = all except selected values
        domainExclusive: new Set(),  // domains that must be sole value
        complexityValues: [],         // unique complexity values found in data
        domainValues: [],             // unique domain values found in data
        passRateOp: '',               // #20: '' = any, 'gte' = at least, 'lte' = at most, 'eq' = exactly
        passRateValue: 0,             // #20: the number for the pass rate filter
        allMetadataKeys: [],          // collected metadata keys across all items
        selectedCategories: new Set(),   // which metadata keys to show as breakdowns
        categoryFilters: {},             // custom category filters: key -> null|[values]
        visibleMetadataFields: {},    // #6: which metadata fields to show (key -> bool)
        allMetricMetaKeys: [],
        visibleMetricMetaFields: {},
        rootCauseFilter: null,        // null = all, [] = none, [...] = specific values
        taskErrorFilter: null,
        traceErrorFilter: null,
        analysisErrorFilter: null,
        rootCauseValues: [],          // unique root cause values found in data
        rcCountMode: 'total',         // 'total' or 'unique' for root cause breakdown cards
        sortBy: 'index',              // index, score_asc, score_desc, latency_asc, latency_desc
        activeCompareTab: 'compare',
        compareAlignmentStatus: 'aligned',
        compareAlignmentIssues: [],
        compareItemIds: [],
        hasRenderedItems: false,
        groupedOutcomeGroups: null,
        explicitGroupedOutcomeGroups: null,
        groupedComparisonCache: {},
        sweepReverse: false,
        sweepMoveFilter: 'all',
        sweepOutcomeFilter: 'all',
        sweepSearchQuery: '',
        sweepMetadataKey: 'all',
        sweepMetadataMode: 'include',
        sweepMetadataValues: null,
        sweepMetadataExclusiveValues: new Set(),
        sweepTableSortKey: 'default',
        sweepTableSortDir: 'desc',
        sweepBreakdownSortKey: 'count',
        sweepBreakdownSortDir: 'desc',
        groupedOutcomeLabelOverrides: { left: '', right: '' },
      };

      const el = (id) => document.getElementById(id);

      function getGroupedOutcomeBucket(bucketKey) {
        return GROUPED_OUTCOME_BUCKETS.find(bucket => bucket.key === bucketKey) || null;
      }

      function groupedOutcomeFilterValue(bucketKey) {
        return `${GROUPED_OUTCOME_ITEM_FILTER_PREFIX}${bucketKey}`;
      }

      function getCompareRunDataId(runData) {
        return runData?.run?.file_path || runData?.run?.run_id || '';
      }

      function stripProviderFromCompareRunId(runId) {
        if (!runId) return '';
        const slashIdx = runId.indexOf('/');
        if (slashIdx < 0) return runId;
        const beforeSlash = runId.slice(0, slashIdx);
        const lastDash = beforeSlash.lastIndexOf('-');
        if (lastDash < 0) return runId.slice(slashIdx + 1);
        return beforeSlash.slice(0, lastDash + 1) + runId.slice(slashIdx + 1);
      }

      function truncateMiddle(value, maxLength = 64) {
        const text = String(value || '').trim();
        if (!text || text.length <= maxLength) return text;
        const keep = Math.max(10, Math.floor((maxLength - 1) / 2));
        return `${text.slice(0, keep)}…${text.slice(-keep)}`;
      }

      function getCompareRunDisplayNameById(runId, fallbackIndex = null) {
        const match = (state.runs || []).find((runData) => getCompareRunDataId(runData) === runId);
        if (match?.run?.run_name) return String(match.run.run_name).trim();
        if (match?.run?.run_id) return stripProviderFromCompareRunId(String(match.run.run_id).trim());
        if (typeof runId === 'string' && runId.trim()) {
          const cleaned = stripProviderFromCompareRunId(runId).split('/').filter(Boolean).pop();
          if (cleaned) return cleaned;
        }
        if (fallbackIndex !== null) return `Run ${fallbackIndex + 1}`;
        return '';
      }

      function looksLikeOpaqueRunId(value) {
        const text = String(value || '').trim();
        if (!text) return true;
        return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(text);
      }

      function trimSharedBoundary(text) {
        return String(text || '').replace(/[-_\s.,/:]+$/g, '').trim();
      }

      function longestCommonPrefix(values) {
        const list = (values || []).filter(Boolean);
        if (!list.length) return '';
        let prefix = list[0];
        for (let i = 1; i < list.length && prefix; i += 1) {
          const value = list[i];
          let j = 0;
          const limit = Math.min(prefix.length, value.length);
          while (j < limit && prefix[j] === value[j]) j += 1;
          prefix = prefix.slice(0, j);
        }
        return trimSharedBoundary(prefix);
      }

      function toTitleLikeLabel(text) {
        return String(text || '')
          .split(/\s+/)
          .filter(Boolean)
          .map((part) => {
            if (/^\d+$/.test(part)) return part;
            if (part.length <= 3 && /^[a-z0-9]+$/i.test(part)) return part.toUpperCase();
            return part.charAt(0).toUpperCase() + part.slice(1).toLowerCase();
          })
          .join(' ');
      }

      function cleanCohortSourceLabel(rawLabel) {
        let text = String(rawLabel || '').trim();
        if (!text) return '';
        text = stripProviderFromCompareRunId(text);
        text = text.replace(/^[a-z0-9]+_[a-f0-9]{6,}_/i, '');
        text = text.replace(/[-_](?:gpt|qwen|claude|gemini|llama|mistral|deepseek|grok|o[1-9]|sonnet|haiku|opus)\b.*$/i, '');
        text = text.replace(/[-_]\d{6,}(?:[-_]\d+)*$/i, '');
        text = text.replace(/[-_](?:run|attempt|trial|seed)\d*$/i, '');
        text = text.replace(/^[-_\s]+|[-_\s]+$/g, '');
        text = text.replace(/[_-]+/g, ' ');
        text = text.replace(/\s+/g, ' ').trim();
        return toTitleLikeLabel(text);
      }

      function isGenericCohortLabel(label) {
        const normalized = String(label || '').trim().toLowerCase();
        return normalized === 'cohort a'
          || normalized === 'cohort b'
          || normalized === 'model a'
          || normalized === 'model b'
          || normalized === 'left cohort'
          || normalized === 'right cohort';
      }

      function deriveExplicitCohortLabel(runIds, providedLabel = '') {
        const label = String(providedLabel || '').trim();
        if (label && !isGenericCohortLabel(label) && !label.includes(',') && !/\+\d+$/.test(label)) {
          return label;
        }
        const names = (Array.isArray(runIds) ? runIds : [])
          .map((runId, idx) => getCompareRunDisplayNameById(runId, idx))
          .filter(Boolean);
        if (!names.length) return '';
        if (names.length === 1) return names[0];

        const nonOpaqueNames = names.filter(name => !looksLikeOpaqueRunId(name));
        const sourceNames = nonOpaqueNames.length ? nonOpaqueNames : names;
        const sharedStem = longestCommonPrefix(sourceNames);
        if (sharedStem && sharedStem.length >= 8 && !looksLikeOpaqueRunId(sharedStem)) {
          return sharedStem;
        }

        const uniqueNames = [...new Set(sourceNames)];
        if (uniqueNames.length === 1) {
          return uniqueNames[0];
        }

        if (uniqueNames.length >= 2) {
          return uniqueNames[0];
        }

        return 'Cohort';
      }

      function getCurrentGroupedOutcomeLabels() {
        const groups = state.groupedOutcomeGroups || {};
        return {
          left: groups.modelALabel || deriveExplicitCohortLabel(groups.leftRunIds || [], ''),
          right: groups.modelBLabel || deriveExplicitCohortLabel(groups.rightRunIds || [], ''),
        };
      }

      function persistExplicitCohortLabels() {
        if (!state.explicitGroupedOutcomeGroups) return;
        const explicit = state.explicitGroupedOutcomeGroups;
        const payload = {
          left: explicit.leftRunIds || [],
          right: explicit.rightRunIds || [],
          leftLabel: explicit.modelALabel || '',
          rightLabel: explicit.modelBLabel || '',
        };
        sessionStorage.setItem('compareCohorts', JSON.stringify(payload));
        _updateCompareUrl(
          [...(explicit.leftRunIds || []), ...(explicit.rightRunIds || [])],
          payload
        );
      }

      function renameGroupedOutcomeLabel(side, nextLabel) {
        const normalizedSide = side === 'right' ? 'right' : 'left';
        const trimmed = String(nextLabel || '').trim();

        if (state.explicitGroupedOutcomeGroups) {
          if (normalizedSide === 'left') {
            state.explicitGroupedOutcomeGroups.modelALabel = trimmed || deriveExplicitCohortLabel(state.explicitGroupedOutcomeGroups.leftRunIds || [], '');
          } else {
            state.explicitGroupedOutcomeGroups.modelBLabel = trimmed || deriveExplicitCohortLabel(state.explicitGroupedOutcomeGroups.rightRunIds || [], '');
          }
          persistExplicitCohortLabels();
        } else {
          state.groupedOutcomeLabelOverrides[normalizedSide] = trimmed;
        }

        inferGroupedOutcomeGroups();
        renderCompareCohortBanner();
        populateItemFilterOptions();
        renderCompareModeTabs();
        renderSweepView();
        renderItems();
      }

      function normalizeExplicitCohortPayload(payload) {
        const left = Array.isArray(payload?.left) ? payload.left.filter(Boolean) : [];
        const right = Array.isArray(payload?.right) ? payload.right.filter(Boolean) : [];
        if (left.length < 1 || right.length < 1 || left.length !== right.length) return null;
        return {
          left,
          right,
          leftLabel: String(payload?.leftLabel || '').trim(),
          rightLabel: String(payload?.rightLabel || '').trim(),
        };
      }

      function ensureGroupedOutcomeBucketsHelper() {
        if (!window.QymMetrics || typeof window.QymMetrics.getRowScore !== 'function') return;
        if (typeof window.QymMetrics.calculateGroupedOutcomeBuckets === 'function') return;

        window.QymMetrics.calculateGroupedOutcomeBuckets = function calculateGroupedOutcomeBuckets(options) {
          const {
            runsData,
            leftRunIds,
            rightRunIds,
            threshold,
            getMetricIndex,
            getItemId,
            getRunId,
          } = options || {};

          const bucketKeys = ['a_sweeps_b', 'b_sweeps_a', 'both_pass', 'both_fail'];
          const result = {
            eligibleItems: 0,
            leftRunCount: Array.isArray(leftRunIds) ? leftRunIds.length : 0,
            rightRunCount: Array.isArray(rightRunIds) ? rightRunIds.length : 0,
            buckets: bucketKeys.reduce((acc, key) => {
              acc[key] = { count: 0, percentage: 0, itemIds: [] };
              return acc;
            }, {}),
          };

          if (!Array.isArray(runsData) || !runsData.length) return result;
          if (!Array.isArray(leftRunIds) || !leftRunIds.length) return result;
          if (!Array.isArray(rightRunIds) || !rightRunIds.length) return result;
          if (typeof getMetricIndex !== 'function' || typeof getItemId !== 'function' || typeof getRunId !== 'function') {
            return result;
          }

          const runMap = new Map();
          runsData.forEach((runData) => {
            const runId = getRunId(runData);
            if (runId !== undefined && runId !== null && !runMap.has(runId)) {
              runMap.set(runId, runData);
            }
          });

          const leftRuns = leftRunIds.map(runId => runMap.get(runId)).filter(Boolean);
          const rightRuns = rightRunIds.map(runId => runMap.get(runId)).filter(Boolean);
          if (leftRuns.length !== leftRunIds.length || rightRuns.length !== rightRunIds.length) {
            return result;
          }

          const selectedRuns = [...leftRuns, ...rightRuns];
          const itemIds = new Set();
          selectedRuns.forEach((runData) => {
            const rows = runData?.snapshot?.rows || [];
            rows.forEach((row) => {
              const itemId = getItemId(row);
              if (itemId !== undefined && itemId !== null && itemId !== '') itemIds.add(itemId);
            });
          });

          let currentItemId = null;
          function collectPasses(groupRuns) {
            const values = [];
            for (const runData of groupRuns) {
              const rows = runData?.snapshot?.rows || [];
              const row = rows.find(candidate => getItemId(candidate) === currentItemId);
              if (!row) return null;
              const metricIdx = getMetricIndex(runData);
              if (metricIdx < 0) return null;
              const { score } = window.QymMetrics.getRowScore(row, metricIdx);
              if (score === null) return null;
              values.push(score >= threshold);
            }
            return values;
          }

          itemIds.forEach((itemId) => {
            currentItemId = itemId;
            const leftPasses = collectPasses(leftRuns);
            if (!leftPasses || leftPasses.length !== leftRuns.length) return;
            const rightPasses = collectPasses(rightRuns);
            if (!rightPasses || rightPasses.length !== rightRuns.length) return;

            result.eligibleItems += 1;

            const leftAllPass = leftPasses.every(Boolean);
            const leftAllFail = leftPasses.every(value => !value);
            const rightAllPass = rightPasses.every(Boolean);
            const rightAllFail = rightPasses.every(value => !value);

            let bucketKey = null;
            if (leftAllPass && rightAllFail) bucketKey = 'a_sweeps_b';
            else if (leftAllFail && rightAllPass) bucketKey = 'b_sweeps_a';
            else if (leftAllPass && rightAllPass) bucketKey = 'both_pass';
            else if (leftAllFail && rightAllFail) bucketKey = 'both_fail';

            if (!bucketKey) return;
            result.buckets[bucketKey].count += 1;
            result.buckets[bucketKey].itemIds.push(itemId);
          });

          bucketKeys.forEach((key) => {
            result.buckets[key].percentage = result.eligibleItems > 0
              ? result.buckets[key].count / result.eligibleItems
              : 0;
          });

          return result;
        };
      }

      ensureGroupedOutcomeBucketsHelper();

      function inferGroupedOutcomeGroups() {
        state.groupedOutcomeGroups = null;
        if (state.explicitGroupedOutcomeGroups) {
          const explicit = state.explicitGroupedOutcomeGroups;
          state.groupedOutcomeGroups = {
            leftRunIds: explicit.leftRunIds || [],
            rightRunIds: explicit.rightRunIds || [],
            modelALabel: deriveExplicitCohortLabel(explicit.leftRunIds || [], explicit.modelALabel),
            modelBLabel: deriveExplicitCohortLabel(explicit.rightRunIds || [], explicit.modelBLabel),
            k: explicit.k || Math.min((explicit.leftRunIds || []).length, (explicit.rightRunIds || []).length),
          };
          return;
        }
        const runsByModel = new Map();
        const modelOrder = [];

        for (const run of state.runs) {
          const modelName = String(run?.run?.model_name || '').trim();
          const runId = getCompareRunDataId(run);
          if (!modelName || !runId) return;
          if (!runsByModel.has(modelName)) {
            runsByModel.set(modelName, []);
            modelOrder.push(modelName);
          }
          runsByModel.get(modelName).push(runId);
        }

        if (modelOrder.length !== 2) return;
        const [leftModel, rightModel] = modelOrder;
        const leftRunIds = runsByModel.get(leftModel) || [];
        const rightRunIds = runsByModel.get(rightModel) || [];
        if (!leftRunIds.length || leftRunIds.length !== rightRunIds.length) return;

        state.groupedOutcomeGroups = {
          leftRunIds,
          rightRunIds,
          modelALabel: state.groupedOutcomeLabelOverrides.left || leftModel,
          modelBLabel: state.groupedOutcomeLabelOverrides.right || rightModel,
          k: leftRunIds.length,
        };
      }

      function getActiveGroupedOutcomeResults() {
        const groups = state.groupedOutcomeGroups;
        if (!groups) return null;
        const metricName = state.selectedItemsMetric;
        if (!metricName) return null;
        const metricType = state.metricTypes?.[metricName];
        if (metricType === 'numeric') return null;

        const threshold = state.metricIsBoolean[metricName]
          ? 0.9999
          : (state.metricThresholds[metricName] || 0.8);

        return window.QymMetrics.calculateGroupedOutcomeBuckets({
          runsData: state.runs,
          leftRunIds: groups.leftRunIds || [],
          rightRunIds: groups.rightRunIds || [],
          threshold,
          getMetricIndex: (runData) => {
            const metricNames = runData?.snapshot?.metric_names || runData?.run?.metric_names || [];
            return metricNames.indexOf(metricName);
          },
          getItemId: (row) => row?.item_id || row?.compare_item_id || String(row?.index ?? ''),
          getRunId: getCompareRunDataId,
        });
      }

      function canShowSweepTab() {
        if (!state.groupedOutcomeGroups) return false;
        if (!canRenderItemComparison()) return false;
        const metricName = state.selectedOverviewMetric;
        if (!metricName) return false;
        return state.metricTypes?.[metricName] !== 'numeric';
      }

      function invalidateGroupedComparisonCache(metricName) {
        if (!metricName) {
          state.groupedComparisonCache = {};
          return;
        }
        delete state.groupedComparisonCache[metricName];
      }

      function getActiveGroupedComparison() {
        if (!canShowSweepTab()) return null;
        const metricName = state.selectedOverviewMetric;
        if (!metricName) return null;
        if (state.groupedComparisonCache[metricName]) {
          return state.groupedComparisonCache[metricName];
        }

        const groups = state.groupedOutcomeGroups;
        const threshold = state.metricIsBoolean[metricName]
          ? 0.9999
          : (state.metricThresholds[metricName] || 0.8);

        const result = window.QymMetrics.calculateGroupedCohortComparison({
          runsData: state.runs,
          leftRunIds: groups.leftRunIds || [],
          rightRunIds: groups.rightRunIds || [],
          threshold,
          getMetricIndex: (runData) => {
            const metricNames = runData?.snapshot?.metric_names || runData?.run?.metric_names || [];
            return metricNames.indexOf(metricName);
          },
          getItemId: getRowCompareId,
          getRunId: getCompareRunDataId,
        });
        state.groupedComparisonCache[metricName] = result;
        return result;
      }

      function renderCompareModeTabs() {
        const container = el('compare-mode-tabs');
        if (!container) return;
        const showSweep = canShowSweepTab();
        if (!showSweep && state.activeCompareTab === 'sweep') {
          state.activeCompareTab = 'compare';
        }

        const tabs = [
          { key: 'compare', label: 'Compare' },
          ...(showSweep ? [{ key: 'sweep', label: 'Sweep' }] : []),
        ];

        container.innerHTML = tabs.map(tab => `
          <button class="compare-mode-tab ${state.activeCompareTab === tab.key ? 'active' : ''}" data-compare-tab="${tab.key}">
            ${escapeHtml(tab.label)}
          </button>
        `).join('');

        container.querySelectorAll('[data-compare-tab]').forEach(btn => {
          btn.addEventListener('click', () => {
            state.activeCompareTab = btn.dataset.compareTab || 'compare';
            applyCompareMode();
          });
        });
      }

      function renderCompareCohortBanner() {
        const container = el('compare-cohort-banner');
        if (!container) return;

        const groups = state.groupedOutcomeGroups;
        if (!groups || !Array.isArray(groups.leftRunIds) || !Array.isArray(groups.rightRunIds) || !groups.leftRunIds.length || !groups.rightRunIds.length) {
          container.style.display = 'none';
          container.innerHTML = '';
          return;
        }

        const leftLabel = groups.modelALabel || deriveExplicitCohortLabel(groups.leftRunIds || [], '');
        const rightLabel = groups.modelBLabel || deriveExplicitCohortLabel(groups.rightRunIds || [], '');
        const leftCount = Array.isArray(groups.leftRunIds) ? groups.leftRunIds.length : 0;
        const rightCount = Array.isArray(groups.rightRunIds) ? groups.rightRunIds.length : 0;
        container.style.display = 'flex';
        container.innerHTML = `
          <span class="compare-cohort-label">Compare Sides</span>
          <div class="compare-cohort-grid">
            <span class="compare-cohort-pill" data-cohort-side="left" title="${escapeAttr(`${leftLabel}\nDouble-click to rename`) }">
              <span class="cohort-key">A / Left</span>
              <span class="cohort-name">${escapeHtml(leftLabel)}</span>
              <span class="cohort-meta">${leftCount} ${leftCount === 1 ? 'run' : 'runs'}</span>
            </span>
            <span class="compare-cohort-pill" data-cohort-side="right" title="${escapeAttr(`${rightLabel}\nDouble-click to rename`) }">
              <span class="cohort-key">B / Right</span>
              <span class="cohort-name">${escapeHtml(rightLabel)}</span>
              <span class="cohort-meta">${rightCount} ${rightCount === 1 ? 'run' : 'runs'}</span>
            </span>
          </div>
        `;

        container.querySelectorAll('[data-cohort-side]').forEach((pill) => {
          pill.addEventListener('dblclick', () => {
            const side = pill.dataset.cohortSide === 'right' ? 'right' : 'left';
            const current = side === 'right' ? rightLabel : leftLabel;
            const next = window.prompt(`Rename ${side === 'right' ? 'B / Right' : 'A / Left'}`, current);
            if (next === null) return;
            renameGroupedOutcomeLabel(side, next);
          });
        });
      }

      function applyCompareMode() {
        const mainPanel = el('compare-main-panel');
        const sweepPanel = el('compare-sweep-panel');
        const showSweep = canShowSweepTab() && state.activeCompareTab === 'sweep';
        if (mainPanel) mainPanel.classList.toggle('active', !showSweep);
        if (sweepPanel) sweepPanel.classList.toggle('active', showSweep);
      }

      function formatSweepMetricValue(value) {
        if (value === undefined || value === null || isNaN(value)) return '—';
        return `${(Number(value) * 100).toFixed(1)}%`;
      }

      function formatSweepAttemptsDelta(value) {
        if (value === undefined || value === null || isNaN(value)) return '—';
        const rounded = Math.abs(value) < 0.005 ? 0 : value;
        const prefix = rounded > 0 ? '+' : '';
        return `${prefix}${rounded.toFixed(2)}`;
      }

      function getDeltaClass(value) {
        if (value > 0.0005) return 'positive';
        if (value < -0.0005) return 'negative';
        return 'neutral';
      }

      function renderSweepDelta(value) {
        const deltaClass = getDeltaClass(value);
        const rounded = Math.abs(value) < 0.0005 ? 0 : value;
        const prefix = rounded > 0 ? '+' : '';
        return `<span class="sweep-delta-pill ${deltaClass}">${prefix}${(rounded * 100).toFixed(1)}%</span>`;
      }

      function renderSweepMetaBadges(item) {
        const metadata = item?.metadata || {};
        let html = '';
        const domains = getMetadataCategoryValues(metadata, 'domain');
        domains.slice(0, 3).forEach(domain => {
          html += `<span class="meta-badge badge-domain"><span class="badge-icon">◆</span>${escapeHtml(domain)}</span>`;
        });
        const complexity = metadata?.complexity ? String(metadata.complexity) : '';
        if (complexity) {
          let complexityClass = '';
          const norm = complexity.toLowerCase();
          if (norm === 'easy') complexityClass = ' complexity-easy';
          else if (norm === 'medium') complexityClass = ' complexity-medium';
          else if (norm === 'hard') complexityClass = ' complexity-hard';
          else if (norm === 'very hard' || norm === 'expert') complexityClass = ' complexity-expert';
          html += `<span class="meta-badge badge-complexity${complexityClass}"><span class="badge-icon">◈</span>${escapeHtml(complexity)}</span>`;
        }
        return html;
      }

      function formatSweepMetadataLabel(key) {
        const raw = String(key || '').trim();
        if (!raw) return 'Metadata';
        return raw
          .replace(/_/g, ' ')
          .replace(/\b\w/g, match => match.toUpperCase());
      }

      function getSweepMetadataKeys(items) {
        const keySet = new Set();
        (items || []).forEach((item) => {
          const metadata = item?.metadata || {};
          Object.keys(metadata).forEach((key) => {
            const values = getMetadataCategoryValues(metadata, key);
            if (values.length) keySet.add(key);
          });
        });
        return Array.from(keySet).sort((a, b) => formatSweepMetadataLabel(a).localeCompare(formatSweepMetadataLabel(b)));
      }

      function getSweepMetadataValues(items, key) {
        if (!key || key === 'all') return [];
        const valueSet = new Set();
        (items || []).forEach((item) => {
          const metadata = item?.metadata || {};
          getMetadataCategoryValues(metadata, key).forEach((value) => {
            if (value !== undefined && value !== null && value !== '') valueSet.add(String(value));
          });
        });
        return Array.from(valueSet).sort((a, b) => a.localeCompare(b));
      }

      function sweepMetadataKeySupportsExclusive(items, key) {
        if (!key || key === 'all') return false;
        if (isListCategoryKey(key)) return true;
        return (items || []).some((item) => Array.isArray(item?.metadata?.[key]));
      }

      function normalizeSweepMetadataValues(values, availableValues) {
        const available = Array.isArray(availableValues) ? availableValues : [];
        if (!Array.isArray(values)) return null;
        if (!available.length) return values.length ? [] : null;
        if (!values.length) return [];
        const normalized = values.filter(value => available.includes(value));
        if (!normalized.length) return [];
        if (normalized.length >= available.length) return null;
        return normalized;
      }

      function normalizeSweepMetadataExclusiveValues(values, availableValues) {
        const available = Array.isArray(availableValues) ? availableValues : [];
        if (!(values instanceof Set) || !available.length) return new Set();
        return new Set([...values].filter(value => available.includes(value)));
      }

      function getSweepMetadataTargetValues(availableValues, metadataMode = state.sweepMetadataMode, selectedValues = state.sweepMetadataValues) {
        const available = Array.isArray(availableValues) ? availableValues : [];
        if (!available.length || metadataMode === 'exclude') return [];
        if (!Array.isArray(selectedValues)) return [...available];
        return selectedValues.filter(value => available.includes(value));
      }

      function isSweepMetadataExclusiveOnlyActive(availableValues, metadataMode = state.sweepMetadataMode, selectedValues = state.sweepMetadataValues, exclusiveValues = state.sweepMetadataExclusiveValues) {
        const targets = getSweepMetadataTargetValues(availableValues, metadataMode, selectedValues);
        if (!targets.length || !(exclusiveValues instanceof Set)) return false;
        return exclusiveValues.size === targets.length && targets.every(value => exclusiveValues.has(value));
      }

      function getSweepMetadataValueButtonLabel(availableValues, metadataMode, selectedValues, exclusiveValues) {
        if (!availableValues.length) return 'No Values';
        if (metadataMode === 'exclude') {
          if (!Array.isArray(selectedValues) || !selectedValues.length) return 'All Values';
          if (selectedValues.length === 1) return `All except ${selectedValues[0]}`;
          return `Exclude ${selectedValues.length}`;
        }
        if (!Array.isArray(selectedValues)) return 'All Values';
        if (!selectedValues.length) return 'No Values';
        if (selectedValues.length === 1 && exclusiveValues instanceof Set && exclusiveValues.has(selectedValues[0])) {
          return `Only ${selectedValues[0]}`;
        }
        if (selectedValues.length === 1) return selectedValues[0];
        if (selectedValues.length === 2) return `${selectedValues[0]}, ${selectedValues[1]}`;
        return `${selectedValues.length} selected`;
      }

      function renderSweepPassTrack(passes) {
        const values = Array.isArray(passes) ? passes : [];
        const passCount = values.filter(Boolean).length;
        const failCount = Math.max(0, values.length - passCount);
        const dots = [
          ...new Array(passCount).fill('<span class="sweep-pass-dot pass"></span>'),
          ...new Array(failCount).fill('<span class="sweep-pass-dot"></span>'),
        ].join('');
        return `
          <div class="sweep-pass-cell">
            <div class="sweep-pass-track">${dots}</div>
            <span class="sweep-pass-count">${passCount}/${values.length}</span>
          </div>
        `;
      }

      function renderSweepStatCard(label, fromValue, toValue, deltaValue) {
        const deltaClass = getDeltaClass(deltaValue);
        return `
          <div class="sweep-stat-card ${deltaClass}">
            <div class="sweep-stat-label">${escapeHtml(label)}</div>
            <div class="sweep-stat-values">
              <span class="sweep-stat-from">${formatSweepMetricValue(fromValue)}</span>
              <span class="sweep-stat-arrow">→</span>
              <span class="sweep-stat-to">${formatSweepMetricValue(toValue)}</span>
            </div>
            ${renderSweepDelta(deltaValue)}
          </div>
        `;
      }

      function renderSortableHeader(label, key, activeKey, activeDir, dataAttr) {
        const isActive = activeKey === key;
        const arrow = isActive ? (activeDir === 'asc' ? '↑' : '↓') : '↕';
        return `<button type="button" class="sortable-col ${isActive ? 'active' : ''}" ${dataAttr}="${escapeAttr(key)}">${escapeHtml(label)} <span class="chart-col-sort">${arrow}</span></button>`;
      }

      function toggleSweepSort(sortKeyStateKey, sortDirStateKey, nextKey, defaultDir = 'desc') {
        if (state[sortKeyStateKey] === nextKey) {
          state[sortDirStateKey] = state[sortDirStateKey] === 'asc' ? 'desc' : 'asc';
        } else {
          state[sortKeyStateKey] = nextKey;
          state[sortDirStateKey] = defaultDir;
        }
      }

      function formatSweepCompactMetricValue(value) {
        if (value === undefined || value === null || isNaN(value)) return '—';
        return `${(Number(value) * 100).toFixed(0)}%`;
      }

      function formatSweepCompactDelta(value) {
        if (value === undefined || value === null || isNaN(value)) return '—';
        const rounded = Math.abs(value) < 0.0005 ? 0 : value;
        const prefix = rounded > 0 ? '+' : '';
        return `${prefix}${(rounded * 100).toFixed(0)}%`;
      }

      function getSweepDisplayedItem(baseItem, reversed) {
        if (!baseItem) return null;
        if (!reversed) return baseItem;
        return {
          ...baseItem,
          leftScores: [...(baseItem.rightScores || [])],
          rightScores: [...(baseItem.leftScores || [])],
          leftPasses: [...(baseItem.rightPasses || [])],
          rightPasses: [...(baseItem.leftPasses || [])],
          leftAttempts: [...(baseItem.rightAttempts || [])],
          rightAttempts: [...(baseItem.leftAttempts || [])],
          leftPassCount: baseItem.rightPassCount ?? 0,
          rightPassCount: baseItem.leftPassCount ?? 0,
          leftAvgAttempts: baseItem.rightAvgAttempts ?? 0,
          rightAvgAttempts: baseItem.leftAvgAttempts ?? 0,
          move: -(baseItem.move ?? 0),
        };
      }

      function getSweepDisplayOutcome(item) {
        const leftPasses = Array.isArray(item?.leftPasses) ? item.leftPasses : [];
        const rightPasses = Array.isArray(item?.rightPasses) ? item.rightPasses : [];
        if (!leftPasses.length || !rightPasses.length) return 'mixed';

        const leftAllPass = leftPasses.every(Boolean);
        const leftAllFail = leftPasses.every(value => !value);
        const rightAllPass = rightPasses.every(Boolean);
        const rightAllFail = rightPasses.every(value => !value);

        if (leftAllPass && rightAllFail) return 'left_sweeps_right';
        if (leftAllFail && rightAllPass) return 'right_sweeps_left';
        if (leftAllPass && rightAllPass) return 'both_pass';
        if (leftAllFail && rightAllFail) return 'both_fail';
        return 'mixed';
      }

      function matchesSweepSearch(item, query) {
        const rawQuery = String(query || '').trim().toLowerCase();
        if (!rawQuery) return true;

        const metadata = item?.metadata || {};
        const haystacks = [
          item?.itemId,
          item?.rawItemId,
          metadata?.complexity,
          ...getMetadataCategoryValues(metadata, 'domain'),
        ]
          .filter(value => value !== undefined && value !== null && value !== '')
          .map(value => String(value).toLowerCase());

        return haystacks.some(value => value.includes(rawQuery));
      }

      function filterSweepItems(items, overrides = {}) {
        const moveFilter = overrides.sweepMoveFilter ?? state.sweepMoveFilter;
        const outcomeFilter = overrides.sweepOutcomeFilter ?? state.sweepOutcomeFilter;
        const metadataKey = overrides.sweepMetadataKey ?? state.sweepMetadataKey;
        const metadataMode = overrides.sweepMetadataMode ?? state.sweepMetadataMode;
        const metadataValuesFilter = overrides.sweepMetadataValues ?? state.sweepMetadataValues;
        const metadataExclusiveValues = overrides.sweepMetadataExclusiveValues ?? state.sweepMetadataExclusiveValues;
        const searchQuery = overrides.sweepSearchQuery ?? state.sweepSearchQuery;

        return (items || []).filter(item => {
          if (moveFilter === 'improved' && item.move <= 0) return false;
          if (moveFilter === 'regressed' && item.move >= 0) return false;
          if (moveFilter === 'unchanged' && item.move !== 0) return false;

          const outcome = getSweepDisplayOutcome(item);
          if (outcomeFilter !== 'all' && outcome !== outcomeFilter) return false;
          if (metadataKey !== 'all') {
            const metadataValues = getMetadataCategoryValues(item?.metadata || {}, metadataKey);
            if (!metadataValues.length) return false;
            if (metadataMode === 'exclude') {
              if (Array.isArray(metadataValuesFilter) && metadataValuesFilter.length) {
                if (metadataValuesFilter.some(value => metadataValues.includes(value))) return false;
              }
            } else {
              if (Array.isArray(metadataValuesFilter) && metadataValuesFilter.length === 0) return false;
              if (Array.isArray(metadataValuesFilter) && metadataValuesFilter.length) {
                if (!metadataValuesFilter.some(value => metadataValues.includes(value))) return false;
              }
            }
            if (metadataExclusiveValues instanceof Set && metadataExclusiveValues.size > 0) {
              for (const exclusiveValue of metadataExclusiveValues) {
                if (metadataValues.includes(exclusiveValue) && metadataValues.length > 1) return false;
              }
            }
          }
          if (!matchesSweepSearch(item, searchQuery)) return false;
          return true;
        });
      }

      function sortSweepItems(items) {
        const direction = state.sweepTableSortDir === 'asc' ? 1 : -1;
        const sortKey = state.sweepTableSortKey || 'default';
        return [...(items || [])].sort((a, b) => {
          if (sortKey === 'issue') {
            return direction * String(a.itemId || a.rawItemId || '').localeCompare(String(b.itemId || b.rawItemId || ''));
          }
          if (sortKey === 'left') {
            if ((a.leftPassCount ?? 0) !== (b.leftPassCount ?? 0)) return direction * ((a.leftPassCount ?? 0) - (b.leftPassCount ?? 0));
          } else if (sortKey === 'right') {
            if ((a.rightPassCount ?? 0) !== (b.rightPassCount ?? 0)) return direction * ((a.rightPassCount ?? 0) - (b.rightPassCount ?? 0));
          } else if (sortKey === 'move') {
            if ((a.move ?? 0) !== (b.move ?? 0)) return direction * ((a.move ?? 0) - (b.move ?? 0));
          } else {
            if ((b.move ?? 0) !== (a.move ?? 0)) return (b.move ?? 0) - (a.move ?? 0);
            if ((a.leftPassCount ?? 0) !== (b.leftPassCount ?? 0)) return (a.leftPassCount ?? 0) - (b.leftPassCount ?? 0);
            if ((b.rightPassCount ?? 0) !== (a.rightPassCount ?? 0)) return (b.rightPassCount ?? 0) - (a.rightPassCount ?? 0);
          }
          if ((b.move ?? 0) !== (a.move ?? 0)) return (b.move ?? 0) - (a.move ?? 0);
          if ((a.leftPassCount ?? 0) !== (b.leftPassCount ?? 0)) return (a.leftPassCount ?? 0) - (b.leftPassCount ?? 0);
          if ((b.rightPassCount ?? 0) !== (a.rightPassCount ?? 0)) return (b.rightPassCount ?? 0) - (a.rightPassCount ?? 0);
          return String(a.itemId || a.rawItemId || '').localeCompare(String(b.itemId || b.rawItemId || ''));
        });
      }

      function summarizeSweepItems(items, leftRunCount, rightRunCount) {
        const summary = {
          eligibleItems: items.length,
          left: {
            passAtK: 0,
            passHatK: 0,
            avgAtK: 0,
            consistency: null,
            reliability: null,
            avgAttempts: 0,
          },
          right: {
            passAtK: 0,
            passHatK: 0,
            avgAtK: 0,
            consistency: null,
            reliability: null,
            avgAttempts: 0,
          },
          deltas: {
            passAtK: 0,
            passHatK: 0,
            avgAtK: 0,
            consistency: 0,
            reliability: 0,
          },
          summary: {
            improvedCount: 0,
            regressedCount: 0,
            unchangedCount: 0,
            avgAttemptsDelta: 0,
          },
        };

        if (!items.length) return summary;

        function aggregateSide(sideKey, runCount) {
          const agg = {
            passAtKCount: 0,
            passHatKCount: 0,
            totalScoreSum: 0,
            totalScoreCount: 0,
            totalConsistencySum: 0,
            itemsWithMultipleRuns: 0,
            totalReliabilitySum: 0,
            itemsWithAtLeastOnePass: 0,
            totalAttemptsSum: 0,
            totalAttemptsCount: 0,
          };

          items.forEach((item) => {
            const passes = Array.isArray(item?.[`${sideKey}Passes`]) ? item[`${sideKey}Passes`] : [];
            const scores = Array.isArray(item?.[`${sideKey}Scores`]) ? item[`${sideKey}Scores`] : [];
            const attempts = Array.isArray(item?.[`${sideKey}Attempts`]) ? item[`${sideKey}Attempts`] : [];
            const passCount = passes.filter(Boolean).length;

            agg.totalScoreSum += scores.reduce((sum, value) => sum + Number(value || 0), 0);
            agg.totalScoreCount += scores.length;
            agg.totalAttemptsSum += attempts.reduce((sum, value) => sum + Number(value || 0), 0);
            agg.totalAttemptsCount += attempts.length;

            if (passCount > 0) agg.passAtKCount += 1;
            if (passes.length && passCount === passes.length) agg.passHatKCount += 1;
            if (passes.length > 1) {
              const failCount = passes.length - passCount;
              agg.totalConsistencySum += (2 * Math.max(passCount, failCount) / passes.length) - 1;
              agg.itemsWithMultipleRuns += 1;
            }
            if (passCount > 0 && runCount > 0) {
              agg.totalReliabilitySum += passCount / runCount;
              agg.itemsWithAtLeastOnePass += 1;
            }
          });

          return {
            passAtK: items.length ? agg.passAtKCount / items.length : 0,
            passHatK: items.length ? agg.passHatKCount / items.length : 0,
            avgAtK: agg.totalScoreCount ? agg.totalScoreSum / agg.totalScoreCount : 0,
            consistency: agg.itemsWithMultipleRuns ? agg.totalConsistencySum / agg.itemsWithMultipleRuns : null,
            reliability: agg.itemsWithAtLeastOnePass ? agg.totalReliabilitySum / agg.itemsWithAtLeastOnePass : null,
            avgAttempts: agg.totalAttemptsCount ? agg.totalAttemptsSum / agg.totalAttemptsCount : 0,
          };
        }

        summary.left = aggregateSide('left', leftRunCount);
        summary.right = aggregateSide('right', rightRunCount);
        summary.deltas = {
          passAtK: summary.right.passAtK - summary.left.passAtK,
          passHatK: summary.right.passHatK - summary.left.passHatK,
          avgAtK: summary.right.avgAtK - summary.left.avgAtK,
          consistency: (summary.right.consistency ?? 0) - (summary.left.consistency ?? 0),
          reliability: (summary.right.reliability ?? 0) - (summary.left.reliability ?? 0),
        };

        let attemptsDeltaSum = 0;
        items.forEach((item) => {
          if (item.move > 0) summary.summary.improvedCount += 1;
          else if (item.move < 0) summary.summary.regressedCount += 1;
          else summary.summary.unchangedCount += 1;
          attemptsDeltaSum += (item.rightAvgAttempts ?? 0) - (item.leftAvgAttempts ?? 0);
        });
        summary.summary.avgAttemptsDelta = items.length ? attemptsDeltaSum / items.length : 0;
        return summary;
      }

      function getSweepPresentation(grouped, groups) {
        if (!grouped || !groups) return null;
        const reversed = !!state.sweepReverse;
        const leftLabel = reversed ? (groups.modelBLabel || 'Model B') : (groups.modelALabel || 'Model A');
        const rightLabel = reversed ? (groups.modelALabel || 'Model A') : (groups.modelBLabel || 'Model B');
        const displayedItems = (grouped.items || []).map(item => getSweepDisplayedItem(item, reversed)).filter(Boolean);
        const filteredItems = sortSweepItems(filterSweepItems(displayedItems));
        const summary = summarizeSweepItems(filteredItems, grouped.leftRunCount || groups.k || 0, grouped.rightRunCount || groups.k || 0);
        return {
          reversed,
          leftLabel,
          rightLabel,
          k: groups.k || grouped.k || grouped.leftRunCount || 0,
          displayedItems,
          totalItems: displayedItems.length,
          items: filteredItems,
          ...summary,
        };
      }

      function getPreferredSweepBreakdownKey(metadataKeys) {
        if (state.sweepMetadataKey && state.sweepMetadataKey !== 'all' && metadataKeys.includes(state.sweepMetadataKey)) {
          return state.sweepMetadataKey;
        }
        const preferred = ['domain', 'complexity', 'root_cause'];
        for (const key of preferred) {
          if (metadataKeys.includes(key)) return key;
        }
        return metadataKeys[0] || null;
      }

      function renderSweepMetadataMetricCell(fromValue, toValue, deltaValue) {
        const deltaClass = getDeltaClass(deltaValue);
        return `
          <div class="sweep-metadata-metric">
            <span class="from">${formatSweepCompactMetricValue(fromValue)}</span>
            <span class="arrow">→</span>
            <span class="to">${formatSweepCompactMetricValue(toValue)}</span>
          </div>
          <span class="sweep-metadata-delta ${deltaClass}">${formatSweepCompactDelta(deltaValue)}</span>
        `;
      }

      function renderSweepMetadataBreakdown(items, metadataKey, leftRunCount, rightRunCount, sourceItems = null) {
        if (!metadataKey) return '';
        const values = getSweepMetadataValues(items, metadataKey);
        if (!values.length) return '';
        const supportsExclusive = sweepMetadataKeySupportsExclusive(items, metadataKey);
        const baseItems = Array.isArray(sourceItems) && sourceItems.length ? sourceItems : items;

        const rows = values.map((value) => {
          const isFiltered = state.sweepMetadataKey === metadataKey && Array.isArray(state.sweepMetadataValues) && state.sweepMetadataValues.includes(value);
          const isExclusive = isFiltered && state.sweepMetadataExclusiveValues instanceof Set && state.sweepMetadataExclusiveValues.has(value);
          let subset = items.filter(item => getMetadataCategoryValues(item?.metadata || {}, metadataKey).includes(value));

          if (supportsExclusive && isFiltered) {
            const exclusiveSubset = filterSweepItems(baseItems, {
              sweepMetadataKey: metadataKey,
              sweepMetadataMode: 'include',
              sweepMetadataValues: [value],
              sweepMetadataExclusiveValues: new Set([value]),
            });
            subset = exclusiveSubset;
          }

          const summary = summarizeSweepItems(subset, leftRunCount, rightRunCount);
          return {
            value,
            count: subset.length,
            summary,
            isFiltered,
            isExclusive,
          };
        }).sort((a, b) => {
          const direction = state.sweepBreakdownSortDir === 'asc' ? 1 : -1;
          const key = state.sweepBreakdownSortKey || 'count';
          const metricMap = {
            passAtK: ['passAtK', 'deltas'],
            avgAtK: ['avgAtK', 'deltas'],
            consistency: ['consistency', 'deltas'],
            reliability: ['reliability', 'deltas'],
            passHatK: ['passHatK', 'deltas'],
          };

          if (key === 'value') {
            return direction * String(a.value).localeCompare(String(b.value));
          }
          if (key === 'count') {
            if (a.count !== b.count) return direction * (a.count - b.count);
          } else if (metricMap[key]) {
            const metricKey = metricMap[key][0];
            const aVal = a.summary.deltas[metricKey] ?? 0;
            const bVal = b.summary.deltas[metricKey] ?? 0;
            if (aVal !== bVal) return direction * (aVal - bVal);
          }

          if (b.count !== a.count) return b.count - a.count;
          if (Math.abs(b.summary.deltas.passAtK) !== Math.abs(a.summary.deltas.passAtK)) {
            return Math.abs(b.summary.deltas.passAtK) - Math.abs(a.summary.deltas.passAtK);
          }
          return String(a.value).localeCompare(String(b.value));
        });

        const rowsHtml = rows.map((row) => `
          <tr class="sweep-metadata-row${row.isFiltered ? ' is-filtered' : ''}${row.isExclusive ? ' is-exclusive' : ''}" data-sweep-breakdown-key="${escapeAttr(metadataKey)}" data-sweep-breakdown-value="${escapeAttr(row.value)}" title="${escapeAttr(supportsExclusive ? 'Click to filter. Click again to require this value to be the only list value.' : 'Click to filter by this value.')}">
            <td><div class="sweep-metadata-value">${escapeHtml(row.value)}</div></td>
            <td><span class="sweep-metadata-count">${row.count}</span></td>
            <td>${renderSweepMetadataMetricCell(row.summary.left.passAtK, row.summary.right.passAtK, row.summary.deltas.passAtK)}</td>
            <td>${renderSweepMetadataMetricCell(row.summary.left.avgAtK, row.summary.right.avgAtK, row.summary.deltas.avgAtK)}</td>
            <td>${renderSweepMetadataMetricCell(row.summary.left.consistency ?? 0, row.summary.right.consistency ?? 0, row.summary.deltas.consistency)}</td>
            <td>${renderSweepMetadataMetricCell(row.summary.left.reliability ?? 0, row.summary.right.reliability ?? 0, row.summary.deltas.reliability)}</td>
            <td>${renderSweepMetadataMetricCell(row.summary.left.passHatK, row.summary.right.passHatK, row.summary.deltas.passHatK)}</td>
          </tr>
        `).join('');

        return `
          <div>
            <div class="sweep-section-title">Cohort Metrics by ${escapeHtml(formatSweepMetadataLabel(metadataKey))}</div>
            <div class="sweep-section-subtitle">Current sweep filters applied</div>
            <div class="sweep-metadata-shell">
              <table class="sweep-metadata-table">
                <thead>
                  <tr>
                    <th>${renderSortableHeader(formatSweepMetadataLabel(metadataKey), 'value', state.sweepBreakdownSortKey, state.sweepBreakdownSortDir, 'data-sweep-breakdown-sort')}</th>
                    <th>${renderSortableHeader('N', 'count', state.sweepBreakdownSortKey, state.sweepBreakdownSortDir, 'data-sweep-breakdown-sort')}</th>
                    <th>${renderSortableHeader(`Pass@${leftRunCount}`, 'passAtK', state.sweepBreakdownSortKey, state.sweepBreakdownSortDir, 'data-sweep-breakdown-sort')}</th>
                    <th>${renderSortableHeader(`Avg@${leftRunCount}`, 'avgAtK', state.sweepBreakdownSortKey, state.sweepBreakdownSortDir, 'data-sweep-breakdown-sort')}</th>
                    <th>${renderSortableHeader('Consistency', 'consistency', state.sweepBreakdownSortKey, state.sweepBreakdownSortDir, 'data-sweep-breakdown-sort')}</th>
                    <th>${renderSortableHeader('Reliability', 'reliability', state.sweepBreakdownSortKey, state.sweepBreakdownSortDir, 'data-sweep-breakdown-sort')}</th>
                    <th>${renderSortableHeader(`Pass^${leftRunCount}`, 'passHatK', state.sweepBreakdownSortKey, state.sweepBreakdownSortDir, 'data-sweep-breakdown-sort')}</th>
                  </tr>
                </thead>
                <tbody>${rowsHtml}</tbody>
              </table>
            </div>
          </div>
        `;
      }

      function renderSweepView() {
        const container = el('grouped-sweep-view');
        if (!container) return;
        if (!canShowSweepTab()) {
          container.innerHTML = '';
          return;
        }

        const grouped = getActiveGroupedComparison();
        const groups = state.groupedOutcomeGroups;
        if (!grouped || !groups) {
          container.innerHTML = '<div class="sweep-empty">Sweep comparison is unavailable for the current selection.</div>';
          return;
        }

        if (!grouped.eligibleItems) {
          container.innerHTML = '<div class="sweep-empty">No aligned items have scored data across all selected runs for this metric.</div>';
          return;
        }

        const presentation = getSweepPresentation(grouped, groups);
        if (!presentation) {
          container.innerHTML = '<div class="sweep-empty">Sweep comparison is unavailable for the current selection.</div>';
          return;
        }

        const leftLabel = presentation.leftLabel;
        const rightLabel = presentation.rightLabel;
        const k = presentation.k;
        const metricName = state.selectedOverviewMetric || '';
        const metadataKeys = getSweepMetadataKeys(grouped.items || []);
        if (!metadataKeys.includes(state.sweepMetadataKey)) {
          state.sweepMetadataKey = 'all';
          state.sweepMetadataMode = 'include';
          state.sweepMetadataValues = null;
          state.sweepMetadataExclusiveValues = new Set();
        }
        const metadataValues = getSweepMetadataValues(grouped.items || [], state.sweepMetadataKey);
        state.sweepMetadataValues = normalizeSweepMetadataValues(state.sweepMetadataValues, metadataValues);
        state.sweepMetadataExclusiveValues = normalizeSweepMetadataExclusiveValues(state.sweepMetadataExclusiveValues, metadataValues);
        if (state.sweepMetadataMode === 'exclude' && (!Array.isArray(state.sweepMetadataValues) || state.sweepMetadataValues.length === 0)) {
          state.sweepMetadataMode = 'include';
          state.sweepMetadataValues = null;
        }
        const metadataValueButtonLabel = getSweepMetadataValueButtonLabel(metadataValues, state.sweepMetadataMode, state.sweepMetadataValues, state.sweepMetadataExclusiveValues);
        const metadataSupportsExclusive = sweepMetadataKeySupportsExclusive(grouped.items || [], state.sweepMetadataKey);
        const metadataExclusiveTargets = getSweepMetadataTargetValues(metadataValues);
        const metadataExclusiveOnlyChecked = isSweepMetadataExclusiveOnlyActive(metadataValues);
        const metadataExclusiveOnlyDisabled = state.sweepMetadataKey === 'all'
          || !metadataSupportsExclusive
          || state.sweepMetadataMode === 'exclude'
          || metadataExclusiveTargets.length === 0;
        const breakdownKey = getPreferredSweepBreakdownKey(metadataKeys);
        const breakdownItems = presentation.items;
        const metadataBreakdownHtml = renderSweepMetadataBreakdown(
          breakdownItems,
          breakdownKey,
          grouped.leftRunCount || groups.k || 0,
          grouped.rightRunCount || groups.k || 0,
          presentation.displayedItems
        );

        const statCards = [
          renderSweepStatCard(`Pass@${k}`, presentation.left.passAtK, presentation.right.passAtK, presentation.deltas.passAtK),
          renderSweepStatCard(`Avg@${k}`, presentation.left.avgAtK, presentation.right.avgAtK, presentation.deltas.avgAtK),
          renderSweepStatCard('Consistency', presentation.left.consistency ?? 0, presentation.right.consistency ?? 0, presentation.deltas.consistency),
          renderSweepStatCard('Reliability', presentation.left.reliability ?? 0, presentation.right.reliability ?? 0, presentation.deltas.reliability),
          renderSweepStatCard(`Pass^${k}`, presentation.left.passHatK, presentation.right.passHatK, presentation.deltas.passHatK),
        ].join('');

        const rowsHtml = presentation.items.map(item => {
          const itemLabel = item.itemId || item.rawItemId || '—';
          const moveClass = getDeltaClass(item.move);
          const movePrefix = item.move > 0 ? '+' : '';
          return `
            <tr class="sweep-item-row" data-sweep-item-id="${escapeAttr(item.itemId || item.rawItemId || '')}" tabindex="0" title="Open item comparison">
              <td>
                <div class="sweep-issue-id">${escapeHtml(itemLabel)}</div>
              </td>
              <td>
                <div class="sweep-issue-meta">${renderSweepMetaBadges(item)}</div>
              </td>
              <td>${renderSweepPassTrack(item.leftPasses)}</td>
              <td>${renderSweepPassTrack(item.rightPasses)}</td>
              <td><span class="sweep-move-pill ${moveClass}">${movePrefix}${item.move}</span></td>
            </tr>
          `;
        }).join('');

        container.innerHTML = `
          <div class="sweep-header">
            <div>
              <div class="sweep-title">Sweep</div>
              <div class="sweep-subtitle">${escapeHtml(leftLabel)} vs ${escapeHtml(rightLabel)} across ${k} runs per cohort • Metric: ${escapeHtml(metricName)} • ${presentation.items.length}/${presentation.totalItems} items shown</div>
            </div>
            <div class="sweep-toolbar-actions">
              <button type="button" class="compare-mode-tab sweep-reverse-btn ${presentation.reversed ? 'active' : ''}" id="sweep-reverse-btn">Reverse</button>
            </div>
          </div>

          <div class="sweep-filter-bar">
            <div class="sweep-filter-group">
              <label class="sweep-filter-label" for="sweep-move-filter">Move</label>
              <select id="sweep-move-filter" class="filter-select">
                <option value="all"${state.sweepMoveFilter === 'all' ? ' selected' : ''}>All Items</option>
                <option value="improved"${state.sweepMoveFilter === 'improved' ? ' selected' : ''}>Improved</option>
                <option value="regressed"${state.sweepMoveFilter === 'regressed' ? ' selected' : ''}>Regressed</option>
                <option value="unchanged"${state.sweepMoveFilter === 'unchanged' ? ' selected' : ''}>Unchanged</option>
              </select>
            </div>
            <div class="sweep-filter-group">
              <label class="sweep-filter-label" for="sweep-outcome-filter">Outcome</label>
              <select id="sweep-outcome-filter" class="filter-select">
                <option value="all"${state.sweepOutcomeFilter === 'all' ? ' selected' : ''}>All Outcomes</option>
                <option value="left_sweeps_right"${state.sweepOutcomeFilter === 'left_sweeps_right' ? ' selected' : ''}>${escapeHtml(leftLabel)} sweeps ${escapeHtml(rightLabel)}</option>
                <option value="right_sweeps_left"${state.sweepOutcomeFilter === 'right_sweeps_left' ? ' selected' : ''}>${escapeHtml(rightLabel)} sweeps ${escapeHtml(leftLabel)}</option>
                <option value="both_pass"${state.sweepOutcomeFilter === 'both_pass' ? ' selected' : ''}>Both Pass</option>
                <option value="both_fail"${state.sweepOutcomeFilter === 'both_fail' ? ' selected' : ''}>Both Fail</option>
                <option value="mixed"${state.sweepOutcomeFilter === 'mixed' ? ' selected' : ''}>Mixed</option>
              </select>
            </div>
            <div class="sweep-filter-group">
              <label class="sweep-filter-label" for="sweep-search-input">Search</label>
              <input id="sweep-search-input" class="sweep-filter-search" type="search" value="${escapeAttr(state.sweepSearchQuery || '')}" placeholder="Issue, domain, complexity">
            </div>
            <div class="sweep-filter-group">
              <label class="sweep-filter-label" for="sweep-metadata-key-filter">Metadata</label>
              <select id="sweep-metadata-key-filter" class="filter-select">
                <option value="all">All Categories</option>
                ${metadataKeys.map((key) => `<option value="${escapeAttr(key)}"${state.sweepMetadataKey === key ? ' selected' : ''}>${escapeHtml(formatSweepMetadataLabel(key))}</option>`).join('')}
              </select>
            </div>
            <div class="sweep-filter-group">
              <label class="sweep-filter-label">Values</label>
              <div class="multi-select-wrapper">
                <button
                  type="button"
                  class="multi-select-btn${Array.isArray(state.sweepMetadataValues) && state.sweepMetadataValues.length ? ' has-selection' : ''}"
                  id="sweep-metadata-values-btn"
                  ${state.sweepMetadataKey === 'all' ? 'disabled' : ''}
                >${escapeHtml(metadataValueButtonLabel)}</button>
                <div class="multi-select-dropdown" id="sweep-metadata-values-dropdown">
                  <div class="ms-actions">
                    <button type="button" class="ms-action-btn" id="sweep-metadata-values-all">All</button>
                    <button type="button" class="ms-action-btn" id="sweep-metadata-values-clear">Clear</button>
                  </div>
                  ${metadataValues.map((value) => `
                    <label class="multi-select-option" data-value="${escapeAttr(value)}">
                      <input type="checkbox" value="${escapeAttr(value)}"${
                        state.sweepMetadataMode === 'exclude'
                          ? (Array.isArray(state.sweepMetadataValues) && state.sweepMetadataValues.includes(value) ? '' : ' checked')
                          : (state.sweepMetadataValues === null || (Array.isArray(state.sweepMetadataValues) && state.sweepMetadataValues.includes(value)) ? ' checked' : '')
                      }>
                      <span>${escapeHtml(value)}</span>
                    </label>
                  `).join('')}
                </div>
              </div>
            </div>
            <div class="sweep-filter-group">
              <label class="sweep-filter-label" for="sweep-metadata-exclusive-only">Matching</label>
              <label class="sweep-filter-toggle${metadataExclusiveOnlyDisabled ? ' is-disabled' : ''}" title="${escapeAttr(metadataExclusiveOnlyDisabled ? 'Available for list-valued metadata in include mode.' : 'Keep only items where the selected metadata value is the sole value in that list.')}">
                <input
                  type="checkbox"
                  id="sweep-metadata-exclusive-only"
                  ${metadataExclusiveOnlyChecked ? 'checked' : ''}
                  ${metadataExclusiveOnlyDisabled ? 'disabled' : ''}
                >
                <span>Exclusive only</span>
              </label>
            </div>
          </div>

          ${presentation.items.length ? `
          <div>
            <div class="sweep-section-title">Cohort Metrics</div>
            <div class="sweep-stat-grid">${statCards}</div>
          </div>

          ${metadataBreakdownHtml}

          <div>
            <div class="sweep-section-title">Outcome Summary</div>
            <div class="sweep-outcome-grid">
              <div class="sweep-outcome-card">
                <div class="sweep-outcome-value neutral">${presentation.items.length}</div>
                <div class="sweep-outcome-label">Total Items</div>
              </div>
              <div class="sweep-outcome-card">
                <div class="sweep-outcome-value positive">${presentation.summary.improvedCount}</div>
                <div class="sweep-outcome-label">Improved</div>
              </div>
              <div class="sweep-outcome-card">
                <div class="sweep-outcome-value negative">${presentation.summary.regressedCount}</div>
                <div class="sweep-outcome-label">Regressed</div>
              </div>
              <div class="sweep-outcome-card">
                <div class="sweep-outcome-value neutral">${presentation.summary.unchangedCount}</div>
                <div class="sweep-outcome-label">Unchanged</div>
              </div>
              <div class="sweep-outcome-card">
                <div class="sweep-outcome-value accent">${formatSweepAttemptsDelta(presentation.summary.avgAttemptsDelta)}</div>
                <div class="sweep-outcome-label">Avg Δ Attempts / Item</div>
              </div>
            </div>
          </div>

          <div class="sweep-table-shell">
            <table class="sweep-table">
              <thead>
                <tr>
                  <th>${renderSortableHeader('Item', 'issue', state.sweepTableSortKey, state.sweepTableSortDir, 'data-sweep-table-sort')}</th>
                  <th>Metadata</th>
                  <th>${renderSortableHeader(leftLabel, 'left', state.sweepTableSortKey, state.sweepTableSortDir, 'data-sweep-table-sort')}</th>
                  <th>${renderSortableHeader(rightLabel, 'right', state.sweepTableSortKey, state.sweepTableSortDir, 'data-sweep-table-sort')}</th>
                  <th>${renderSortableHeader('Move', 'move', state.sweepTableSortKey, state.sweepTableSortDir, 'data-sweep-table-sort')}</th>
                </tr>
              </thead>
              <tbody>${rowsHtml}</tbody>
            </table>
          </div>
          ` : '<div class="sweep-empty">No sweep items match the current filters.</div>'}
        `;

        const reverseBtn = el('sweep-reverse-btn');
        if (reverseBtn) {
          reverseBtn.addEventListener('click', () => {
            state.sweepReverse = !state.sweepReverse;
            renderSweepView();
          });
        }

        const moveFilter = el('sweep-move-filter');
        if (moveFilter) {
          moveFilter.addEventListener('change', (e) => {
            state.sweepMoveFilter = e.target.value || 'all';
            renderSweepView();
          });
        }

        const outcomeFilter = el('sweep-outcome-filter');
        if (outcomeFilter) {
          outcomeFilter.addEventListener('change', (e) => {
            state.sweepOutcomeFilter = e.target.value || 'all';
            renderSweepView();
          });
        }

        const searchInput = el('sweep-search-input');
        if (searchInput) {
          searchInput.addEventListener('input', (e) => {
            state.sweepSearchQuery = e.target.value || '';
            renderSweepView();
          });
        }

        const metadataKeyFilter = el('sweep-metadata-key-filter');
        if (metadataKeyFilter) {
          metadataKeyFilter.addEventListener('change', (e) => {
            state.sweepMetadataKey = e.target.value || 'all';
            state.sweepMetadataMode = 'include';
            state.sweepMetadataValues = null;
            state.sweepMetadataExclusiveValues = new Set();
            renderSweepView();
          });
        }

        const metadataValuesBtn = el('sweep-metadata-values-btn');
        const metadataValuesDropdown = el('sweep-metadata-values-dropdown');
        if (metadataValuesBtn && metadataValuesDropdown) {
          metadataValuesBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            metadataValuesDropdown.classList.toggle('open');
          });

          metadataValuesDropdown.querySelectorAll('input[type="checkbox"]').forEach((checkbox) => {
            checkbox.addEventListener('change', () => {
              const checked = Array.from(metadataValuesDropdown.querySelectorAll('input[type="checkbox"]:checked'))
                .map(input => input.value)
                .filter(Boolean);
              state.sweepMetadataExclusiveValues = new Set();
              if (checked.length === metadataValues.length) {
                state.sweepMetadataMode = 'include';
                state.sweepMetadataValues = null;
              } else if (checked.length === 0) {
                state.sweepMetadataMode = 'include';
                state.sweepMetadataValues = [];
              } else if (state.sweepMetadataMode === 'exclude' || state.sweepMetadataValues === null) {
                state.sweepMetadataMode = 'exclude';
                const excluded = metadataValues.filter(value => !checked.includes(value));
                state.sweepMetadataValues = normalizeSweepMetadataValues(excluded, metadataValues);
              } else {
                state.sweepMetadataMode = 'include';
                state.sweepMetadataValues = normalizeSweepMetadataValues(checked, metadataValues);
              }
              renderSweepView();
            });
          });

          const selectAllBtn = el('sweep-metadata-values-all');
          if (selectAllBtn) {
            selectAllBtn.addEventListener('click', (e) => {
              e.stopPropagation();
              state.sweepMetadataMode = 'include';
              state.sweepMetadataValues = null;
              state.sweepMetadataExclusiveValues = new Set();
              renderSweepView();
            });
          }

          const clearBtn = el('sweep-metadata-values-clear');
          if (clearBtn) {
            clearBtn.addEventListener('click', (e) => {
              e.stopPropagation();
              state.sweepMetadataMode = 'include';
              state.sweepMetadataValues = [];
              state.sweepMetadataExclusiveValues = new Set();
              renderSweepView();
            });
          }

          const closeDropdown = (event) => {
            if (!metadataValuesDropdown.contains(event.target) && !metadataValuesBtn.contains(event.target)) {
              metadataValuesDropdown.classList.remove('open');
              document.removeEventListener('click', closeDropdown);
            }
          };

          metadataValuesBtn.addEventListener('click', () => {
            setTimeout(() => document.addEventListener('click', closeDropdown), 0);
          });
        }

        const metadataExclusiveOnly = el('sweep-metadata-exclusive-only');
        if (metadataExclusiveOnly) {
          metadataExclusiveOnly.addEventListener('change', (e) => {
            const enabled = !!e.target.checked;
            if (!enabled) {
              state.sweepMetadataExclusiveValues = new Set();
              renderSweepView();
              return;
            }

            const targetValues = getSweepMetadataTargetValues(metadataValues);
            const nextExclusive = new Set(targetValues);
            const exclusiveMatches = filterSweepItems(presentation.displayedItems || [], {
              sweepMetadataKey: state.sweepMetadataKey,
              sweepMetadataMode: 'include',
              sweepMetadataValues: state.sweepMetadataValues,
              sweepMetadataExclusiveValues: nextExclusive,
            });

            if (exclusiveMatches.length === 0) {
              state.sweepMetadataExclusiveValues = new Set();
              showToast('error', 'No Exclusive Matches', `No current items have ${formatSweepMetadataLabel(state.sweepMetadataKey).toLowerCase()} values that are exclusive to the selected filter.`);
              renderSweepView();
              return;
            }

            state.sweepMetadataMode = 'include';
            state.sweepMetadataExclusiveValues = nextExclusive;
            renderSweepView();
          });
        }

        container.querySelectorAll('[data-sweep-table-sort]').forEach((header) => {
          header.addEventListener('click', () => {
            toggleSweepSort('sweepTableSortKey', 'sweepTableSortDir', header.dataset.sweepTableSort, header.dataset.sweepTableSort === 'issue' ? 'asc' : 'desc');
            renderSweepView();
          });
        });

        container.querySelectorAll('.sweep-item-row[data-sweep-item-id]').forEach((row) => {
          row.addEventListener('click', () => {
            openItemComparisonModal(row.dataset.sweepItemId || '');
          });
          row.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' || event.key === ' ') {
              event.preventDefault();
              openItemComparisonModal(row.dataset.sweepItemId || '');
            }
          });
        });

        container.querySelectorAll('[data-sweep-breakdown-sort]').forEach((header) => {
          header.addEventListener('click', () => {
            toggleSweepSort('sweepBreakdownSortKey', 'sweepBreakdownSortDir', header.dataset.sweepBreakdownSort, header.dataset.sweepBreakdownSort === 'value' ? 'asc' : 'desc');
            renderSweepView();
          });
        });

        container.querySelectorAll('[data-sweep-breakdown-key][data-sweep-breakdown-value]').forEach((row) => {
          row.addEventListener('click', () => {
            const key = row.dataset.sweepBreakdownKey || 'all';
            const value = row.dataset.sweepBreakdownValue || '';
            const displayedItems = presentation.displayedItems || [];
            const availableValues = getSweepMetadataValues(grouped.items || [], key);
            const supportsExclusive = sweepMetadataKeySupportsExclusive(grouped.items || [], key);
            const currentValues = state.sweepMetadataKey === key && Array.isArray(state.sweepMetadataValues) ? [...state.sweepMetadataValues] : null;
            const currentExclusive = state.sweepMetadataKey === key && state.sweepMetadataExclusiveValues instanceof Set
              ? new Set(state.sweepMetadataExclusiveValues)
              : new Set();

            if (key === 'all' || !value) return;

            if (state.sweepMetadataKey !== key) {
              state.sweepMetadataKey = key;
              state.sweepMetadataMode = 'include';
              state.sweepMetadataValues = [value];
              state.sweepMetadataExclusiveValues = new Set();
            } else if (supportsExclusive) {
              if (currentValues === null) {
                state.sweepMetadataMode = 'include';
                state.sweepMetadataValues = [value];
                state.sweepMetadataExclusiveValues = new Set();
              } else if (currentValues.includes(value) && !currentExclusive.has(value)) {
                const nextExclusive = new Set(currentExclusive);
                nextExclusive.add(value);
                const exclusiveMatches = filterSweepItems(displayedItems, {
                  sweepMetadataKey: key,
                  sweepMetadataValues: currentValues,
                  sweepMetadataExclusiveValues: nextExclusive,
                });
                if (exclusiveMatches.length === 0) {
                  showToast('error', 'No Exclusive Matches', `${value} is present, but no current items have it as the only ${formatSweepMetadataLabel(key).toLowerCase()} value.`);
                  return;
                }
                state.sweepMetadataMode = 'include';
                state.sweepMetadataExclusiveValues = nextExclusive;
              } else if (currentValues.includes(value) && currentExclusive.has(value)) {
                if (currentValues.length === 1) {
                  state.sweepMetadataMode = 'include';
                  state.sweepMetadataValues = null;
                  state.sweepMetadataExclusiveValues = new Set();
                } else {
                  const nextValues = currentValues.filter(candidate => candidate !== value);
                  currentExclusive.delete(value);
                  state.sweepMetadataMode = 'include';
                  state.sweepMetadataValues = normalizeSweepMetadataValues(nextValues, availableValues);
                  state.sweepMetadataExclusiveValues = currentExclusive;
                }
              } else if (!currentValues.includes(value)) {
                currentExclusive.delete(value);
                state.sweepMetadataMode = 'include';
                state.sweepMetadataValues = normalizeSweepMetadataValues(currentValues.concat(value), availableValues);
                state.sweepMetadataExclusiveValues = currentExclusive;
              }
            } else if (currentValues !== null && currentValues.length === 1 && currentValues[0] === value) {
              state.sweepMetadataMode = 'include';
              state.sweepMetadataValues = null;
              state.sweepMetadataExclusiveValues = new Set();
            } else {
              state.sweepMetadataMode = 'include';
              state.sweepMetadataValues = [value];
              state.sweepMetadataExclusiveValues = new Set();
            }

            renderSweepView();
          });
        });
      }

          { value: 'all_wrong', label: 'No Run Correct' },
          { value: 'partially_correct', label: 'Partially Correct' },
          { value: 'rarely_solved', label: 'Rarely Solved (≤25%)' },
          { value: 'unique_solve', label: 'Uniquely Solved (1 run)' },
        ];
        let optionsHtml = baseOptions.map((option) => `<option value="${option.value}">${option.label}</option>`).join('');

        if (parts.length >= 2) return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
        return String(name).slice(0, 2).toUpperCase();
      }

        const dropdown = el('header-user-dropdown');

      function getRowCompareId(row) {
        return row?.compare_item_id || null;
      }

      function findRowByCompareId(rows, compareItemId) {
        return (rows || []).find(r => getRowCompareId(r) === compareItemId) || null;
      }

      function canRenderItemComparison() {
        return state.compareAlignmentStatus === 'aligned';
      }

      function getApprovalState(row) {
        if (!row) return '';
        const reviewStatus = String(row.review_correction_status || '').toLowerCase();
        if (reviewStatus === 'approved') return 'approved';
        return 'not_approved';
      }

      function matchesApprovalFilter(row, approvalSelection) {
        if (!approvalSelection) return true;
        const approvalState = getApprovalState(row);
        if (!approvalState) return false;
        if (typeof approvalSelection === 'string') {
          return approvalState === approvalSelection;
        }
        return approvalSelection.some(option => {
          if (option === 'approved') return approvalState === 'approved';
          if (option === 'not_approved') return approvalState === 'not_approved';
          return false;
        });
      }

      function isMetricMetaEdited(meta) {
        if (!meta || typeof meta !== 'object') return false;
        const raw = meta.modified;
        if (raw === true || raw === 1) return true;
        const normalized = String(raw ?? '').trim().toLowerCase();
        return normalized === 'true' || normalized === '1' || normalized === 'yes';
      }

      function rowHasEditedMetric(row) {
        const metricMeta = row?.metric_meta;
        if (!metricMeta || typeof metricMeta !== 'object') return false;
        return Object.values(metricMeta).some(isMetricMetaEdited);
      }

      function getAlignmentWarningHtml(titleText) {
        const issueText = state.compareAlignmentIssues.map(run => {
          const details = (run.issues || []).length ? ` (${run.issues.join('; ')})` : '';
          return `<div><strong>${escapeHtml(run.runName)}</strong>${escapeHtml(details)}</div>`;
        }).join('');
        return `

          <h2 style="margin-bottom: var(--space-sm);">${escapeHtml(titleText)}</h2>
          <p style="max-width: 720px; margin: 0 auto var(--space-md);">

          </p>
          ${issueText ? `<div style="text-align:left;display:inline-block;">${issueText}</div>` : ''}
        `;
      }

      function getSuccessClass(rate) {
