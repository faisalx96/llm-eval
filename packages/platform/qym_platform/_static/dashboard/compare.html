        if (rate >= 0.9) return 'score-5';
        if (rate >= 0.75) return 'score-4';
        if (rate >= 0.6) return 'score-3';
        if (rate >= 0.4) return 'score-2';
        return 'score-1';
      }

      // Use shared utilities from metrics.js
      const formatPercent = window.QymMetrics.formatPercent;
      const formatLatency = window.QymMetrics.formatLatency;

      function formatTaskStart(ms) {
        if (!ms || ms <= 0) return null;
        try {
          const d = new Date(ms);
          const pad = (n) => String(n).padStart(2, '0');
          const yyyy = d.getFullYear();
          const mm = pad(d.getMonth() + 1);
          const dd = pad(d.getDate());
          const hh = pad(d.getHours());
          const min = pad(d.getMinutes());
          const sec = pad(d.getSeconds());
          const ts = `${yyyy}-${mm}-${dd} ${hh}:${min}:${sec}`;
          return { ts };
        } catch {
          return null;
        }
      }

      function formatIsoDateTime(value) {
        if (!value) return '—';
        try {
          const d = new Date(value);
          if (Number.isNaN(d.getTime())) return String(value);
          return d.toLocaleString([], {
            year: 'numeric',
            month: 'short',
            day: 'numeric',
            hour: 'numeric',
            minute: '2-digit'
          });
        } catch {
          return String(value);
        }
      }

      function formatDurationMs(ms) {
        if (ms == null || !Number.isFinite(Number(ms)) || Number(ms) < 0) return '—';
        const totalMs = Number(ms);
        if (totalMs < 1000) return Math.round(totalMs) + 'ms';
        if (totalMs < 60000) return (totalMs / 1000).toFixed(totalMs >= 10000 ? 0 : 1) + 's';
        const totalSeconds = Math.round(totalMs / 1000);
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;
        if (hours > 0) return hours + 'h ' + minutes + 'm';
        if (minutes > 0) return minutes + 'm ' + seconds + 's';
        return totalSeconds + 's';
      }

      function buildCompareLangfuseProjectUrl(runInfo) {
        const direct = runInfo.metadata?.langfuse_url || '';
        if (direct) return direct;
        const host = (runInfo.langfuse_host || '').replace(/\/$/, '');
        const projectId = runInfo.langfuse_project_id || '';
        if (!host || !projectId) return '';
        return `${host}/project/${projectId}`;
      }

      function buildLangfuseTraceUrl(traceId) {
        if (!traceId || !state.langfuseHost || !state.langfuseProjectId) return null;
        const host = state.langfuseHost.replace(/\/$/, '');
        return `${host}/project/${state.langfuseProjectId}/traces/${traceId}`;
      }

      function buildLangfuseTraceUrlFromRun(traceId, runInfo) {
        const host = (runInfo.langfuse_host || '').replace(/\/$/, '');
        const projectId = runInfo.langfuse_project_id || '';
        if (!traceId || !host || !projectId) return null;
        return `${host}/project/${projectId}/traces/${traceId}`;
      }

      function buildDistributionBar(stats) {
        return stats.correctDistribution.map((count, idx) => {
          if (count === 0) return '';
          const pct = (count / stats.totalCompared * 100).toFixed(0);
          const isZero = idx === 0;
          const isAll = idx === state.runs.length;
          const colorClass = isZero ? 'dist-zero' : isAll ? 'dist-all' : 'dist-partial';
          return `<div class="dist-segment ${colorClass} clickable" style="flex: ${count}" data-dist-count="${idx}" title="${idx}/${state.runs.length} correct: ${count} items (${pct}%) — Click to filter">
            <span class="dist-label">${idx}</span>
            <span class="dist-count">${count}</span>
          </div>`;
        }).join('');
      }

      const IS_COMPARE_EXPORT = !!window.__QYM_COMPARE_EXPORT__;
      if (window.QymTraceViewer) window.QymTraceViewer.init({ exportMode: IS_COMPARE_EXPORT });

      function _updateCompareUrl(files, explicitCohorts = null) {
        if (IS_COMPARE_EXPORT) return;
        const params = new URLSearchParams();
        const normalizedExplicit = normalizeExplicitCohortPayload(explicitCohorts);
        if (normalizedExplicit) {
          normalizedExplicit.left.forEach(f => params.append('cohortA', f));
          normalizedExplicit.right.forEach(f => params.append('cohortB', f));
          params.set('cohortALabel', normalizedExplicit.leftLabel);
          params.set('cohortBLabel', normalizedExplicit.rightLabel);
        } else {
          files.forEach(f => params.append('runs', f));
        }
        const newUrl = window.location.pathname + '?' + params.toString();
        window.history.replaceState(null, '', newUrl);
      }

      async function loadComparisonData() {
        // If opened as export, load from embedded data
        if (IS_COMPARE_EXPORT && window.__QYM_COMPARE_DATA__) {
          const data = window.__QYM_COMPARE_DATA__;
          if (data.runs && data.runs.length >= 2) {
            state.runs = data.runs;
            state.langfuseHost = data.runs[0]?.run?.langfuse_host || '';
            state.langfuseProjectId = data.runs[0]?.run?.langfuse_project_id || '';
            processRuns();
            render();
            // Hide share button in export mode
            var shareBtn = el('export-share-btn');
            if (shareBtn) shareBtn.style.display = 'none';
            return;
          }
        }

        state.explicitGroupedOutcomeGroups = null;

        // Get run IDs from URL query params first, fall back to sessionStorage
        let files;
        const urlParams = new URLSearchParams(window.location.search);
        const explicitCohortsFromUrl = normalizeExplicitCohortPayload({
          left: urlParams.getAll('cohortA'),
          right: urlParams.getAll('cohortB'),
          leftLabel: urlParams.get('cohortALabel'),
          rightLabel: urlParams.get('cohortBLabel'),
        });
        const runsFromUrl = urlParams.getAll('runs');
        if (explicitCohortsFromUrl) {
          files = [...explicitCohortsFromUrl.left, ...explicitCohortsFromUrl.right];
          sessionStorage.setItem('compareCohorts', JSON.stringify(explicitCohortsFromUrl));
          sessionStorage.setItem('compareRuns', JSON.stringify(files));
          state.explicitGroupedOutcomeGroups = {
            leftRunIds: [...explicitCohortsFromUrl.left],
            rightRunIds: [...explicitCohortsFromUrl.right],
            modelALabel: explicitCohortsFromUrl.leftLabel,
            modelBLabel: explicitCohortsFromUrl.rightLabel,
            k: explicitCohortsFromUrl.left.length,
          };
        } else if (runsFromUrl.length >= 2) {
          files = runsFromUrl;
          // Sync to sessionStorage so removal still works
          sessionStorage.removeItem('compareCohorts');
          sessionStorage.setItem('compareRuns', JSON.stringify(files));
        } else {
          let storedCohorts = null;
          try {
            storedCohorts = normalizeExplicitCohortPayload(JSON.parse(sessionStorage.getItem('compareCohorts') || 'null'));
          } catch {}
          if (storedCohorts) {
            files = [...storedCohorts.left, ...storedCohorts.right];
            state.explicitGroupedOutcomeGroups = {
              leftRunIds: [...storedCohorts.left],
              rightRunIds: [...storedCohorts.right],
              modelALabel: storedCohorts.leftLabel,
              modelBLabel: storedCohorts.rightLabel,
              k: storedCohorts.left.length,
            };
          } else {
            const filesJson = sessionStorage.getItem('compareRuns');
            if (!filesJson) {
              showEmpty();
              return;
            }
            try {
              files = JSON.parse(filesJson);
            } catch {
              showEmpty();
              return;
            }
          }
        }

        if (!Array.isArray(files) || files.length < 2) {
          showEmpty();
          return;
        }

        // Update URL to include run IDs for shareability
        _updateCompareUrl(files, state.explicitGroupedOutcomeGroups ? {
          left: state.explicitGroupedOutcomeGroups.leftRunIds,
          right: state.explicitGroupedOutcomeGroups.rightRunIds,
          leftLabel: state.explicitGroupedOutcomeGroups.modelALabel,
          rightLabel: state.explicitGroupedOutcomeGroups.modelBLabel,
        } : null);

        // Fetch comparison data from API
        const params = files.map(f => 'files=' + encodeURIComponent(f)).join('&');
        try {
          const compareResponse = await fetch(apiUrl('api/compare?' + params));
          const data = await compareResponse.json();

          if (!data.runs || data.runs.length < 2) {
            showEmpty();
            return;
          }

          state.runs = data.runs;
          state.langfuseHost = data.langfuse_host || '';
          state.langfuseProjectId = data.langfuse_project_id || '';
          // Fallback: use per-run Langfuse config if top-level is incomplete
          if ((!state.langfuseHost || !state.langfuseProjectId) && data.runs?.length) {
            const firstRun = data.runs[0]?.run || {};
            state.langfuseHost = state.langfuseHost || firstRun.langfuse_host || '';
            state.langfuseProjectId = state.langfuseProjectId || firstRun.langfuse_project_id || '';
          }
          processRuns();
          render();
        } catch (err) {
          console.error('Failed to load comparison:', err);
          showEmpty();
        }
      }

      function processRuns() {
        const unalignableRuns = [];
        const compareItemIds = new Set();
        for (const run of state.runs) {
          const runInfo = run.run || {};
          if ((runInfo.compare_alignment_status || 'aligned') !== 'aligned') {
            unalignableRuns.push({
              runName: runInfo.run_name || 'Unnamed run',
              issues: runInfo.compare_alignment_issues || [],
            });
          }
          const rows = run.snapshot?.rows || [];
          for (const row of rows) {
            const compareItemId = getRowCompareId(row);
            if (compareItemId) compareItemIds.add(compareItemId);
          }
        }
        state.compareAlignmentStatus = unalignableRuns.length > 0 ? 'unalignable' : 'aligned';
        state.compareAlignmentIssues = unalignableRuns;
        state.compareItemIds = Array.from(compareItemIds);

        // Collect all unique metrics
        const metricsSet = new Set();
        for (const run of state.runs) {
          const snap = run.snapshot || {};
          const names = snap.metric_names || run.run?.metric_names || [];
          names.forEach(m => metricsSet.add(m));
        }
        state.allMetrics = Array.from(metricsSet).sort();

        // Set default selected metrics
        if (state.allMetrics.length > 0) {
          state.selectedOverviewMetric = state.allMetrics[0];
          state.selectedItemsMetric = state.allMetrics[0];
        }

        // Update header stats
        if (el('run-count')) el('run-count').textContent = state.runs.length;
        if (el('metric-count')) el('metric-count').textContent = state.allMetrics.length;

        // Set up pass rate filter controls based on K
        const K = state.runs.length;
        const prValueInput = el('pass-rate-value');
        if (prValueInput) {
          prValueInput.max = K;
          prValueInput.value = Math.ceil(K / 2);
        }
        const prKSpan = el('pass-rate-k');
        if (prKSpan) prKSpan.textContent = K;

        const maxItems = Math.max(...state.runs.map(r => (r.snapshot?.rows || []).length));
        if (el('total-items')) el('total-items').textContent = state.compareItemIds.length || maxItems;
        // Detect metric types (boolean vs continuous)
        detectMetricTypes();
        inferGroupedOutcomeGroups();
        invalidateGroupedComparisonCache();

        // Calculate comparison statistics for each metric
        state.comparisonStats = {};
        for (const metric of state.allMetrics) {
          state.comparisonStats[metric] = calculateComparisonStatsForMetric(metric);
        }

        // Collect all unique metadata keys and values for complexity/domain
        const metaKeySet = new Set();
        const complexitySet = new Set();
        const domainSet = new Set();
        const rootCauseSet = new Set();
        for (const run of state.runs) {
          const rows = run.snapshot?.rows || [];
          for (const row of rows) {
            const md = row.item_metadata || {};
            if (typeof md === 'object') {
              for (const k of Object.keys(md)) {
                if (k !== 'task_started_at_ms' && k !== 'trace_stats') metaKeySet.add(k);
              }
              if (md.complexity != null && md.complexity !== '') complexitySet.add(String(md.complexity));
              if (md.domain != null && md.domain !== '') {
                for (const d of parseMetaList(md.domain)) domainSet.add(d);
              }
              if (md.root_cause != null && md.root_cause !== '') rootCauseSet.add(String(md.root_cause));
            }
          }
        }
        state.allMetadataKeys = Array.from(metaKeySet).sort();
        const complexityOrder = ['easy', 'medium', 'hard'];
        state.complexityValues = Array.from(complexitySet).sort((a, b) => {
          const ai = complexityOrder.indexOf(a.toLowerCase());
          const bi = complexityOrder.indexOf(b.toLowerCase());
          return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
        });
        state.domainValues = Array.from(domainSet).sort();
        state.rootCauseValues = Array.from(rootCauseSet).sort();

        // Initialize visible metadata fields (all on by default)
        for (const k of state.allMetadataKeys) {
          if (state.visibleMetadataFields[k] === undefined) {
            state.visibleMetadataFields[k] = true;
          }
        }

        // Auto-select categories for breakdown chips
        const EXCLUDED_CATEGORY_KEYS = new Set(['root_cause', 'root_cause_detail', 'root_cause_note', 'root_cause_source', 'root_cause_confidence', 'solution', 'solution_note', 'solution_source', 'task_started_at_ms', 'retry_count', 'analysis_error', 'trace_stats']);
        const MAX_CARDINALITY = 30;
        if (state.selectedCategories.size === 0) {
          for (const k of state.allMetadataKeys) {
            if (EXCLUDED_CATEGORY_KEYS.has(k)) continue;
            const uniqueVals = new Set();
            for (const run of state.runs) {
              for (const row of (run.snapshot?.rows || [])) {
                const v = (row.item_metadata || {})[k];
                if (v != null && v !== '') {
                  for (const value of getMetadataCategoryValues(row.item_metadata || {}, k)) uniqueVals.add(value);
                }
              }
            }
            if (uniqueVals.size === 0 || uniqueVals.size > MAX_CARDINALITY) continue;
            // Auto-select first 3 valid categories
            if (state.selectedCategories.size < 3) state.selectedCategories.add(k);
          }
        }

        // Collect metric metadata keys
        const mmKeySet = new Set();
        for (const run of state.runs) {
          for (const row of (run?.snapshot?.rows || [])) {
            const mm = row.metric_meta || {};
            for (const metricName of Object.keys(mm)) {
              const meta = mm[metricName] || {};
              for (const k of Object.keys(meta)) {
                if (!['modified', 'original_score'].includes(k)) mmKeySet.add(k);
              }
            }
          }
        }
        state.allMetricMetaKeys = Array.from(mmKeySet).sort();
        for (const k of state.allMetricMetaKeys) {
          if (state.visibleMetricMetaFields[k] === undefined) state.visibleMetricMetaFields[k] = true;
        }

        // Build complexity/domain multi-select dropdowns
        buildCategoryDropdowns();

        // Populate metadata fields dropdowns
        populateMetadataFieldsDropdown();
        populateMetricMetaFieldsDropdown();

        // Populate metric selectors
        populateMetricSelectors();
        populateItemFilterOptions();

        // Populate winner filter dropdown
        populateWinnerFilter();
      }

      function populateMetricSelectors() {
        const singleMetric = state.allMetrics.length <= 1;

        // Overview metric tabs — hide when single metric
        const tabsContainer = el('overview-metric-tabs');
        if (tabsContainer) {
          if (singleMetric) {
            tabsContainer.style.display = 'none';
          } else {
            tabsContainer.style.display = '';
            tabsContainer.innerHTML = state.allMetrics.map(metric =>
              `<button class="metric-tab ${metric === state.selectedOverviewMetric ? 'active' : ''}" data-metric="${metric}">${metric}</button>`
            ).join('');

            tabsContainer.querySelectorAll('.metric-tab').forEach(tab => {
              tab.addEventListener('click', () => {
                state.selectedOverviewMetric = tab.dataset.metric;
                tabsContainer.querySelectorAll('.metric-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                updateThresholdControl();
                renderComparisonStats();
                renderMetadataBreakdown();
                renderCompareModeTabs();
                renderSweepView();
                applyCompareMode();
              });
            });
          }
        }

        // Threshold slider (only for continuous metrics)
        const thresholdSlider = el('threshold-slider');
        const thresholdValue = el('threshold-value');
        if (thresholdSlider) {
          thresholdSlider.addEventListener('input', (e) => {
            const value = parseFloat(e.target.value);
            if (thresholdValue) thresholdValue.textContent = `${value}%`;
          });
          thresholdSlider.addEventListener('change', (e) => {
            const value = parseFloat(e.target.value);
            if (!isNaN(value) && value >= 0 && value <= 100) {
              state.metricThresholds[state.selectedOverviewMetric] = value / 100;
              invalidateGroupedComparisonCache(state.selectedOverviewMetric);
              // Recalculate stats for this metric
              state.comparisonStats[state.selectedOverviewMetric] = calculateComparisonStatsForMetric(state.selectedOverviewMetric);
              // Also recalculate for items metric if different
              if (state.selectedItemsMetric && state.selectedItemsMetric !== state.selectedOverviewMetric) {
                state.comparisonStats[state.selectedItemsMetric] = calculateComparisonStatsForMetric(state.selectedItemsMetric);
              }
              renderComparisonStats();
              renderCompareModeTabs();
              renderSweepView();
              applyCompareMode();
              renderItems();
            }
          });
        }

        // Initial threshold control visibility
        updateThresholdControl();

        // Items metric selector dropdown — hide when single metric
        const itemsMetricSelect = el('items-metric-select');
        if (itemsMetricSelect) {
          const metricGroup = itemsMetricSelect.closest('.fp-group');
          if (singleMetric) {
            if (metricGroup) metricGroup.style.display = 'none';
          } else {
            if (metricGroup) metricGroup.style.display = '';
            itemsMetricSelect.innerHTML = state.allMetrics.map(metric =>
              `<option value="${metric}" ${metric === state.selectedItemsMetric ? 'selected' : ''}>${metric}</option>`
            ).join('');

            itemsMetricSelect.addEventListener('change', (e) => {
              state.selectedItemsMetric = e.target.value;
              if (state.itemFilter.startsWith(GROUPED_OUTCOME_ITEM_FILTER_PREFIX) && state.metricTypes?.[state.selectedItemsMetric] === 'numeric') {
                state.itemFilter = 'all';
                populateItemFilterOptions();
              }
              state.page = 1;
              populateWinnerFilter();
              renderItems();
            });
          }
        }

        // Metrics Averages table — hide when single metric
        const metricsSection = document.querySelector('.metrics-comparison');
        if (metricsSection) metricsSection.style.display = singleMetric ? 'none' : '';
      }

      // Show/hide threshold control based on metric type
      function updateThresholdControl() {
        const thresholdControl = el('threshold-control');
        const thresholdSlider = el('threshold-slider');
        const thresholdValue = el('threshold-value');
        if (!thresholdControl || !thresholdSlider) return;

        const metric = state.selectedOverviewMetric;
        if (!metric) {
          thresholdControl.style.display = 'none';
          return;
        }

        const isBoolean = state.metricIsBoolean[metric];
        const isNumeric = state.metricTypes?.[metric] === 'numeric';
        if (isBoolean || isNumeric) {
          thresholdControl.style.display = 'none';
        } else {
          thresholdControl.style.display = 'flex';
          // Set slider value to current threshold (as percentage)
          const pct = Math.round((state.metricThresholds[metric] ?? 0.8) * 100);
          thresholdSlider.value = pct;
          if (thresholdValue) thresholdValue.textContent = `${pct}%`;
        }
      }

      // Detect if a metric is boolean/score/numeric and initialize threshold
      function detectMetricTypes() {
        state.metricTypes = {};
        for (const metricName of state.allMetrics) {
          // Collect all rows across all runs for this metric
          let allRows = [];
          let metricIdx = -1;
          for (const run of state.runs) {
            const snap = run.snapshot || {};
            const rows = snap.rows || [];
            const metricNames = snap.metric_names || run.run?.metric_names || [];
            const idx = metricNames.indexOf(metricName);
            if (idx >= 0) {
              metricIdx = idx;
              allRows = allRows.concat(rows.map(row => {
                // Remap metric_values so the target metric is at index 0
                return { ...row, metric_values: [row.metric_values?.[idx]] };
              }));
            }
          }

          const mType = window.QymMetrics.detectMetricType(allRows, 0);
          state.metricTypes[metricName] = mType;
          state.metricIsBoolean[metricName] = (mType === 'boolean');
          if (!state.metricThresholds[metricName]) {
            state.metricThresholds[metricName] = 0.8;
          }
        }
      }

      function calculateComparisonStatsForMetric(metricName, itemIdListOverride = null) {
        const stats = {
          wins: new Array(state.runs.length).fill(0),
          ties: 0,
          totalCompared: 0,
          avgScores: [],
          avgLatencies: [],
          scoreDelta: 0,
          latencyDelta: 0,
          agreementRate: 0,
          allCorrect: 0,
          allWrong: 0,
          passAtK: 0, // Items where at least one run scored 100%
          passHatK: 0, // Items where ALL runs scored 100%
          totalConsistencySum: 0, // Sum of per-item consistency scores
          totalReliabilitySum: 0, // Sum of per-item reliability (pass_count / K) for items with at least one pass
          itemsWithMultipleRuns: 0, // Count of items with K > 1 for consistency
          itemsWithAtLeastOnePass: 0, // Count of items where at least one run passed (for reliability)
          maxAtK: 0, // Sum of max scores across all items (best possible if you pick best run per item)
          failedCount: 0, // Total number of failed attempts across all items and runs
          correctDistribution: [], // How many items had 0, 1, 2, ... N runs correct
          overallAvgScore: 0,
          overallAvgLatency: 0,
          errorCounts: [],
          errorTypes: [],
          biggestWins: [],
          itemWinners: [], // For each item, which run won
        };

        const itemIdList = Array.isArray(itemIdListOverride) ? itemIdListOverride : (state.compareItemIds || []);
        const itemIdSet = new Set(itemIdList);

        // Create a map from item_id to array index for itemWinners tracking
        state.itemIdToIndex = {};
        itemIdList.forEach((id, idx) => { state.itemIdToIndex[id] = idx; });

        // Initialize correct distribution array (index = number of runs correct, value = count)
        stats.correctDistribution = new Array(state.runs.length + 1).fill(0);

        // Helper to get metric index for a run
        function getMetricIndex(run) {
          const metricNames = run.snapshot?.metric_names || run.run?.metric_names || [];
          return metricNames.indexOf(metricName);
        }

        // Calculate per-run stats
        for (let runIdx = 0; runIdx < state.runs.length; runIdx++) {
          const run = state.runs[runIdx];
          const snap = run.snapshot || {};
          const rows = snap.rows || [];
          const metricIdx = getMetricIndex(run);

          let scoreSum = 0, scoreCount = 0, latSum = 0, latCount = 0;
          let timeoutErrors = 0, runtimeErrors = 0, otherErrors = 0;

          for (const row of rows) {
            const itemId = getRowCompareId(row);
            if (!itemIdSet.has(itemId)) continue;
            // Score for the selected metric (use centralized error handling)
            if (metricIdx >= 0) {
              const { score } = window.QymMetrics.getRowScore(row, metricIdx);
              if (score !== null) { scoreSum += score; scoreCount++; }
            }
            // Latency
            if (row.latency_ms && row.status === 'completed') {
              latSum += row.latency_ms;
              latCount++;
            }
            // Errors (use centralized check)
            if (window.QymMetrics.isErrorRow(row)) {
              const output = (row.output_full || row.output || '').toLowerCase();
              if (output.includes('timeout')) timeoutErrors++;
              else if (output.includes('error')) runtimeErrors++;
              else otherErrors++;
            }
          }

          stats.avgScores.push(scoreCount > 0 ? scoreSum / scoreCount : 0);
          stats.avgLatencies.push(latCount > 0 ? latSum / latCount : 0);
          stats.errorCounts.push(timeoutErrors + runtimeErrors + otherErrors);
          stats.errorTypes.push({ timeout: timeoutErrors, runtime: runtimeErrors, other: otherErrors });
        }

        // Compare items head-to-head using item_id for alignment
        let agreements = 0;
        for (const itemId of itemIdList) {
          const scoresWithStatus = state.runs.map((run) => {
            const snap = run.snapshot || {};
            const rows = snap.rows || [];
            const row = findRowByCompareId(rows, itemId);
            if (!row) return { score: null, failed: false };
            const metricIdx = getMetricIndex(run);
            if (metricIdx < 0) return { score: null, failed: false };
            // Use centralized error handling from metrics.js
            const { score, isError } = window.QymMetrics.getRowScore(row, metricIdx);
            return { score, failed: isError };
          });

          // Count failed attempts
          stats.failedCount += scoresWithStatus.filter(s => s.failed).length;

          const scores = scoresWithStatus.map(s => s.score);
          const validScores = scores.filter(s => s !== null);

          // Max@K: track the best score for this item across all runs (not affected by threshold)
          if (validScores.length > 0) {
            stats.maxAtK += Math.max(...validScores);
          }

          // Determine threshold for "correct": 1.0 for boolean, user-defined for continuous
          const isBoolean = state.metricIsBoolean[metricName];
          const threshold = isBoolean ? 0.9999 : state.metricThresholds[metricName];

          // Count distribution for ALL items (even those with missing data)
          const numCorrect = scores.filter(s => s !== null && s >= threshold).length;
          stats.correctDistribution[numCorrect]++;

          // For head-to-head comparison, need at least 2 valid scores
          if (validScores.length < 2) {
            stats.itemWinners.push(null);
            // Still count pass@k for items with any data
            if (numCorrect > 0) stats.passAtK++;
            if (scores.every(s => s === null || s < 0.0001)) stats.allWrong++;
            if (numCorrect === scores.filter(s => s !== null).length && numCorrect > 0) stats.allCorrect++;
            stats.totalCompared++;
            continue;
          }

          stats.totalCompared++;

          const maxScore = Math.max(...validScores);
          const minScore = Math.min(...validScores);
          const winners = scores.map((s, idx) => s === maxScore ? idx : -1).filter(x => x >= 0);

          // Check if ALL scores are the same (true tie)
          if (maxScore === minScore) {
            stats.ties++;
            stats.itemWinners.push('tie');
          } else if (winners.length === 1) {
            // Clear winner - only one run has the HIGHEST score (beat all others)
            stats.wins[winners[0]]++;
            stats.itemWinners.push(winners[0]);
            // Track biggest wins
            const diff = maxScore - minScore;
            stats.biggestWins.push({ itemId: itemId, winner: winners[0], diff, scores });
          } else {
            // Multiple runs tied for the highest score, but didn't beat everyone
            // This counts as a tie (no clear winner)
            stats.ties++;
            stats.itemWinners.push('tie');
          }

          // All correct / all wrong / pass@k (at least one run meets threshold)
          // Note: numCorrect was already calculated above using threshold
          const allCorrectItem = numCorrect === validScores.length && validScores.length > 0;
          const allZeroItem = validScores.every(s => s < 0.0001); // All scores are 0%

          if (allCorrectItem) stats.allCorrect++;
          if (allZeroItem) stats.allWrong++;
          if (numCorrect > 0) stats.passAtK++;

          // Pass^K: ALL runs meet threshold
          if (allCorrectItem) stats.passHatK++;

          // Consistency: binary agreement (do runs agree on pass/fail?)
          // Formula: 2 * max(passCount, failCount) / K - 1
          // Range: 0% (50/50 split) to 100% (all agree)
          if (validScores.length > 1) {
            const numFail = validScores.length - numCorrect;
            const maxAgreement = Math.max(numCorrect, numFail);
            const itemConsistency = (2 * maxAgreement / validScores.length) - 1;
            stats.totalConsistencySum += itemConsistency;
            stats.itemsWithMultipleRuns++;

            // Reliability: when it CAN answer correctly, how often does it?
            // Only include items with at least one passing run
            if (numCorrect > 0) {
              const itemReliability = numCorrect / validScores.length;
              stats.totalReliabilitySum += itemReliability;
              stats.itemsWithAtLeastOnePass++;
            }
          }

          // Agreement (runs scored similarly - within 10% of each other)
          const scoreRange = maxScore - minScore;
          if (scoreRange < 0.1) agreements++;
        }

        stats.agreementRate = stats.totalCompared > 0 ? agreements / stats.totalCompared : 0;

        // Calculate overall averages across all runs
        const validScoresAll = stats.avgScores.filter(s => s > 0);
        const validLatenciesAll = stats.avgLatencies.filter(l => l > 0);

        // Min/total across all individual scores (for numeric metrics)
        let allScoresMin = Infinity, allScoresMax = -Infinity, allScoresTotal = 0, allScoresCount = 0;
        for (const run of state.runs) {
          const snap = run.snapshot || {};
          const rows = snap.rows || [];
          const mIdx = (function() {
            const mNames = snap.metric_names || run.run?.metric_names || [];
            return mNames.indexOf(metricName);
          })();
          if (mIdx < 0) continue;
          for (const row of rows) {
            const itemId = getRowCompareId(row);
            if (!itemIdSet.has(itemId)) continue;
            const { score } = window.QymMetrics.getRowScore(row, mIdx);
            if (score !== null) {
              if (score < allScoresMin) allScoresMin = score;
              if (score > allScoresMax) allScoresMax = score;
              allScoresTotal += score;
              allScoresCount++;
            }
          }
        }
        stats.allScoresMin = allScoresCount > 0 ? allScoresMin : 0;
        stats.allScoresMax = allScoresCount > 0 ? allScoresMax : 0;
        stats.allScoresTotal = allScoresTotal;
        stats.allScoresCount = allScoresCount;

        stats.overallAvgScore = allScoresCount > 0
          ? allScoresTotal / allScoresCount
          : 0;
        stats.overallAvgLatency = validLatenciesAll.length > 0
          ? validLatenciesAll.reduce((a, b) => a + b, 0) / validLatenciesAll.length
          : 0;

        // Score and latency deltas (comparing first two runs)
        if (state.runs.length >= 2) {
          stats.scoreDelta = stats.avgScores[0] - stats.avgScores[1];
          stats.latencyDelta = stats.avgLatencies[0] - stats.avgLatencies[1];
        }

        // Sort biggest wins
        stats.biggestWins.sort((a, b) => b.diff - a.diff);
        stats.biggestWins = stats.biggestWins.slice(0, 5);

        return stats;
      }

      function populateWinnerFilter() {
        const select = el('run-winner-filter');
        if (!select) return;

        // Save current value to restore after repopulating
        const currentValue = state.winnerFilter;

        let options = '<option value="any">Any Winner</option>';
        options += '<option value="tie">Ties Only</option>';

        state.runs.forEach((run, idx) => {
          const info = run.run || {};
          const name = info.run_name || `Run ${idx + 1}`;
          options += `<option value="win_${idx}">${name} Won</option>`;
        });

        // Add "Only X Solved" options for unique insights
        options += '<optgroup label="Uniquely Solved By">';
        state.runs.forEach((run, idx) => {
          const info = run.run || {};
          const name = info.run_name || `Run ${idx + 1}`;
          options += `<option value="only_${idx}">Only ${name}</option>`;
        });
        options += '</optgroup>';

        select.innerHTML = options;

        // Restore previous selection if it still exists
        if (select.querySelector(`option[value="${currentValue}"]`)) {
          select.value = currentValue;
        } else {
          state.winnerFilter = 'any';
        }
      }

      function removeRun(idx) {
        if (state.runs.length <= 2) return;
        const removedRunId = getCompareRunDataId(state.runs[idx]);

        // Remove from state
        state.runs.splice(idx, 1);

        // Update sessionStorage and URL so they persist
        let files = null;
        const filesJson = sessionStorage.getItem('compareRuns');
        if (filesJson) {
          try {
            files = JSON.parse(filesJson);
            files.splice(idx, 1);
            sessionStorage.setItem('compareRuns', JSON.stringify(files));
          } catch {}
        }

        if (state.explicitGroupedOutcomeGroups && removedRunId) {
          const explicit = state.explicitGroupedOutcomeGroups;
          const nextLeft = (explicit.leftRunIds || []).filter(runId => runId !== removedRunId);
          const nextRight = (explicit.rightRunIds || []).filter(runId => runId !== removedRunId);
          if (nextLeft.length >= 1 && nextLeft.length === nextRight.length) {
            state.explicitGroupedOutcomeGroups = {
              ...explicit,
              leftRunIds: nextLeft,
              rightRunIds: nextRight,
              k: nextLeft.length,
            };
            sessionStorage.setItem('compareCohorts', JSON.stringify({
              left: nextLeft,
              right: nextRight,
              leftLabel: explicit.modelALabel,
              rightLabel: explicit.modelBLabel,
            }));
          } else {
            state.explicitGroupedOutcomeGroups = null;
            sessionStorage.removeItem('compareCohorts');
          }
        }
        _updateCompareUrl(files || state.runs.map(getCompareRunDataId), state.explicitGroupedOutcomeGroups ? {
          left: state.explicitGroupedOutcomeGroups.leftRunIds,
          right: state.explicitGroupedOutcomeGroups.rightRunIds,
          leftLabel: state.explicitGroupedOutcomeGroups.modelALabel,
          rightLabel: state.explicitGroupedOutcomeGroups.modelBLabel,
        } : null);

        // Reset filters that might reference removed run
        state.winnerFilter = 'any';
        state.page = 1;

        // Reprocess and re-render
        processRuns();
        render();
      }

      function showEmpty() {
        el('loading').style.display = 'none';
        el('empty').style.display = 'flex';
        el('compare-content').style.display = 'none';
      }

      function render() {
        el('loading').style.display = 'none';
        el('empty').style.display = 'none';
        el('compare-content').style.display = 'block';

        renderCompareModeTabs();
        renderCompareCohortBanner();
        renderSummaries();
        renderComparisonStats();
        renderMetricsTable();
        renderRootCauseSection();
        renderItems();
        renderSweepView();
        applyCompareMode();
        // Auto-open trace if ?trace=itemId is in the URL
        if (window.QymTraceViewer) window.QymTraceViewer.restoreFromUrl();
      }

      function getVisibleCompareContextEntries() {
        const heroHiddenKeys = new Set([
          'run_name', 'task_name', 'task', 'git_branch', 'git_commit',
          'model', 'model_name', 'dataset', 'dataset_name', 'langfuse_url',
          'langfuse_host', 'langfuse_project_id', 'langfuse_run_id', 'langfuse_trace_id', 'trace_stats',
          'max_metric_concurrency', 'MAX_METRIC_CONCURRENCY', 'snapshot',
          'rows', 'metric_names', 'total_items'
        ]);
        const sourcePriority = { config: 0, metadata: 1 };
        const rankByKey = new Map([
          ['timeout', 0],
          ['max_concurrency', 1],
          ['max_workers', 2],
          ['temperature', 3],
          ['top_p', 4],
          ['max_tokens', 5],
          ['run_config_id', 6],
          ['provider', 7],
          ['base_url', 8]
        ]);
        const contextAllowlist = [
          /timeout/,
          /concurr/,
          /^temperature$/,
          /^top p$/,
          /top_p/,
          /max tokens/,
          /max_tokens/,
          /provider/,
          /base url/,
          /base_url/,
          /run config id/,
          /run_config_id/,
          /seed/,
          /retry/,
          /evaluator/,
          /judge/,
          /endpoint/,
        ];
        const entries = new Map();

        state.runs.forEach((run, runIdx) => {
          const info = run.run || {};
          const config = info.config || {};
          const metadata = info.metadata || {};

          function addEntries(source, obj) {
            Object.entries(obj || {}).forEach(([rawKey, rawValue]) => {
              const key = String(rawKey || '');
              const norm = key.toLowerCase();
              if (!key || heroHiddenKeys.has(key) || heroHiddenKeys.has(norm)) return;
              if (rawValue == null || rawValue === '') return;
              const value = stringify(rawValue);
              if (!value) return;

              const existing = entries.get(norm);
              if (!existing) {
                entries.set(norm, {
                  key,
                  norm,
                  label: formatFieldName(key),
                  source,
                  sourceRank: sourcePriority[source] || 0,
                  values: new Array(state.runs.length).fill('—')
                });
              } else if ((sourcePriority[source] || 0) < existing.sourceRank) {
                existing.key = key;
                existing.label = formatFieldName(key);
                existing.source = source;
                existing.sourceRank = sourcePriority[source] || 0;
              }

              entries.get(norm).values[runIdx] = value;
            });
          }

          addEntries('config', config);
          addEntries('metadata', metadata);
        });

        const allRows = Array.from(entries.values())
          .filter((entry) => {
            const nonEmpty = entry.values.filter(v => v !== '—');
            if (!nonEmpty.length) return false;
            return new Set(entry.values).size > 1;
          })
          .sort((a, b) => {
            const aRank = rankByKey.has(a.norm) ? rankByKey.get(a.norm) : 1000;
            const bRank = rankByKey.has(b.norm) ? rankByKey.get(b.norm) : 1000;
            if (aRank !== bRank) return aRank - bRank;
            return a.label.localeCompare(b.label);
          });

        const rows = allRows.filter((row) => contextAllowlist.some((pattern) => pattern.test(row.norm) || pattern.test(row.label.toLowerCase())));
        const visibleRows = rows.length ? rows : allRows;
        if (
          visibleRows.length === 1 &&
          ['run_config_id', 'run config id'].includes(String(visibleRows[0].norm || '').toLowerCase())
        ) {
          return [];
        }
        return visibleRows;
      }

      // #3: Render complexity/domain metadata breakdown with avg score, avg latency & consistency
      function getCategoryChipKeys() {
        const EXCLUDED = new Set(['root_cause', 'root_cause_detail', 'root_cause_note', 'root_cause_source', 'root_cause_confidence', 'solution', 'solution_note', 'solution_source', 'task_started_at_ms', 'retry_count', 'analysis_error']);
        const MAX_CARD = 30;
        const keys = [];
        for (const k of state.allMetadataKeys) {
          if (EXCLUDED.has(k)) continue;
          const uniqueVals = new Set();
          for (const run of state.runs) {
            for (const row of (run.snapshot?.rows || [])) {
              const v = (row.item_metadata || {})[k];
              if (v != null && v !== '') {
                for (const value of getMetadataCategoryValues(row.item_metadata || {}, k)) uniqueVals.add(value);
              }
            }
          }
          if (uniqueVals.size === 0 || uniqueVals.size > MAX_CARD) continue;
          keys.push({ key: k, count: uniqueVals.size });
        }
        return keys;
      }

      function renderMetadataBreakdown() {
        let existingSection = document.getElementById('metadata-breakdown');
        if (!existingSection) {
          existingSection = document.createElement('div');
          existingSection.id = 'metadata-breakdown';
          existingSection.style.marginBottom = 'var(--space-xl)';
          const statsEl = el('comparison-stats');
          if (statsEl && statsEl.parentNode) {
            statsEl.parentNode.insertBefore(existingSection, statsEl.nextSibling);
          }
        }

        const chipKeys = getCategoryChipKeys();
        if (chipKeys.length === 0) { existingSection.innerHTML = ''; return; }

        const selectedMetric = state.selectedOverviewMetric || state.allMetrics[0];
        if (!selectedMetric) return;
        if (!canRenderItemComparison()) {
          existingSection.innerHTML = `
            <h3 class="section-title">Performance by Category</h3>
            <div class="compare-empty" style="display:flex;">${getAlignmentWarningHtml('Category Breakdown Unavailable')}</div>
          `;
          return;
        }

        const isBoolean = state.metricIsBoolean[selectedMetric];
        const correctThreshold = isBoolean ? 0.9999 : (state.metricThresholds[selectedMetric] || 0.8);
        const K = state.runs.length;

        const filteredItems = getFilteredItems();
        const filteredItemIds = new Set(filteredItems.map(item => item.itemId));

        let html = '<h3 class="section-title">Performance by Category</h3>';

        // Chip selector bar
        html += '<div class="category-chip-bar">';
        html += '<span class="category-chip-bar-label">Categories</span>';
        for (const { key, count } of chipKeys) {
          const selected = state.selectedCategories.has(key);
          const displayName = key;
          html += `<button class="category-chip${selected ? ' selected' : ''}" data-chip-key="${escapeAttr(key)}">${escapeHtml(displayName)} <span class="chip-count">${count}</span></button>`;
        }
        html += '</div>';

        const breakdownKeys = chipKeys.filter(c => state.selectedCategories.has(c.key)).map(c => c.key);

        if (breakdownKeys.length === 0) {
          html += '<div class="category-empty-state"><strong>Select categories above to see performance breakdowns</strong>Choose from your item metadata fields to analyze scores by group</div>';
          existingSection.innerHTML = html;
          wireChipClicks(existingSection);
          return;
        }

        html += '<div class="comparison-stats">';

        for (const bdKey of breakdownKeys) {
          const itemsByGroup = {};

          for (let runIdx = 0; runIdx < state.runs.length; runIdx++) {
            const run = state.runs[runIdx];
            const rows = run.snapshot?.rows || [];
            const metricNames = run.snapshot?.metric_names || run.run?.metric_names || [];
            const mIdx = metricNames.indexOf(selectedMetric);

            for (const row of rows) {
              const itemId = getRowCompareId(row);
              if (!itemId) continue;
              if (!filteredItemIds.has(itemId)) continue;

              const md = row.item_metadata || {};
              const rawVal = md[bdKey] ?? '';
              const isListKey = isListCategoryKey(bdKey);
              const normalizedVals = getMetadataCategoryValues(md, bdKey);
              const groupVals = normalizedVals.length ? normalizedVals : [String(rawVal)];
              if (groupVals.length === 0) groupVals.push('');
              const domainIsSole = isListKey && groupVals.length === 1;
              for (const groupVal of groupVals) {
                if (isListKey && state.domainFilter !== null
                    && state.domainFilter.some(f => f.toLowerCase() === groupVal.toLowerCase()) && !domainIsSole) continue;
                const effectiveGroup = groupVal || 'unknown';

                if (!itemsByGroup[effectiveGroup]) itemsByGroup[effectiveGroup] = {};
                if (!itemsByGroup[effectiveGroup][itemId]) itemsByGroup[effectiveGroup][itemId] = { scores: [], latencies: [], runCount: 0 };
                itemsByGroup[effectiveGroup][itemId].runCount++;

                if (mIdx >= 0) {
                  const { score } = window.QymMetrics.getRowScore(row, mIdx);
                  if (score !== null) itemsByGroup[effectiveGroup][itemId].scores.push(score);
                }
                if (row.latency_ms && row.status === 'completed') {
                  itemsByGroup[effectiveGroup][itemId].latencies.push(row.latency_ms);
                }
              }
            }
          }

          const groupStats = [];
          for (const [groupVal, items] of Object.entries(itemsByGroup)) {
            const itemIds = Object.keys(items);
            let totalScoreSum = 0, totalScoreCount = 0;
            let totalLatSum = 0, totalLatCount = 0;
            let consistencySum = 0, consistencyCount = 0;
            let passAtKCount = 0;

            for (const itemId of itemIds) {
              const { scores, latencies } = items[itemId];
              for (const s of scores) { totalScoreSum += s; totalScoreCount++; }
              for (const l of latencies) { totalLatSum += l; totalLatCount++; }
              if (scores.some(s => s >= correctThreshold)) passAtKCount++;
              if (scores.length > 1) {
                const numCorrect = scores.filter(s => s >= correctThreshold).length;
                const numFail = scores.length - numCorrect;
                const maxAgreement = Math.max(numCorrect, numFail);
                const itemConsistency = (2 * maxAgreement / scores.length) - 1;
                consistencySum += itemConsistency;
                consistencyCount++;
              }
            }

            const avgScore = totalScoreCount > 0 ? totalScoreSum / totalScoreCount : 0;
            const avgLatency = totalLatCount > 0 ? totalLatSum / totalLatCount : null;
            const consistency = consistencyCount > 0 ? consistencySum / consistencyCount : null;
            const passAtK = itemIds.length > 0 ? passAtKCount / itemIds.length : 0;

            groupStats.push({ groupVal, itemCount: itemIds.length, avgScore, passAtK, avgLatency, consistency });
          }

          if (bdKey === 'complexity') {
            const cOrder = ['easy', 'medium', 'hard'];
            groupStats.sort((a, b) => {
              const ai = cOrder.indexOf(a.groupVal.toLowerCase().trim());
              const bi = cOrder.indexOf(b.groupVal.toLowerCase().trim());
              return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
            });
          } else {
            groupStats.sort((a, b) => b.avgScore - a.avgScore);
          }
          if (groupStats.length === 0) continue;

          const icon = bdKey === 'complexity' ? '\u2666' : (bdKey === 'domain' ? '\u25C6' : '\u25CB');
          const colorClass = bdKey === 'complexity' ? 'breakdown-complexity' : (bdKey === 'domain' ? 'breakdown-domain' : 'breakdown-custom');
          const displayName = bdKey;

          html += `<div class="breakdown-section ${colorClass}">`;
          html += `<div class="breakdown-header"><span class="breakdown-icon">${icon}</span> ${escapeHtml(displayName)} <span class="breakdown-metric">${escapeHtml(selectedMetric)}</span></div>`;
          html += '<div class="breakdown-grid">';

          for (const g of groupStats) {
            const latStr = g.avgLatency !== null ? formatLatency(g.avgLatency) : '—';
            const consStr = g.consistency !== null
              ? window.QymMetrics.formatMetricValue(g.consistency, 'score', 0)
              : '—';
            const consClass = g.consistency !== null
              ? window.QymMetrics.getMetricColorClass(g.consistency, 'score')
              : '';

            let cardValClass = '';
            if (bdKey === 'complexity') {
              const cv = g.groupVal.toLowerCase().trim();
              if (['easy', 'simple', 'basic', 'low'].includes(cv)) cardValClass = ' complexity-easy';
              else if (['medium', 'moderate', 'intermediate', 'mid'].includes(cv)) cardValClass = ' complexity-medium';
              else if (['hard', 'difficult', 'advanced', 'high', 'complex'].includes(cv)) cardValClass = ' complexity-hard';
              else if (['very hard', 'very_hard', 'expert', 'extreme'].includes(cv)) cardValClass = ' complexity-expert';
            }

            const passAtKStr = formatPercent(g.passAtK, 0);
            const passAtKClass = scoreColorClass(g.passAtK);

            const bdMType = state.metricTypes?.[selectedMetric] || 'score';
            const bdColorCls = window.QymMetrics.getMetricColorClass(g.avgScore, bdMType);
            const bdDisplay = window.QymMetrics.formatMetricValue(g.avgScore, bdMType, 0);
            const bdIsNumeric = bdMType === 'numeric';
            html += `<div class="breakdown-card${cardValClass}" data-bd-category="${escapeAttr(bdKey)}" data-bd-value="${escapeAttr(g.groupVal)}" style="cursor:pointer;" title="Click to filter by ${escapeAttr(g.groupVal)}">
              <div class="breakdown-card-label">${escapeHtml(g.groupVal)}</div>
              <div class="breakdown-card-scores">
                <div class="score-col">
                  <span class="score-col-label">${bdIsNumeric ? 'Avg' : `Avg@${K}`}</span>
                  <span class="score-col-value ${bdColorCls}">${bdDisplay}</span>
                </div>
                ${bdIsNumeric ? '' : `<div class="score-col">
                  <span class="score-col-label">Pass@${K}</span>
                  <span class="score-col-value ${passAtKClass}">${passAtKStr}</span>
                </div>`}
                <div class="score-col" style="margin-left:auto;">
                  <span class="score-col-label">Items</span>
                  <span class="score-col-value" style="color:var(--text-muted);">${g.itemCount}</span>
                </div>
              </div>
              <div class="breakdown-card-details">
                <span class="breakdown-detail"><span class="breakdown-detail-label">Latency</span> ${latStr}</span>
                ${bdIsNumeric ? '' : `<span class="breakdown-detail"><span class="breakdown-detail-label">Consistency</span> <span class="breakdown-detail-value ${consClass}">${consStr}</span></span>`}
              </div>
            </div>`;
          }

          html += '</div></div>';
        }

        html += '</div>';
        existingSection.innerHTML = html;
        wireChipClicks(existingSection);

        // Wire breakdown card click-to-filter
        existingSection.querySelectorAll('.breakdown-card[data-bd-category]').forEach(card => {
          card.addEventListener('click', () => {
            const cat = card.dataset.bdCategory;
            const val = card.dataset.bdValue;
            const current = getCatFilter(cat);
            if (cat === 'domain') {
              if (state.domainFilterMode === 'exclude') {
                state.domainExclusive.delete(val);
                setCatFilter(cat, [val], 'include');
              } else if (current === null) {
                state.domainExclusive.delete(val);
                setCatFilter(cat, [val], 'include');
              } else if (current.includes(val) && !state.domainExclusive.has(val)) {
                state.domainExclusive.add(val);
              } else if (!current.includes(val)) {
                state.domainExclusive.delete(val);
                setCatFilter(cat, current.concat(val), 'include');
              }
            } else if (current !== null && current.length === 1 && current[0] === val) {
              setCatFilter(cat, null);
            } else {
              setCatFilter(cat, [val]);
            }
            syncMultiselectUI(cat);
            state.page = 1;
            renderItems();
          });
        });
      }

      function wireChipClicks(container) {
        container.querySelectorAll('.category-chip[data-chip-key]').forEach(chip => {
          chip.addEventListener('click', () => {
            const key = chip.dataset.chipKey;
            if (state.selectedCategories.has(key)) {
              state.selectedCategories.delete(key);
              setCatFilter(key, null);
            } else {
              state.selectedCategories.add(key);
            }
            renderMetadataBreakdown();
            state.page = 1;
            renderItems();
          });
        });
      }

      // Helper to create info icon with tooltip
      function infoIcon(tooltip) {
        return `<span class="stat-info-icon">i<span class="stat-info-tooltip">${tooltip}</span></span>`;
      }

      // Helper to get color class based on percentage (0-1) - matches getSuccessClass thresholds
      function scoreColorClass(value) {
        if (value >= 0.9) return 'score-5';
        if (value >= 0.75) return 'score-4';
        if (value >= 0.6) return 'score-3';
        if (value >= 0.4) return 'score-2';
        return 'score-1';
      }

      function renderComparisonStats(filteredItemsOverride = null) {
        const container = el('stats-grid');
        if (!container || !state.comparisonStats || !state.selectedOverviewMetric) return;
        if (!canRenderItemComparison()) {
          container.innerHTML = `<div class="compare-empty" style="display:flex;grid-column:1/-1;">${getAlignmentWarningHtml('Head-to-Head Stats Unavailable')}</div>`;
          return;
        }

        const filteredItems = Array.isArray(filteredItemsOverride) ? filteredItemsOverride : getFilteredItems();
        const filteredItemIds = filteredItems.map(item => item.itemId);
        if (filteredItemIds.length === 0) {
          container.innerHTML = '<div class="compare-empty" style="display:flex;grid-column:1/-1;">No items match the current filters.</div>';
          return;
        }
        const previousItemIdToIndex = state.itemIdToIndex;
        const stats = calculateComparisonStatsForMetric(state.selectedOverviewMetric, filteredItemIds);
        state.itemIdToIndex = previousItemIdToIndex;
        if (!stats) return;
        const runNames = state.runs.map((r, i) => r.run?.run_name || `Run ${i + 1}`);
        const K = state.runs.length;

        // Build win/loss bar with proper colors
        const total = stats.totalCompared || 1;
        const winBarSegments = state.runs.map((_, idx) => {
          const color = COLORS[idx % COLORS.length];
          const count = stats.wins[idx];
          if (count === 0) return '';
          return `<div class="segment clickable" style="flex: ${count}; background: ${color}" data-winner-filter="win_${idx}" title="Click to filter items won by this run">${count}</div>`;
        }).join('');
        const tieSegment = stats.ties > 0
          ? `<div class="segment tie clickable" style="flex: ${stats.ties}" data-winner-filter="tie" title="Click to filter ties">${stats.ties}</div>`
          : '';

        // Build legend
        const legendItems = state.runs.map((_, idx) => {
          const color = COLORS[idx % COLORS.length];
          return `<div class="legend-item">
            <div class="legend-dot" style="background: ${color}"></div>
            <span>${runNames[idx]}:</span>
            <span class="legend-count">${stats.wins[idx]}</span>
          </div>`;
        }).join('');
        const tieLegend = `<div class="legend-item">
          <div class="legend-dot" style="background: var(--text-muted)"></div>
          <span>Ties:</span>
          <span class="legend-count">${stats.ties}</span>
        </div>`;

        // Tooltips for each metric - adjust based on boolean vs continuous
        const isBoolean = state.metricIsBoolean[state.selectedOverviewMetric];
        const isNumeric = state.metricTypes?.[state.selectedOverviewMetric] === 'numeric';
        const overviewMType = isNumeric ? 'numeric' : (isBoolean ? 'boolean' : 'score');
        const threshold = Math.round((state.metricThresholds[state.selectedOverviewMetric] ?? 0.8) * 100);
        const correctDef = isBoolean ? '100%' : `≥${threshold}%`;

        const tooltips = {
          passAtK: isBoolean
            ? `Percentage of items where <strong>at least one</strong> of the ${K} runs achieved a perfect score (100%). Measures coverage - can any run solve this item?`
            : `Percentage of items where <strong>at least one</strong> of the ${K} runs scored <strong>≥${threshold}%</strong>. Adjust the threshold above to change what counts as "correct".`,
          passHatK: isBoolean
            ? `Percentage of items where <strong>all ${K} runs</strong> achieved a perfect score (100%). Measures consistency - do all runs reliably solve this item?`
            : `Percentage of items where <strong>all ${K} runs</strong> scored <strong>≥${threshold}%</strong>. Adjust the threshold above to change what counts as "correct".`,
          maxAtK: isNumeric
            ? `Average of the <strong>best value</strong> across all ${K} runs for each item.`
            : `Average of the <strong>best score</strong> across all ${K} runs for each item. Shows the upper bound of what your runs can achieve.`,
          consistency: `Measures how often runs <strong>agree on pass/fail</strong> across ${K} runs. <strong>100%</strong> = all runs agree, <strong>0%</strong> = 50/50 split.`,
          reliability: `When an item <strong>CAN be solved</strong>, how often is it? Only includes items with <strong>≥1 passing run</strong>.`,
          failedCount: `Number of runs that <strong>threw an error</strong> (across all items). Errors are scored as 0%.`,
          avgScore: isNumeric
            ? `The <strong>mean value</strong> across all items and all runs.`
            : `The <strong>mean score</strong> across all items and all runs. A general measure of overall performance.`,
          avgLatency: `The <strong>mean response time</strong> across all items and all runs. Lower is better.`,
          winnerBreakdown: `Shows which run "won" (scored highest) for each item. Ties occur when multiple runs share the top score. Helps identify which run performs best most often.`,
          correctDist: isBoolean
            ? `Distribution showing how many runs got each item correct. "0 runs" = no run solved it, "${K} runs" = all runs solved it. Helps identify easy vs hard items.`
            : `Distribution showing how many runs scored ≥${threshold}% for each item. Adjust the threshold above to change what counts as "correct".`
        };

        // For numeric metrics, show avg/max instead of pass@K/consistency
        const avgScoreDisplay = window.QymMetrics.formatMetricValue(stats.overallAvgScore, overviewMType);
        const avgScoreColor = window.QymMetrics.getMetricColorClass(stats.overallAvgScore, overviewMType);
        const maxAtKVal = stats.totalCompared > 0 ? stats.maxAtK / stats.totalCompared : 0;
        const maxAtKDisplay = window.QymMetrics.formatMetricValue(maxAtKVal, overviewMType);
        const maxAtKColor = window.QymMetrics.getMetricColorClass(maxAtKVal, overviewMType);

        const fmtN = window.QymMetrics.formatNumericValue;
        const statsRowHtml = isNumeric ? `
          <div class="stats-row">
            <div class="stat-box">
              <div class="stat-title">Min ${infoIcon('The lowest individual value across all items and runs.')}</div>
              <div class="stat-main">${fmtN(stats.allScoresMin)}</div>
            </div>

            <div class="stat-box">
              <div class="stat-title">Avg ${infoIcon(tooltips.avgScore)}</div>
              <div class="stat-main">${avgScoreDisplay}</div>
            </div>

            <div class="stat-box">
              <div class="stat-title">Max ${infoIcon('The highest individual value across all items and runs.')}</div>
              <div class="stat-main">${fmtN(stats.allScoresMax)}</div>
            </div>

            <div class="stat-box">
              <div class="stat-title">Total ${infoIcon('Sum of all values across all items and runs.')}</div>
              <div class="stat-main" style="color:var(--accent-primary)">${fmtN(stats.allScoresTotal)}</div>
            </div>

            <div class="stat-box">
              <div class="stat-title">Avg Latency ${infoIcon(tooltips.avgLatency)}</div>
              <div class="stat-main">${formatLatency(stats.overallAvgLatency)}</div>
            </div>

            <div class="stat-box">
              <div class="stat-title">Errors ${infoIcon(tooltips.failedCount)}</div>
              <div class="stat-main ${stats.failedCount > 0 ? 'score-1' : ''}">${stats.failedCount}</div>
            </div>
          </div>
        ` : `
          <div class="stats-row">
            <div class="stat-box">
              <div class="stat-title">Pass@${K} ${infoIcon(tooltips.passAtK)}</div>
              <div class="stat-main ${scoreColorClass(stats.passAtK / stats.totalCompared)}">${formatPercent(stats.passAtK / stats.totalCompared)}</div>
            </div>

            <div class="stat-box">
              <div class="stat-title">Pass^${K} ${infoIcon(tooltips.passHatK)}</div>
              <div class="stat-main ${scoreColorClass(stats.passHatK / stats.totalCompared)}">${formatPercent(stats.passHatK / stats.totalCompared)}</div>
            </div>

            <div class="stat-box">
              <div class="stat-title">Max@${K} ${infoIcon(tooltips.maxAtK)}</div>
              <div class="stat-main ${scoreColorClass(stats.maxAtK / stats.totalCompared)}">${formatPercent(stats.maxAtK / stats.totalCompared)}</div>
            </div>

            <div class="stat-box">
              <div class="stat-title">Consistency ${infoIcon(tooltips.consistency)}</div>
              ${stats.itemsWithMultipleRuns > 0
                ? `<div class="stat-main ${scoreColorClass(stats.totalConsistencySum / stats.itemsWithMultipleRuns)}">${formatPercent(stats.totalConsistencySum / stats.itemsWithMultipleRuns)}</div>`
                : `<div class="stat-main">NA</div>`}
            </div>

            <div class="stat-box">
              <div class="stat-title">Reliability ${infoIcon(tooltips.reliability)}</div>
              ${stats.itemsWithAtLeastOnePass > 0
                ? `<div class="stat-main ${scoreColorClass(stats.totalReliabilitySum / stats.itemsWithAtLeastOnePass)}">${formatPercent(stats.totalReliabilitySum / stats.itemsWithAtLeastOnePass)}</div>`
                : `<div class="stat-main">NA</div>`}
            </div>

            <div class="stat-box">
              <div class="stat-title">Avg Score ${infoIcon(tooltips.avgScore)}</div>
              <div class="stat-main ${scoreColorClass(stats.overallAvgScore)}">${formatPercent(stats.overallAvgScore)}</div>
            </div>

            <div class="stat-box">
              <div class="stat-title">Avg Latency ${infoIcon(tooltips.avgLatency)}</div>
              <div class="stat-main">${formatLatency(stats.overallAvgLatency)}</div>
            </div>

            <div class="stat-box">
              <div class="stat-title">Errors ${infoIcon(tooltips.failedCount)}</div>
              <div class="stat-main ${stats.failedCount > 0 ? 'score-1' : ''}">${stats.failedCount}</div>
            </div>
          </div>
        `;

        container.innerHTML = `
          ${statsRowHtml}

          <div class="stat-box wide">
            <div class="stat-title">Winner Breakdown ${infoIcon(tooltips.winnerBreakdown)}</div>
            <div class="win-loss-bar">
              ${winBarSegments}
              ${tieSegment}
            </div>
            <div class="win-loss-legend">
              ${legendItems}
              ${tieLegend}
            </div>
          </div>

          ${isNumeric ? '' : `<div class="stat-box wide">
            <div class="stat-title">Correct Distribution ${infoIcon(tooltips.correctDist)}</div>
            <div class="distribution-bar">
              ${buildDistributionBar(stats)}
            </div>
          </div>`}
        `;

        // #11: Wire click handlers on winner breakdown segments
        container.querySelectorAll('.segment.clickable[data-winner-filter]').forEach(seg => {
          seg.addEventListener('click', () => {
            const val = seg.dataset.winnerFilter;
            if (state.selectedOverviewMetric && state.selectedItemsMetric !== state.selectedOverviewMetric) {
              state.selectedItemsMetric = state.selectedOverviewMetric;
              const itemsMetricSelect = el('items-metric-select');
              if (itemsMetricSelect) itemsMetricSelect.value = state.selectedItemsMetric;
            }
            state.winnerFilter = val;
            const winnerSelect = el('run-winner-filter');
            if (winnerSelect && winnerSelect.querySelector(`option[value="${val}"]`)) {
              winnerSelect.value = val;
            }
            state.page = 1;
            renderItems(true);
          });
        });

        // #11: Wire click handlers on distribution bar segments
        container.querySelectorAll('.dist-segment.clickable[data-dist-count]').forEach(seg => {
          seg.addEventListener('click', () => {
            const count = seg.dataset.distCount;
            if (state.selectedOverviewMetric && state.selectedItemsMetric !== state.selectedOverviewMetric) {
              state.selectedItemsMetric = state.selectedOverviewMetric;
              const itemsMetricSelect = el('items-metric-select');
              if (itemsMetricSelect) itemsMetricSelect.value = state.selectedItemsMetric;
            }
            state.passRateOp = 'eq';
            state.passRateValue = Number(count);
            el('pass-rate-op').value = 'eq';
            el('pass-rate-value').value = count;
            el('pass-rate-value').style.display = '';
            el('pass-rate-suffix').style.display = '';
            state.page = 1;
            renderItems(true);
          });
        });

      }


      function renderSummaries() {
        const container = el('run-summaries');
        const visibleContextRows = getVisibleCompareContextEntries();
        container.innerHTML = state.runs.map((run, idx) => {
          const info = run.run || {};
          const color = COLORS[idx % COLORS.length];
          const canRemove = state.runs.length > 2;
          const statusClass = String(info.status || 'unknown').toLowerCase();
          const statusText = escapeHtml(String(info.status || 'unknown').toUpperCase());
          const modelName = info.model_name || info.config?.model || info.config?.model_name || '—';
          const taskName = info.task_name || info.metadata?.task_name || info.config?.task || '—';
          const ownerLabel = info.owner?.display_name || info.owner?.email || info.owner?.id || '';
          const startedAt = info.started_at || info.created_at || '';
          let runtimeMs = info.duration_ms;
          if ((runtimeMs == null || runtimeMs === '') && startedAt && !info.ended_at) {
            const startedTime = new Date(startedAt).getTime();
            if (!Number.isNaN(startedTime)) runtimeMs = Date.now() - startedTime;
          }
          const runtimeText = formatDurationMs(runtimeMs);
          const versionText = [info.git_branch, info.git_commit].filter(Boolean).join(' • ');
          const langfuseUrl = buildCompareLangfuseProjectUrl(info);
          const stats = run.snapshot?.stats || {};
          const summaryItem = (kind, label, valueHtml, iconHtml) => `
            <div class="compare-run-summary-pill ${kind}">
              <span class="compare-run-summary-icon">${iconHtml}</span>
              <span class="compare-run-summary-text">
                <span class="compare-run-summary-value">${valueHtml}</span>
                <span class="compare-run-summary-label">${label}</span>
              </span>
            </div>`;

          function metaItem(label, value, options) {
            const opts = options || {};
            if (value == null || value === '') return '';
            const text = String(value);
            const classes = ['compare-run-meta-value'];
            if (opts.mono) classes.push('mono');
            if (opts.nowrap) classes.push('nowrap');
            const contentHtml = opts.html || escapeHtml(text);
            return `<div class="compare-run-meta-item">
              <div class="compare-run-meta-label">${escapeHtml(label)}</div>
              <div class="${classes.join(' ')}" title="${escapeAttr(text)}">${contentHtml}</div>
            </div>`;
          }

          const metaHtml = [
            metaItem('Task', taskName),
            metaItem('Dataset', info.dataset_name || '—'),
            metaItem('Model', modelName || '—', { html: renderModelLabel(modelName || '—', hasReasoningTraceStats(info.trace_stats)) }),
            metaItem('Owner', ownerLabel),
            metaItem('Started', formatIsoDateTime(startedAt), { nowrap: true }),
            metaItem('Runtime', runtimeText, { nowrap: true }),
            metaItem('Version', versionText, { mono: true, nowrap: true }),
          ].filter(Boolean).join('');
          const summaryHtml =
            '<div class="compare-run-summary-strip">' +
              summaryItem('total', 'Items', String(stats.total || 0), '<svg viewBox="0 0 24 24"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h10"/></svg>') +
              summaryItem('completed', 'Completed', String(stats.completed || 0), '<svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg>') +
              summaryItem('errors', 'Errors', String(stats.failed || 0), '<svg viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>') +
            '</div>';
          const contextCells = visibleContextRows.map((row) => {
            const value = row.values[idx];
            if (!value || value === '—') return '';
            const dotColor = ['var(--accent-primary)', 'var(--accent-secondary)', 'var(--accent-tertiary)', 'var(--chart-4)', 'var(--chart-5)'][visibleContextRows.indexOf(row) % 5];
            return `<div class="context-cell">
              <span class="context-cell-dot" style="background:${dotColor}"></span>
              <div class="context-cell-text">
                <div class="context-cell-key">${escapeHtml(row.label + ' • ' + row.source)}</div>
                <div class="context-cell-val" title="${escapeAttr(value)}">${escapeHtml(value)}</div>
              </div>
            </div>`;
          }).filter(Boolean).join('');
          const contextHtml = contextCells
            ? `<div class="context-section"><div class="context-grid">${contextCells}</div></div>`
            : '';

          return `
            <div class="compare-run-card" style="--run-accent:${color}">
              <div class="compare-run-card-top">
                <div class="compare-run-card-head">
                  <span class="compare-run-marker"></span>
                  <div class="compare-run-title-block">
                    <div class="compare-run-title">${escapeHtml(info.run_name || ('Run ' + (idx + 1)))}</div>
                  </div>
                </div>
                <div class="compare-run-actions">
                  <div class="compare-run-status ${statusClass}">
                    <span class="compare-run-status-dot"></span>${statusText}
                  </div>
                  ${langfuseUrl ? `<a href="${escapeAttr(langfuseUrl)}" target="_blank" rel="noopener" class="compare-run-link langfuse">Langfuse &#8599;</a>` : ''}
                  ${canRemove ? `<button class="compare-run-remove" data-idx="${idx}" title="Remove from comparison">Remove</button>` : ''}
                </div>
              </div>
              <div class="compare-run-meta-grid">${metaHtml}</div>
              ${summaryHtml}
              ${contextHtml}
            </div>
          `;
        }).join('');

        // Add click handlers for remove buttons
        container.querySelectorAll('.compare-run-remove').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const idx = parseInt(e.target.dataset.idx, 10);
            removeRun(idx);
          });
        });
      }

      function renderMetricsTable() {
        const thead = el('metrics-thead');
        const tbody = el('metrics-tbody');

        // Header row
        thead.innerHTML = `
          <tr>
            <th>Metric</th>
            ${state.runs.map((run, idx) => {
              const info = run.run || {};
              const color = COLORS[idx % COLORS.length];
              return `<th><span style="display:inline-block;width:10px;height:10px;background:${color};border-radius:2px;margin-right:6px;"></span>${info.run_name || 'Run ' + (idx + 1)}</th>`;
            }).join('')}
          </tr>
        `;

        // Calculate metric averages and latency for each run
        const runMetricAvgs = state.runs.map(run => {
          const snap = run.snapshot || {};
          const rows = snap.rows || [];
          const metricNames = snap.metric_names || run.run?.metric_names || [];
          const avgs = {};

          for (const metric of state.allMetrics) {
            const idx = metricNames.indexOf(metric);
            if (idx === -1) {
              avgs[metric] = null;
              continue;
            }

            let sum = 0, count = 0;
            for (const row of rows) {
              // Use centralized error handling - errors count as 0
              const { score } = window.QymMetrics.getRowScore(row, idx);
              if (score !== null) {
                sum += score;
                count++;
              }
            }
            avgs[metric] = count > 0 ? sum / count : null;
          }
          return avgs;
        });

        // Calculate average latency for each run
        const runLatencyAvgs = state.runs.map(run => {
          const snap = run.snapshot || {};
          const rows = snap.rows || [];
          let sum = 0, count = 0;
          for (const row of rows) {
            if (row.latency_ms && row.status === 'completed') {
              sum += row.latency_ms;
              count++;
            }
          }
          return count > 0 ? sum / count : null;
        });

        // Find best (lowest) latency
        const bestLatency = Math.min(...runLatencyAvgs.filter(v => v !== null));

        // Find best value for each metric
        const bestValues = {};
        for (const metric of state.allMetrics) {
          let best = -Infinity;
          for (const avgs of runMetricAvgs) {
            if (avgs[metric] !== null && avgs[metric] > best) {
              best = avgs[metric];
            }
          }
          bestValues[metric] = best > -Infinity ? best : null;
        }

        // Render rows - metrics first, then latency
        const metricRows = state.allMetrics.map(metric => {
          const mType = state.metricTypes?.[metric] || 'score';
          const peerValues = runMetricAvgs
            .map(avgs => avgs[metric])
            .filter(val => val !== null && val !== undefined && !isNaN(val));
          const cells = runMetricAvgs.map(avgs => {
            const val = avgs[metric];
            if (val === null) return '<td class="metric-val">—</td>';
            const isBest = val === bestValues[metric] && state.runs.length > 1;
            const cls = window.QymMetrics.getMetricColorClass(val, mType);
            const display = window.QymMetrics.formatMetricValueSmart(val, mType, peerValues);
            return `<td class="metric-val ${cls} ${isBest ? 'best' : ''}">${display}</td>`;
          }).join('');

          return `
            <tr>
              <td class="metric-name">${metric}</td>
              ${cells}
            </tr>
          `;
        }).join('');

        // Latency row
        const latencyCells = runLatencyAvgs.map(val => {
          if (val === null) return '<td class="metric-val">—</td>';
          const isBest = val === bestLatency && state.runs.length > 1;
          return `<td class="metric-val ${isBest ? 'best' : ''}" style="${isBest ? 'background: var(--success-dim);' : ''}">${formatLatency(val)}</td>`;
        }).join('');

        const latencyRow = `
          <tr>
            <td class="metric-name">⚡ Avg Latency</td>
            ${latencyCells}
          </tr>
        `;

        // ⚡ Trace stats rows
        const hasAnyTrace = state.runs.some(r => r.run?.trace_stats?.has_spans);
        let traceRows = '';
        if (hasAnyTrace) {
          const traceDefs = [
            { key: 'avg_tokens',     label: '\u26A1 Avg Tokens', fmt: v => v != null ? Math.round(v).toLocaleString() : '\u2014', best: 'low' },
            { key: 'avg_llm_calls',  label: '\u26A1 LLM Calls',  fmt: v => v != null ? v.toFixed(1) : '\u2014', best: 'low' },
            { key: 'avg_tool_calls', label: '\u26A1 Tool Calls',  fmt: v => v != null ? v.toFixed(1) : '\u2014', best: 'low' },
            { key: 'tool_success_rate', label: '\u26A1 Tool Success Rate', fmt: v => v != null ? (v * 100).toFixed(1) + '%' : '\u2014', best: 'high' },
            { key: 'avg_llm_ms', label: '\u26A1 Avg LLM Latency', fmt: v => v != null ? formatLatency(v) : '\u2014', best: 'low' },
