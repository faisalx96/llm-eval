            { key: 'avg_tool_ms', label: '\u26A1 Avg Tool Latency', fmt: v => v != null ? formatLatency(v) : '\u2014', best: 'low' },
            { key: 'avg_retriever_ms', label: '\u26A1 Avg Retriever Latency', fmt: v => v != null ? formatLatency(v) : '\u2014', best: 'low' },
            { key: 'avg_evaluator_ms', label: '\u26A1 Avg Evaluator Latency', fmt: v => v != null ? formatLatency(v) : '\u2014', best: 'low' },
            { key: 'avg_top_level_chain_ms', label: '\u26A1 Avg Trace Latency', fmt: v => v != null ? formatLatency(v) : '\u2014', best: 'low' },
          ];
          for (const td of traceDefs) {
            const vals = state.runs.map(r => {
              const ts = r.run?.trace_stats;
              return ts ? ts[td.key] : null;
            });
            const validVals = vals.filter(v => v != null && v >= 0);
            const bestVal = validVals.length > 0 ? (td.best === 'high' ? Math.max(...validVals) : Math.min(...validVals)) : null;
            const cells = vals.map(v => {
              const isBest = v != null && bestVal != null && v === bestVal && validVals.length > 1;
              return '<td class="metric-val' + (isBest ? ' best' : '') + '">' + td.fmt(v) + '</td>';
            }).join('');
            traceRows += '<tr class="trace-metric-row"><td class="metric-name">' + td.label + '</td>' + cells + '</tr>';
          }
        }

        tbody.innerHTML = metricRows + latencyRow + traceRows;
      }

      // ── Sankey Diagram ──
      var _sankeyResizeObserver = null;
      var _sankeyResizeTimeout = null;

      function renderSankeyDiagram(filteredItemIds) {
        const container = document.getElementById('sankey-diagram-container');
        if (!container) return;

        // Compute root cause -> solution mapping across ALL runs
        const links = {};
        const rcCounts = {};
        const solCounts = {};
        for (const run of state.runs) {
          const rows = run.snapshot?.rows || [];
          for (const row of rows) {
            const itemId = getRowCompareId(row);
            if (!itemId) continue;
            if (!filteredItemIds.has(itemId)) continue;
            const md = row.item_metadata || {};
            const rc = md.root_cause || '';
            const sol = md.solution || '';
            if (!rc || !sol) continue;
            const key = rc + '|||' + sol;
            links[key] = (links[key] || 0) + 1;
            rcCounts[rc] = (rcCounts[rc] || 0) + 1;
            solCounts[sol] = (solCounts[sol] || 0) + 1;
          }
        }

        const linkEntries = Object.entries(links);
        if (linkEntries.length === 0) { container.innerHTML = ''; return; }

        const rcList = Object.entries(rcCounts).sort((a, b) => b[1] - a[1]);
        const solList = Object.entries(solCounts).sort((a, b) => b[1] - a[1]);

        const nodeH = 32;
        const nodeGap = 8;
        const colWidth = 190;
        const svgPad = 20;
        const totalLeftH = rcList.length * nodeH + (rcList.length - 1) * nodeGap;
        const totalRightH = solList.length * nodeH + (solList.length - 1) * nodeGap;
        const diagramH = Math.max(totalLeftH, totalRightH) + svgPad * 2;

        const leftOffsetY = svgPad + (diagramH - svgPad * 2 - totalLeftH) / 2;
        const rightOffsetY = svgPad + (diagramH - svgPad * 2 - totalRightH) / 2;

        let html = '<div class="breakdown-header" style="color:var(--text-primary);margin-top:var(--space-md);"><span class="breakdown-icon">\u2666</span> Failure to Fix Flow</div>';
        html += '<div class="sankey-body" style="height:' + diagramH + 'px;">';
        html += '<svg class="sankey-svg" viewBox="0 0 100 ' + diagramH + '" preserveAspectRatio="none" id="sankey-svg"></svg>';

        html += '<div class="sankey-col sankey-col-rc" style="width:' + colWidth + 'px;">';
        rcList.forEach(([rc, count]) => {
          const color = ROOT_CAUSE_COLORS[rc] || '#e07a5f';
          html += '<div class="sankey-node" data-sankey-rc="' + escapeAttr(rc) + '" style="background:' + color + '15;border-color:' + color + '40;color:' + color + ';" title="' + escapeAttr(rc) + ' (' + count + ')"><span class="sankey-node-label">' + escapeHtml(rc) + '</span><span class="sankey-node-count" style="background:' + color + '30;">' + count + '</span></div>';
        });
        html += '</div>';

        html += '<div class="sankey-col sankey-col-sol" style="width:' + colWidth + 'px;">';
        solList.forEach(([sol, count]) => {
          const color = SOLUTION_COLORS[sol] || '#60a5fa';
          html += '<div class="sankey-node" data-sankey-sol="' + escapeAttr(sol) + '" style="background:' + color + '15;border-color:' + color + '40;color:' + color + ';" title="' + escapeAttr(sol) + ' (' + count + ')"><span class="sankey-node-label">' + escapeHtml(sol) + '</span><span class="sankey-node-count" style="background:' + color + '30;">' + count + '</span></div>';
        });
        html += '</div>';

        html += '</div>';
        container.innerHTML = html;

        requestAnimationFrame(function () {
          drawSankeyPaths(container, linkEntries, {}, {}, colWidth);
          wireSankeyHover(container);
        });
      }

      function drawSankeyPaths(container, linkEntries, rcPositions, solPositions, colWidth) {
        const svg = container.querySelector('#sankey-svg');
        if (!svg) return;
        const body = container.querySelector('.sankey-body');
        if (!body) return;
        const bodyRect = body.getBoundingClientRect();
        const bodyW = bodyRect.width;

        svg.setAttribute('viewBox', '0 0 ' + bodyW + ' ' + svg.parentElement.clientHeight);
        svg.style.width = bodyW + 'px';

        const rcNodes = container.querySelectorAll('[data-sankey-rc]');
        const solNodes = container.querySelectorAll('[data-sankey-sol]');
        const rcActual = {};
        rcNodes.forEach(n => {
          const r = n.getBoundingClientRect();
          rcActual[n.dataset.sankeyRc] = r.top - bodyRect.top + r.height / 2;
        });
        const solActual = {};
        solNodes.forEach(n => {
          const r = n.getBoundingClientRect();
          solActual[n.dataset.sankeySol] = r.top - bodyRect.top + r.height / 2;
        });

        const maxCount = Math.max(...linkEntries.map(([, c]) => c));
        const minStroke = 2;
        const maxStroke = 16;

        let paths = '';
        for (const [key, count] of linkEntries) {
          const [rc, sol] = key.split('|||');
          const y1 = rcActual[rc];
          const y2 = solActual[sol];
          if (y1 == null || y2 == null) continue;

          const x1 = colWidth + 8;
          const x2 = bodyW - colWidth - 8;
          const cx = (x1 + x2) / 2;
          const sw = minStroke + (count / maxCount) * (maxStroke - minStroke);
          const color = ROOT_CAUSE_COLORS[rc] || '#e07a5f';

          paths += '<path d="M ' + x1 + ' ' + y1 + ' C ' + cx + ' ' + y1 + ', ' + cx + ' ' + y2 + ', ' + x2 + ' ' + y2 + '" ' +
            'fill="none" stroke="' + color + '" stroke-opacity="0.35" stroke-width="' + sw.toFixed(1) + '" ' +
            'data-sankey-link-rc="' + escapeAttr(rc) + '" data-sankey-link-sol="' + escapeAttr(sol) + '" ' +
            'data-sankey-count="' + count + '"/>';
        }
        svg.innerHTML = paths;
      }

      function wireSankeyHover(container) {
        if (container._sankeyMouseHandler) {
          container.removeEventListener('mouseenter', container._sankeyMouseHandler, true);
          container.removeEventListener('mouseleave', container._sankeyMouseHandler, true);
        }

        function getHoverTarget(el) {
          while (el && el !== container) {
            if (el.classList && el.classList.contains('sankey-node')) return { rc: el.dataset.sankeyRc || '', sol: el.dataset.sankeySol || '' };
            if (el.dataset && el.dataset.sankeyLinkRc) return { rc: el.dataset.sankeyLinkRc, sol: el.dataset.sankeyLinkSol };
            el = el.parentElement;
          }
          return null;
        }

        function highlight(rc, sol) {
          const allPaths = container.querySelectorAll('[data-sankey-link-rc]');
          const allNodes = container.querySelectorAll('.sankey-node');
          const connectedRc = new Set();
          const connectedSol = new Set();
          allPaths.forEach(p => {
            const pRc = p.dataset.sankeyLinkRc;
            const pSol = p.dataset.sankeyLinkSol;
            if ((rc && pRc === rc) || (sol && pSol === sol)) {
              connectedRc.add(pRc);
              connectedSol.add(pSol);
              p.classList.add('sankey-highlighted');
              p.classList.remove('sankey-dimmed');
              p.setAttribute('stroke-opacity', '0.7');
            } else {
              p.classList.add('sankey-dimmed');
              p.classList.remove('sankey-highlighted');
              p.setAttribute('stroke-opacity', '0.08');
            }
          });
          allNodes.forEach(n => {
            const connected = (n.dataset.sankeyRc && connectedRc.has(n.dataset.sankeyRc)) ||
                              (n.dataset.sankeySol && connectedSol.has(n.dataset.sankeySol));
            if (connected) { n.classList.add('sankey-highlighted'); n.classList.remove('sankey-dimmed'); }
            else { n.classList.add('sankey-dimmed'); n.classList.remove('sankey-highlighted'); }
          });
        }

        function clearHighlight() {
          container.querySelectorAll('[data-sankey-link-rc]').forEach(p => {
            p.classList.remove('sankey-highlighted', 'sankey-dimmed');
            p.setAttribute('stroke-opacity', '0.35');
          });
          container.querySelectorAll('.sankey-node').forEach(n => n.classList.remove('sankey-highlighted', 'sankey-dimmed'));
        }

        function handler(e) {
          if (e.type === 'mouseenter') {
            const target = getHoverTarget(e.target);
            if (target) highlight(target.rc, target.sol);
          } else {
            const target = getHoverTarget(e.target);
            if (target) clearHighlight();
          }
        }
        container._sankeyMouseHandler = handler;
        container.addEventListener('mouseenter', handler, true);
        container.addEventListener('mouseleave', handler, true);

        if (_sankeyResizeObserver) {
          _sankeyResizeObserver.disconnect();
          _sankeyResizeObserver = null;
        }
        clearTimeout(_sankeyResizeTimeout);

        if (typeof ResizeObserver !== 'undefined') {
          const body = container.querySelector('.sankey-body');
          if (body) {
            _sankeyResizeObserver = new ResizeObserver(() => {
              clearTimeout(_sankeyResizeTimeout);
              _sankeyResizeTimeout = setTimeout(() => {
                if (!container.isConnected) { if (_sankeyResizeObserver) _sankeyResizeObserver.disconnect(); return; }
                const existingPaths = container.querySelectorAll('[data-sankey-link-rc]');
                const entries = [];
                existingPaths.forEach(p => {
                  entries.push([p.dataset.sankeyLinkRc + '|||' + p.dataset.sankeyLinkSol, parseInt(p.dataset.sankeyCount) || 1]);
                });
                if (entries.length > 0) {
                  drawSankeyPaths(container, entries, {}, {}, 190);
                }
              }, 150);
            });
            _sankeyResizeObserver.observe(body);
          }
        }
      }

      function normalizeErrorLabel(value, fallback) {
        let text = stringify(value || '').trim();
        if (!text) text = fallback || 'Unknown error';
        text = text.replace(/^ERROR:\s*/i, '').split(/\r?\n/).map(s => s.trim()).filter(Boolean).join(' ') || text;
        text = text.replace(/\s+/g, ' ').trim();
        return text;
      }

      function splitErrorLabel(label) {
        const text = String(label || '').trim();
        const idx = text.indexOf(':');
        if (idx <= 0) return { title: text || 'Unknown error', detail: '' };
        const title = text.slice(0, idx).trim();
        const detail = text.slice(idx + 1).trim();
        if (!title || !detail) return { title: text || 'Unknown error', detail: '' };
        return { title: title, detail: detail };
      }

      function getErrorBucketKey(kind, label) {
        const parts = splitErrorLabel(label);
        const title = parts.title.replace(/\s+/g, ' ').trim();
        const detail = parts.detail.replace(/\s+/g, ' ').trim();
        const visibleDetail = detail.length > 72 ? detail.slice(0, 69).trimEnd() : detail;
        return kind + '||' + title + '||' + visibleDetail;
      }

      function renderErrorDetailHtml(detail) {
        const text = String(detail || '').trim();
        if (!text) return '';
        const needsExpand = text.length > 120;
        if (!needsExpand) return '<div class="error-card-detail">' + escapeHtml(text) + '</div>';
        return '<div class="error-card-detail" data-error-full="' + escapeAttr(text) + '">' +
          '<span class="error-detail-text">' + escapeHtml(text) + '</span><span class="error-detail-more">' +
          '<button type="button" class="error-detail-toggle">Show more</button></span></div>';
      }

      function addErrorBucket(buckets, kind, label, count, itemKey, runName) {
        const safeCount = Math.max(1, Number(count) || 1);
        const key = getErrorBucketKey(kind, label);
        if (!buckets[key]) {
          buckets[key] = { kind: kind, label: label, count: 0, itemKeys: new Set(), runCounts: {} };
        }
        buckets[key].count += safeCount;
        if (itemKey != null && itemKey !== '') buckets[key].itemKeys.add(String(itemKey));
        if (runName) buckets[key].runCounts[runName] = (buckets[key].runCounts[runName] || 0) + safeCount;
      }

      function rowMatchesErrorFilter(row, filter, runName, itemId) {
        if (!filter) return true;
        const buckets = {};
        collectRowErrors(row, buckets, runName, itemId);
        return !!buckets[getErrorBucketKey(filter.kind, filter.label)];
      }

      function rowMatchesActiveErrorFilters(row, runName, itemId) {
        return rowMatchesErrorFilter(row, state.taskErrorFilter, runName, itemId) &&
          rowMatchesErrorFilter(row, state.traceErrorFilter, runName, itemId) &&
          rowMatchesErrorFilter(row, state.analysisErrorFilter, runName, itemId);
      }

      function getErrorFilterSlot(kind) {
        if (kind === 'Task error') return 'taskErrorFilter';
        if (kind === 'Trace error') return 'traceErrorFilter';
        if (kind === 'Analysis error') return 'analysisErrorFilter';
        return 'traceErrorFilter';
      }

      function collectRowErrors(row, buckets, runName, itemId) {
        if (!row) return;
        const itemKey = (runName || 'Run') + '::' + (itemId || getRowCompareId(row) || row.item_id || String(row.index || ''));
        if ((row.status || '') === 'error') {
          const executionError = row.error || row.output_full || row.output || '';
          addErrorBucket(buckets, 'Task error', normalizeErrorLabel(executionError, 'Task failed'), 1, itemKey, runName);
        }

        const md = row.item_metadata || {};
        if (md.analysis_error) {
          addErrorBucket(buckets, 'Analysis error', normalizeErrorLabel(md.analysis_error, 'Analysis failed'), 1, itemKey, runName);
        }

        const ts = (row.trace_stats && typeof row.trace_stats === 'object') ? row.trace_stats : {};
        const toolErrors = Number(ts.tool_errors || ts.malformed_tool_calls || 0);
        const providerErrors = Number(ts.provider_errors || 0);
        if (toolErrors > 0) addErrorBucket(buckets, 'Trace error', 'Tool errors', toolErrors, itemKey, runName);
        if (providerErrors > 0) addErrorBucket(buckets, 'Trace error', 'Provider errors', providerErrors, itemKey, runName);
      }

      function renderErrorDistributionSection() {
        const section = el('error-distribution-section');
        if (!section) return;
        if (!canRenderItemComparison()) {
          section.innerHTML = `<div class="compare-empty" style="display:flex;margin-bottom:var(--space-xl);">${getAlignmentWarningHtml('Error Distribution Unavailable')}</div>`;
          return;
        }

        const buckets = {};
        const filteredItems = getFilteredItems();
        for (const item of filteredItems) {
          (item.rowData || []).forEach((row, runIdx) => {
            const runName = state.runs[runIdx]?.run?.run_name || `Run ${runIdx + 1}`;
            collectRowErrors(row, buckets, runName, item.itemId);
          });
        }

        const stats = Object.values(buckets).sort((a, b) => b.count - a.count || a.label.localeCompare(b.label));
        const totalErrors = stats.reduce((sum, entry) => sum + entry.count, 0);

        if (totalErrors === 0) {
          section.innerHTML = '<h3 class="section-title">Error Distribution</h3>' +
            '<div class="comparison-stats"><div class="category-empty-state">No errors in the current filtered items.</div></div>';
          return;
        }

        function renderErrorCards(entries) {
          if (!entries.length) return '<div class="category-empty-state">No errors in this category.</div>';
          let cards = '<div class="breakdown-grid">';
          for (const entry of entries) {
            const labelParts = splitErrorLabel(entry.label);
            const itemCount = entry.itemKeys.size;
            const itemText = itemCount === 1 ? '1 item/run pair' : itemCount + ' item/run pairs';
            const itemCountHtml = entry.kind === 'Task error' ? '' : '<div class="error-card-item-count">' + itemText + '</div>';
            const countLabel = entry.count === 1 ? 'error' : 'errors';
            const activeFilter = state[getErrorFilterSlot(entry.kind)];
            const isActive = activeFilter && activeFilter.kind === entry.kind && activeFilter.label === entry.label;
            cards += '<div class="breakdown-card error-card' + (isActive ? ' active' : '') + '" data-error-kind="' + escapeAttr(entry.kind) + '" data-error-label="' + escapeAttr(entry.label) + '" title="Click to filter by this error">' +
              '<div class="error-card-top">' +
                '<div class="error-card-text"><div class="error-card-title" title="' + escapeAttr(entry.label) + '">' + escapeHtml(labelParts.title) + '</div></div>' +
                '<div class="error-card-count">' + entry.count + '<span class="error-card-count-label">' + countLabel + '</span></div>' +
              '</div>' +
              renderErrorDetailHtml(labelParts.detail) +
              itemCountHtml +
            '</div>';
          }
          return cards + '</div>';
        }

      function renderErrorGroup(title, icon, entries, alwaysShow) {
        if (!alwaysShow && entries.length === 0) return '';
        const groupTotal = entries.reduce((sum, entry) => sum + entry.count, 0);
          const iconHtml = icon === 'task'
            ? '<svg class="breakdown-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>'
            : '<svg class="breakdown-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h4l2-7 4 14 2-7h4"/></svg>';
          const groupClass = icon === 'task' ? 'task-error-group' : 'trace-error-group';
        return '<div class="breakdown-section breakdown-errors ' + groupClass + '">' +
            '<div class="breakdown-header">' + iconHtml + ' ' + escapeHtml(title) + ' <span class="breakdown-metric">' + groupTotal + '</span></div>' +
            renderErrorCards(entries) +
          '</div>';
      }

        const taskStats = stats.filter(entry => entry.kind === 'Task error');
        const traceStats = stats.filter(entry => entry.kind === 'Trace error');
        const analysisStats = stats.filter(entry => entry.kind === 'Analysis error');

        let html = '<h3 class="section-title">Error Distribution</h3>';
        html += '<div class="comparison-stats">';
        html += renderErrorGroup('Task Errors', 'task', taskStats, true);
        html += renderErrorGroup('Trace Errors', 'trace', traceStats, true);
        html += renderErrorGroup('Analysis Errors', 'trace', analysisStats, false);
        html += '</div>';
        section.innerHTML = html;

        section.querySelectorAll('.error-card[data-error-kind]').forEach(card => {
          card.addEventListener('click', (e) => {
            if (e.target.closest('.error-detail-toggle')) return;
            const nextFilter = { kind: card.dataset.errorKind, label: card.dataset.errorLabel };
            const slot = getErrorFilterSlot(nextFilter.kind);
            const current = state[slot];
            state[slot] = current && current.kind === nextFilter.kind && current.label === nextFilter.label ? null : nextFilter;
            state.page = 1;
            renderItems();
          });
        });
        section.querySelectorAll('.error-detail-toggle').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const detail = btn.closest('.error-card-detail');

            const textEl = detail.querySelector('.error-detail-text');
            const expanded = detail.dataset.expanded === '1';
            detail.dataset.expanded = expanded ? '0' : '1';
            textEl.textContent = detail.dataset.errorFull;
            btn.textContent = expanded ? 'Show more' : 'Show less';
          });
        });

      function renderRootCauseSection() {
        const section = el('root-cause-section');
        if (!section) return;
        if (!canRenderItemComparison()) {
          section.innerHTML = `<div class="compare-empty" style="display:flex;margin-bottom:var(--space-xl);">${getAlignmentWarningHtml('Root Cause Comparison Unavailable')}</div>`;
          return;
        }

        const filteredItems = getFilteredItems();
        const filteredItemIds = new Set(filteredItems.map(item => item.itemId));
        const anyAssignedOverall = state.runs.some(run => (run.snapshot?.rows || []).some(row => {
          const md = row.item_metadata || {};
          return !!String(md.root_cause || '').trim();
        }));
        const filteredFailedCount = filteredItems.filter(item => {
          return (item.rowData || []).some((row, runIdx) => {
            if (!row) return false;
            if ((row.status || '') === 'error') return true;
            const run = state.runs[runIdx];
            const metricNames = run.snapshot?.metric_names || run.run?.metric_names || [];
            const metricIdx = state.selectedItemsMetric ? metricNames.indexOf(state.selectedItemsMetric) : 0;
            if (metricIdx < 0) return false;
            const score = window.QymMetrics.parseScoreValue((row.metric_values || [])[metricIdx]);
            const isBoolean = state.selectedItemsMetric ? state.metricIsBoolean[state.selectedItemsMetric] : false;
            const threshold = isBoolean ? 0.9999 : (state.metricThresholds[state.selectedItemsMetric] || 0.8);
            return score !== null && score < threshold;
          });
        }).length;

        // Build hierarchical root cause categories across ALL runs
        const rcCategories = {};
        for (const run of state.runs) {
          const rows = run.snapshot?.rows || [];
          for (const row of rows) {
            const itemId = getRowCompareId(row);
            if (!itemId) continue;
            if (!filteredItemIds.has(itemId)) continue;
            const md = row.item_metadata || {};
            const rcRaw = String(md.root_cause || '');
            if (!rcRaw) continue;
            const rcDetail = md.root_cause_detail || '';
            if (!rcCategories[rcRaw]) rcCategories[rcRaw] = { count: 0, subcauses: {} };
            rcCategories[rcRaw].count++;
            if (rcDetail) {
              rcCategories[rcRaw].subcauses[rcDetail] = (rcCategories[rcRaw].subcauses[rcDetail] || 0) + 1;
            }
          }
        }

        const catStats = Object.entries(rcCategories)
          .map(([cat, data]) => ({ category: cat, count: data.count, subcauses: data.subcauses }))
          .sort((a, b) => b.count - a.count);

        // Empty state
        if (catStats.length === 0) {
          const emptyMsg = anyAssignedOverall
            ? (filteredFailedCount === 0
                ? 'The current filtered items are all passing, so there are no root causes to summarize.'
                : 'No root causes appear in the current filtered items. Adjust filters to view failure patterns.')
            : 'No root causes assigned yet. Run Auto-Analyze to identify failure patterns.';
          const autoAnalyzeHtml = anyAssignedOverall
            ? ''
            : '<button class="auto-analyze-btn" id="auto-analyze-btn" title="AI-powered root cause analysis"><span class="ai-icon">\uD83E\uDD16</span> Auto-Analyze</button>';
          section.innerHTML = '<h3 class="section-title">Root Cause Analysis</h3>' +
            '<div class="comparison-stats"><div style="padding:32px 24px;text-align:center;">' +
              '<div style="color:var(--text-muted);font-size:var(--font-sm);margin-bottom:12px;">' + escapeHtml(emptyMsg) + '</div>' +
              autoAnalyzeHtml +
            '</div></div>';
          var aaBtn0 = section.querySelector('#auto-analyze-btn');
          if (aaBtn0) aaBtn0.addEventListener('click', function () { QymPlayground.open(); });
          return;
        }

        let html = '<h3 class="section-title">Root Cause Analysis <button class="auto-analyze-btn" id="auto-analyze-btn" title="AI-powered root cause analysis" style="margin-left:12px;"><span class="ai-icon">\uD83E\uDD16</span> Auto-Analyze</button></h3>';
        html += '<div class="comparison-stats"><div class="breakdown-section breakdown-root-cause">';
        html += '<div class="breakdown-header"><span class="breakdown-icon">\u2666</span> Categories &amp; Subcauses</div>';
        html += '<div class="breakdown-grid">';

        for (const cat of catStats) {
          const rcColor = ROOT_CAUSE_COLORS[cat.category] || '#e07a5f';
          const subcauseList = Object.entries(cat.subcauses).sort((a, b) => b[1] - a[1]);
          let subcauseHtml = '';
          if (subcauseList.length > 0) {
            subcauseHtml = '<div class="rc-subcauses">' + subcauseList.map(function(sc) {
              return '<div class="rc-subcause-item" data-bd-category="root_cause" data-bd-value="' + escapeAttr(cat.category) + '" style="cursor:pointer;" title="' + escapeAttr(sc[0]) + '">' +
                '<span class="rc-subcause-name">' + escapeHtml(sc[0]) + '</span>' +
                '<span class="rc-subcause-count">' + sc[1] + '</span>' +
              '</div>';
            }).join('') + '</div>';
          }
          html += '<div class="breakdown-card rc-category-card" data-bd-category="root_cause" data-bd-value="' + escapeAttr(cat.category) + '" style="cursor:pointer;" title="Click to filter by ' + escapeAttr(cat.category) + '">' +
            '<div class="rc-category-pill" style="background:' + rcColor + '20;border-color:' + rcColor + '40;color:' + rcColor + ';">' +
              '<span class="rc-category-pill-name">' + escapeHtml(cat.category) + '</span>' +
              '<span class="rc-category-pill-count" style="background:' + rcColor + '30;">' + cat.count + '</span>' +
            '</div>' +
            subcauseHtml +
          '</div>';
        }

        html += '</div></div>';
        html += '<div id="sankey-diagram-container"></div>';
        html += '</div>';
        section.innerHTML = html;

        // Render Sankey diagram
        renderSankeyDiagram(filteredItemIds);

        // Sankey highlight helpers
        var sankeyContainer = section.querySelector('#sankey-diagram-container');
        function highlightSankey(rc) {
          if (!sankeyContainer) return;
          var allPaths = sankeyContainer.querySelectorAll('[data-sankey-link-rc]');
          var allNodes = sankeyContainer.querySelectorAll('.sankey-node');
          var connectedSol = new Set();
          allPaths.forEach(function (p) {
            if (p.dataset.sankeyLinkRc === rc) {
              connectedSol.add(p.dataset.sankeyLinkSol);
              p.classList.add('sankey-highlighted');
              p.classList.remove('sankey-dimmed');
              p.setAttribute('stroke-opacity', '0.7');
            } else {
              p.classList.add('sankey-dimmed');
              p.classList.remove('sankey-highlighted');
              p.setAttribute('stroke-opacity', '0.08');
            }
          });
          allNodes.forEach(function (n) {
            var connected = (n.dataset.sankeyRc && n.dataset.sankeyRc === rc) ||
                            (n.dataset.sankeySol && connectedSol.has(n.dataset.sankeySol));
            if (connected) { n.classList.add('sankey-highlighted'); n.classList.remove('sankey-dimmed'); }
            else { n.classList.add('sankey-dimmed'); n.classList.remove('sankey-highlighted'); }
          });
        }
        function clearSankeyHighlight() {
          if (!sankeyContainer) return;
          sankeyContainer.querySelectorAll('[data-sankey-link-rc]').forEach(function (p) {
            p.classList.remove('sankey-highlighted', 'sankey-dimmed');
            p.setAttribute('stroke-opacity', '0.35');
          });
          sankeyContainer.querySelectorAll('.sankey-node').forEach(function (n) {
            n.classList.remove('sankey-highlighted', 'sankey-dimmed');
          });
        }

        // Wire click-to-filter and hover-to-highlight-sankey on cards
        section.querySelectorAll('.breakdown-card[data-bd-category]').forEach(card => {
          card.addEventListener('click', () => {
            const val = card.dataset.bdValue;
            const current = getCatFilter('root_cause');
            if (current !== null && current.length === 1 && current[0] === val) {
              setCatFilter('root_cause', null);
            } else {
              setCatFilter('root_cause', [val]);
            }
            syncMultiselectUI('root_cause');
            state.page = 1;
            renderItems();
          });
          card.addEventListener('mouseenter', function () {
            highlightSankey(card.dataset.bdValue);
          });
          card.addEventListener('mouseleave', function () {
            clearSankeyHighlight();
          });
        });

        // Wire auto-analyze button
        var aaBtn = section.querySelector('#auto-analyze-btn');
        if (aaBtn) aaBtn.addEventListener('click', function () { QymPlayground.open(); });
      }

      function getFilteredItems() {
        if (!canRenderItemComparison()) {
          return [];
        }
        // Build aligned item list across runs using item_id
        const items = [];
        const selectedMetric = state.selectedItemsMetric;
        const stats = selectedMetric ? state.comparisonStats[selectedMetric] : null;
        const groupedBucketKey = state.itemFilter.startsWith(GROUPED_OUTCOME_ITEM_FILTER_PREFIX)
          ? state.itemFilter.slice(GROUPED_OUTCOME_ITEM_FILTER_PREFIX.length)
          : null;
        const groupedBucketItems = groupedBucketKey
          ? new Set(getActiveGroupedOutcomeResults()?.buckets?.[groupedBucketKey]?.itemIds || [])
          : null;

        const itemIdList = state.compareItemIds || [];

        // Helper to get metric index for a run
        function getMetricIndex(run) {
          const metricNames = run.snapshot?.metric_names || run.run?.metric_names || [];
          return selectedMetric ? metricNames.indexOf(selectedMetric) : 0;
        }

        for (const itemId of itemIdList) {
          const rowData = state.runs.map(run => {
            const rows = run.snapshot?.rows || [];
            return findRowByCompareId(rows, itemId);
          });

          // Get scores for this item based on selected metric (use centralized error handling)
          const scores = rowData.map((row, runIdx) => {
            if (!row) return null;
            const run = state.runs[runIdx];
            const metricIdx = getMetricIndex(run);
            if (metricIdx < 0) return null;
            // Use centralized error handling from metrics.js
            const { score } = window.QymMetrics.getRowScore(row, metricIdx);
            return score;
          });
          const validScores = scores.filter(s => s !== null);

          // #19: Apply search query filter across input/expected and all run outputs
          if (state.searchQuery) {
            const q = state.searchQuery.toLowerCase();
            const searchableText = rowData
              .filter(r => r)
              .map(r => [
                stringify(r.compare_item_id || r.item_id || r.index || ''),
                stringify(r.input_full || r.input || ''),
                stringify(r.expected_full || r.expected || ''),
                stringify(r.output_full || r.output || ''),
              ].join('\n'))
              .join('\n')
              .toLowerCase();
            if (!searchableText.includes(q)) continue;
          }

          // #2: Apply complexity/domain/root_cause category filters (null = all, array = explicit)
          if (state.complexityFilter !== null || state.domainFilter !== null || state.rootCauseFilter !== null) {
            const inputRow = rowData.find(r => r);
            const md = (typeof (inputRow?.item_metadata) === 'object') ? inputRow.item_metadata : {};
            if (state.complexityFilter !== null) {
              if (state.complexityFilter.length === 0) continue;
              const val = String(md.complexity ?? '').toLowerCase();
              if (!state.complexityFilter.some(f => f.toLowerCase() === val)) continue;
            }
            if (state.domainFilter !== null) {
              const domainVals = parseMetaList(md.domain).map(v => v.toLowerCase());
              if (state.domainFilterMode === 'exclude') {
                if (state.domainFilter.some(f => domainVals.includes(f.toLowerCase()))) continue;
              } else {
                if (state.domainFilter.length === 0) continue;
                // AND logic: item must contain ALL selected domains
                if (!state.domainFilter.every(f => domainVals.includes(f.toLowerCase()))) continue;
                // Exclusive domains: item must have ONLY that domain (sole value)
                if (state.domainExclusive.size > 0) {
                  let excluded = false;
                  for (const ex of state.domainExclusive) {
                    if (domainVals.includes(ex.toLowerCase()) && domainVals.length > 1) { excluded = true; break; }
                  }
                  if (excluded) continue;
                }
              }
            }
            if (state.rootCauseFilter !== null) {
              if (state.rootCauseFilter.length === 0) continue;
              const wantNone = state.rootCauseFilter.includes('__none__');
              const namedFilters = state.rootCauseFilter.filter(f => f !== '__none__');
              const matchesNamed = namedFilters.length > 0 && rowData.some(r => {
                if (!r) return false;
                const rmd = (typeof r.item_metadata === 'object') ? r.item_metadata : {};
                const val = String(rmd.root_cause ?? '').toLowerCase();
                return namedFilters.some(f => f.toLowerCase() === val);
              });
              // Show row if ANY run has no root cause (partial match)
              const hasAnyWithoutRc = rowData.some(r => {
                if (!r) return true;
                const rmd = (typeof r.item_metadata === 'object') ? r.item_metadata : {};
                return !rmd.root_cause;
              });
              const matchesNone = wantNone && hasAnyWithoutRc;
              if (!matchesNamed && !matchesNone) continue;
            }
          }
          // Custom category filters
          if (Object.keys(state.categoryFilters).some(k => state.categoryFilters[k] !== null)) {
            const inputRow2 = rowData.find(r => r);
            const md2 = (typeof (inputRow2?.item_metadata) === 'object') ? inputRow2.item_metadata : {};
            let customFilterFail = false;
            for (const [cfKey, cfVal] of Object.entries(state.categoryFilters)) {
              if (cfVal === null) continue;
              if (cfVal.length === 0) { customFilterFail = true; break; }
              const itemVals = getMetadataCategoryValues(md2, cfKey).map(v => v.toLowerCase());
              const effectiveVals = itemVals.length ? itemVals : ['unknown'];
              if (!cfVal.some(f => effectiveVals.includes(String(f).toLowerCase()))) { customFilterFail = true; break; }
            }
            if (customFilterFail) continue;
          }
          if (state.approvalFilter !== null) {
            const matchingApproval = rowData.some(r => r && matchesApprovalFilter(r, state.approvalFilter));
            if (!matchingApproval) continue;
          }
          if (state.taskErrorFilter || state.traceErrorFilter || state.analysisErrorFilter) {
            const matchingError = rowData.some((r, runIdx) => {
              if (!r) return false;
              const runName = state.runs[runIdx]?.run?.run_name || `Run ${runIdx + 1}`;
              return rowMatchesActiveErrorFilters(r, runName, itemId);
            });
            if (!matchingError) continue;
          }

          // Apply item filter
          if (state.itemFilter === 'different') {
            const outputs = rowData.map(r => r?.output_full || r?.output || '').filter(o => o);
            const uniqueOutputs = new Set(outputs);
            if (uniqueOutputs.size <= 1) continue;
          } else if (state.itemFilter === 'errors') {
            const hasError = rowData.some(r => window.QymMetrics.isErrorRow(r));
            if (!hasError) continue;
          } else if (state.itemFilter === 'edited_metrics') {
            const hasEditedMetric = rowData.some(rowHasEditedMetric);
            if (!hasEditedMetric) continue;
          } else if (state.itemFilter === 'all_correct') {
            // All runs meet threshold (correct)
            const isBoolean = state.metricIsBoolean[state.selectedItemsMetric];
            const correctThreshold = isBoolean ? 0.9999 : state.metricThresholds[state.selectedItemsMetric];
            if (validScores.length < 2 || !validScores.every(s => s >= correctThreshold)) continue;
          } else if (state.itemFilter === 'all_wrong') {
            // No run meets threshold (not correct)
            const isBoolean = state.metricIsBoolean[state.selectedItemsMetric];
            const correctThreshold = isBoolean ? 0.9999 : state.metricThresholds[state.selectedItemsMetric];
            if (validScores.length < 2 || validScores.some(s => s >= correctThreshold)) continue;
          } else if (state.itemFilter === 'rarely_solved') {
            // 25% or fewer runs meet threshold
            const isBoolean = state.metricIsBoolean[state.selectedItemsMetric];
            const correctThreshold = isBoolean ? 0.9999 : state.metricThresholds[state.selectedItemsMetric];
            const numCorrect = scores.filter(s => s !== null && s >= correctThreshold).length;
            const rareThreshold = Math.max(1, Math.floor(state.runs.length * 0.25));
            if (numCorrect === 0 || numCorrect > rareThreshold) continue;
          } else if (state.itemFilter === 'unique_solve') {
            // Exactly 1 run meets threshold
            const isBoolean = state.metricIsBoolean[state.selectedItemsMetric];
            const correctThreshold = isBoolean ? 0.9999 : state.metricThresholds[state.selectedItemsMetric];
            const numCorrect = scores.filter(s => s !== null && s >= correctThreshold).length;
            if (numCorrect !== 1) continue;
          } else if (state.itemFilter === 'partially_correct') {
            // #12: Some but not all runs met threshold
            const isBoolean = state.metricIsBoolean[state.selectedItemsMetric];
            const correctThreshold = isBoolean ? 0.9999 : state.metricThresholds[state.selectedItemsMetric];
            const numCorrect = scores.filter(s => s !== null && s >= correctThreshold).length;
            if (numCorrect === 0 || numCorrect === validScores.length || validScores.length < 2) continue;
          } else if (state.itemFilter.startsWith(GROUPED_OUTCOME_ITEM_FILTER_PREFIX)) {
            if (!groupedBucketItems || !groupedBucketItems.has(itemId)) continue;
          }

          // #20: Apply pass rate filter
          if (state.passRateOp) {
            const isBoolean = state.metricIsBoolean[state.selectedItemsMetric];
            const correctThreshold = isBoolean ? 0.9999 : state.metricThresholds[state.selectedItemsMetric];
            const numCorrect = scores.filter(s => s !== null && s >= correctThreshold).length;
            const target = state.passRateValue;
            if (state.passRateOp === 'lte' && numCorrect > target) continue;
            if (state.passRateOp === 'gte' && numCorrect < target) continue;
            if (state.passRateOp === 'eq' && numCorrect !== target) continue;
          }

          // Apply winner filter using item_id to index mapping
          if (state.winnerFilter !== 'any' && stats && state.itemIdToIndex) {
            const itemIndex = state.itemIdToIndex[itemId];
            const winner = itemIndex !== undefined ? stats.itemWinners[itemIndex] : null;
            if (state.winnerFilter === 'tie') {
              // Only show ties (all runs same score OR multiple tied for highest)
              if (winner !== 'tie') continue;
            } else if (state.winnerFilter.startsWith('win_')) {
              const winnerIdx = parseInt(state.winnerFilter.replace('win_', ''), 10);
              // Only show items where this run was the SOLE winner (beat all others)
              if (winner !== winnerIdx) continue;
            } else if (state.winnerFilter.startsWith('only_')) {
              // Only show items where ONLY this run met threshold
              const runIdx = parseInt(state.winnerFilter.replace('only_', ''), 10);
              const isBoolean = state.metricIsBoolean[state.selectedItemsMetric];
              const correctThreshold = isBoolean ? 0.9999 : state.metricThresholds[state.selectedItemsMetric];
              const correctRuns = scores.map((s, idx) => s !== null && s >= correctThreshold ? idx : -1).filter(x => x >= 0);
              if (correctRuns.length !== 1 || correctRuns[0] !== runIdx) continue;
            }
          }

          items.push({ itemId: itemId, rowData });
        }

        // Sorting
        if (state.sortBy === 'score_asc' || state.sortBy === 'score_desc') {
          items.sort((a, b) => {
            const getMax = (item) => {
              const vals = item.rowData.map((row, ri) => {
                if (!row) return null;
                const run = state.runs[ri];
                const mNames = run.snapshot?.metric_names || run.run?.metric_names || [];
                const mIdx = selectedMetric ? mNames.indexOf(selectedMetric) : 0;
                if (mIdx < 0) return null;
                return window.QymMetrics.getRowScore(row, mIdx).score;
              }).filter(s => s !== null);
              return vals.length > 0 ? Math.max(...vals) : -1;
            };
            const diff = getMax(a) - getMax(b);
            return state.sortBy === 'score_asc' ? diff : -diff;
          });
        } else if (state.sortBy === 'latency_asc' || state.sortBy === 'latency_desc') {
          items.sort((a, b) => {
            const getMin = (item) => {
              const vals = item.rowData.filter(r => r?.latency_ms).map(r => r.latency_ms);
              return vals.length > 0 ? Math.min(...vals) : Infinity;
            };
            const diff = getMin(a) - getMin(b);
            return state.sortBy === 'latency_asc' ? diff : -diff;
          });
        }

        return items;
      }

      function getScrollHost() {
        return document.querySelector('.compare-container');
      }

      function getItemsGridTop() {
        const grid = el('items-grid');
        return grid ? grid.getBoundingClientRect().top : null;
      }

      function restoreItemsGridTop(anchorTop) {
        const host = getScrollHost();
        const grid = el('items-grid');
        if (!host || !grid || anchorTop == null) return;
        const currentTop = grid.getBoundingClientRect().top;
        host.scrollTop += currentTop - anchorTop;
      }

      function makeSafeDomId(value) {
        const raw = String(value ?? '');
        try {
          const binary = encodeURIComponent(raw).replace(/%([0-9A-F]{2})/g, (_, hex) => String.fromCharCode(parseInt(hex, 16)));
          return btoa(binary).replace(/[+/=]/g, '_') || 'item';
        } catch {
          return raw.replace(/[^A-Za-z0-9_-]/g, '_') || 'item';
        }
      }

      function renderItemComparisonCard(itemId, rowData, options = {}) {
          // Get input and expected from any available row
          const inputRow = rowData.find(r => r);
          const input = inputRow?.input_full || inputRow?.input || '—';
          const expected = inputRow?.expected_full || inputRow?.expected || '';

          // Use a safe ID for DOM elements by encoding the itemId
          const safeBaseId = makeSafeDomId(itemId);
          const safeId = options.idSuffix ? `${safeBaseId}_${options.idSuffix}` : safeBaseId;

          const perRunDetails = [];
          const outputCells = rowData.map((row, runIdx) => {
            const color = COLORS[runIdx % COLORS.length];
            const runInfo = state.runs[runIdx]?.run || {};
            const runFilePath = runInfo.file_path || '';

            if (!row) {
              perRunDetails.push(`<div class="run-metric-details" data-item="${safeId}" style="border-left-color:${color}"></div>`);
              return `
                <div class="item-run-output" style="border-left-color: ${color}">
                  <div class="compare-run-caption">
                    <span class="compare-run-dot" style="background:${color}"></span>
                    <span class="compare-run-name">${escapeHtml(runInfo.run_name || ('Run ' + (runIdx + 1)))}</span>
                  </div>
                  <div class="output-header">
                    <span class="output-status-cluster"><span class="run-label">OUTPUT</span></span>
                    <span class="output-actions"></span>
                  </div>
                  <div class="output-text" style="color:var(--text-muted);font-style:italic;">No data</div>
                </div>
              `;
            }

            const output = row.output_full || row.output || '—';
            const status = row.status || 'pending';
            const latencyMs = row.latency_ms;
            const taskStartedAtMs = row.task_started_at_ms;
            const traceId = row.trace_id;
            const runItemId = row.item_id || itemId;
            // Use direct trace_url if available, otherwise build from trace_id (global or per-run config)
            const traceUrl = row.trace_url || buildLangfuseTraceUrl(traceId) || buildLangfuseTraceUrlFromRun(traceId, runInfo);

            // Get metric values and metadata
            const metricVals = row.metric_values || [];
            const metricMeta = row.metric_meta || {};
            const run = state.runs[runIdx];
            const metricNames = run.snapshot?.metric_names || run.run?.metric_names || [];

            // Determine if this run is the winner for the selected metric
            const selectedMetric = state.selectedItemsMetric;
            const stats = selectedMetric ? state.comparisonStats[selectedMetric] : null;
            // Use itemIdToIndex mapping to find the winner for this item
            const itemIndex = state.itemIdToIndex?.[itemId];
            const itemWinner = itemIndex !== undefined ? stats?.itemWinners?.[itemIndex] : null;
            const isWinner = itemWinner === runIdx;

            // Build inline metric scores (all metrics shown, selected one highlighted)
            const metricScoresHtml = metricNames.map((name, i) => {
              const score = metricVals[i];
              const v = window.QymMetrics.parseScoreValue(score);
              if (v === null) return '';

              const itemMType = state.metricTypes?.[name] || 'score';
              const cls = window.QymMetrics.getMetricColorClass(v, itemMType);
              const display = window.QymMetrics.formatMetricValue(v, itemMType);
              const isSelected = name === selectedMetric;
              const meta = metricMeta[name] || {};
              const editBtn = `<button class="metric-edit-open" data-run-idx="${runIdx}" data-row-index="${escapeAttr(String(row.index ?? 0))}" data-metric="${escapeAttr(name)}" aria-label="Edit ${escapeAttr(name)}" title="Edit">✎</button>`;
              const editedBadge = String(meta.modified || '').toLowerCase() === 'true'
                ? '<span class="metric-edit-badge">Edited</span>'
                : '';

              return `<div class="metric-score-row ${isSelected ? 'highlighted' : ''}">
                <span class="metric-score-name">${escapeHtml(name)}</span>
                <span class="metric-score-meta">
                  <span class="metric-score-value ${cls}">${display}</span>
                  ${editBtn}
                  ${editedBadge}
                </span>
              </div>`;
            }).join('');

            let metricEditHtml = '';
            if (metricNames.length) {
              metricEditHtml = metricNames.map((name, i) => {
                const rawScore = metricVals[i];
                const rawValue = (rawScore == null || rawScore === '') ? '' : String(rawScore);
                const meta = metricMeta[name] || {};
                const originalRaw = meta.original_score;
                const hasOriginal = !(originalRaw == null || originalRaw === '');
                const modifiedNote = hasOriginal
                  ? `<div class="metric-edit-meta">Original: ${escapeHtml(String(originalRaw))}</div>`
                  : '';
                return `
                  <div class="metric-edit-block hidden" data-run-idx="${runIdx}" data-row-index="${escapeAttr(String(row.index ?? 0))}" data-metric="${escapeAttr(name)}">
                    <div class="metric-edit-title">Edit ${escapeHtml(name)}_score</div>
                    <div class="metric-edit-controls">
                      <input class="metric-edit-input" type="text" value="${escapeAttr(rawValue)}" data-run-idx="${runIdx}" data-row-index="${escapeAttr(String(row.index ?? 0))}" data-metric="${escapeAttr(name)}" />
                      <button class="metric-edit-save" data-run-idx="${runIdx}" data-row-index="${escapeAttr(String(row.index ?? 0))}" data-metric="${escapeAttr(name)}">Save</button>
                      <span class="metric-edit-status" aria-live="polite"></span>
                    </div>
                    ${modifiedNote}
                  </div>
                `;
              }).join('');
            }

            const startInfo = formatTaskStart(taskStartedAtMs);
            const clockIcon = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="6.25"/><path d="M8 4.5V8l2.5 1.5"/></svg>';
            const durationPart = latencyMs ? '<span class="toolbar-sep">·</span><span class="toolbar-duration">' + clockIcon + '<span>' + formatLatency(latencyMs) + '</span></span>' : '';
            const timePart = startInfo ? '<span class="toolbar-sep">·</span><span class="toolbar-time" title="' + escapeAttr(startInfo.ts) + '">' + escapeHtml(startInfo.ts) + '</span>' : '';

            const traceEndpoint = apiUrl('api/runs/' + encodeURIComponent(runFilePath) + '/items/' + encodeURIComponent(runItemId) + '/trace');
            const traceButton = !IS_COMPARE_EXPORT
              ? `<button type="button" class="action-chip trace-drawer-btn" data-trace-endpoint="${escapeAttr(traceEndpoint)}" data-trace-item-label="${escapeAttr((runInfo.run_name || ('Run ' + (runIdx + 1))) + ' · ' + runItemId)}" data-trace-id="${escapeAttr(traceId || '')}" data-trace-url="${escapeAttr(traceUrl || '')}" title="Open trace viewer"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2.5 4h11M2.5 8h7M2.5 12h9"/><circle cx="12.5" cy="8" r="1.2" fill="currentColor" stroke="none" opacity=".5"/><circle cx="13.5" cy="12" r="1.2" fill="currentColor" stroke="none" opacity=".5"/></svg>Trace</button>`
              : '';
            const copyBtn = `<button class="copy-btn" data-copy-text="${escapeAttr(typeof output === 'object' ? JSON.stringify(output, null, 2) : String(output))}" title="Copy output">${COPY_ICON}</button>`;
            const langfuseChip = traceUrl ? `<a class="action-chip" href="${escapeAttr(traceUrl)}" target="_blank" title="View in Langfuse"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5H4A1.5 1.5 0 0 0 2.5 5v7A1.5 1.5 0 0 0 4 13.5h7A1.5 1.5 0 0 0 12.5 12v-2"/><path d="M9.5 2.5h4v4"/><path d="M13.25 2.75 7.5 8.5"/></svg>Langfuse</a>` : '';

            // Build metric details for this run (collected, rendered after toggle)
            const hasMetricMeta = Object.keys(metricMeta).length > 0;

            if (hasMetricMeta) {
              const detailRows = metricNames.map((name) => {
                const meta = metricMeta[name] || {};
                const metaKeys = Object.keys(meta).filter(k => !['modified','original_score'].includes(k) && state.visibleMetricMetaFields[k] !== false);
                if (metaKeys.length === 0) return '';

                return metaKeys.map(key => {
                  const val = meta[key];
                  if (val === undefined || val === null || val === '') return '';
                  const displayName = formatFieldName(key);
                  return `<div class="metric-detail-row">
                    <span class="metric-detail-name">${escapeHtml(name)} · ${displayName}</span>
                    <span class="metric-detail-value">${formatMetaValue(val)}</span>
                  </div>`;
                }).join('');
              }).join('');

              if (detailRows) {
                perRunDetails.push(`<div class="run-metric-details" data-item="${safeId}" style="border-left-color:${color}">${detailRows}</div>`);
              } else {
                perRunDetails.push(`<div class="run-metric-details" data-item="${safeId}" style="border-left-color:${color}"></div>`);
              }
            } else {
              perRunDetails.push(`<div class="run-metric-details" data-item="${safeId}" style="border-left-color:${color}"></div>`);
            }

            const winnerBadge = isWinner ? '<span class="winner-badge">★ Winner</span>' : '';

            // Pass/fail indicator based on selected metric threshold (skip for numeric metrics)
            const pfIsNumeric = state.metricTypes?.[selectedMetric] === 'numeric';
            let pfClass = '';
            if (status === 'error') {
              pfClass = 'fail';
            } else if (selectedMetric && !pfIsNumeric) {
              const mIdx = metricNames.indexOf(selectedMetric);
              if (mIdx !== -1) {
                const pfScore = metricVals[mIdx];
                const pfVal = window.QymMetrics.parseScoreValue(pfScore);
                if (pfVal !== null) {
                  const pfBoolean = state.metricIsBoolean[selectedMetric];
                  const pfThreshold = pfBoolean ? 0.9999 : (state.metricThresholds[selectedMetric] || 0.8);
                  pfClass = pfVal >= pfThreshold ? 'pass' : 'fail';
                }
              }
            }
            const statusIndicator = pfClass
              ? `<div class="status-indicator"><div class="status-dot ${pfClass}"></div><span class="status-label ${pfClass}">${pfClass === 'pass' ? 'Pass' : 'Fail'}</span></div>`
              : '';

            // Root cause + Solution badges + feedback (only for failed items)
            let rootCauseHtml = '';
            const itemPassed = pfClass === 'pass';
            const rowRc = row.item_metadata?.root_cause || '';
            const rowRcDetail = row.item_metadata?.root_cause_detail || '';
            const rowRcNote = row.item_metadata?.root_cause_note || '';
            const rowRcSource = row.item_metadata?.root_cause_source || '';
            const rowRcConfidence = row.item_metadata?.root_cause_confidence;
            const rowSol = row.item_metadata?.solution || '';
            const rowSolNote = row.item_metadata?.solution_note || '';
            const reviewStatus = row.review_correction_status || '';

            if (rowRc || rowRcDetail || rowSol || !itemPassed) {
              const feedbackIcon = '<svg class="feedback-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 3h12v8H4l-2 2V3z"/></svg>';
              const isAi = rowRcSource === 'ai';
              const rcColor = ROOT_CAUSE_COLORS[rowRc] || '#e07a5f';

              // Detail badge — uses same color as category
              let rcDetailBadge = '';
              if (rowRcDetail) {
                const aiClass = isAi ? ' ai-suggested' : '';
                const aiIcon = isAi ? '<span class="ai-indicator" title="AI suggested">\uD83E\uDD16</span>' : '';
                rcDetailBadge = `<span class="meta-badge badge-rc-detail${aiClass}" data-rcdetail-item="${escapeAttr(itemId)}" data-rcdetail-run-idx="${runIdx}" style="border-color:${rcColor}40;color:${rcColor};background:${rcColor}15;max-width:100%;box-sizing:border-box;display:inline-flex;" title="Root cause: ${escapeAttr(rowRcDetail)}. Click to change.">${aiIcon}${escapeHtml(rowRcDetail)}</span>`;
              } else if (!itemPassed) {
                rcDetailBadge = `<button class="root-cause-assign-btn" data-rcdetail-item="${escapeAttr(itemId)}" data-rcdetail-run-idx="${runIdx}" title="Assign root cause"><span class="badge-icon">+</span>Root Cause</button>`;
              }

              // Category badge
              let rcCategoryBadge = '';
              if (rowRc) {
                const aiClass = isAi ? ' ai-suggested' : '';
                let confidenceDot = '';
                const aiIcon = isAi ? '<span class="ai-indicator" title="AI suggested">\uD83E\uDD16</span>' : '';
                if (isAi && rowRcConfidence != null) {
                  const confColor = rowRcConfidence >= 0.8 ? '#22c55e' : rowRcConfidence >= 0.5 ? '#eab308' : '#ef4444';
                  confidenceDot = `<span class="confidence-dot" style="background:${confColor};" title="Confidence: ${Math.round(rowRcConfidence * 100)}%"></span>`;
                }
                rcCategoryBadge = `<span class="meta-badge badge-root-cause${aiClass}" data-rc-item="${escapeAttr(itemId)}" data-rc-run-idx="${runIdx}" style="border-color: ${rcColor}40; color: ${rcColor}; background: ${rcColor}15;max-width:100%;box-sizing:border-box;display:inline-flex;" title="Category: ${escapeAttr(rowRc)}. Click to change.">${aiIcon}${escapeHtml(rowRc)}${confidenceDot}</span>`;
              } else if (!itemPassed) {
                rcCategoryBadge = `<button class="root-cause-assign-btn rc-category-assign" data-rc-item="${escapeAttr(itemId)}" data-rc-run-idx="${runIdx}" title="Assign root cause category"><span class="badge-icon">+</span>Category</button>`;
              }

              // Solution badge group
              let solBadgeHtml = '';
              if (rowSol) {
                const solColor = SOLUTION_COLORS[rowSol] || '#60a5fa';
                const solSource = row.item_metadata?.solution_source || '';
                const solIsAi = solSource === 'ai';
                const solIcon = solIsAi ? '<span class="ai-indicator">\uD83E\uDD16</span>' : '';
                solBadgeHtml = `<div class="rc-badge-group" style="max-width:100%;">
                  <span class="rc-sol-label sol-label">\uD83D\uDEE0 SOLUTION</span>
                  <span class="meta-badge badge-solution${solIsAi ? ' ai-suggested' : ''}" data-sol-item="${escapeAttr(itemId)}" data-sol-run-idx="${runIdx}" style="border-color:${solColor}40;color:${solColor};background:${solColor}15;max-width:100%;box-sizing:border-box;display:inline-flex;" title="Solution: ${escapeAttr(rowSol)}. Click to change.">${solIcon}${escapeHtml(rowSol)}</span>
                  ${rowSolNote ? `<div class="sol-note-text">${escapeHtml(rowSolNote)}</div>` : ''}
                </div>`;
              } else if (!itemPassed) {
                solBadgeHtml = `<div class="rc-badge-group" style="max-width:100%;">
                  <span class="rc-sol-label sol-label">\uD83D\uDEE0 SOLUTION</span>
                  <button class="solution-assign-btn" data-sol-item="${escapeAttr(itemId)}" data-sol-run-idx="${runIdx}" title="Suggest solution"><span class="badge-icon">+</span>Solution</button>
                </div>`;
              }

              // Feedback
              let feedbackHtml = '';
              if (rowRc || rowRcDetail) {
                feedbackHtml = rowRcNote
                  ? `<div class="feedback-section"><div class="feedback-display" data-feedback-item="${escapeAttr(itemId)}" data-feedback-run-idx="${runIdx}" title="Click to edit feedback">${feedbackIcon}<span class="feedback-text">${escapeHtml(rowRcNote)}</span></div></div>`
                  : `<div class="feedback-section"><div class="feedback-display" data-feedback-item="${escapeAttr(itemId)}" data-feedback-run-idx="${runIdx}" title="Click to add feedback">${feedbackIcon}<span class="feedback-text feedback-placeholder">Add feedback\u2026</span></div></div>`;
              }

              const detailGroup = rcDetailBadge ? `<div class="rc-badge-group" style="max-width:100%;"><span class="rc-sol-label rc-label">\u26A0 ROOT CAUSE</span>${rcDetailBadge}</div>` : '';
              const catGroup = rcCategoryBadge ? `<div class="rc-badge-group" style="max-width:100%;"><span class="rc-sol-label rc-label">\uD83D\uDCC2 CATEGORY</span>${rcCategoryBadge}</div>` : '';
              const reviewStatusHtml = reviewStatus === 'approved' ? '<div class="rc-status-pill approved">Approved</div>' : '';
              const solSep = solBadgeHtml ? '<div class="rc-badges-sep"></div>' : '';
              rootCauseHtml = `<div class="rc-sol-row">${reviewStatusHtml}<div class="rc-badges-row">${detailGroup}${catGroup}${solSep}${solBadgeHtml}</div>${feedbackHtml}</div>`;
            }

            return `
              <div class="item-run-output" style="border-left-color: ${color}">
                <div class="compare-run-caption">
                  <span class="compare-run-dot" style="background:${color}"></span>
                  <span class="compare-run-name">${escapeHtml(runInfo.run_name || ('Run ' + (runIdx + 1)))}</span>
                  ${winnerBadge}
                </div>
                <div class="output-header">
                  <span class="output-status-cluster"><span class="run-label">OUTPUT</span>${statusIndicator}${durationPart}${timePart}</span>
                  <span class="output-actions">${copyBtn}${traceButton}${langfuseChip}</span>
                </div>
                <div class="output-text ${status === 'error' ? 'score-1' : ''}">${renderMarkdownSafe(output)}</div>
                <div class="metric-scores-inline">${metricScoresHtml}</div>
                ${_renderTraceChips(row.trace_stats, row.retry_count)}
                ${metricEditHtml}
                ${rootCauseHtml}
              </div>
            `;
          }).join('');
          const perRunDetailsHtml = perRunDetails.join('');
          const hasAnyMetricDetails = perRunDetails.some(h => !h.endsWith('"></div>'));

          // Format item ID for display (e.g., "item_5" -> "Item 6", or keep original if not matching pattern)
          let displayItemId = itemId;
          const itemMatch = itemId.match(/^item_(\d+)$/);
          if (itemMatch) {
            displayItemId = `Item ${parseInt(itemMatch[1], 10) + 1}`;
          }

          // #5/#6: Build item metadata row — complexity & domain as first-class badges
          let itemMetadataHtml = '';
          {
            const SPECIAL_KEYS = ['complexity', 'domain', 'root_cause', 'root_cause_detail', 'root_cause_note', 'root_cause_source', 'root_cause_confidence', 'solution', 'solution_note', 'solution_source'];
            const metaRow = rowData.find(r => r);
            const md = metaRow?.item_metadata || {};
            if (typeof md === 'object') {
              // Build special badges for complexity & domain
              let badgesHtml = '';
              for (const sk of SPECIAL_KEYS) {
                if (sk.startsWith('root_cause') || sk.startsWith('solution')) continue;
                if (md[sk] !== undefined && md[sk] !== null && md[sk] !== '' && state.visibleMetadataFields[sk] !== false) {
                  const icon = sk === 'complexity' ? '\u2666' : '\u25C6';
                  const vals = (sk === 'domain' || sk === 'patterns') ? parseMetaList(md[sk]) : [String(md[sk])];
                  for (const v of vals) {
                    let valClass = '';
                    if (sk === 'complexity') {
                      const lv = v.toLowerCase().trim();
                      if (['easy', 'simple', 'basic', 'low'].includes(lv)) valClass = ' complexity-easy';
                      else if (['medium', 'moderate', 'intermediate', 'mid'].includes(lv)) valClass = ' complexity-medium';
                      else if (['hard', 'difficult', 'advanced', 'high', 'complex'].includes(lv)) valClass = ' complexity-hard';
                      else if (['very hard', 'very_hard', 'expert', 'extreme'].includes(lv)) valClass = ' complexity-expert';
                    }
                    badgesHtml += `<span class="meta-badge badge-${sk}${valClass}"><span class="badge-icon">${icon}</span>${escapeHtml(v)}</span>`;
                  }
                }
              }

              // Build generic tags (everything except special keys and internal keys)
              const genericEntries = Object.entries(md).filter(([k]) =>
                k !== 'task_started_at_ms' && k !== 'trace_stats' && !SPECIAL_KEYS.includes(k) && state.visibleMetadataFields[k] !== false
              );
              let genericHtml = '';
              if (genericEntries.length > 0) {
                genericHtml = genericEntries.map(([k, v]) =>
                  `<span class="item-metadata-tag"><span class="meta-key">${escapeHtml(k)}:</span> <span class="meta-val">${escapeHtml(String(v))}</span></span>`
                ).join('');
              }

              if (badgesHtml || genericHtml) {
                const separator = badgesHtml && genericHtml ? '<span class="item-meta-sep"></span>' : '';
                itemMetadataHtml = `
                  <div class="item-metadata-row">
                    ${badgesHtml ? `<div class="item-meta-badges">${badgesHtml}</div>` : ''}
                    ${separator}
                    ${genericHtml ? `<div class="item-metadata-tags">${genericHtml}</div>` : ''}
                  </div>`;
              }
            }
          }

          return `
            <div class="item-comparison-row">
              <div class="item-header">
                <span class="item-index" title="ID: ${escapeHtml(itemId)}">${escapeHtml(displayItemId)}</span>
                <button class="copy-btn" data-item-id="${escapeAttr(itemId)}" title="Copy all fields">${COPY_ICON}</button>
              </div>
              <div class="item-input-row">
                <div class="input-label">Input <button class="copy-btn" data-copy-text="${escapeAttr(typeof input === 'object' ? JSON.stringify(input, null, 2) : String(input))}" title="Copy input">${COPY_ICON}</button></div>
                <div class="input-text">${renderMarkdownSafe(input)}</div>
              </div>
              ${expected ? `
              <div class="item-expected-row">
                <div class="expected-label">Expected Output <button class="copy-btn" data-copy-text="${escapeAttr(typeof expected === 'object' ? JSON.stringify(expected, null, 2) : String(expected))}" title="Copy expected output">${COPY_ICON}</button></div>
                <div class="expected-text collapsed">${renderMarkdownSafe(expected)}</div>
                <button class="expected-toggle" onclick="this.previousElementSibling.classList.toggle('collapsed'); this.textContent = this.previousElementSibling.classList.contains('collapsed') ? 'Show more \u25BC' : 'Show less \u25B2';">Show more \u25BC</button>
              </div>` : ''}
              ${itemMetadataHtml}
              <div class="item-outputs-row" style="--run-count: ${state.runs.length}">
                ${outputCells}
              </div>
              ${hasAnyMetricDetails ? `<div class="item-outputs-row run-metric-details-grid" style="--run-count: ${state.runs.length}" data-item="${safeId}">
                <button class="metric-details-toggle" style="grid-column:1/-1;" onclick="toggleItemMetricDetails('${safeId}')"><span class="toggle-icon" id="toggle-icon-${safeId}">\u25B6</span> Metric Details</button>
                ${perRunDetailsHtml}
              </div>` : ''}
            </div>
          `;

      }

      function getComparisonRowDataForItem(itemId) {
        return state.runs.map(run => findRowByCompareId(run.snapshot?.rows || [], itemId));
      }

      function hasComparisonRowData(rowData) {
        return Array.isArray(rowData) && rowData.some(Boolean);
      }

      function getItemCopyText(itemId, rowData) {
        const inputRow = rowData.find(r => r);
        const parts = [];
        const inp = inputRow?.input_full || inputRow?.input || '';
        parts.push('Input: ' + (typeof inp === 'object' ? JSON.stringify(inp, null, 2) : String(inp)));
        const exp = inputRow?.expected_full || inputRow?.expected || '';
        if (exp) parts.push('Expected: ' + (typeof exp === 'object' ? JSON.stringify(exp, null, 2) : String(exp)));
        rowData.forEach((rd, ri) => {
          const rName = state.runs[ri]?.run?.run_name || `Run ${ri + 1}`;
          const out = rd?.output_full || rd?.output || '';
          parts.push(`${rName} Output: ${typeof out === 'object' ? JSON.stringify(out, null, 2) : String(out)}`);
        });
        return parts.join('\n\n');
      }

      function markCopyButtonCopied(btn) {
        btn.innerHTML = CHECK_ICON;
        btn.classList.add('copied');
        setTimeout(() => { btn.innerHTML = COPY_ICON; btn.classList.remove('copied'); }, 1500);
      }

      function wireComparisonCardCopyHandlers(scope, fallbackItem = null) {
        if (!scope) return;
        scope.querySelectorAll('.copy-btn[data-item-id]').forEach(btn => {
          btn.addEventListener('click', (event) => {
            event.stopPropagation();
            const id = btn.dataset.itemId;
            const item = fallbackItem?.itemId === id
              ? fallbackItem
              : getFilteredItems().find(it => it.itemId === id);
            if (!item) return;
            navigator.clipboard.writeText(getItemCopyText(id, item.rowData)).then(() => markCopyButtonCopied(btn));
          });
        });

        scope.querySelectorAll('.copy-btn[data-copy-text]').forEach(btn => {
          btn.addEventListener('click', (event) => {
            event.stopPropagation();
            navigator.clipboard.writeText(btn.dataset.copyText).then(() => markCopyButtonCopied(btn));
          });
        });
      }

      function ensureItemComparisonModal() {
        let overlay = document.getElementById('item-comparison-modal-overlay');
        if (overlay) return overlay;

        overlay = document.createElement('div');
        overlay.id = 'item-comparison-modal-overlay';
        overlay.className = 'item-comparison-modal-overlay';
        overlay.innerHTML = `
          <div class="item-comparison-modal" role="dialog" aria-modal="true" aria-labelledby="item-comparison-modal-title">
            <div class="item-comparison-modal-header">
              <div class="item-comparison-modal-title" id="item-comparison-modal-title"></div>
              <button type="button" class="item-comparison-modal-close" id="item-comparison-modal-close" aria-label="Close">&times;</button>
            </div>
            <div class="item-comparison-modal-body" id="item-comparison-modal-body"></div>
          </div>
        `;
        document.body.appendChild(overlay);

        overlay.addEventListener('click', (event) => {
          if (event.target === overlay) closeItemComparisonModal();
        });
        overlay.querySelector('#item-comparison-modal-close')?.addEventListener('click', closeItemComparisonModal);
        document.addEventListener('keydown', (event) => {
          if (event.key === 'Escape' && overlay.classList.contains('open')) closeItemComparisonModal();
        });
        return overlay;
      }

      function closeItemComparisonModal() {
        const overlay = document.getElementById('item-comparison-modal-overlay');
        if (!overlay) return;
        overlay.classList.remove('open');
        delete overlay.dataset.itemId;
        document.body.style.overflow = '';
        document.querySelectorAll('.root-cause-dropdown, .solution-dropdown').forEach(d => d.remove());
      }

      function renderItemComparisonModalBody(overlay, itemId, rowData) {
        const title = overlay.querySelector('#item-comparison-modal-title');
        const body = overlay.querySelector('#item-comparison-modal-body');
        if (title) title.textContent = `Item Comparison · ${itemId}`;
        if (body) {
          body.innerHTML = renderItemComparisonCard(itemId, rowData, { idSuffix: 'modal' });
          wireMetricEditHandlers(body);
          wireRootCauseHandlers(body);
          wireSolutionHandlers(body);
          wireComparisonCardCopyHandlers(body, { itemId, rowData });
          initExpectedToggles();
          alignOutputHeights();
        }
      }

      function refreshOpenItemComparisonModal() {
        const overlay = document.getElementById('item-comparison-modal-overlay');
        if (!overlay || !overlay.classList.contains('open') || !overlay.dataset.itemId) return;
        const itemId = overlay.dataset.itemId;
        const rowData = getComparisonRowDataForItem(itemId);
        if (hasComparisonRowData(rowData)) renderItemComparisonModalBody(overlay, itemId, rowData);
      }

      function openItemComparisonModal(itemId) {
        if (!itemId || !canRenderItemComparison()) {
          showToast('error', 'Comparison Unavailable', 'Item comparison is unavailable for this selection.');
          return;
        }
        const rowData = getComparisonRowDataForItem(itemId);
        if (!hasComparisonRowData(rowData)) {
          showToast('error', 'Item Not Found', 'No aligned run rows were found for this item.');
          return;
        }

        const overlay = ensureItemComparisonModal();
        overlay.dataset.itemId = itemId;
        overlay.classList.add('open');
        document.body.style.overflow = 'hidden';
        renderItemComparisonModalBody(overlay, itemId, rowData);
        overlay.querySelector('#item-comparison-modal-close')?.focus();
      }

      function renderItems(scrollToTop = false) {
        const preserveAnchor = state.hasRenderedItems && !scrollToTop;
        const anchorTop = preserveAnchor ? getItemsGridTop() : null;
        // Keep Performance by Category and Root Cause Analysis in sync with filters
        renderMetadataBreakdown();
        renderErrorDistributionSection();
        renderRootCauseSection();

        const container = el('items-grid');
        const paginationEl = el('pagination');
        const filterCountEl = el('filter-count');
        const warningEl = el('alignment-warning');
        const filterPanel = document.querySelector('.items-comparison .filter-panel');
        if (!canRenderItemComparison()) {
          if (warningEl) {
            warningEl.innerHTML = getAlignmentWarningHtml('Item-by-Item Comparison Unavailable');
            warningEl.style.display = 'flex';
          }
          if (filterPanel) filterPanel.style.display = 'none';
          if (filterCountEl) filterCountEl.textContent = '';
          container.innerHTML = '';
          paginationEl.innerHTML = '';
          if (anchorTop != null) requestAnimationFrame(() => restoreItemsGridTop(anchorTop));
          return;
        }
        if (warningEl) warningEl.style.display = 'none';
        if (filterPanel) filterPanel.style.display = '';
        const items = getFilteredItems();
        renderComparisonStats(items);

        // Update filter count & clear button
        filterCountEl.innerHTML = `Showing <span class="count-num">${items.length}</span> items`;
        updateClearButton();

        // Set CSS variable for grid columns
        container.style.setProperty('--run-count', state.runs.length);

        // Pagination
        const totalPages = Math.max(1, Math.ceil(items.length / state.pageSize));
        if (state.page > totalPages) state.page = totalPages;
        const start = (state.page - 1) * state.pageSize;
        const pageItems = items.slice(start, start + state.pageSize);

        if (items.length === 0) {
          container.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--text-muted);">No items match the current filter</div>';
          paginationEl.innerHTML = '';
          if (anchorTop != null) requestAnimationFrame(() => restoreItemsGridTop(anchorTop));
          return;

        container.innerHTML = pageItems.map(({ itemId, rowData }) => renderItemComparisonCard(itemId, rowData)).join('');

        // Pagination controls
        paginationEl.innerHTML = `
          <button id="prev-page" ${state.page <= 1 ? 'disabled' : ''}>← Prev</button>

        el('prev-page').onclick = () => { state.page--; renderItems(true); };

        if (scrollToTop) {

          requestAnimationFrame(() => restoreItemsGridTop(anchorTop));

        state.hasRenderedItems = true;

        wireMetricEditHandlers();

        wireSolutionHandlers();
        initExpectedToggles();
        alignOutputHeights();
        wireComparisonCardCopyHandlers(container);
        refreshOpenItemComparisonModal();
