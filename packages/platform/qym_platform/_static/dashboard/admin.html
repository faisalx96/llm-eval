<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قيِّم • Admin</title>
  <link rel="icon" type="image/png" href="/static/qym_icon.png">
  <link rel="stylesheet" href="/static/dashboard.css">
  <link rel="stylesheet" href="/static/shell.css">
  <script src="/static/auth.js"></script>
  <script src="/static/shell.js"></script>
  <style>
    .page {
      max-width: 1280px;
      margin: 0 auto;
      padding: var(--space-lg);
    }
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-md);
      margin-bottom: var(--space-lg);
    }
    .page-header h1 {
      margin: 0;
      font-size: 28px;
    }
    .page-header p {
      margin: 6px 0 0;
      color: var(--text-muted);
    }
    .section {
      background: var(--bg-surface);
      border: 1px solid var(--border-default);
      border-radius: 10px;
      padding: var(--space-lg);
      margin-bottom: var(--space-lg);
    }
    .section h2 {
      margin: 0 0 var(--space-md);
      font-size: var(--font-md);
    }
    .toolbar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: var(--space-sm);
      margin-bottom: var(--space-md);
    }
    .form-input, .form-select, .form-textarea {
      width: 100%;
      box-sizing: border-box;
      background: var(--bg-elevated);
      border: 1px solid var(--border-default);
      border-radius: 6px;
      color: var(--text-primary);
      padding: 10px 12px;
      font-size: var(--font-sm);
      font-family: var(--font-sans);
    }
    .form-textarea {
      min-height: 72px;
      resize: vertical;
    }
    .table-wrap {
      overflow: auto;
    }
    table {
      width: 100%;
      min-width: 920px;
      border-collapse: collapse;
    }
    th, td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-default);
      vertical-align: top;
    }
    th {
      font-size: var(--font-xs);
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: var(--bg-elevated);
    }
    .row-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .row-meta {
      color: var(--text-muted);
      font-size: var(--font-xs);
      margin-top: 4px;
    }
    .message {
      color: var(--accent-primary);
      font-size: var(--font-sm);
      margin-top: var(--space-sm);
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="page-header">
      <div>
        <h1>Admin</h1>
        <p>Manage members and project lifecycle. Project memberships and API keys live on each project.</p>
      </div>
    </section>

    <section class="section">
      <h2>Create Project</h2>
      <div class="toolbar">
        <input class="form-input" id="new-project-name" placeholder="Project name">
        <input class="form-input" id="new-project-slug" placeholder="project-slug">
        <input class="form-input" id="new-project-description" placeholder="Description">
        <button class="btn btn-primary" id="create-project-btn" type="button">Create Project</button>
      </div>
      <div class="message" id="project-message"></div>
      <div class="table-wrap" style="margin-top:14px;">
        <table>
          <thead>
            <tr>
              <th>Project</th>
              <th>Description</th>
              <th>Status</th>
              <th>Members</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="projects-tbody"></tbody>
        </table>
      </div>
    </section>

    <section class="section">
      <h2>Create User</h2>
      <div class="toolbar">
        <input class="form-input" id="new-user-email" placeholder="name@example.com">
        <input class="form-input" id="new-user-name" placeholder="Display name">
        <select class="form-select" id="new-user-role">
          <option value="MEMBER">MEMBER</option>
          <option value="ADMIN">ADMIN</option>
        </select>
        <button class="btn btn-primary" id="create-user-btn" type="button">Create User</button>
      </div>
      <div class="message" id="user-message"></div>
      <div class="table-wrap" style="margin-top:14px;">
        <table>
          <thead>
            <tr>
              <th>User</th>
              <th>Role</th>
              <th>Active</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="users-tbody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    (() => {
      'use strict';

      function apiUrl(path) {
        return `${window.location.origin}/${String(path || '').replace(/^\/+/, '')}`;
      }

      function escapeHtml(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      let state = { users: [], projects: [] };

      async function fetchJson(path, options) {
        const res = await fetch(apiUrl(path), options);
        if (window.QymAuth && window.QymAuth.handle401(res)) return null;
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.detail || 'Request failed');
        return data;
      }

      async function load() {
        const [me, users, projectsPayload] = await Promise.all([
          fetchJson('v1/me'),
          fetchJson('v1/admin/users'),
          fetchJson('v1/projects'),
        ]);
        if (!me || me.role !== 'ADMIN') throw new Error('Admin access required');
        state.users = users || [];
        state.projects = (projectsPayload && projectsPayload.projects) || [];
        renderUsers();
        renderProjects();
      }

      function renderProjects() {
        document.getElementById('projects-tbody').innerHTML = state.projects.map((project) => `
          <tr>
            <td>
              <input class="form-input" data-project-name="${escapeHtml(project.id)}" value="${escapeHtml(project.name)}">
              <div class="row-meta">${escapeHtml(project.slug)}</div>
            </td>
            <td><input class="form-input" data-project-description="${escapeHtml(project.id)}" value="${escapeHtml(project.description || '')}"></td>
            <td>
              <label style="display:flex; gap:8px; align-items:center;">
                <input type="checkbox" data-project-active="${escapeHtml(project.id)}" ${project.is_active ? 'checked' : ''}>
                <span>${project.is_active ? 'ACTIVE' : 'ARCHIVED'}</span>
              </label>
            </td>
            <td>${escapeHtml(String(project.member_count || 0))}</td>
            <td>
              <div class="row-actions">
                <button class="btn btn-secondary" type="button" data-project-save="${escapeHtml(project.id)}">Save</button>
                <a class="btn btn-secondary" href="/projects/${encodeURIComponent(project.slug)}/settings">Settings</a>
                <button class="btn btn-danger" type="button" data-project-delete="${escapeHtml(project.id)}">Delete / Archive</button>
              </div>
            </td>
          </tr>
        `).join('');

        document.querySelectorAll('[data-project-save]').forEach((button) => {
          button.addEventListener('click', async () => {
            const id = button.dataset.projectSave;
            const name = document.querySelector(`[data-project-name="${CSS.escape(id)}"]`).value.trim();
            const description = document.querySelector(`[data-project-description="${CSS.escape(id)}"]`).value.trim();
            const isActive = document.querySelector(`[data-project-active="${CSS.escape(id)}"]`).checked;
            await fetchJson(`v1/admin/projects/${id}`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ name, description, is_active: isActive }),
            });
            document.getElementById('project-message').textContent = 'Project updated';
            await load();
          });
        });

        document.querySelectorAll('[data-project-delete]').forEach((button) => {
          button.addEventListener('click', async () => {
            if (!window.confirm('Delete or archive this project?')) return;
            await fetchJson(`v1/admin/projects/${button.dataset.projectDelete}`, { method: 'DELETE' });
            document.getElementById('project-message').textContent = 'Project removed';
            await load();
          });
        });
      }

      function renderUsers() {
        document.getElementById('users-tbody').innerHTML = state.users.map((user) => `
          <tr>
            <td>
              <input class="form-input" data-user-name="${escapeHtml(user.id)}" value="${escapeHtml(user.display_name || '')}">
              <div class="row-meta">${escapeHtml(user.email)}</div>
            </td>
            <td>
              <select class="form-select" data-user-role="${escapeHtml(user.id)}">
                <option value="MEMBER" ${user.role === 'MEMBER' ? 'selected' : ''}>MEMBER</option>
                <option value="ADMIN" ${user.role === 'ADMIN' ? 'selected' : ''}>ADMIN</option>
              </select>
            </td>
            <td>
              <label style="display:flex; gap:8px; align-items:center;">
                <input type="checkbox" data-user-active="${escapeHtml(user.id)}" ${user.is_active ? 'checked' : ''}>
                <span>${user.is_active ? 'ACTIVE' : 'DISABLED'}</span>
              </label>
            </td>
            <td>
              <div class="row-actions">
                <button class="btn btn-secondary" type="button" data-user-save="${escapeHtml(user.id)}">Save</button>
                <button class="btn btn-danger" type="button" data-user-delete="${escapeHtml(user.id)}">Delete</button>
              </div>
            </td>
          </tr>
        `).join('');

        document.querySelectorAll('[data-user-save]').forEach((button) => {
          button.addEventListener('click', async () => {
            const id = button.dataset.userSave;
            const displayName = document.querySelector(`[data-user-name="${CSS.escape(id)}"]`).value.trim();
            const role = document.querySelector(`[data-user-role="${CSS.escape(id)}"]`).value;
            const isActive = document.querySelector(`[data-user-active="${CSS.escape(id)}"]`).checked;
            await fetchJson(`v1/admin/users/${id}`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ display_name: displayName, role, is_active: isActive }),
            });
            document.getElementById('user-message').textContent = 'User updated';
            await load();
          });
        });

        document.querySelectorAll('[data-user-delete]').forEach((button) => {
          button.addEventListener('click', async () => {
            if (!window.confirm('Delete this user?')) return;
            await fetchJson(`v1/admin/users/${button.dataset.userDelete}`, { method: 'DELETE' });
            document.getElementById('user-message').textContent = 'User deleted';
            await load();
          });
        });
      }

      document.getElementById('create-project-btn').addEventListener('click', async () => {
        await fetchJson('v1/admin/projects', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: document.getElementById('new-project-name').value.trim(),
            slug: document.getElementById('new-project-slug').value.trim(),
            description: document.getElementById('new-project-description').value.trim(),
          }),
        });
        document.getElementById('project-message').textContent = 'Project created';
        document.getElementById('new-project-name').value = '';
        document.getElementById('new-project-slug').value = '';
        document.getElementById('new-project-description').value = '';
        await load();
      });

      document.getElementById('create-user-btn').addEventListener('click', async () => {
        await fetchJson('v1/admin/users', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('new-user-email').value.trim(),
            display_name: document.getElementById('new-user-name').value.trim(),
            role: document.getElementById('new-user-role').value,
            is_active: true,
          }),
        });
        document.getElementById('user-message').textContent = 'User created';
        document.getElementById('new-user-email').value = '';
        document.getElementById('new-user-name').value = '';
        await load();
      });

      load().catch((error) => {
        document.querySelector('main').innerHTML = `<div class="page"><div class="section">${escapeHtml(error.message)}</div></div>`;
      });
    })();
  </script>
</body>
</html>
