<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قيِّم • Admin</title>
  <link rel="icon" type="image/png" href="/static/qym_icon.png">
  <link rel="stylesheet" href="/static/dashboard.css">
  <link rel="stylesheet" href="/static/shell.css">
  <script src="/static/auth.js"></script>
  <script src="/static/shell.js"></script>
  <style>
    .admin-page { }
    .admin-header { margin-bottom: var(--space-xl); }
    .admin-header h1 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: -0.3px; }
    .admin-header p { font-size: var(--font-sm); color: var(--text-muted); margin-top: 6px; }

    .admin-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-md); margin-bottom: var(--space-lg); }
    .stat-card { background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: 8px; padding: var(--space-lg); }
    .stat-card-label { font-size: 11px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: var(--space-sm); }
    .stat-card-value { font-size: 28px; font-weight: 700; font-family: var(--font-mono); color: var(--text-primary); }

    .card { background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: 8px; overflow: hidden; margin-bottom: var(--space-lg); }
    .card-header { display: flex; align-items: center; justify-content: space-between; padding: var(--space-md) var(--space-lg); border-bottom: 1px solid var(--border-subtle); }
    .card-title { font-size: var(--font-md); font-weight: 600; }
    .card-subtitle { font-size: var(--font-xs); color: var(--text-muted); margin-top: 2px; }
    .card-body { padding: 0; }

    .add-bar { display: flex; align-items: center; gap: var(--space-sm); padding: var(--space-md) var(--space-lg); border-bottom: 1px solid var(--border-subtle); }
    .add-bar .form-input, .add-bar .form-select {
      font-family: var(--font-sans); font-size: var(--font-base);
      background: var(--bg-elevated); border: 1px solid var(--border-default);
      border-radius: 6px; padding: var(--space-sm) var(--space-md); color: var(--text-primary);
    }
    .add-bar .form-input { flex: 1; min-width: 0; }
    .add-bar .form-select { width: 120px; flex: none; }

    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th { text-align: left; padding: var(--space-sm) var(--space-lg); font-size: 11px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; background: var(--bg-elevated); border-bottom: 1px solid var(--border-subtle); }
    .data-table td { padding: var(--space-md) var(--space-lg); font-size: var(--font-sm); color: var(--text-secondary); border-bottom: 1px solid var(--border-subtle); vertical-align: middle; }
    .data-table tbody tr { transition: background 0.1s ease; }
    .data-table tbody tr:hover { background: var(--bg-hover); }
    .data-table tbody tr:last-child td { border-bottom: none; }
    .data-table .form-input, .data-table .form-select { font-size: var(--font-xs); padding: 4px 8px; background: var(--bg-elevated); border: 1px solid var(--border-default); border-radius: 4px; color: var(--text-primary); }
    .data-table .form-input { width: 100%; }
    .row-meta { color: var(--text-muted); font-size: var(--font-xs); margin-top: 2px; font-family: var(--font-mono); }
    .row-actions { display: flex; gap: var(--space-xs); justify-content: flex-end; }

    .role-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.3px; }
    .role-badge.admin { background: rgba(0,212,170,0.12); color: var(--accent-primary); }
    .role-badge.member { background: var(--bg-active); color: var(--text-muted); }

    .message { color: var(--accent-primary); font-size: var(--font-sm); padding: 0 var(--space-lg); min-height: 20px; }
  </style>
</head>
<body>
  <main class="admin-page">
    <div class="admin-header">
      <h1>Admin</h1>
      <p>Platform-wide user and project management.</p>
    </div>

    <div class="admin-stats">
      <div class="stat-card"><div class="stat-card-label">Total Users</div><div class="stat-card-value" id="stat-users">—</div></div>
      <div class="stat-card"><div class="stat-card-label">Projects</div><div class="stat-card-value" id="stat-projects">—</div></div>
      <div class="stat-card"><div class="stat-card-label">Total Runs</div><div class="stat-card-value" id="stat-runs">—</div></div>
    </div>

    <div class="card">
      <div class="card-header"><div><div class="card-title">Projects</div><div class="card-subtitle" id="project-count-label">All platform projects</div></div></div>
      <div class="add-bar">
        <input class="form-input" id="new-project-name" placeholder="Project name" />
        <input class="form-input" id="new-project-slug" placeholder="project-slug" style="font-family:var(--font-mono);font-size:12px" />
        <input class="form-input" id="new-project-description" placeholder="Description" style="flex:2" />
        <button class="btn btn-primary" id="create-project-btn" type="button" style="padding:var(--space-sm) var(--space-md);font-size:var(--font-sm)">Create</button>
      </div>
      <div class="message" id="project-message"></div>
      <div class="card-body">
        <table class="data-table">
          <thead><tr><th>Project</th><th>Slug</th><th>Status</th><th>Members</th><th style="text-align:right">Actions</th></tr></thead>
          <tbody id="projects-tbody"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div class="card-header"><div><div class="card-title">Users</div><div class="card-subtitle" id="user-count-label">All platform users</div></div></div>
      <div class="add-bar">
        <input class="form-input" id="new-user-email" placeholder="name@example.com" />
        <input class="form-input" id="new-user-name" placeholder="Display name" />
        <select class="form-select" id="new-user-role"><option value="MEMBER">Member</option><option value="ADMIN">Admin</option></select>
        <button class="btn btn-primary" id="create-user-btn" type="button" style="padding:var(--space-sm) var(--space-md);font-size:var(--font-sm)">Create User</button>
      </div>
      <div class="message" id="user-message"></div>
      <div class="card-body">
        <table class="data-table">
          <thead><tr><th>User</th><th>Email</th><th>Role</th><th>Status</th><th style="text-align:right">Actions</th></tr></thead>
          <tbody id="users-tbody"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    (() => {
      'use strict';

      function apiUrl(path) {
        return `${window.location.origin}/${String(path || '').replace(/^\/+/, '')}`;
      }

      function escapeHtml(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }

      let state = { users: [], projects: [] };

      async function fetchJson(path, options) {
        const res = await fetch(apiUrl(path), options);
        if (window.QymAuth && window.QymAuth.handle401(res)) return null;
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.detail || 'Request failed');
        return data;
      }

      async function load() {
        const [me, users, projectsPayload] = await Promise.all([
          fetchJson('v1/me'),
          fetchJson('v1/admin/users'),
          fetchJson('v1/projects'),
        ]);
        if (!me || me.role !== 'ADMIN') throw new Error('Admin access required');
        state.users = users || [];
        state.projects = (projectsPayload && projectsPayload.projects) || [];

        // Stats
        document.getElementById('stat-users').textContent = state.users.length;
        document.getElementById('stat-projects').textContent = state.projects.length;
        const totalRuns = state.projects.reduce((a, p) => a + (p.run_count || 0), 0);
        document.getElementById('stat-runs').textContent = totalRuns || '—';

        renderProjects();
        renderUsers();
      }

      function renderProjects() {
        document.getElementById('project-count-label').textContent = `${state.projects.length} projects`;
        document.getElementById('projects-tbody').innerHTML = state.projects.map(p => `
          <tr>
            <td style="font-weight:500;color:var(--text-primary)">${escapeHtml(p.name)}</td>
            <td><span class="row-meta">${escapeHtml(p.slug)}</span></td>
            <td>${p.is_active ? '<span style="color:var(--success)">Active</span>' : '<span style="color:var(--text-muted)">Archived</span>'}</td>
            <td>${escapeHtml(String(p.member_count || 0))}</td>
            <td><div class="row-actions">
              <a class="btn btn-secondary" href="/projects/${encodeURIComponent(p.slug)}/settings" style="padding:4px 10px;font-size:var(--font-xs)">Settings</a>
              <button class="btn btn-danger" style="padding:4px 10px;font-size:var(--font-xs)" data-project-delete="${escapeHtml(p.id)}">Archive</button>
            </div></td>
          </tr>`).join('');

        document.querySelectorAll('[data-project-delete]').forEach(btn => {
          btn.addEventListener('click', async () => {
            if (!confirm('Archive this project?')) return;
            await fetchJson(`v1/admin/projects/${btn.dataset.projectDelete}`, { method: 'DELETE' });
            document.getElementById('project-message').textContent = 'Project archived';
            await load();
          });
        });
      }

      function renderUsers() {
        document.getElementById('user-count-label').textContent = `${state.users.length} users`;
        document.getElementById('users-tbody').innerHTML = state.users.map(u => `
          <tr>
            <td style="font-weight:500;color:var(--text-primary)">${escapeHtml(u.display_name || u.email)}</td>
            <td><span class="row-meta">${escapeHtml(u.email)}</span></td>
            <td><span class="role-badge ${u.role === 'ADMIN' ? 'admin' : 'member'}">${escapeHtml(u.role)}</span></td>
            <td>${u.is_active ? '<span style="color:var(--success)">Active</span>' : '<span style="color:var(--error)">Disabled</span>'}</td>
            <td><div class="row-actions">
              <button class="btn btn-secondary" style="padding:4px 10px;font-size:var(--font-xs)" data-user-edit="${escapeHtml(u.id)}">Edit</button>
              ${u.is_active ? `<button class="btn btn-danger" style="padding:4px 10px;font-size:var(--font-xs)" data-user-toggle="${escapeHtml(u.id)}" data-active="false">Disable</button>` : `<button class="btn btn-secondary" style="padding:4px 10px;font-size:var(--font-xs)" data-user-toggle="${escapeHtml(u.id)}" data-active="true">Enable</button>`}
            </div></td>
          </tr>`).join('');

        document.querySelectorAll('[data-user-toggle]').forEach(btn => {
          btn.addEventListener('click', async () => {
            const isActive = btn.dataset.active === 'true';
            await fetchJson(`v1/admin/users/${btn.dataset.userToggle}`, {
              method: 'PUT', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ is_active: isActive }),
            });
            document.getElementById('user-message').textContent = isActive ? 'User enabled' : 'User disabled';
            await load();
          });
        });
      }

      document.getElementById('create-project-btn').addEventListener('click', async () => {
        await fetchJson('v1/admin/projects', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: document.getElementById('new-project-name').value.trim(),
            slug: document.getElementById('new-project-slug').value.trim(),
            description: document.getElementById('new-project-description').value.trim(),
          }),
        });
        document.getElementById('project-message').textContent = 'Project created';
        document.getElementById('new-project-name').value = '';
        document.getElementById('new-project-slug').value = '';
        document.getElementById('new-project-description').value = '';
        await load();
      });

      document.getElementById('create-user-btn').addEventListener('click', async () => {
        await fetchJson('v1/admin/users', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('new-user-email').value.trim(),
            display_name: document.getElementById('new-user-name').value.trim(),
            role: document.getElementById('new-user-role').value,
            is_active: true,
          }),
        });
        document.getElementById('user-message').textContent = 'User created';
        document.getElementById('new-user-email').value = '';
        document.getElementById('new-user-name').value = '';
        await load();
      });

      load().catch(err => {
        document.querySelector('main').innerHTML = `<div class="admin-page"><div class="card"><div style="padding:var(--space-lg);color:var(--error)">${escapeHtml(err.message)}</div></div></div>`;
      });
    })();
  </script>
</body>
</html>
