<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قيِّم • Profile</title>
  <link rel="icon" type="image/png" href="/static/qym_icon.png">
  <link rel="stylesheet" href="/static/dashboard.css">
  <link rel="stylesheet" href="/static/shell.css">
  <script src="/static/auth.js"></script>
  <script src="/static/shell.js"></script>
  <style>
    .page {
    }
    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-md);
      margin-bottom: var(--space-lg);
    }
    .hero h1 {
      margin: 0;
      font-size: 28px;
    }
    .hero p {
      margin: 6px 0 0;
      color: var(--text-muted);
    }
    .actions {
      display: flex;
      gap: var(--space-sm);
      flex-wrap: wrap;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: var(--space-md);
    }
    .panel {
      background: var(--bg-surface);
      border: 1px solid var(--border-default);
      border-radius: 10px;
      padding: var(--space-lg);
      margin-bottom: var(--space-lg);
    }
    .panel h2 {
      margin: 0 0 var(--space-md);
      font-size: var(--font-md);
    }
    .kv-label {
      font-size: var(--font-xs);
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .kv-value {
      color: var(--text-primary);
      font-family: var(--font-mono);
      word-break: break-word;
    }
    .project-list {
      display: grid;
      gap: var(--space-sm);
    }
    .project-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-md);
      background: var(--bg-elevated);
      border: 1px solid var(--border-default);
      border-radius: 8px;
      padding: 12px 14px;
    }
    .project-meta strong {
      display: block;
      margin-bottom: 4px;
    }
    .project-meta span {
      color: var(--text-muted);
      font-size: var(--font-sm);
    }
    .role-pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 4px 10px;
      background: rgba(0, 212, 170, 0.08);
      border: 1px solid rgba(0, 212, 170, 0.22);
      color: var(--accent-primary);
      font-size: var(--font-xs);
      font-family: var(--font-mono);
      text-transform: uppercase;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: var(--space-md);
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .field label {
      font-size: var(--font-xs);
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .form-input, .form-textarea {
      width: 100%;
      box-sizing: border-box;
      background: var(--bg-elevated);
      border: 1px solid var(--border-default);
      border-radius: 6px;
      color: var(--text-primary);
      padding: 10px 12px;
      font-size: var(--font-sm);
      font-family: var(--font-sans);
    }
    .form-textarea {
      min-height: 88px;
      resize: vertical;
    }
    .inline-note {
      color: var(--text-muted);
      font-size: var(--font-sm);
      margin-top: 10px;
    }
    .message {
      margin-top: var(--space-sm);
      color: var(--accent-primary);
      font-size: var(--font-sm);
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <div>
        <h1>Profile</h1>
        <p>Your access is now project-scoped. API keys live inside each project’s settings page.</p>
      </div>
      <div class="actions">
      </div>
    </section>

    <section class="panel">
      <h2>Account</h2>
      <div class="grid" id="account-grid"></div>
    </section>

    <section class="panel">
      <h2>Projects</h2>
      <div class="project-list" id="projects-list"></div>
    </section>

    <section class="panel">
      <h2>Review LLM</h2>
      <div class="form-grid">
        <div class="field">
          <label for="llm-base-url">Base URL</label>
          <input class="form-input" id="llm-base-url" placeholder="https://api.openai.com/v1">
        </div>
        <div class="field">
          <label for="llm-model">Model</label>
          <input class="form-input" id="llm-model" placeholder="gpt-4o-mini">
        </div>
        <div class="field">
          <label for="llm-api-key">API Key</label>
          <input class="form-input" id="llm-api-key" type="password" placeholder="sk-...">
        </div>
      </div>
      <div class="inline-note" id="llm-note"></div>
      <div style="display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;">
        <button class="btn btn-primary" id="save-llm-btn" type="button">Save</button>
        <button class="btn btn-secondary" id="test-llm-btn" type="button">Test</button>
      </div>
      <div class="message" id="llm-message"></div>
    </section>
  </main>

  <script>
    (() => {
      'use strict';

      function apiUrl(path) {
        return `${window.location.origin}/${String(path || '').replace(/^\/+/, '')}`;
      }

      function escapeHtml(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function projectUrl(slug, suffix = '') {
        const clean = String(suffix || '').replace(/^\/+/, '');
        return `/projects/${encodeURIComponent(slug)}${clean ? `/${clean}` : ''}`;
      }

      async function loadProfile() {
        const [meRes, cfgRes] = await Promise.all([
          fetch(apiUrl('v1/me')),
          fetch(apiUrl('v1/me/llm-config')),
        ]);
        if (window.QymAuth && window.QymAuth.handle401(meRes)) return;
        if (!meRes.ok) throw new Error('Failed to load profile');
        if (!cfgRes.ok) throw new Error('Failed to load review LLM config');

        const me = await meRes.json();
        const cfg = await cfgRes.json();
        renderProfile(me, cfg);
      }

      function renderProfile(me, cfg) {
        const defaultProject = me.default_project;
        var openBtn = document.getElementById('open-default-project');
        if (openBtn) openBtn.href = defaultProject ? projectUrl(defaultProject.slug) : '/';

        document.getElementById('account-grid').innerHTML = [
          ['Display Name', me.display_name || '—'],
          ['Email', me.email || '—'],
          ['Global Role', me.role || '—'],
          ['Default Project', defaultProject ? defaultProject.name : '—'],
        ].map(([label, value]) => `
          <div class="panel" style="margin:0; padding:14px;">
            <div class="kv-label">${escapeHtml(label)}</div>
            <div class="kv-value">${escapeHtml(value)}</div>
          </div>
        `).join('');

        const projects = Array.isArray(me.projects) ? me.projects : [];
        document.getElementById('projects-list').innerHTML = projects.length ? projects.map((project) => `
          <div class="project-card">
            <div class="project-meta">
              <strong>${escapeHtml(project.name)}</strong>
              <span>${escapeHtml(project.slug)}</span>
            </div>
            <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
              <span class="role-pill">${escapeHtml(project.role || 'MEMBER')}</span>
              <a class="btn btn-secondary" href="${projectUrl(project.slug)}">Open</a>
              <a class="btn btn-secondary" href="${projectUrl(project.slug, 'settings')}">Settings</a>
            </div>
          </div>
        `).join('') : '<div class="inline-note">You do not belong to any active projects yet.</div>';

        document.getElementById('llm-base-url').value = cfg.llm_base_url || 'https://api.openai.com/v1';
        document.getElementById('llm-model').value = cfg.llm_model || 'gpt-4o-mini';
        document.getElementById('llm-api-key').placeholder = cfg.llm_api_key_set ? 'Leave blank to keep current key' : 'sk-...';
        document.getElementById('llm-note').textContent = cfg.llm_api_key_set
          ? `Stored key: ${cfg.llm_api_key_hint || 'configured'}`
          : 'No review LLM key stored yet.';
      }

      async function saveConfig(testOnly) {
        const message = document.getElementById('llm-message');
        const apiKey = document.getElementById('llm-api-key').value.trim();
        const payload = {
          llm_base_url: document.getElementById('llm-base-url').value.trim() || 'https://api.openai.com/v1',
          llm_model: document.getElementById('llm-model').value.trim() || 'gpt-4o-mini',
          llm_api_key: apiKey || '__KEEP__',
        };

        const path = testOnly ? 'v1/me/llm-config/test' : 'v1/me/llm-config';
        const method = testOnly ? 'POST' : 'PUT';
        message.textContent = testOnly ? 'Testing…' : 'Saving…';

        const res = await fetch(apiUrl(path), {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          message.textContent = data.detail || 'Request failed';
          return;
        }
        message.textContent = testOnly ? `Connected: ${data.model || payload.llm_model}` : 'Saved';
        if (!testOnly) {
          document.getElementById('llm-api-key').value = '';
          await loadProfile();
        }
      }

      document.getElementById('save-llm-btn').addEventListener('click', () => saveConfig(false));
      document.getElementById('test-llm-btn').addEventListener('click', () => saveConfig(true));
      loadProfile().catch((error) => {
        document.getElementById('account-grid').innerHTML = `<div class="inline-note">${escapeHtml(error.message)}</div>`;
      });
    })();
  </script>
</body>
</html>
