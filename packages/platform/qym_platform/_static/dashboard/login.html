<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in</title>
  <link rel="icon" type="image/png" href="/static/qym_icon.png">
  <link rel="stylesheet" href="/static/dashboard.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Sans', var(--font-sans);
      background: var(--bg-void);
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }

    /* ── Ambient background ── */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 50% 30%, rgba(0, 212, 170, 0.10), transparent),
        radial-gradient(ellipse 50% 60% at 30% 70%, rgba(0, 168, 255, 0.08), transparent),
        radial-gradient(ellipse 40% 40% at 75% 60%, rgba(168, 85, 247, 0.05), transparent);
      pointer-events: none;
    }

    .grid-overlay {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 212, 170, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 212, 170, 0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse 60% 60% at center, black 10%, transparent 70%);
      -webkit-mask-image: radial-gradient(ellipse 60% 60% at center, black 10%, transparent 70%);
      animation: grid-drift 25s linear infinite;
      pointer-events: none;
    }

    @keyframes grid-drift {
      from { transform: translate(0, 0); }
      to { transform: translate(60px, 60px); }
    }

    /* ── Centered card ── */
    .login-card {
      position: relative;
      width: min(440px, 100%);
      background: rgba(20, 20, 30, 0.92);
      border: 1px solid var(--border-default);
      border-radius: 20px;
      backdrop-filter: blur(20px);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    .login-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0, 212, 170, 0.5), rgba(0, 168, 255, 0.3), transparent);
    }

    /* ── Brand header ── */
    .login-brand {
      padding: 36px 32px 28px;
      text-align: center;
      border-bottom: 1px solid var(--border-subtle);
      background: radial-gradient(circle at 50% 0%, rgba(0, 212, 170, 0.06), transparent 70%);
    }

    .login-logo {
      height: 64px;
      margin-bottom: 16px;
      filter: drop-shadow(0 0 30px rgba(0, 212, 170, 0.25));
      animation: fade-in 0.6s ease-out both;
    }

    .login-wordmark {
      height: 36px;
      filter: drop-shadow(0 0 16px rgba(0, 212, 170, 0.12));
      animation: fade-in 0.6s ease-out 0.1s both;
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── Body ── */
    .login-body {
      padding: 28px 32px 32px;
    }

    .login-heading {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.01em;
      margin-bottom: 4px;
    }

    .login-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    /* ── Provider buttons ── */
    .providers {
      display: grid;
      gap: 10px;
      margin-bottom: 24px;
    }

    .provider-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border-default);
      background: var(--bg-surface);
      color: var(--text-primary);
      font-family: 'DM Sans', var(--font-sans);
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.18s ease;
      animation: slide-up 0.35s ease-out both;
    }

    .provider-btn:nth-child(1) { animation-delay: 0.15s; }
    .provider-btn:nth-child(2) { animation-delay: 0.22s; }
    .provider-btn:nth-child(3) { animation-delay: 0.29s; }

    @keyframes slide-up {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .provider-btn:hover {
      border-color: var(--accent-primary);
      background: var(--bg-elevated);
      box-shadow: 0 4px 20px rgba(0, 212, 170, 0.12), 0 0 0 1px rgba(0, 212, 170, 0.15);
    }

    .provider-btn:focus-visible {
      outline: none;
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(0, 212, 170, 0.15);
    }

    .provider-btn.disabled {
      opacity: 0.4;
      cursor: not-allowed;
      pointer-events: none;
    }

    .provider-icon {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 1px solid var(--border-subtle);
      background: rgba(255, 255, 255, 0.03);
    }

    .provider-icon svg { width: 18px; height: 18px; display: block; }

    .provider-google .provider-icon { background: #fff; border-color: rgba(255, 255, 255, 0.2); }
    .provider-github .provider-icon { background: rgba(255, 255, 255, 0.06); }
    .provider-sso .provider-icon { background: linear-gradient(135deg, rgba(0, 168, 255, 0.12), rgba(168, 85, 247, 0.12)); }

    .provider-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .provider-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.2;
    }

    .provider-desc {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.3;
    }

    .provider-badge {
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .provider-badge.active { background: rgba(0, 212, 170, 0.12); color: var(--accent-primary); }
    .provider-badge.reserved { background: rgba(122, 122, 144, 0.12); color: var(--text-dim); }

    .provider-arrow {
      color: var(--text-dim);
      flex-shrink: 0;
      transition: transform 0.18s ease, color 0.18s ease;
    }

    .provider-btn:hover .provider-arrow {
      color: var(--accent-primary);
      transform: translateX(2px);
    }

    .provider-arrow svg { width: 14px; height: 14px; }

    /* ── Status & footer ── */
    .provider-status {
      text-align: center;
      font-size: 11px;
      color: var(--text-dim);
      font-family: var(--font-mono);
      margin-bottom: 20px;
    }

    .login-footer {
      padding-top: 16px;
      border-top: 1px solid var(--border-subtle);
      color: var(--text-dim);
      font-size: 11px;
      line-height: 1.6;
      text-align: center;
    }

    /* ── Empty / loading ── */
    .provider-empty {
      padding: 20px;
      border-radius: 12px;
      border: 1px dashed var(--border-default);
      background: rgba(16, 16, 24, 0.5);
      color: var(--text-muted);
      font-size: 13px;
      text-align: center;
      line-height: 1.6;
    }

    .providers-loading { display: grid; gap: 10px; }

    .shimmer {
      height: 60px;
      border-radius: 12px;
      background: linear-gradient(90deg, var(--bg-surface) 25%, var(--bg-elevated) 50%, var(--bg-surface) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s ease-in-out infinite;
    }

    @keyframes shimmer {
      from { background-position: 200% 0; }
      to { background-position: -200% 0; }
    }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      body { padding: 16px; }
      .login-brand { padding: 28px 24px 22px; }
      .login-logo { height: 52px; }
      .login-wordmark { height: 28px; }
      .login-body { padding: 22px 24px 28px; }
      .login-heading { font-size: 18px; }
    }
  </style>
</head>
<body>
  <div class="grid-overlay"></div>

  <div class="login-card">
    <div class="login-brand">
      <img src="/static/qym_icon.png" alt="" class="login-logo">
      <br>
      <img src="/static/qym_text.png" alt="" class="login-wordmark">
    </div>

    <div class="login-body">
      <div class="login-heading">Sign in</div>
      <div class="login-sub">Choose a provider to continue</div>

      <div class="providers" id="providers">
        <div class="providers-loading">
          <div class="shimmer"></div>
          <div class="shimmer"></div>
        </div>
      </div>

    </div>
  </div>

  <script>
    (async function () {
      var params = new URLSearchParams(window.location.search);
      var next = params.get('next') || '/';
      var host = document.getElementById('providers');

      var icons = {
        arrow: '<svg viewBox="0 0 20 20" fill="none"><path d="M7 5l5 5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
        google: '<svg viewBox="0 0 24 24"><path fill="#EA4335" d="M12 10.2v3.96h5.5c-.24 1.28-.98 2.37-2.08 3.1l3.36 2.61c1.96-1.81 3.09-4.47 3.09-7.63 0-.73-.06-1.43-.19-2.11H12z"/><path fill="#4285F4" d="M12 22c2.79 0 5.13-.92 6.84-2.5l-3.36-2.61c-.93.63-2.11 1-3.48 1-2.68 0-4.95-1.81-5.76-4.24H2.77v2.66A9.99 9.99 0 0012 22z"/><path fill="#FBBC05" d="M6.24 13.65A5.99 5.99 0 015.92 12c0-.57.08-1.12.22-1.65V7.69H2.77A9.99 9.99 0 002 12c0 1.61.39 3.13 1.08 4.46l3.16-2.81z"/><path fill="#34A853" d="M12 6.11c1.52 0 2.89.52 3.97 1.54l2.98-2.98C17.12 2.98 14.79 2 12 2A9.99 9.99 0 002.77 7.69l3.37 2.66C7.05 7.92 9.32 6.11 12 6.11z"/></svg>',
        github: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.65.5.5 5.72.5 12.15c0 5.15 3.3 9.52 7.89 11.06.58.11.79-.26.79-.58v-2.24c-3.21.71-3.89-1.39-3.89-1.39-.52-1.36-1.28-1.72-1.28-1.72-1.04-.73.08-.72.08-.72 1.15.08 1.75 1.2 1.75 1.2 1.02 1.79 2.69 1.28 3.35.98.1-.76.4-1.28.72-1.58-2.56-.3-5.26-1.31-5.26-5.85 0-1.29.46-2.34 1.2-3.17-.12-.3-.52-1.52.12-3.17 0 0 .98-.32 3.22 1.21a10.93 10.93 0 015.86 0c2.24-1.53 3.22-1.21 3.22-1.21.64 1.65.24 2.87.12 3.17.75.83 1.2 1.88 1.2 3.17 0 4.55-2.7 5.55-5.28 5.84.41.36.78 1.07.78 2.16v3.21c0 .32.21.69.8.58 4.58-1.54 7.88-5.91 7.88-11.06C23.5 5.72 18.35.5 12 .5z"/></svg>',
        sso: '<svg viewBox="0 0 24 24" fill="none"><path d="M4 19h16M6 19V9l6-4 6 4v10M9 13h1m4 0h1m-6 3h1m4 0h1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
        generic: '<svg viewBox="0 0 24 24" fill="none"><path d="M12 4v16M4 12h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>'
      };

      function esc(v) {
        return String(v || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      }

      function theme(id, enabled) {
        var p = String(id || '').toLowerCase();
        if (p === 'google') return { key: 'google', icon: icons.google, desc: 'Sign in with your Google account', badge: enabled ? 'Available' : 'Unavailable', cls: enabled ? 'active' : 'reserved' };
        if (p === 'github') return { key: 'github', icon: icons.github, desc: 'Sign in with GitHub', badge: enabled ? 'Available' : 'Unavailable', cls: enabled ? 'active' : 'reserved' };
        if (p === 'sso') return { key: 'sso', icon: icons.sso, desc: enabled ? 'Enterprise identity provider' : 'Available when SSO is configured', badge: enabled ? 'Enterprise' : 'Reserved', cls: enabled ? 'active' : 'reserved' };
        return { key: 'generic', icon: icons.generic, desc: enabled ? 'Sign in with this provider' : 'Currently unavailable', badge: '', cls: enabled ? 'active' : 'reserved' };
      }

      function label(p) {
        if (p && p.label) return p.label;
        var id = String((p && p.id) || 'provider');
        return 'Continue with ' + id.charAt(0).toUpperCase() + id.slice(1);
      }

      function btn(p) {
        var t = theme(p.id, true);
        var href = '/v1/auth/login/' + encodeURIComponent(p.id) + '?next=' + encodeURIComponent(next);
        return '<a href="' + esc(href) + '" class="provider-btn provider-' + t.key + '">'
          + '<span class="provider-icon">' + t.icon + '</span>'
          + '<span class="provider-label">' + esc(label(p)) + '</span>'
          + '<span class="provider-arrow">' + icons.arrow + '</span>'
          + '</a>';
      }

      try {
        var res = await fetch('/v1/auth/providers');
        var data = await res.json();
        var providers = Array.isArray(data.providers) ? data.providers : [];
        var active = providers.filter(function(p) { return p.enabled; });

        host.innerHTML = active.length
          ? active.map(btn).join('')
          : '<div class="provider-empty">No login providers are configured for this deployment.</div>';

      } catch (err) {
        host.innerHTML = '<div class="provider-empty">Could not load login providers. Please try again.</div>';
      }
    })();
  </script>
</body>
</html>
